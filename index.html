  {t:"card",art:"dividend",ic:"🏢",h:"נדל\"ן שנסחר כמו מניה",p:"REIT היא חברה שמחזיקה נכסים מניבים (משרדים, קניונים, מגורים) ומחלקת את רוב דמי השכירות כדיבידנד. אתה קונה 'חתיכה' מתיק נדל\"ן שלם — נזיל, בלי משכנתא ובלי לתקן ברזים.",tr:{en:{"h": "Real estate that trades like a stock", "p": "A REIT is a company that owns income-producing properties (offices, malls, housing) and distributes most of the rent as a dividend. You buy a slice of an entire property portfolio — liquid, with no mortgage and no taps to fix."}}},
  {t:"quiz",q:"מה מקור ההכנסה העיקרי של REIT?",o:["מכירת מניות","דמי שכירות מנכסים מניבים","ריבית בנק","פרסום"],a:1,why:"REIT מחזיקה נכסים ומשכירה אותם — ומחלקת את רוב ההכנסה כדיבידנד לבעלי המניות.",tr:{en:{"q": "What is a REIT's main source of income?", "o": ["Selling shares", "Rent from income-producing properties", "Bank interest", "Advertising"], "why": "A REIT owns properties and leases them out — distributing most of the income as a dividend to shareholders."}}},
  {t:"card",art:"riskreturn",ic:"⚖️",h:"היתרון והחיסרון",p:"יתרון: פיזור, נזילות ותשואת דיבידנד גבוהה. חיסרון: רגישות גבוהה לריבית — כשהריבית עולה, גם המימון מתייקר וגם משקיעים דורשים תשואה גבוהה יותר, אז REIT יורדות.",tr:{en:{"h": "The advantage and the drawback", "p": "The advantage: diversification, liquidity and a high dividend yield. The drawback: high sensitivity to interest rates — when rates rise, financing gets more expensive and investors demand higher yields, so REITs fall."}}},
  {t:"sim",asset:"🏘️ קרן REIT",start:10000,
   why:"ראית את שני הצדדים: REIT נותן חשיפה לנדל\"ן ודיבידנד יפה, אבל הוא רגיש מאוד לריבית. הוא לא 'דירה בטוחה' — הוא מניה שמתנהגת כמו נדל\"ן.",
   events:[
    {ic:"💵",t:"תשלום דיבידנד",good:true,news:"הקרן מחלקת דיבידנד רבעוני מהשכירות שהיא גובה. הכסף נכנס לחשבון.",
     opts:[{l:"מחזיק — זו ההכנסה שרציתי",r:.04,good:true,fb:"נכון. REIT חייב לחלק את רוב הרווח — זו התכונה המרכזית שלו."},
      {l:"מוכר מיד אחרי הדיבידנד",r:-.01,fb:"מכרת את מקור ההכנסה בשביל תשלום אחד. זה מפספס את הרעיון."}]},
    {ic:"📈",t:"הריבית עולה חדות",good:false,news:"הבנק המרכזי מעלה ריבית. קרנות REIT צונחות — המימון שלהן התייקר, והאלטרנטיבה (אג\"ח) נעשתה אטרקטיבית.",
     opts:[{l:"נבהל ומוכר בהפסד",r:-.18,fb:"מכרת בשפל. הרגישות לריבית היא תכונה ידועה — היית צריך לדעת עליה מראש."},
      {l:"ידעתי שזה קורה — מחזיק",r:-.08,good:true,fb:"ספגת את הירידה בלי לקבע אותה. הבנת את הסיכון לפני שנכנסת."}]},
    {ic:"🏘️",t:"השכירות ממשיכה",good:true,news:"הדיירים ממשיכים לשלם. הדיבידנד ממשיך לזרום למרות ירידת המחיר.",
     opts:[{l:"מחזיק — התזרים לא נפגע",r:.12,good:true,fb:"בדיוק. מחיר המניה ירד, אבל העסק ממשיך לייצר מזומן."},
      {l:"מוכר הכל",r:0,fb:"ויתרת על תזרים יציב בגלל תנודת מחיר זמנית."}]}],tr:{en:{"asset": "🏘️ A REIT fund", "why": "You saw both sides: a REIT gives you property exposure and a healthy dividend, but it's highly sensitive to interest rates. It isn't a 'safe apartment' — it's a stock that behaves like real estate.", "events": [{"t": "A dividend payment", "news": "The fund distributes a quarterly dividend from the rent it collects. The money lands in your account.", "opts": [{"l": "Hold — this is the income I wanted", "fb": "Correct. A REIT is required to distribute most of its profit — that's its defining feature."}, {"l": "Sell immediately after the dividend", "fb": "You sold the income source for a single payment. That misses the point entirely."}]}, {"t": "Rates rise sharply", "news": "The central bank raises rates. REITs plunge — their financing became more expensive, and the alternative (bonds) became attractive.", "opts": [{"l": "Panic and sell at a loss", "fb": "You sold at the low. Interest rate sensitivity is a known characteristic — you should have known about it in advance."}, {"l": "I knew this happens — hold", "fb": "You absorbed the decline without locking it in. You understood the risk before you got in."}]}, {"t": "The rent keeps coming", "news": "Tenants keep paying. The dividend keeps flowing despite the price decline.", "opts": [{"l": "Hold — the cash flow is intact", "fb": "Exactly. The share price fell, but the business keeps generating cash."}, {"l": "Sell everything", "fb": "You gave up steady cash flow because of a temporary price move."}]}]}}},
  {t:"summary",h:"מה למדת",points:["REIT = חברה שמחזיקה נדל\"ן מניב, ואתה קונה ממנה מניה","נזיל: קונים ומוכרים בשנייה — לא כמו דירה","מחלק דיבידנד גבוה מהשכירות","חשוף לריבית: ריבית עולה — REIT נפגע"],tr:{en:{"h": "What you learned", "points": ["A REIT is a company that owns income-producing property, and you buy shares in it", "Liquid: you buy and sell in seconds — unlike an apartment", "It pays a high dividend from the rent", "It's exposed to interest rates: when rates rise, REITs suffer"]}}}]},
 {id:"l152",ic:"📉",title:"REIT וריבית",tier:"intermediate",tr:{en:{"title": "REITs and interest rates"}},steps:[
  {t:"scenario",q:"הריבית במשק עולה בחדות.",situation:"מה צפוי לקרות לקרן REIT ממונפת?",
   options:[{label:"להיפגע — מימון יקר יותר ותחרות מאג\"ח",verdict:"good",fb:"נכון. REIT רגישות מאוד לריבית: החוב מתייקר, והדיבידנד שלהן מתחרה באג\"ח שנעשה אטרקטיבי יותר."},
    {label:"לזנק, ריבית תמיד טובה לנדל\"ן",verdict:"bad",fb:"הפוך. עליית ריבית לרוב לוחצת על REIT דרך עלות המימון והתחרות מאג\"ח."}],
   why:"REIT הן מהנכסים הרגישים ביותר לריבית. שים לב לסביבת הריבית לפני שמשקללים אותן בתיק.",tr:{en:{"q": "Interest rates in the economy rise sharply.", "situation": "What's likely to happen to a leveraged REIT?", "why": "REITs are among the most rate-sensitive assets there are. Pay attention to the rate environment before weighting them in a portfolio.", "options": [{"label": "It suffers — more expensive financing and competition from bonds", "fb": "Correct. REITs are highly rate-sensitive: their debt costs more, and their dividend competes with bonds that have become more attractive."}, {"label": "It surges, rates are always good for property", "fb": "The opposite. Rising rates usually pressure REITs through financing costs and competition from bonds."}]}}},
  {t:"quiz",q:"תשואת דיבידנד גבוהה מאוד ב-REIT יכולה גם לרמז על...",o:["הזדמנות ודאית","סיכון — אולי המחיר צנח כי הנכסים בבעיה","אין סיכון","טעות בחישוב"],a:1,why:"תשואה שקופצת כי המחיר צנח היא דגל אזהרה, לא בהכרח מציאה. בדוק למה המחיר ירד.",tr:{en:{"q": "A very high dividend yield on a REIT can also hint at...", "o": ["A certain opportunity", "Risk — the price may have collapsed because the properties are in trouble", "No risk", "A calculation error"], "why": "A yield that jumps because the price collapsed is a warning sign, not necessarily a bargain. Check why the price fell."}}}]}
]},
{id:"c16",ic:"💵",title:"דיבידנדים והכנסה",desc:"לבנות זרם הכנסה פסיבית",tr:{en:{"title": "Dividends and Income", "desc": "Building a stream of passive income"}},lessons:[
 {id:"l161",ic:"💵",title:"איך דיבידנד עובד",tier:"beginner",tr:{en:{"title": "How dividends work"}},steps:[
  {t:"hook",ic:"💵",q:"מניה ששולחת לך כסף לחשבון, בלי שתמכור כלום.",sub:"זה דיבידנד. וכדאי להבין אותו לפני שרודפים אחריו.",cta:"בוא נגלה →",tr:{en:{"q": "A stock that sends money to your account without you selling anything.", "sub": "That's a dividend. And it's worth understanding before you chase it.", "cta": "Let's find out →"}}},
  {t:"card",art:"dividend",ic:"💵",h:"נתח מהרווח, במזומן",p:"חברות בוגרות ורווחיות מחלקות חלק מהרווח לבעלי המניות — דיבידנד. חברות צמיחה לרוב לא מחלקות אלא משקיעות הכל בחזרה בעסק. אף גישה אינה 'נכונה' — הן פשוט שונות.",tr:{en:{"h": "A slice of the profit, in cash", "p": "Mature, profitable companies distribute part of their profit to shareholders as a dividend. Growth companies usually don't distribute and instead reinvest everything back into the business. Neither approach is 'right' — they're simply different."}}},
  {t:"predict",q:"מניה ב-₪100 שמחלקת ₪4 דיבידנד בשנה. מהי תשואת הדיבידנד?",min:1,max:12,step:1,unit:"%",answer:4,tol:1,reveal:"4% — הדיבידנד חלקי המחיר.",why:"תשואת דיבידנד = דיבידנד שנתי ÷ מחיר. היא אומרת כמה מזומן הנכס מחזיר לך בשנה, באחוזים.",tr:{en:{"q": "A stock at ₪100 that pays a ₪4 dividend a year. What's the dividend yield?", "unit": "%", "reveal": "4% — the dividend divided by the price.", "why": "Dividend yield = annual dividend ÷ price. It tells you what percentage of cash the asset returns to you each year."}}},
  {t:"quiz",q:"חברת צמיחה צעירה בדרך כלל...",o:["מחלקת דיבידנד גבוה","משקיעה את הרווח בחזרה בעסק במקום לחלק","חייבת לחלק","לא חוקית"],a:1,why:"צמיחה זקוקה להון — לכן חברות צעירות משקיעות מחדש ולא מחלקות. הדיבידנד מגיע לרוב בבגרות.",tr:{en:{"q": "A young growth company usually...", "o": ["Pays a high dividend", "Reinvests its profit back into the business rather than distributing", "Is required to distribute", "Is illegal"], "why": "Growth needs capital — which is why young companies reinvest rather than distribute. Dividends usually arrive with maturity."}}},
  {t:"predict",q:"מניה מחלקת דיבידנד. ביום החלוקה, מה קורה למחיר המניה?",
   min:-10,max:10,step:1,unit:"% שינוי",answer:-3,tol:3,
   reveal:"המחיר יורד בערך בגובה הדיבידנד. הכסף יצא מהחברה — אז שוויה קטן בדיוק באותו סכום.",
   why:"דיבידנד הוא לא 'כסף חינם'. הוא העברת כסף מהכיס של החברה לכיס שלך. השווי הכולל שלך לא השתנה באותו רגע.",tr:{en:{"q": "A stock pays a dividend. On the distribution date, what happens to the share price?", "unit": "% change", "reveal": "The price falls by roughly the size of the dividend. The money left the company — so its value shrinks by exactly that amount.", "why": "A dividend isn't 'free money'. It's a transfer from the company's pocket into yours. Your total value didn't change at that moment."}}},
  {t:"summary",h:"מה למדת",points:["דיבידנד = חלק מהרווח שמחולק במזומן","תשואת דיבידנד גבוהה מדי = לרוב דגל אדום","חברה יכולה לקצץ דיבידנד בכל רגע","דיבידנד הוא לא 'כסף חינם' — הוא יוצא משווי החברה"],tr:{en:{"h": "What you learned", "points": ["A dividend is part of the profit distributed in cash", "An unusually high dividend yield is usually a red flag", "A company can cut its dividend at any moment", "A dividend isn't 'free money' — it comes out of the company's value"]}}}]},
 {id:"l162",ic:"🔁",title:"מלכודת התשואה",tier:"intermediate",tr:{en:{"title": "The yield trap"}},steps:[
  {t:"swipe",q:"תשואת דיבידנד — פיתוי בריא או דגל אדום? החלק.",leftLabel:"🚩 חשוד",rightLabel:"✅ בריא",
   cards:[{text:"תשואה של 3-4% מחברה יציבה ורווחית",good:true,why:"תשואה סבירה מעסק בריא — קלאסיקה של השקעת הכנסה."},
    {text:"תשואה של 15% אחרי שהמניה צנחה 60%",good:false,why:"תשואה שקפצה כי המחיר קרס = אזהרה. אולי הדיבידנד עומד להיחתך."},
    {text:"דיבידנד שגדל בהתמדה 10 שנים",good:true,why:"גידול עקבי בדיבידנד מעיד על עסק בריא ומנהלים בטוחים."}],tr:{en:{"q": "Dividend yield — a healthy attraction or a red flag? Swipe.", "leftLabel": "🚩 Suspicious", "rightLabel": "✅ Healthy", "cards": [{"text": "A 3-4% yield from a stable, profitable company", "why": "A reasonable yield from a healthy business — the classic income investment."}, {"text": "A 15% yield after the stock plunged 60%", "why": "A yield that jumped because the price collapsed is a warning. The dividend may be about to be cut."}, {"text": "A dividend that has grown steadily for 10 years", "why": "Consistent dividend growth indicates a healthy business and confident management."}]}}},
  {t:"quiz",q:"'מלכודת דיבידנד' היא...",o:["דיבידנד גבוה שנראה מפתה אך לא בר-קיימא","דיבידנד קטן","מס","קרן מדד"],a:0,why:"תשואה גבוהה במיוחד לרוב משקפת מחיר שקרס — והדיבידנד עלול להיחתך בקרוב.",tr:{en:{"q": "A 'dividend trap' is...", "o": ["A high dividend that looks tempting but isn't sustainable", "A small dividend", "A tax", "An index fund"], "why": "An unusually high yield usually reflects a collapsed price — and the dividend may soon be cut."}}}]}
]},
{id:"c17",ic:"🥇",title:"סחורות, זהב ואינפלציה",desc:"נכסים אמיתיים בעולם משתנה",tr:{en:{"title": "Commodities, Gold and Inflation", "desc": "Real assets in a changing world"}},lessons:[
 {id:"l171",ic:"🥇",title:"למה זהב",tier:"beginner",tr:{en:{"title": "Why gold"}},steps:[
  {t:"hook",ic:"🥇",q:"זהב שרד 5,000 שנה. אז למה הוא לא השקעה מעולה?",sub:"התשובה מפתיעה את רוב האנשים.",cta:"בוא נגלה →",tr:{en:{"q": "Gold has survived 5,000 years. So why isn't it a great investment?", "sub": "The answer surprises most people.", "cta": "Let's find out →"}}},
  {t:"card",art:"inflation",ic:"🥇",h:"נכס בלי רווחים",p:"זהב לא מייצר רווח, דיבידנד או תזרים — ערכו נובע מביקוש בלבד. תפקידו העיקרי בתיק: הגנה. בזמני אי-ודאות ואינפלציה גבוהה משקיעים בורחים אליו, ולכן הוא לרוב מתואם הפוך למניות.",tr:{en:{"h": "An asset with no earnings", "p": "Gold produces no profit, dividend or cash flow — its value comes purely from demand. Its main role in a portfolio is protection. In times of uncertainty and high inflation investors flee to it, which is why it tends to be inversely correlated with stocks."}}},
  {t:"quiz",q:"מה תפקידו העיקרי של זהב בתיק?",o:["צמיחה מהירה","הגנה וגיוון בזמני משבר","דיבידנד גבוה","ריבית"],a:1,why:"זהב הוא נכס הגנתי — הוא מרכך בזמן שמניות צונחות, לא מנוע צמיחה.",tr:{en:{"q": "What's gold's main role in a portfolio?", "o": ["Rapid growth", "Protection and diversification during crises", "A high dividend", "Interest"], "why": "Gold is a defensive asset — it cushions while stocks plunge, rather than driving growth."}}},
  {t:"predict",q:"על פני 30 שנה, מה הניב יותר בממוצע — זהב או שוק המניות הרחב?",
   min:0,max:100,step:10,unit:"% (0=זהב מנצח, 100=מניות מנצחות)",answer:100,tol:25,
   reveal:"מניות, בפער גדול. זהב שומר על ערך — מניות מייצרות ערך. זה ההבדל המהותי.",
   why:"זהב לא מייצר רווחים, מוצרים או דיבידנד. הוא ביטוח — לא מנוע צמיחה.",tr:{en:{"q": "Over 30 years, which returned more on average — gold or the broad stock market?", "unit": "% (0 = gold wins, 100 = stocks win)", "reveal": "Stocks, by a wide margin. Gold preserves value — stocks create value. That's the fundamental difference.", "why": "Gold produces no earnings, products or dividends. It's insurance — not a growth engine."}}},
  {t:"summary",h:"מה למדת",points:["זהב לא מייצר כלום — אין רווחים, אין דיבידנד","הוא ביטוח נגד משברים ואינפלציה, לא מנוע צמיחה","היסטורית הוא הניב פחות ממניות בטווח ארוך","נתח קטן בתיק כביטוח — לא כעיקר"],tr:{en:{"h": "What you learned", "points": ["Gold produces nothing — no earnings, no dividend", "It's insurance against crises and inflation, not a growth engine", "Historically it has returned less than stocks over the long run", "A small slice of a portfolio as insurance — not as the main holding"]}}}]},
 {id:"l172",ic:"🛢️",title:"סחורות ואינפלציה",tier:"intermediate",tr:{en:{"title": "Commodities and inflation"}},steps:[
  {t:"card",art:"inflation",ic:"🛢️",h:"נכסים אמיתיים",p:"סחורות (נפט, מתכות, תבואה) הן 'נכסים אמיתיים' שמחירן לרוב עולה עם האינפלציה — ולכן משמשות גידור. אבל הן תנודתיות מאוד ותלויות בהיצע וביקוש גלובלי, מזג אוויר וגאופוליטיקה.",tr:{en:{"h": "Real assets", "p": "Commodities (oil, metals, grain) are 'real assets' whose prices usually rise with inflation, which makes them a hedge. But they're highly volatile and depend on global supply and demand, weather and geopolitics."}}},
  {t:"scenario",q:"האינפלציה מזנקת באופן מתמשך.",situation:"אילו נכסים נוטים להחזיק טוב יותר?",
   options:[{label:"נכסים אמיתיים כמו סחורות וזהב",verdict:"good",fb:"נכון. בזמן אינפלציה, נכסים אמיתיים נוטים לשמור על ערך טוב יותר ממזומן."},
    {label:"מזומן בעו\"ש",verdict:"bad",fb:"מזומן נשחק הכי הרבה באינפלציה — כוח הקנייה שלו יורד."}],
   why:"אינפלציה שוחקת מזומן ומטיבה יחסית עם נכסים אמיתיים — אך אלה תנודתיים, אז במינון.",tr:{en:{"q": "Inflation surges persistently.", "situation": "Which assets tend to hold up better?", "why": "Inflation erodes cash and relatively favours real assets — but those are volatile, so keep the dose moderate.", "options": [{"label": "Real assets such as commodities and gold", "fb": "Correct. During inflation, real assets tend to hold their value better than cash."}, {"label": "Cash in a current account", "fb": "Cash erodes most under inflation — its purchasing power falls."}]}}}]}
]},
{id:"c18",ic:"🪙",title:"קריפטו — בזהירות",desc:"להבין את הסיכון לפני שנכנסים",tr:{en:{"title": "Crypto — With Caution", "desc": "Understand the risk before you go in"}},lessons:[
 {id:"l181",ic:"🪙",title:"מה זה בעצם",tier:"beginner",tr:{en:{"title": "What it actually is"}},steps:[
  {t:"hook",ic:"₿",q:"קריפטו: הזדמנות היסטורית או הימור מסוכן?",sub:"התשובה הכנה: תלוי איך אתה ניגש.",cta:"בוא נגלה →",tr:{en:{"q": "Crypto: a historic opportunity or a dangerous gamble?", "sub": "The honest answer: it depends how you approach it.", "cta": "Let's find out →"}}},
  {t:"card",art:"crashcurve",ic:"🪙",h:"נכס ספקולטיבי וקיצוני",p:"קריפטו הוא נכס דיגיטלי ללא רווחים, דיבידנד או תזרים — התמחור נשען כולו על ביקוש והלך רוח. הוא יכול לעלות מאות אחוזים — ולרדת 80% באותה מהירות. אין 'שווי הוגן' לעגן אליו.",tr:{en:{"h": "A speculative, extreme asset", "p": "Crypto is a digital asset with no earnings, dividend or cash flow — its price rests entirely on demand and sentiment. It can rise hundreds of percent, and fall 80% just as fast. There's no 'fair value' to anchor to."}}},
  {t:"quiz",q:"מה קובע את מחיר הקריפטו בעיקר?",o:["רווחי החברה","ביקוש והלך רוח בלבד","דיבידנד","ריבית הבנק"],a:1,why:"אין עסק או תזרים מאחוריו — התמחור הוא כולו ביקוש/היצע ופסיכולוגיה, ולכן תנודתי בקיצוניות.",tr:{en:{"q": "What mainly determines the price of crypto?", "o": ["Company earnings", "Demand and sentiment alone", "Dividends", "Central bank interest rates"], "why": "There's no business or cash flow behind it — pricing is entirely supply, demand and psychology, which makes it extremely volatile."}}},
  {t:"swipe",q:"עובדה על קריפטו — או מיתוס? החלק כל כרטיס.",leftLabel:"❌ מיתוס",rightLabel:"✅ עובדה",
   cards:[
    {text:"ירידות של 70-80% קרו יותר מפעם אחת",good:true,why:"עובדה. תנודתיות קיצונית היא מאפיין מרכזי, לא חריג."},
    {text:"זה 'בטוח' כי כולם משקיעים",good:false,why:"מיתוס. פופולריות אינה בטיחות — היא בדיוק מה שמנפח בועות."},
    {text:"אין תזרים מזומנים או רווחים מאחורי המחיר",good:true,why:"עובדה. התמחור מבוסס על ציפייה בלבד, לא על עסק שמייצר כסף."},
    {text:"מובטח שהמחיר יעלה בטווח הארוך",good:false,why:"מיתוס מסוכן. שום נכס לא מבטיח דבר — בטח לא זה."},
    {text:"אם משקיעים — רק סכום שאתה מוכן לאבד לגמרי",good:true,why:"עובדה, וזה הכלל החשוב ביותר בתחום הזה."}],tr:{en:{"q": "A fact about crypto — or a myth? Swipe each card.", "leftLabel": "❌ Myth", "rightLabel": "✅ Fact", "cards": [{"text": "Declines of 70-80% have happened more than once", "why": "Fact. Extreme volatility is a core characteristic, not an anomaly."}, {"text": "It's 'safe' because everyone is investing", "why": "Myth. Popularity isn't safety — it's precisely what inflates bubbles."}, {"text": "There's no cash flow or earnings behind the price", "why": "Fact. Pricing rests on expectation alone, not on a business generating money."}, {"text": "The price is guaranteed to rise over the long run", "why": "A dangerous myth. No asset guarantees anything — least of all this one."}, {"text": "If you invest — only an amount you're prepared to lose entirely", "why": "Fact, and it's the single most important rule in this space."}]}}},
  {t:"challenge",task:"אם אתה שוקל קריפטו — כתוב מראש: כמה אחוז מהתיק (לא יותר ממה שאתה מוכן לאבד לגמרי), ומתי תמכור. שמור את הפתק.",
   hint:"בלי כלל כתוב מראש, התנודתיות הקיצונית תקבל בשבילך את ההחלטות — תמיד ברגע הגרוע.",tr:{en:{"task": "If you're considering crypto, write down in advance: what percentage of your portfolio (no more than you're prepared to lose entirely), and when you'll sell. Keep the note.", "hint": "Without a rule written in advance, extreme volatility will make the decisions for you — always at the worst moment."}}},
  {t:"summary",h:"מה למדת",points:["תנודתיות קיצונית — ירידות של 70-80% קרו לא פעם","אין תזרים, אין רווחים — התמחור הוא ציפייה בלבד","רגולציה עדיין מתפתחת. סיכון אמיתי","אם בכלל — נתח קטן שאתה מוכן לאבד לגמרי"],tr:{en:{"h": "What you learned", "points": ["Extreme volatility — declines of 70-80% have happened repeatedly", "No cash flow, no earnings — the price is pure expectation", "Regulation is still evolving. That's a real risk", "If at all — a small slice you're prepared to lose entirely"]}}}]},
 {id:"l182",ic:"⚖️",title:"כמה, אם בכלל",tier:"intermediate",tr:{en:{"title": "How much, if any"}},steps:[
  {t:"card",art:"diversify",ic:"⚖️",h:"כלל הפוזיציה הקטנה",p:"אם אתה בוחר להיחשף לקריפטו — הכלל הרווח הוא סכום קטן שאתה מוכן לאבד לגמרי, לא נתח מרכזי מהתיק. תנודתיות של 80% דורשת שתוכל לישון בשקט כשהיא קורית.",tr:{en:{"h": "The small position rule", "p": "If you choose to take crypto exposure, the prevailing rule is a small amount you're prepared to lose entirely, not a core part of your portfolio. Volatility of 80% demands that you can sleep soundly while it happens."}}},
  {t:"scenario",q:"חבר: 'שים את כל החיסכון בקריפטו, זה העתיד!'.",situation:"מה התגובה הנבונה?",
   options:[{label:"אם בכלל — פוזיציה קטנה מכסף פנוי שאני מוכן להפסיד",verdict:"good",fb:"נכון. חשיפה קטנה מגבילה את הנזק אם הכל קורס — וזה קורה בקריפטו."},
    {label:"להעביר את כל החיסכון וקרן החירום",verdict:"bad",fb:"מסוכן ביותר. נכס תנודתי קיצוני לעולם לא צריך להיות כל התיק — ובטח לא קרן החירום."}],
   why:"ריכוז קרן חירום או כל התיק בנכס ספקולטיבי הוא הימור, לא השקעה. פוזיציה קטנה = הישרדות.",tr:{en:{"q": "A friend says: 'put all your savings into crypto, it's the future!'.", "situation": "What's the sensible response?", "why": "Concentrating your emergency fund or entire portfolio in a speculative asset is gambling, not investing. A small position means survival.", "options": [{"label": "If at all — a small position from spare money I'm prepared to lose", "fb": "Correct. Small exposure limits the damage if everything collapses — and in crypto, it does."}, {"label": "Move all my savings and emergency fund in", "fb": "Extremely dangerous. An extremely volatile asset should never be your whole portfolio — and certainly never your emergency fund."}]}}}]}
]},
{id:"c19",ic:"🎰",title:"אופציות ונגזרים",desc:"למה רובם צריכים להתרחק",tr:{en:{"title": "Options and Derivatives", "desc": "Why most people should stay away"}},lessons:[
 {id:"l191",ic:"🎰",title:"מה זה נגזר",tier:"beginner",tr:{en:{"title": "What a derivative is"}},steps:[
  {t:"hook",ic:"⚡",q:"אופציות: איך להרוויח 200% — או לאבד 100% בשבוע.",sub:"המכשיר הכי מהיר להימחק בו. ברצינות.",cta:"בוא נגלה →",tr:{en:{"q": "Options: how to make 200% — or lose 100% in a week.", "sub": "The fastest instrument to get wiped out with. Seriously.", "cta": "Let's find out →"}}},
  {t:"card",art:"leverage",ic:"🎰",h:"הימור על תנועה, לא בעלות",p:"נגזר (כמו אופציה) הוא חוזה ששוויו 'נגזר' מנכס אחר. הוא לא מקנה בעלות — אלא הימור ממונף על כיוון המחיר בזמן קצוב. אפשר להרוויח הרבה מהר, ולאבד את כל ההשקעה מהר עוד יותר.",tr:{en:{"h": "A bet on movement, not ownership", "p": "A derivative (such as an option) is a contract whose value is derived from another asset. It confers no ownership — it's a leveraged bet on price direction within a set time. You can profit quickly, and lose your entire investment even faster."}}},
  {t:"quiz",q:"מה ההבדל בין מניה לאופציה?",o:["אין הבדל","מניה = בעלות; אופציה = הימור ממונף על תנועה בזמן קצוב","אופציה בטוחה יותר","מניה פגה תוקף"],a:1,why:"אופציה היא חוזה עם תאריך תפוגה ומינוף — לא נתח בעסק. הסיכון בה גבוה בהרבה.",tr:{en:{"q": "What's the difference between a stock and an option?", "o": ["There's no difference", "A stock = ownership; an option = a leveraged bet on movement within a deadline", "An option is safer", "A stock expires"], "why": "An option is a contract with an expiry date and leverage — not a stake in a business. Its risk is far higher."}}},
  {t:"sim",asset:"⚡ אופציה",start:10000,
   why:"זה בדיוק למה אופציות מסוכנות: הרווח הפוטנציאלי מפתה, אבל התפוגה שוחקת אותך כל יום — ואם לא צדקת בזמן, אתה מאבד את הכל. לא חלק. הכל.",
   events:[
    {ic:"⏳",t:"הזמן עובר",good:false,news:"עברו שבועיים. המניה כמעט לא זזה. אבל האופציה שלך איבדה 25% — פשוט כי הזמן עובר.",
     opts:[{l:"מחזיק ומקווה",r:-.25,fb:"התפוגה שוחקת אותך כל יום. 'לקוות' זו לא אסטרטגיה מול שעון."},
      {l:"מבין שהזמן פועל נגדי ויוצא",r:-.10,good:true,fb:"חתכת הפסד קטן. באופציות, זמן = כסף שנשרף."}]},
    {ic:"📉",t:"המניה זזה נגדך",good:false,news:"המניה יורדת 5% בלבד — אבל האופציה שלך צונחת 60%. זה המינוף.",
     opts:[{l:"קונה עוד אופציות 'בהנחה'",r:-.40,fb:"הכפלת הימור מפסיד עם שעון מתקתק. זו הדרך המהירה להתאפס."},
      {l:"עוצר את ההפסד",r:-.15,good:true,fb:"נכון. מינוף מגדיל תנועה קטנה לאסון — צריך לצאת מוקדם."}]},
    {ic:"💀",t:"התפוגה",good:false,news:"האופציה פגה. אם היא לא 'בכסף' — היא שווה בדיוק אפס. לא 'ירדה'. אפס.",
     opts:[{l:"למדתי — אופציות לא בשבילי כרגע",r:0,good:true,fb:"זו התשובה הבוגרת. רוב המתחילים לומדים אותה בכסף אמיתי."},
      {l:"ננסה שוב עם עוד כסף",r:-.50,fb:"זו התנהגות של מהמר, לא של משקיע. וזה נגמר תמיד באותו מקום."}]}],tr:{en:{"asset": "⚡ An option", "why": "This is exactly why options are dangerous: the potential profit is tempting, but expiry erodes you every single day — and if you weren't right in time, you lose everything. Not part of it. Everything.", "events": [{"t": "Time passes", "news": "Two weeks have gone by. The stock has barely moved. But your option has lost 25% — purely because time is passing.", "opts": [{"l": "Hold and hope", "fb": "Expiry erodes you every day. 'Hoping' isn't a strategy against a clock."}, {"l": "Recognise that time works against me and exit", "fb": "You cut a small loss. With options, time is money burning."}]}, {"t": "The stock moves against you", "news": "The stock falls just 5% — but your option plunges 60%. That's leverage.", "opts": [{"l": "Buy more options 'at a discount'", "fb": "Doubling down on a losing bet with a ticking clock. That's the fast route to zero."}, {"l": "Stop the loss", "fb": "Correct. Leverage magnifies a small move into a disaster — you have to exit early."}]}, {"t": "Expiry", "news": "The option expires. If it isn't 'in the money', it's worth exactly zero. Not 'down'. Zero.", "opts": [{"l": "Lesson learned — options aren't for me right now", "fb": "That's the mature answer. Most beginners learn it with real money."}, {"l": "Try again with more money", "fb": "That's a gambler's behaviour, not an investor's. And it always ends in the same place."}]}]}}},
  {t:"summary",h:"מה למדת",points:["אופציה = זכות לקנות/למכור במחיר מסוים עד תאריך","תפוגה: הזמן פועל נגדך כל יום","מינוף עצום — לשני הכיוונים","למתחילים: הימנע. פשוט הימנע"],tr:{en:{"h": "What you learned", "points": ["An option is the right to buy or sell at a set price until a set date", "Expiry: time works against you every day", "Enormous leverage — in both directions", "For beginners: avoid. Simply avoid"]}}}]},
 {id:"l192",ic:"⏳",title:"למה זה מסוכן",tier:"intermediate",tr:{en:{"title": "Why it's dangerous"}},steps:[
  {t:"card",art:"leverage",ic:"⏳",h:"שלושה רוצחים",p:"אופציות הורגות מתחילים בשלושה אופנים: מינוף (הפסדים מוגדלים), תפוגה (הזמן פועל נגדך — הן מאבדות ערך יום-יום), ומורכבות (קל לטעות בכיוון וגם בעיתוי). רוב הסוחרים הפרטיים באופציות מפסידים.",tr:{en:{"h": "Three killers", "p": "Options kill beginners in three ways: leverage (magnified losses), expiry (time works against you — they lose value day by day), and complexity (it's easy to be wrong about direction and timing both). Most retail options traders lose money."}}},
  {t:"quiz",q:"מה ייחודי לאופציה לעומת מניה?",o:["אין לה סיכון","יש לה תאריך תפוגה והזמן פועל נגדך","היא תמיד עולה","היא אג\"ח"],a:1,why:"תפוגה + מינוף הופכים אופציות למכשיר מהיר ומסוכן — לרוב לא מתאים למי שרק מתחיל.",tr:{en:{"q": "What's unique to an option compared with a stock?", "o": ["It carries no risk", "It has an expiry date and time works against you", "It always rises", "It's a bond"], "why": "Expiry plus leverage make options a fast and dangerous instrument — usually unsuitable for anyone just starting out."}}},
  {t:"scenario",q:"חבר: 'קניתי אופציות, אם המניה תעלה 10% ארוויח 200%!'.",situation:"מה הוא לא מספר לך?",
   options:[{label:"שאם היא לא תעלה בזמן — הוא עלול לאבד 100%",verdict:"good",fb:"בדיוק. המינוף עובד בשני הכיוונים, והתפוגה שוחקת את הערך כל יום. סיכוי לרווח גדול = סיכון להפסד מלא."},
    {label:"כלום, זו הזדמנות בטוחה",verdict:"bad",fb:"אין 'בטוח' באופציות. הרווח הגדול מגיע עם סיכון ריאלי לאבד את כל ההשקעה."}],
   why:"אופציות מדגישות רק את האפסייד. המחיר: מינוף ותפוגה שהופכים הפסד מלא לתרחיש נפוץ.",tr:{en:{"q": "A friend says: 'I bought options — if the stock rises 10% I'll make 200%!'.", "situation": "What isn't he telling you?", "why": "Options highlight only the upside. The price is leverage and expiry, which make a total loss a common outcome.", "options": [{"label": "That if it doesn't rise in time, he could lose 100%", "fb": "Exactly. Leverage works both ways, and expiry erodes the value daily. A chance of a large gain means a risk of total loss."}, {"label": "Nothing, it's a safe opportunity", "fb": "There's no 'safe' in options. The large gain comes with a real risk of losing the entire investment."}]}}}]}
]},
{id:"c20",ic:"⚡",title:"מכירה בחסר ומינוף",desc:"החרב הפיפיות של השווקים",tr:{en:{"title": "Short Selling and Leverage", "desc": "The double-edged sword of markets"}},lessons:[
 {id:"l201",ic:"📉",title:"מכירה בחסר (Short)",tier:"beginner",tr:{en:{"title": "Short selling"}},steps:[
  {t:"hook",ic:"📉",q:"איך אפשר להפסיד יותר מ-100% ממה שהשקעת?",sub:"זה נשמע בלתי אפשרי. זה לא.",cta:"בוא נגלה →",tr:{en:{"q": "How can you lose more than 100% of what you invested?", "sub": "It sounds impossible. It isn't.", "cta": "Let's find out →"}}},
  {t:"card",art:"leverage",ic:"📉",h:"להרוויח מירידה",p:"מכירה בחסר = לשאול מניה, למכור אותה, ולקוות לקנות בזול בעתיד ולהחזיר. אתה מרוויח אם המחיר יורד. הבעיה: ההפסד הפוטנציאלי אינסופי (מחיר יכול לעלות בלי גבול), בעוד ברכישה רגילה אתה מפסיד לכל היותר את מה שהשקעת.",tr:{en:{"h": "Profiting from a decline", "p": "Short selling means borrowing a stock, selling it, and hoping to buy it back cheaper later to return it. You profit if the price falls. The problem: the potential loss is unlimited (a price can rise without limit), whereas in a normal purchase you can lose at most what you invested."}}},
  {t:"quiz",q:"מה מסוכן במכירה בחסר?",o:["אין סיכון","ההפסד הפוטנציאלי בלתי מוגבל אם המחיר עולה","היא חינם","היא תמיד מרוויחה"],a:1,why:"בקנייה ההפסד מוגבל להשקעה; בשורט הוא יכול לגדול ללא גבול כי אין תקרה למחיר.",tr:{en:{"q": "What's dangerous about short selling?", "o": ["There's no risk", "The potential loss is unlimited if the price rises", "It's free", "It always profits"], "why": "When buying, your loss is capped at your investment; when shorting, it can grow without limit because there's no ceiling on price."}}},
  {t:"predict",q:"מכרת בחסר מניה ב-₪100. היא עלתה ל-₪400. כמה הפסדת ביחס להשקעה המקורית?",
   min:0,max:500,step:25,unit:"% הפסד",answer:300,tol:75,
   reveal:"300% — פי 3 ממה שהשקעת. ובקנייה רגילה ההפסד המקסימלי הוא 100%. במכירה בחסר הוא אינסופי.",
   why:"מניה יכולה לעלות בלי גבול — ולכן ההפסד בשורט הוא בלתי מוגבל. זה הופך אותו למכשיר מסוכן במיוחד.",tr:{en:{"q": "You shorted a stock at ₪100. It rose to ₪400. How much did you lose relative to your original stake?", "unit": "% loss", "reveal": "300% — three times what you invested. In a normal purchase the maximum loss is 100%. In a short sale it's unlimited.", "why": "A stock can rise without limit — which is why the loss on a short is unbounded. That makes it a particularly dangerous instrument."}}},
  {t:"sim",asset:"📉 שורט על מניה",start:10000,
   why:"זה ההבדל המהותי: בקנייה רגילה ההפסד המקסימלי שלך הוא 100% — הכסף שהשקעת. בשורט המחיר יכול לעלות בלי גבול, ולכן ההפסד בלתי מוגבל. וכשמוסיפים מינוף, אתה לא בוחר מתי לצאת — הברוקר בוחר בשבילך.",
   events:[
    {ic:"📉",t:"התחלה טובה",good:true,news:"מכרת בחסר ב-₪100. המניה יורדת ל-₪85. אתה ברווח.",
     opts:[{l:"סוגר את הפוזיציה ברווח",r:.15,good:true,fb:"יצאת ברווח. בשורט, לצאת מוקדם זו לא פחדנות — זו הישרדות."},
      {l:"מחזיק, בטוח שתמשיך ליפול",r:0,fb:"החזקת. בשורט הזמן לא עובד לטובתך — הוא עובד נגדך."}]},
    {ic:"🚀",t:"סקוויז",good:false,news:"חדשות טובות פתאום. המניה מזנקת ל-₪180. אתה בהפסד של 80% — ועדיין עולה.",
     opts:[{l:"סוגר מיד וחותך הפסד",r:-.30,good:true,fb:"כואב, אבל שרדת. בשורט חייבים סטופ — אחרת אין תחתית."},
      {l:"מחזיק, 'היא חייבת לרדת'",r:-.75,fb:"אין 'חייבת'. מחיר יכול לעלות בלי גבול — וההפסד שלך איתו."}]},
    {ic:"💀",t:"קריאת מרג'ין",good:false,news:"המניה ב-₪400. הברוקר מחסל את הפוזיציה בכוח. הפסדת פי 3 ממה שהשקעת.",
     opts:[{l:"למדתי: שורט לא בשבילי",r:0,good:true,fb:"התשובה הבוגרת. רוב האנשים לומדים את זה בכסף אמיתי."},
      {l:"ננסה שוב עם יותר כסף",r:-.50,fb:"זו חשיבה של מהמר. וזה נגמר תמיד באותו מקום."}]}],tr:{en:{"asset": "📉 Shorting a stock", "why": "This is the fundamental difference: in a normal purchase your maximum loss is 100% — the money you put in. In a short, the price can rise without limit, so the loss is unbounded. And once you add leverage, you don't choose when to exit — the broker chooses for you.", "events": [{"t": "A good start", "news": "You shorted at ₪100. The stock falls to ₪85. You're in profit.", "opts": [{"l": "Close the position at a profit", "fb": "You got out with a gain. In shorting, exiting early isn't cowardice — it's survival."}, {"l": "Hold, certain it will keep falling", "fb": "You held. In a short, time doesn't work for you — it works against you."}]}, {"t": "A squeeze", "news": "Sudden good news. The stock leaps to ₪180. You're down 80% — and it's still climbing.", "opts": [{"l": "Close immediately and cut the loss", "fb": "Painful, but you survived. Shorts require a stop — otherwise there's no floor."}, {"l": "Hold on, 'it has to fall'", "fb": "There's no 'has to'. A price can rise without limit — and your loss with it."}]}, {"t": "Margin call", "news": "The stock is at ₪400. The broker liquidates the position by force. You lost three times what you invested.", "opts": [{"l": "Lesson learned: shorting isn't for me", "fb": "The mature answer. Most people learn this with real money."}, {"l": "Try again with more money", "fb": "That's a gambler's thinking. And it always ends in the same place."}]}]}}},
  {t:"summary",h:"מה למדת",points:["מכירה בחסר = מהמר שהמחיר ירד","ההפסד תיאורטית אינסופי — מחיר יכול לעלות בלי גבול","מינוף מגדיל רווח והפסד — וקריאת מרג'ין מוחקת","מינוף הוא הסיבה מספר 1 שמשקיעים נמחקים"],tr:{en:{"h": "What you learned", "points": ["Short selling means betting the price will fall", "The loss is theoretically unlimited — a price can rise without bound", "Leverage magnifies gains and losses — and a margin call wipes you out", "Leverage is the number one reason investors get wiped out"]}}}]},
 {id:"l202",ic:"⚡",title:"מינוף מגדיל הכל",tier:"intermediate",tr:{en:{"title": "Leverage magnifies everything"}},steps:[
  {t:"card",art:"leverage",ic:"⚡",h:"מכפיל רווח — ומכפיל הרס",p:"מינוף (מסחר בכסף שאול) מכפיל את הרווח כשצדקת — ואת ההפסד כשטעית. הוא יכול למחוק פוזיציה, ואף להשאיר אותך חייב יותר ממה שהשקעת. זה ההבדל בין תנודה לא נעימה לבין מחיקה מוחלטת.",tr:{en:{"h": "A profit multiplier — and a ruin multiplier", "p": "Leverage (trading with borrowed money) multiplies your gain when you're right — and your loss when you're wrong. It can erase a position, and even leave you owing more than you invested. That's the difference between an unpleasant swing and complete destruction."}}},
  {t:"scenario",q:"מציעים לך למנף פי 5 את התיק.",situation:"מה הסיכון האמיתי?",
   options:[{label:"ירידה של 20% מוחקת את כל ההון שלי",verdict:"good",fb:"נכון. במינוף פי 5, תנועה של 20% נגדך = 100% הפסד. מינוף הופך תנודה רגילה לאסון."},
    {label:"אין סיכון, רק אפסייד",verdict:"bad",fb:"מינוף מגדיל את שני הכיוונים. ה'אפסייד' מגיע עם סיכון מחיקה מלאה."}],
   why:"מינוף אינו 'עוד תשואה' — הוא הגדלה של הסיכון עד כדי מחיקה. למתחילים: להימנע.",tr:{en:{"q": "You're offered five-times leverage on your portfolio.", "situation": "What's the real risk?", "why": "Leverage isn't 'extra return' — it's an amplification of risk to the point of ruin. For beginners: avoid.", "options": [{"label": "A 20% decline wipes out all my capital", "fb": "Correct. At five-times leverage, a 20% move against you means a 100% loss. Leverage turns an ordinary swing into a disaster."}, {"label": "There's no risk, only upside", "fb": "Leverage magnifies both directions. The 'upside' comes with the risk of total wipeout."}]}}}]}
]},
{id:"c21",ic:"🏛️",title:"פעולות תאגידיות",desc:"IPO, פיצול מניות ובייבק",tr:{en:{"title": "Corporate Actions", "desc": "IPOs, stock splits and buybacks"}},lessons:[
 {id:"l211",ic:"🚀",title:"הנפקה (IPO)",tier:"beginner",tr:{en:{"title": "Initial public offerings (IPOs)"}},steps:[
  {t:"hook",ic:"🎁",q:"החברה מחלקת מניות חינם. התעשרת?",sub:"לא. ובוא נבין למה.",cta:"בוא נגלה →",tr:{en:{"q": "The company is handing out free shares. Did you just get richer?", "sub": "No. Let's understand why.", "cta": "Let's find out →"}}},
  {t:"card",art:"fomo",ic:"🚀",h:"כשחברה יוצאת לבורסה",p:"הנפקה ראשונית (IPO) היא הפעם הראשונה שחברה מוכרת מניות לציבור. סביב הנפקות יש הרבה הייפ ותקשורת — אבל גם תנודתיות קיצונית וחוסר היסטוריה ציבורית. הרבה הנפקות 'חמות' יורדות מתחת למחיר ההנפקה בהמשך.",tr:{en:{"h": "When a company goes public", "p": "An initial public offering is the first time a company sells shares to the public. IPOs come with a great deal of hype and media coverage — but also extreme volatility and no public track record. Many 'hot' IPOs later trade below their offering price."}}},
  {t:"quiz",q:"מה נכון לגבי השקעה בהנפקות (IPO)?",o:["רווח מובטח","הייפ גבוה, תנודתיות גבוהה, מעט היסטוריה","בטוחות מאג\"ח","אסורות"],a:1,why:"הנפקות מגיעות עם התרגשות ותמחור לא בשל — לרוב לא המקום להתחיל בו כמשקיע מתחיל.",tr:{en:{"q": "What's true about investing in IPOs?", "o": ["A guaranteed profit", "High hype, high volatility, little history", "Safer than bonds", "They're prohibited"], "why": "IPOs arrive with excitement and immature pricing — usually not the place for a beginner to start."}}},
  {t:"scenario",q:"הנפקה 'חמה' מלווה בהייפ תקשורתי ענק.",situation:"מה הגישה הנבונה?",
   options:[{label:"להמתין, לתת לתמחור להתייצב ולבחון את העסק בזמן",verdict:"good",fb:"נכון. אין לחץ להיכנס ביום הראשון. הרבה הנפקות 'חמות' יורדות מתחת למחיר ההנפקה בהמשך."},
    {label:"לקנות ביום הראשון לפני ש'מפספסים'",verdict:"bad",fb:"זה FOMO עטוף בהנפקה. בלי היסטוריה ובלי תמחור בשל — אתה קונה הייפ, לא עסק מוכר."}],
   why:"הנפקה אינה חובה להיכנס אליה מיד. סבלנות מאפשרת לראות אם העסק והמחיר מחזיקים.",tr:{en:{"q": "A 'hot' IPO arrives with enormous media hype.", "situation": "What's the sensible approach?", "why": "You're not obliged to enter an IPO immediately. Patience lets you see whether the business and the price hold up.", "options": [{"label": "Wait, let the pricing settle and examine the business over time", "fb": "Correct. There's no pressure to buy on day one. Many 'hot' IPOs later fall below their offering price."}, {"label": "Buy on day one before 'missing out'", "fb": "That's FOMO wrapped in an IPO. With no history and immature pricing, you're buying hype, not a proven business."}]}}},
  {t:"summary",h:"מה למדת",points:["פיצול מניות: יותר מניות, אותו שווי כולל","הנפקה (IPO) = הייפ + תמחור לא בשל","מיזוגים ורכישות משנים את התמונה מהיסוד","פעולה תאגידית לא יוצרת ערך יש מאין"],tr:{en:{"h": "What you learned", "points": ["A stock split: more shares, the same total value", "An IPO = hype plus immature pricing", "Mergers and acquisitions change the picture fundamentally", "A corporate action doesn't create value out of nothing"]}}}]},
 {id:"l212",ic:"✂️",title:"פיצול ובייבק",tier:"intermediate",tr:{en:{"title": "Splits and buybacks"}},steps:[
  {t:"card",art:"diversify",ic:"✂️",h:"פיצול מניה (Split)",p:"פיצול מניות מחלק כל מניה לכמה חלקים (למשל 1 ל-10), כך שהמחיר למניה יורד אך שווי האחזקה שלך לא משתנה. זה קוסמטי — כמו להחליף שטר של 100 בעשרה שטרות של 10. אל תתבלבל: החברה לא נעשתה זולה יותר.",tr:{en:{"h": "A stock split", "p": "A stock split divides each share into several parts (1-for-10, say), so the price per share falls but the value of your holding doesn't change. It's cosmetic — like swapping a 100 note for ten 10s. Don't be fooled: the company hasn't become cheaper."}}},
  {t:"quiz",q:"אחרי פיצול מניות 1:10, מה קורה לשווי ההשקעה שלך?",o:["גדל פי 10","נשאר זהה — יותר מניות במחיר נמוך יותר","נחתך","נעלם"],a:1,why:"פיצול הוא קוסמטי: המחיר למניה יורד ומספר המניות עולה, אבל השווי הכולל שלך זהה.",tr:{en:{"q": "After a 1-for-10 stock split, what happens to the value of your investment?", "o": ["It grows tenfold", "It stays the same — more shares at a lower price", "It's cut", "It disappears"], "why": "A split is cosmetic: the price per share falls and the number of shares rises, but your total value is identical."}}},
  {t:"card",art:"trim",ic:"🔄",h:"רכישה עצמית (Buyback)",p:"בבייבק החברה קונה בחזרה מניות של עצמה מהשוק. זה מקטין את מספר המניות — כך שכל מניה שנשארה מייצגת נתח גדול יותר מהרווח. זו דרך להחזיר ערך לבעלי המניות, חלופה לדיבידנד.",tr:{en:{"h": "A buyback", "p": "In a buyback, the company purchases its own shares from the market. That reduces the share count — so each remaining share represents a larger slice of the profit. It's a way of returning value to shareholders, an alternative to a dividend."}}},
  {t:"flip",q:"3 פעולות תאגידיות — מה הן באמת עושות? הקש:",
   cards:[{ic:"✂️",t:"פיצול מניות",b:"יותר מניות, מחיר נמוך יותר, אותו שווי כולל בדיוק. לא התעשרת — רק חתכת את העוגה לפרוסות דקות יותר."},
    {ic:"🔙",t:"רכישה עצמית (Buyback)",b:"החברה קונה מניות של עצמה. פחות מניות בשוק = כל מניה מייצגת נתח גדול יותר מהרווח."},
    {ic:"🎁",t:"דיבידנד מניות",b:"מקבלים מניות במקום מזומן. גם כאן — השווי הכולל לא השתנה."}],tr:{en:{"q": "3 corporate actions — what do they really do? Tap:", "cards": [{"t": "Stock split", "b": "More shares, a lower price, exactly the same total value. You didn't get richer — you just cut the cake into thinner slices."}, {"t": "Buyback", "b": "The company buys its own shares. Fewer shares outstanding means each one represents a larger slice of the profit."}, {"t": "Stock dividend", "b": "You receive shares instead of cash. Here too, the total value hasn't changed."}]}}}]}
]},
{id:"c22",ic:"📊",title:"מדדים וסקטורים",desc:"איך שוק שלם בנוי",tr:{en:{"title": "Indexes and Sectors", "desc": "How an entire market is built"}},lessons:[
 {id:"l221",ic:"📊",title:"איך מדד בנוי",tier:"beginner",tr:{en:{"title": "How an index is built"}},steps:[
  {t:"hook",ic:"🗂️",q:"S&P 500, נאסד\"ק, ת\"א 35 — מה ההבדל ולמי אכפת?",sub:"למי שרוצה לדעת במה הוא באמת מושקע.",cta:"בוא נגלה →",tr:{en:{"q": "S&P 500, Nasdaq, TA-35 — what's the difference and who cares?", "sub": "Anyone who wants to know what they're actually invested in.", "cta": "Let's find out →"}}},
  {t:"card",art:"diversify",ic:"📊",h:"שקלול לפי גודל",p:"רוב המדדים משוקללים לפי שווי שוק — חברות גדולות יותר תופסות משקל גדול יותר. לכן כשקונים מדד, רוב הכסף הולך לענקיות. זה יתרון (החזקים מובילים) אבל גם ריכוזיות נסתרת בכמה חברות עצומות.",tr:{en:{"h": "Weighted by size", "p": "Most indexes are weighted by market capitalisation — larger companies take a larger share. So when you buy an index, most of your money goes to the giants. That's an advantage (the strongest lead) but also hidden concentration in a handful of enormous companies."}}},
  {t:"quiz",q:"במדד משוקלל שווי שוק, לחברה הגדולה יש...",o:["משקל שווה לכולם","משקל גדול יותר בהתאם לגודלה","משקל אפס","דיבידנד קבוע"],a:1,why:"שקלול שווי-שוק נותן לחברות הגדולות נתח גדול יותר — כך שכמה ענקיות מזיזות את המדד.",tr:{en:{"q": "In a market-cap weighted index, the largest company has...", "o": ["Equal weight to everyone else", "A larger weight in proportion to its size", "Zero weight", "A fixed dividend"], "why": "Cap-weighting gives larger companies a bigger share — so a few giants move the index."}}},
  {t:"predict",q:"במדד משוקלל לפי שווי שוק, כמה בערך מהמשקל תופסות 10 החברות הגדולות ב-S&P 500?",
   min:5,max:60,step:5,unit:"%",answer:35,tol:12,
   reveal:"כ-30-35% — 10 חברות מתוך 500 שולטות בכשליש מהמדד. 'פיזור' הוא לא תמיד מה שנדמה.",
   why:"מדד משוקלל שווי מרוכז בענקיות. אתה חושב שקנית 500 חברות — אבל בפועל התנועה נשלטת על ידי קומץ.",tr:{en:{"q": "In a market-cap weighted index, roughly what share of the weight do the 10 largest companies in the S&P 500 occupy?", "unit": "%", "reveal": "Around 30-35% — 10 companies out of 500 control about a third of the index. 'Diversification' isn't always what it appears.", "why": "A cap-weighted index is concentrated in giants. You think you bought 500 companies — but in practice a handful drives the movement."}}},
  {t:"flip",q:"3 מדדים, 3 עולמות. הקש:",
   cards:[{ic:"🇺🇸",t:"S&P 500",b:"500 החברות הגדולות בארה\"ב. מגוון סקטורים — אבל 10 הענקיות שולטות בכשליש מהתנועה."},
    {ic:"💻",t:"נאסד\"ק 100",b:"מוטה טכנולוגיה בכבדות. תשואה גבוהה יותר היסטורית — ותנודתיות גבוהה בהרבה."},
    {ic:"🌍",t:"מדד עולמי",b:"אלפי חברות בעשרות מדינות. הפיזור הרחב ביותר — ולכן גם הממוצע ביותר."}],tr:{en:{"q": "3 indexes, 3 worlds. Tap:", "cards": [{"t": "S&P 500", "b": "The 500 largest companies in the US. Diverse sectors — but 10 giants control about a third of the movement."}, {"t": "Nasdaq 100", "b": "Heavily tilted toward technology. Higher historical returns — and considerably higher volatility."}, {"t": "A global index", "b": "Thousands of companies across dozens of countries. The broadest diversification — and therefore the most average."}]}}},
  {t:"summary",h:"מה למדת",points:["מדד = סל חברות לפי כלל מוגדר","מדדים שונים = חשיפה שונה לגמרי","נאסד\"ק מוטה טכנולוגיה — תנודתי יותר","דע במה אתה מושקע בפועל, לא רק את השם"],tr:{en:{"h": "What you learned", "points": ["An index is a basket of companies chosen by a defined rule", "Different indexes mean completely different exposure", "The Nasdaq is tech-tilted — and more volatile", "Know what you're actually invested in, not just the name"]}}}]},
 {id:"l222",ic:"🧭",title:"סקטורים ומחזוריות",tier:"intermediate",tr:{en:{"title": "Sectors and cyclicality"}},steps:[
  {t:"card",art:"diversify",ic:"🧭",h:"לא כל הסקטורים זזים יחד",p:"השוק מחולק לסקטורים (טכנולוגיה, פיננסים, בריאות, אנרגיה...). בשלבים שונים של המחזור הכלכלי, סקטורים שונים מובילים: צמיחה/טק בזמני ריבית נמוכה, אנרגיה ובנקים בזמני אינפלציה וריבית גבוהה. פיזור על סקטורים מקטין תלות במגמה אחת.",tr:{en:{"h": "Not all sectors move together", "p": "The market divides into sectors (technology, financials, healthcare, energy and so on). At different stages of the economic cycle, different sectors lead: growth and tech when rates are low, energy and banks during inflation and high rates. Spreading across sectors reduces dependence on any single trend."}}},
  {t:"sort",q:"סדר מהסקטור ההגנתי ביותר (1) לתנודתי ביותר (4).",
   items:[{label:"🔌 תשתיות (יוטיליטי)",rank:1},{label:"🥫 צריכה בסיסית",rank:2},{label:"💻 טכנולוגיה",rank:3},{label:"🧬 ביוטק צעיר",rank:4}],
   why:"סקטורים 'הגנתיים' (תשתיות, צריכה בסיסית) יציבים בזמני משבר; צמיחה וביוטק תנודתיים בהרבה.",tr:{en:{"q": "Order from the most defensive sector (1) to the most volatile (4).", "items": [{"label": "🔌 Utilities"}, {"label": "🥫 Consumer staples"}, {"label": "💻 Technology"}, {"label": "🧬 Early-stage biotech"}], "why": "'Defensive' sectors (utilities, staples) stay stable during crises; growth and biotech are far more volatile."}}}]}
]},
{id:"c23",ic:"🎯",title:"בניית תיק לפי מטרות",desc:"מהמטרה אל ההקצאה",tr:{en:{"title": "Building a Portfolio Around Goals", "desc": "From the goal to the allocation"}},lessons:[
 {id:"l231",ic:"🎯",title:"אופק קובע הכל",tier:"beginner",tr:{en:{"title": "Your horizon decides everything"}},steps:[
  {t:"hook",ic:"🎯",q:"תיק להשקעה לפנסיה ותיק לדירה בעוד 3 שנים — זה לא אותו תיק.",sub:"המטרה קובעת את התיק. לא ההפך.",cta:"בוא נגלה →",tr:{en:{"q": "A retirement portfolio and a portfolio for an apartment in three years aren't the same portfolio.", "sub": "The goal determines the portfolio. Not the other way around.", "cta": "Let's find out →"}}},
  {t:"card",art:"coresat",ic:"🎯",h:"כסף לפי זמן",p:"לפני שבוחרים נכסים — שואלים 'מתי אצטרך את הכסף?'. כסף לשנה הקרובה = נזיל ובטוח (פיקדון). כסף ל-5 שנים = מעורב. כסף ל-20 שנה = יכול לשאת הרבה מניות. אותו אדם יכול להחזיק כמה 'דליים' עם אופקים שונים.",tr:{en:{"h": "Money organised by time", "p": "Before choosing assets, ask 'when will I need this money?'. Money for the coming year should be liquid and safe (a deposit). Money for five years should be mixed. Money for 20 years can carry plenty of stocks. One person can hold several 'buckets' with different horizons."}}},
  {t:"scenario",q:"אתה חוסך גם למקדמה בעוד שנתיים וגם לפנסיה בעוד 30 שנה.",situation:"האם שני הכספים צריכים אותה הקצאה?",
   options:[{label:"לא — המקדמה בטוחה ונזילה, הפנסיה עם יותר מניות",verdict:"good",fb:"בדיוק. אופק שונה = הקצאה שונה. אסור לסכן כסף שתצטרך בקרוב בשוק תנודתי."},
    {label:"כן, אותו דבר לכל הכסף",verdict:"bad",fb:"סיכון. אם המקדמה בשוק ומגיעה מפולת שנה לפני הרכישה — נמחק חלק ממנה בלי זמן להתאושש."}],
   why:"מפרידים כספים לפי אופק. 'דלי' קצר-טווח בטוח, 'דלי' ארוך-טווח יכול לקחת סיכון.",tr:{en:{"q": "You're saving both for a deposit in two years and for retirement in 30 years.", "situation": "Should both pots have the same allocation?", "why": "Separate money by horizon. The short-term bucket stays safe; the long-term bucket can take risk.", "options": [{"label": "No — the deposit stays safe and liquid, the pension holds more stocks", "fb": "Exactly. A different horizon means a different allocation. Never risk money you'll need soon in a volatile market."}, {"label": "Yes, the same for all the money", "fb": "Risky. If the deposit is in the market and a crash arrives a year before the purchase, part of it is erased with no time to recover."}]}}},
  {t:"flip",q:"3 תיקים, 3 מטרות. הקש לגלות מה מתאים לכל אחת:",
   cards:[{ic:"🏖️",t:"פנסיה בעוד 30 שנה",b:"רוב במניות. יש לך זמן לספוג מפולות — והזמן הוא הנכס החזק ביותר שלך."},
    {ic:"🏠",t:"דירה בעוד 3 שנים",b:"נכסים בטוחים ונזילים. מפולת שנה לפני הרכישה תמחק לך את המקדמה."},
    {ic:"🚨",t:"קרן חירום",b:"מזומן נזיל בלבד. אפס סיכון. היא קונה שקט, לא תשואה."}],tr:{en:{"q": "3 portfolios, 3 goals. Tap to see what suits each:", "cards": [{"t": "Retirement in 30 years", "b": "Mostly stocks. You have time to absorb crashes — and time is your most powerful asset."}, {"t": "An apartment in 3 years", "b": "Safe, liquid assets. A crash a year before the purchase would erase your deposit."}, {"t": "An emergency fund", "b": "Liquid cash only. Zero risk. It buys peace of mind, not returns."}]}}},
  {t:"summary",h:"מה למדת",points:["כל מטרה = אופק זמן שונה = תיק שונה","מטרה קרובה: בטוח ונזיל. רחוקה: יותר מניות","אל תערבב מטרות בתיק אחד","כתוב את המטרה לפני שאתה בוחר נכסים"],tr:{en:{"h": "What you learned", "points": ["Every goal has a different time horizon, and therefore a different portfolio", "A near-term goal: safe and liquid. A distant one: more stocks", "Don't mix goals within a single portfolio", "Write down the goal before you choose the assets"]}}}]},
 {id:"l232",ic:"🧱",title:"ליבה ולוויינים",tier:"intermediate",tr:{en:{"title": "Core and satellites"}},steps:[
  {t:"card",art:"coresat",ic:"🧱",h:"מבנה שמחזיק",p:"מבנה תיק קלאסי: ליבה גדולה (70-90%) של מדד רחב ואג\"ח — היציבות. ומסביבה 'לוויינים' קטנים (10-30%): מניות בודדות, סקטור מסוים, נכס תנודתי. הליבה נותנת בסיס יציב; הלוויינים נותנים למידה והזדמנות בלי לסכן את הכל.",tr:{en:{"h": "A structure that holds", "p": "The classic portfolio structure: a large core (70-90%) of a broad index and bonds — the stability. Around it, small 'satellites' (10-30%): individual stocks, a particular sector, a volatile asset. The core provides a stable base; the satellites offer learning and opportunity without risking everything."}}},
  {t:"build",q:"בנה תיק בגישת ליבה-ולוויינים: ליבה גדולה יציבה, לוויינים קטנים.",assets:["INDX","BOND","GOLD","TECH","BIO","CRPT"],
   why:"ליבת מדד ואג\"ח שומרת עליך; הלוויינים הקטנים הם המקום ללמוד ולקחת סיכון מדוד.",tr:{en:{"q": "Build a portfolio using the core-and-satellite approach: a large stable core, small satellites.", "why": "A core of index funds and bonds protects you; the small satellites are where you learn and take measured risk."}}},
  {t:"challenge",task:"כתוב שלוש שורות: (1) מה המטרה הכספית הקרובה שלי? (2) בעוד כמה שנים? (3) לכן — כמה סיכון מתאים לה?",
   hint:"מטרה קובעת תיק. לא ההפך. מי שמשקיע בלי מטרה — מהמר בלי לדעת.",tr:{en:{"task": "Write three lines: (1) What's my nearest financial goal? (2) In how many years? (3) Therefore — how much risk suits it?", "hint": "The goal determines the portfolio, not the other way around. Investing without a goal is gambling without knowing it."}}}]}
]},
{id:"c24",ic:"🌅",title:"פרישה ותכנון ארוך",desc:"לבנות חופש כלכלי עתידי",tr:{en:{"title": "Retirement and Long-Term Planning", "desc": "Building future financial freedom"}},lessons:[
 {id:"l241",ic:"🌅",title:"כוח ההתחלה המוקדמת",tier:"beginner",tr:{en:{"title": "The power of starting early"}},steps:[
  {t:"hook",ic:"🏖️",q:"כמה כסף צריך כדי לפרוש? יש מספר.",sub:"וזה פחות מסתורי ממה שנדמה לך.",cta:"בוא נגלה →",tr:{en:{"q": "How much money do you need to retire? There's a number.", "sub": "And it's less mysterious than you'd think.", "cta": "Let's find out →"}}},
  {t:"card",art:"compound",ic:"🌅",h:"הזמן עושה את העבודה",p:"תכנון פרישה הוא המשחק שבו ריבית דריבית זורחת. הפקדה קבועה קטנה מגיל צעיר, בזכות עשרות שנות צמיחה, מנצחת סכומים גדולים שמתחילים מאוחר. הנכס היקר ביותר בתכנון פרישה הוא הזמן — והיום.",tr:{en:{"h": "Time does the work", "p": "Retirement planning is the game where compounding shines. A small regular contribution from a young age, given decades of growth, beats large sums started late. The most valuable asset in retirement planning is time — and today."}}},
  {t:"predict",q:"₪500 בחודש, החל מגיל 25 עד 65, בתשואה ~7%. בערך כמה יצטבר?",min:200,max:2000,step:100,unit:"אלף ₪",answer:1200,tol:300,
   reveal:"מעל מיליון ₪ — רובו רווח שנצבר, לא ההפקדות עצמן.",why:"סכום צנוע לאורך 40 שנה הופך להון — כי ריבית דריבית פועלת הכי חזק לאורך זמן ארוך.",tr:{en:{"q": "₪500 a month, from age 25 to 65, at roughly a 7% return. Approximately how much accumulates?", "unit": "thousand ₪", "reveal": "Over a million shekels — most of it accumulated gains rather than the contributions themselves.", "why": "A modest sum over 40 years becomes a fortune — because compounding works hardest over long stretches of time."}}},
  {t:"challenge",task:"חשב את 'מספר החופש' שלך: ההוצאות החודשיות × 12 × 25. זה הסכום שמאפשר לחיות מהתיק.",
   hint:"עכשיו חשב שוב עם הוצאות נמוכות ב-20%. תראה כמה היעד ירד. להקטין הוצאות עובד פי שניים — פחות צריך, ומהר יותר מגיע.",tr:{en:{"task": "Work out your 'freedom number': monthly expenses × 12 × 25. That's the sum that lets you live off your portfolio.", "hint": "Now calculate it again with expenses 20% lower. Watch how far the target drops. Reducing expenses works twice over — you need less, and you get there sooner."}}},
  {t:"summary",h:"מה למדת",points:["כלל 4%: תיק פי 25 מההוצאות השנתיות","ככל שמתקרבים לפרישה — מקטינים סיכון בהדרגה","הזמן הוא המנוע. להתחיל מוקדם שווה הכל","אינפלציה שוחקת — התכנון חייב לקחת אותה בחשבון"],tr:{en:{"h": "What you learned", "points": ["The 4% rule: a portfolio 25 times your annual expenses", "As retirement approaches, reduce risk gradually", "Time is the engine. Starting early is worth everything", "Inflation erodes — your plan must account for it"]}}}]},
 {id:"l242",ic:"📐",title:"כמה צריך לפרישה",tier:"intermediate",tr:{en:{"title": "How much you need to retire"}},steps:[
  {t:"card",art:"compound",ic:"📐",h:"כלל ה-4%",p:"כלל אצבע נפוץ: תיק שמכסה 25 שנות הוצאה (או משיכה של ~4% בשנה) יכול לתמוך בפרישה לאורך זמן. אם אתה מוציא ₪10,000 בחודש = ₪120K בשנה, יעד גס הוא כ-₪3M. זה אומדן חינוכי — לא הבטחה.",tr:{en:{"h": "The 4% rule", "p": "A common rule of thumb: a portfolio covering 25 years of expenses (or withdrawals of roughly 4% a year) can support a retirement over time. If you spend ₪10,000 a month, that's ₪120K a year, so a rough target is around ₪3M. This is an educational estimate — not a promise."}}},
  {t:"quiz",q:"מה הרעיון של 'כלל ה-4%'?",o:["למשוך 4% מהתיק בשנה כדי שיחזיק לאורך זמן","להרוויח 4% מובטח","לשלם 4% מס","לחסוך 4% מהמשכורת"],a:0,why:"הרעיון: משיכה של כ-4% בשנה מתיק מפוזר נוטה להיות בת-קיימא לאורך פרישה ארוכה — אומדן, לא ערבות.",tr:{en:{"q": "What's the idea behind the '4% rule'?", "o": ["Withdrawing 4% of the portfolio a year so it lasts over time", "Earning a guaranteed 4%", "Paying 4% tax", "Saving 4% of your salary"], "why": "The idea: withdrawing roughly 4% a year from a diversified portfolio tends to be sustainable across a long retirement — an estimate, not a guarantee."}}},
  {t:"predict",q:"ההוצאות שלך ₪12,000 בחודש. לפי כלל 4%, כמה תיק צריך כדי לחיות ממנו?",
   min:1,max:8,step:0.5,unit:"מיליון ₪",answer:3.6,tol:1,
   reveal:"₪3.6 מיליון (₪144,000 בשנה × 25). זה 'מספר החופש' שלך.",
   why:"כלל 4%: תיק פי 25 מההוצאות השנתיות מאפשר משיכה בת-קיימא. להקטין הוצאות מוריד את היעד דרמטית.",tr:{en:{"q": "Your expenses are ₪12,000 a month. Under the 4% rule, how large a portfolio do you need to live off it?", "unit": "million ₪", "reveal": "₪3.6 million (₪144,000 a year × 25). That's your freedom number.", "why": "The 4% rule: a portfolio 25 times your annual expenses allows sustainable withdrawals. Reducing expenses lowers the target dramatically."}}}]}
]},
{id:"c25",ic:"🌱",title:"השקעה אחראית (ESG)",desc:"ערכים לצד תשואה",tr:{en:{"title": "Responsible Investing (ESG)", "desc": "Values alongside returns"}},lessons:[
 {id:"l251",ic:"🌱",title:"מה זה ESG",tier:"beginner",tr:{en:{"title": "What ESG is"}},steps:[
  {t:"hook",ic:"🌱",q:"אפשר להשקיע לפי הערכים שלך בלי לוותר על תשואה?",sub:"התשובה מורכבת יותר משחושבים.",cta:"בוא נגלה →",tr:{en:{"q": "Can you invest according to your values without giving up returns?", "sub": "The answer is more complicated than people assume.", "cta": "Let's find out →"}}},
  {t:"card",art:"coresat",ic:"🌱",h:"סביבה, חברה, ממשל",p:"ESG הוא סינון השקעות לפי שיקולי סביבה (Environmental), אחריות חברתית (Social) וממשל תאגידי (Governance). הרעיון: להשקיע בחברות שמתנהלות באחריות. זו גישה לגיטימית — אך חשוב לבדוק שהיא לא רק 'שיווק ירוק'.",tr:{en:{"h": "Environmental, social, governance", "p": "ESG screens investments by environmental considerations, social responsibility and corporate governance. The idea is to invest in companies that operate responsibly. It's a legitimate approach — but it's worth checking it isn't merely green marketing."}}},
  {t:"quiz",q:"על מה מסתכלת השקעת ESG?",o:["רק על הרווח","סביבה, אחריות חברתית וממשל תאגידי","רק על הדיבידנד","על צבע הלוגו"],a:1,why:"ESG שוקלת גם איך החברה משפיעה על העולם ומתנהלת — לא רק כמה היא מרוויחה.",tr:{en:{"q": "What does ESG investing look at?", "o": ["Profit alone", "Environment, social responsibility and corporate governance", "The dividend alone", "The colour of the logo"], "why": "ESG also weighs how a company affects the world and how it's run — not only how much it earns."}}},
  {t:"scenario",q:"קרן מציגה את עצמה כ'ירוקה' וגובה 1.2% דמי ניהול (מול 0.15% בקרן מדד רגילה).",situation:"מה בודקים?",
   options:[{label:"מה הקרן באמת מחזיקה — ואם ההפרש בעמלה מוצדק",verdict:"good",fb:"נכון. הרבה קרנות 'ירוקות' מחזיקות כמעט אותן חברות — וגובות פי 8. תמיד פתח את רשימת האחזקות."},
    {label:"סומך על התווית 'ESG' — זה מספיק",verdict:"bad",fb:"זו בדיוק המלכודת (Greenwashing). התווית משווקת; רשימת האחזקות מספרת את האמת."}],
   why:"ESG הוא תווית שיווקית לא מפוקחת אחידה. בדוק אחזקות ועמלות בפועל — לא את השם.",tr:{en:{"q": "A fund markets itself as 'green' and charges 1.2% in fees (against 0.15% for an ordinary index fund).", "situation": "What should you check?", "why": "ESG is a marketing label with no uniform regulation. Check the actual holdings and fees — not the name.", "options": [{"label": "What the fund actually holds — and whether the fee difference is justified", "fb": "Correct. Many 'green' funds hold almost identical companies — and charge eight times as much. Always open the holdings list."}, {"label": "Trust the 'ESG' label — that's enough", "fb": "That's precisely the greenwashing trap. The label is marketing; the holdings list tells the truth."}]}}},
  {t:"summary",h:"מה למדת",points:["ESG = סינון לפי סביבה, חברה וממשל תאגידי","דמי ניהול לרוב גבוהים יותר","'ירוק' בשיווק לא תמיד ירוק במציאות (Greenwashing)","בדוק מה הקרן באמת מחזיקה — לא רק את השם"],tr:{en:{"h": "What you learned", "points": ["ESG means screening by environment, social responsibility and governance", "Management fees are usually higher", "'Green' in marketing isn't always green in reality (greenwashing)", "Check what the fund actually holds — not just its name"]}}}]},
 {id:"l252",ic:"🔍",title:"בין ערכים לביצועים",tier:"intermediate",tr:{en:{"title": "Between values and performance"}},steps:[
  {t:"card",art:"fomo",ic:"🔍",h:"היזהר מ'שטיפה ירוקה'",p:"'Greenwashing' = חברות שמציגות עצמן כאחראיות בלי מעש אמיתי. גם קרנות ESG שונות מגדירות 'אחריות' אחרת. אם ESG חשוב לך — בדוק מה הקרן באמת מחזיקה, לא רק את השם היפה.",tr:{en:{"h": "Beware of greenwashing", "p": "Greenwashing means companies presenting themselves as responsible without genuine action. Different ESG funds also define 'responsibility' differently. If ESG matters to you, check what the fund actually holds, not just its attractive name."}}},
  {t:"scenario",q:"קרן משווקת עצמה כ'ירוקה' אך מחזיקה חברות דלק כבד.",situation:"מה זה מלמד?",
   options:[{label:"צריך לבדוק את ההחזקות בפועל, לא רק את השם",verdict:"good",fb:"נכון. תווית 'ESG' לא מספיקה — בדוק מה באמת בפנים לפני שאתה סומך על ההגדרה."},
    {label:"השם מספיק, אפשר לסמוך",verdict:"bad",fb:"זה בדיוק greenwashing. השם השיווקי לא תמיד משקף את ההחזקות האמיתיות."}],
   why:"ESG הוא כלי טוב — אך דורש בדיקה. אל תסתמך על תווית שיווקית בלי לבדוק את התוכן.",tr:{en:{"q": "A fund markets itself as 'green' yet holds heavy fuel companies.", "situation": "What does that teach you?", "why": "ESG is a useful tool — but it demands scrutiny. Don't rely on a marketing label without examining the substance.", "options": [{"label": "You need to check the actual holdings, not just the name", "fb": "Correct. An 'ESG' label isn't enough — check what's genuinely inside before trusting the definition."}, {"label": "The name is enough, you can trust it", "fb": "That's exactly greenwashing. A marketing name doesn't always reflect the real holdings."}]}}}]}
]},
{id:"c26",ic:"🎓",title:"טעויות מתחילים",desc:"סיכום: המלכודות שעלו לך הכי הרבה",tr:{en:{"title": "Beginner Mistakes", "desc": "A summary of the traps that cost you the most"}},lessons:[
 {id:"l261",ic:"🚫",title:"7 המלכודות הגדולות",tier:"beginner",tr:{en:{"title": "The 7 great traps"}},steps:[
  {t:"hook",ic:"🤦",q:"10 הטעויות שכל מתחיל עושה. כמה מהן כבר עשית?",sub:"אל תדאג — כולם עשו לפחות שלוש.",cta:"בוא נגלה →",tr:{en:{"q": "The 10 mistakes every beginner makes. How many have you already made?", "sub": "Don't worry — everyone has made at least three.", "cta": "Let's find out →"}}},
  {t:"card",art:"riskreturn",ic:"🚫",h:"מפת הסכנות",p:"רוב המתחילים מפסידים מאותן טעויות חוזרות: רדיפת הייפ, מכירת פאניקה, ריכוזיות, אוברטריידינג, מינוף, אמון בהבטחות תשואה, והשקעה בלי קרן חירום. הידיעה שהן קיימות היא חצי מההגנה.",tr:{en:{"h": "A map of the dangers", "p": "Most beginners lose money to the same repeating mistakes: chasing hype, panic selling, concentration, overtrading, leverage, trusting return promises, and investing without an emergency fund. Knowing they exist is half the protection."}}},
  {t:"swipe",q:"מהלך של משקיע נבון — או טעות קלאסית? החלק.",leftLabel:"🚫 טעות",rightLabel:"✅ נבון",
   cards:[{text:"קניתי כי המניה עלתה 50% השבוע",good:false,why:"רדיפת הייפ — קנייה אחרי ריצה במחיר שיא."},
    {text:"בניתי קרן חירום לפני שהשקעתי",good:true,why:"בדיוק הסדר הנכון: ביטחון קודם, השקעה אחר כך."},
    {text:"מכרתי הכל כי המסך היה אדום",good:false,why:"מכירת פאניקה — קיבוע הפסד מתוך פחד."},
    {text:"פיזרתי על מדד, אג\"ח וכמה סקטורים",good:true,why:"פיזור חכם שמקטין נזק מכל טעות בודדת."},
    {text:"מינפתי פי 3 כי הייתי בטוח",good:false,why:"מינוף על ביטחון = מתכון למחיקה."}],tr:{en:{"q": "A wise investor's move — or a classic mistake? Swipe.", "leftLabel": "🚫 Mistake", "rightLabel": "✅ Wise", "cards": [{"text": "I bought because the stock rose 50% this week", "why": "Chasing hype — buying after a run, at a peak price."}, {"text": "I built an emergency fund before I invested", "why": "Exactly the right order: security first, investing second."}, {"text": "I sold everything because the screen was red", "why": "Panic selling — locking in a loss out of fear."}, {"text": "I diversified across an index, bonds and several sectors", "why": "Sensible diversification that limits the damage from any single mistake."}, {"text": "I used three-times leverage because I was certain", "why": "Leverage built on confidence is a recipe for being wiped out."}]}}},
  {t:"swipe",q:"טעות של מתחיל — או מהלך נכון? החלק:",leftLabel:"❌ טעות",rightLabel:"✅ נכון",
   cards:[
    {text:"לקנות מניה כי היא עלתה 200% החודש",good:false,why:"רדיפה אחרי מה שכבר רץ. אתה קונה את ההתלהבות, בשיא הסיכון."},
    {text:"להשקיע סכום קבוע כל חודש בקרן מדד",good:true,why:"DCA. משעמם — ומנצח את רוב המשקיעים לאורך זמן."},
    {text:"למכור הכל כשהשוק יורד 20%",good:false,why:"מכירת פאניקה. הופכת ירידה זמנית להפסד קבוע."},
    {text:"לבדוק דמי ניהול לפני שקונים קרן",good:true,why:"עמלות אוכלות מאות אלפים לאורך שנים. תמיד תבדוק."},
    {text:"לשים 80% מהתיק במניה אחת 'בטוחה'",good:false,why:"ריכוז קיצוני. אין מניה 'בטוחה' — רק תיק מפוזר."},
    {text:"לכתוב תוכנית מראש ולהיצמד אליה במפולת",good:true,why:"הכלי החזק ביותר נגד רגש. התוכנית של אתמול חכמה מהבטן של היום."}],tr:{en:{"q": "A beginner's mistake — or the right move? Swipe:", "leftLabel": "❌ Mistake", "rightLabel": "✅ Right", "cards": [{"text": "Buying a stock because it rose 200% this month", "why": "Chasing what has already run. You're buying the excitement, at peak risk."}, {"text": "Investing a fixed amount every month into an index fund", "why": "DCA. Boring — and it beats most investors over time."}, {"text": "Selling everything when the market falls 20%", "why": "Panic selling. It turns a temporary decline into a permanent loss."}, {"text": "Checking management fees before buying a fund", "why": "Fees consume hundreds of thousands over the years. Always check."}, {"text": "Putting 80% of the portfolio into one 'safe' stock", "why": "Extreme concentration. There's no 'safe' stock — only a diversified portfolio."}, {"text": "Writing a plan in advance and sticking to it during a crash", "why": "The most powerful tool against emotion. Yesterday's plan is wiser than today's gut."}]}}},
  {t:"summary",h:"מה למדת",points:["לרדוף אחרי מה שכבר עלה","למכור בפאניקה בתחתית","לשים הכל במניה אחת","להתעלם מעמלות ומדמי ניהול","לחשוב שאתה יכול לתזמן את השוק"],tr:{en:{"h": "What you learned", "points": ["Chasing whatever has already risen", "Panic selling at the bottom", "Putting everything into one stock", "Ignoring commissions and management fees", "Believing you can time the market"]}}}]},
 {id:"l262",ic:"🧠",title:"הלך הרוח של המנצח",tier:"intermediate",tr:{en:{"title": "The winner's mindset"}},steps:[
  {t:"card",art:"compound",ic:"🧠",h:"משעמם זה טוב",p:"המשקיעים המצליחים לרוב הכי משעממים: מפקידים בקביעות, מפזרים, לא נוגעים במפולות, ומתעלמים מהרעש. ההתרגשות היא האויב. אם ההשקעה שלך מרגישה כמו קזינו — משהו לא בסדר.",tr:{en:{"h": "Boring is good", "p": "Successful investors are usually the most boring: they contribute regularly, diversify, don't touch anything during crashes, and ignore the noise. Excitement is the enemy. If your investing feels like a casino, something is wrong."}}},
  {t:"scenario",q:"השוק צונח 25% והכותרות שחורות.",situation:"מה עושה המשקיע ארוך-הטווח?",
   options:[{label:"ממשיך בתוכנית, אולי אף קונה בזול — לא נבהל",verdict:"good",fb:"בדיוק. מפולות הן חלק מהמשחק. מי שנשאר בתוכנית קוצר את ההתאוששות."},
    {label:"מוכר הכל ובורח מהשוק",verdict:"bad",fb:"מכירת פאניקה — הטעות שהורסת הכי הרבה תיקים לאורך זמן."}],
   why:"סיימת את המסע! העיקרון האחרון והחשוב ביותר: תוכנית פשוטה + משמעת רגשית מנצחות גאונות. ברוך הבא למועדון המשקיעים הסבלניים. 🎓",tr:{en:{"q": "The market plunges 25% and the headlines are grim.", "situation": "What does the long-term investor do?", "why": "You've finished the journey! The final and most important principle: a simple plan plus emotional discipline beats brilliance. Welcome to the club of patient investors. 🎓", "options": [{"label": "Continue with the plan, perhaps even buy cheaply — without panicking", "fb": "Exactly. Crashes are part of the game. Those who stick to the plan reap the recovery."}, {"label": "Sell everything and flee the market", "fb": "Panic selling — the mistake that destroys more portfolios than any other over time."}]}}},
  {t:"challenge",task:"עבור על 5 הטעויות שלמדת וסמן בכנות: אילו מהן כבר עשית? כתוב אחת שאתה מתחייב לא לחזור עליה.",
   hint:"כולם עשו לפחות שלוש. מי שמודה בהן — מפסיק לחזור עליהן.",tr:{en:{"task": "Go through the five mistakes you learned and mark honestly: which have you already made? Write down one you commit to not repeating.", "hint": "Everyone has made at least three. Those who admit them stop repeating them."}}}]}
]},
{id:"c27",ic:"💰",title:"מתי למכור",desc:"הרווח הכי כואב הוא זה שהתאדה",tr:{en:{"title": "When to Sell", "desc": "The most painful gain is the one that evaporated"}},lessons:[
 {id:"l271",ic:"📸",title:"רווח על הנייר הוא לא רווח",tier:"beginner",tr:{en:{"title": "A paper gain isn't a gain"}},steps:[
  {t:"hook",ic:"📸",q:"עלית 60%. צילמת מסך. שלחת לחבר. כמה כסף הרווחת בפועל?",sub:"אפס. עד שתמכור.",cta:"בוא נגלה →",tr:{en:{"q": "You're up 60%. You took a screenshot. You sent it to a friend. How much money did you actually make?", "sub": "Nothing. Until you sell.", "cta": "Let's find out →"}}},
  {t:"card",art:"papergain",ic:"📸",h:"הצילום מסך שלא שווה כלום",p:"אתה במעלה 60%. צילמת מסך. שלחת לחבר. הרגשת גאון. אבל רווח שלא מומש הוא לא כסף — הוא מספר על מסך שהשוק יכול לקחת בחזרה מחר. הצילום מסך לא הופך לכסף בבנק. רק המכירה הופכת.",tr:{en:{"h": "The screenshot that's worth nothing", "p": "You're up 60%. You took a screenshot. You sent it to a friend. You felt like a genius. But an unrealised gain isn't money — it's a number on a screen that the market can take back tomorrow. The screenshot doesn't become money in the bank. Only the sale does."}}},
  {t:"tapChart",q:"גע בנר שבו היית צריך לממש רווח — השיא, רגע לפני שהכל התהפך.",
   candles:candles([[100,108,109,99],[108,118,120,107],[118,132,138,117],[132,126,133,120],[126,112,128,110],[112,101,114,99]]),
   target:2,why:"השיא (138) היה נקודת המימוש. מי שהתמכר לרווח וחיכה ל'עוד' — ראה 32% הופכים להפסד. הרווח היה אמיתי רק אם מכרת.",tr:{en:{"q": "Tap the candle where you should have taken profit — the peak, moments before everything turned.", "why": "The peak (138) was the point to realise. Anyone addicted to the gain who waited for 'more' watched 32% turn into a loss. The profit was only real if you sold."}}},
  {t:"scenario",q:"מניה שקנית עלתה 70%. אתה מתרגש.",situation:"מה אתה עושה?",
   options:[
    {label:"בודק אם הגעתי ליעד שקבעתי מראש — ואם כן, מממש לפחות חלק",verdict:"good",fb:"בדיוק. תוכנית שנקבעה בראש קר מנצחת התלהבות. מימוש חלקי גם נותן רווח וגם משאיר חשיפה."},
    {label:"מצלם מסך, מספר לחברים, מחכה ל-100%",verdict:"bad",fb:"זו התמכרות לרווח. הצילום מסך לא כסף — והיעד '100%' נולד מהתרגשות, לא מניתוח."},
    {label:"קונה עוד כי 'היא בכיוון'",verdict:"bad",fb:"מגדיל פוזיציה על סמך רגש אחרי שהיא כבר רצה. זו רדיפת מומנטום בשיא הביטחון."}],
   why:"התלהבות היא סימן אזהרה, לא אישור. הרגע שאתה הכי בטוח הוא הרגע להיזהר הכי הרבה.",tr:{en:{"q": "A stock you bought is up 70%. You're excited.", "situation": "What do you do?", "why": "Excitement is a warning sign, not a confirmation. The moment you feel most certain is the moment to be most careful.", "options": [{"label": "Check whether I've reached the target I set in advance — and if so, realise at least part", "fb": "Exactly. A plan set with a cool head beats excitement. Partial realisation both banks a gain and keeps you exposed."}, {"label": "Take a screenshot, tell friends, wait for 100%", "fb": "That's addiction to the gain. A screenshot isn't money — and the '100%' target was born of excitement, not analysis."}, {"label": "Buy more because 'it's trending'", "fb": "Increasing a position on emotion after it has already run. That's momentum chasing at peak confidence."}]}}},
  {t:"sim",asset:"📈 המניה שעלתה 60%",start:10000,
   why:"'רווח על הנייר' הוא לא רווח. מי שלא קובע יעד מראש, מוצא את עצמו מחליט מתוך חמדנות בדרך למעלה — ומתוך פחד בדרך למטה. הפתרון: תוכנית מכירה שנכתבת כשאתה רגוע, לא כשאתה מתרגש.",
   events:[
    {ic:"🚀",t:"עלית 60%",good:true,news:"המניה עלתה 60%. צילמת מסך, שלחת לחבר. אתה מרגיש גאון. כמה כסף הרווחת בפועל?",
     opts:[{l:"הרווחתי 60% — זה בכיס",r:0,fb:"לא. זה רווח על הנייר. עד שתמכור, לא הרווחת שקל."},
      {l:"אפס — עד שאמכור",r:0,good:true,fb:"נכון. וזו בדיוק הסיבה שצריך תוכנית מכירה."}]},
    {ic:"🤑",t:"החמדנות",good:false,news:"היא ממשיכה לעלות. אתה חושב: 'אולי תגיע ל-100%?' אין לך יעד כתוב.",
     opts:[{l:"מחכה ל-100% — למה לא",r:-.25,fb:"בלי יעד, החמדנות מחליטה. היא תמיד רוצה עוד קצת — עד שכבר מאוחר."},
      {l:"מממש חלקית: מוכר שליש, משאיר את השאר",r:.12,good:true,fb:"חכם. נעלת רווח אמיתי ונשארת חשוף לעלייה. זה לא 'או-או'."}]},
    {ic:"📉",t:"הירידה",good:false,news:"היא נופלת חזרה. עכשיו אתה ברווח 10% בלבד. הבטן צועקת.",
     opts:[{l:"מוכר הכל בפאניקה",r:-.10,fb:"הרגש שלט משני הכיוונים: חמדנות למעלה, פחד למטה."},
      {l:"פועל לפי התוכנית שכתבתי מראש",r:.08,good:true,fb:"התוכנית ניצחה. זה כל ההבדל בין משקיע למהמר."}]}],tr:{en:{"asset": "📈 The stock that rose 60%", "why": "A 'paper gain' isn't a gain. Anyone who doesn't set a target in advance ends up deciding out of greed on the way up — and out of fear on the way down. The solution: a selling plan written while you're calm, not while you're excited.", "events": [{"t": "You're up 60%", "news": "The stock rose 60%. You took a screenshot and sent it to a friend. You feel like a genius. How much money have you actually made?", "opts": [{"l": "I made 60% — it's in the bank", "fb": "No. That's a paper gain. Until you sell, you haven't made a shekel."}, {"l": "Nothing — until I sell", "fb": "Correct. And that's exactly why you need a selling plan."}]}, {"t": "The greed", "news": "It keeps rising. You think: 'maybe it'll reach 100%?' You have no written target.", "opts": [{"l": "Wait for 100% — why not", "fb": "Without a target, greed decides. It always wants a little more — until it's too late."}, {"l": "Realise partially: sell a third, keep the rest", "fb": "Smart. You locked in a real gain and stayed exposed to the upside. It isn't all or nothing."}]}, {"t": "The decline", "news": "It falls back. Now you're up only 10%. Your stomach is screaming.", "opts": [{"l": "Panic and sell everything", "fb": "Emotion ruled in both directions: greed on the way up, fear on the way down."}, {"l": "Act on the plan I wrote in advance", "fb": "The plan won. That's the entire difference between an investor and a gambler."}]}]}}},
  {t:"summary",h:"מה למדת",points:["רווח שלא מומש הוא לא רווח — הוא מספר על מסך","קבע יעד מכירה מראש, בראש קר","מימוש חלקי: קח רווח והשאר חשיפה","הרגע שאתה הכי בטוח — הוא הרגע להיזהר"],tr:{en:{"h": "What you learned", "points": ["An unrealised gain isn't a gain — it's a number on a screen", "Set a selling target in advance, with a cool head", "Partial realisation: take the gain and keep the exposure", "The moment you feel most certain is the moment to be careful"]}}}]},
 {id:"l272",ic:"🎯",title:"תוכנית יציאה מראש",tier:"intermediate",tr:{en:{"title": "An exit plan, written in advance"}},steps:[
  {t:"card",art:"exitplan",ic:"🎯",h:"מחליטים לפני שנכנסים",p:"הפתרון לבעיה הרגשית הוא מכני: לפני שאתה קונה, כתוב שני מספרים — יעד מכירה (למשל +40%) ורף הפסד (למשל −15%). כשהמחיר מגיע לשם, אתה מבצע. בלי ויכוח עם עצמך, בלי 'עוד קצת'. ההחלטה נלקחה כשהיית רגוע.",tr:{en:{"h": "Decide before you enter", "p": "The solution to an emotional problem is mechanical: before you buy, write two numbers — a selling target (+40%, say) and a loss threshold (−15%, say). When the price gets there, you execute. No arguing with yourself, no 'just a little more'. The decision was made while you were calm."}}},
  {t:"card",art:"trim",ic:"✂️",h:"מימוש חלקי — הפשרה החכמה",p:"לא חייבים 'הכל או כלום'. מכירת חצי בעלייה חזקה = לוקחים רווח אמיתי לכיס, ומשאירים חצי שימשיך לרוץ. זה מוריד את הלחץ הרגשי, ומבטיח שלא תסיים עם כלום אם המניה תתהפך.",tr:{en:{"h": "Partial realisation — the smart compromise", "p": "It doesn't have to be all or nothing. Selling half into a strong rally banks a real gain while leaving half to keep running. It lowers the emotional pressure and ensures you won't end up with nothing if the stock turns."}}},
  {t:"scenario",q:"קבעת יעד מכירה ב-+40%. המניה הגיעה ל-+40%.",situation:"אבל היא ממשיכה לעלות ואתה מתחיל להרגיש שהיא תגיע ל-100%. מה עכשיו?",
   options:[
    {label:"מבצע את התוכנית — מוכר לפחות חלק כפי שהחלטתי",verdict:"good",fb:"זו משמעת. התוכנית נכתבה כשהיית רגוע; עכשיו אתה מתרגש — ואסור לתת לעצמך מהתרגשות לשנות אותה."},
    {label:"מבטל את היעד, זה מרגיש שהיא תמשיך",verdict:"bad",fb:"זה בדיוק הרגע שבו רווחים מתאדים. 'מרגיש' אינו נתון. אם היעד לא מחייב — הוא לא יעד."}],
   why:"תוכנית שמשנים באמצע מרוב התרגשות היא לא תוכנית. המשמעת היא כל הערך.",tr:{en:{"q": "You set a selling target at +40%. The stock reached +40%.", "situation": "But it keeps rising and you start to feel it will reach 100%. What now?", "why": "A plan you change mid-way out of excitement isn't a plan. The discipline is the entire value.", "options": [{"label": "Execute the plan — sell at least part, as I decided", "fb": "That's discipline. The plan was written while you were calm; now you're excited — and you mustn't let excitement rewrite it."}, {"label": "Cancel the target, it feels like it will keep going", "fb": "That's exactly the moment gains evaporate. 'Feels' isn't data. If a target isn't binding, it isn't a target."}]}}},
  {t:"flip",q:"3 סיבות טובות למכור — ו-3 גרועות. הקש:",
   cards:[{ic:"✅",t:"העסק השתנה לרעה",b:"סיבה מצוינת. הרווחים נשחקים, החפיר נפרץ, ההנהלה מאבדת אמון — זו סיבה עניינית."},
    {ic:"✅",t:"מצאת הזדמנות טובה יותר",b:"סיבה טובה. ההון שלך מוגבל — הוא צריך לעבוד במקום הכי טוב."},
    {ic:"✅",t:"התיק יצא מאיזון",b:"סיבה טובה. אם מניה אחת תפחה ל-50% מהתיק — הסיכון שלך השתנה בלי שהחלטת."},
    {ic:"❌",t:"'היא ירדה, אני מפחד'",b:"סיבה גרועה. הפחד הוא לא נתון. השאלה היחידה: העסק השתנה?"},
    {ic:"❌",t:"'היא עלתה, אני חמדן'",b:"סיבה גרועה. עלייה כשלעצמה אינה סיבה לצאת — אלא אם התמחור נעשה מנותק."},
    {ic:"❌",t:"'חבר אמר למכור'",b:"סיבה גרועה. לחבר שלך אין את היעדים, האופק והתיק שלך."}],tr:{en:{"q": "3 good reasons to sell — and 3 bad ones. Tap:", "cards": [{"t": "The business deteriorated", "b": "An excellent reason. Earnings eroding, the moat breached, management losing credibility — that's substantive."}, {"t": "You found a better opportunity", "b": "A good reason. Your capital is limited — it should work where it works best."}, {"t": "The portfolio fell out of balance", "b": "A good reason. If one stock swelled to 50% of the portfolio, your risk changed without you deciding."}, {"t": "'It fell, I'm scared'", "b": "A poor reason. Fear isn't data. The only question: did the business change?"}, {"t": "'It rose, I'm greedy'", "b": "A poor reason. A rise alone isn't a reason to exit — unless the valuation became detached."}, {"t": "'A friend said to sell'", "b": "A poor reason. Your friend doesn't have your goals, your horizon or your portfolio."}]}}}]},
 {id:"l273",ic:"🧠",title:"מתי באמת נכון למכור",tier:"advanced",tr:{en:{"title": "When selling is genuinely right"}},steps:[
