   why:"אופק ארוך = יכולת לספוג תנודתיות = יותר מניות. אופק קצר = פחות.",tr:{en:{"q": "You're 30, and you won't need this money for 30 years.", "situation": "How much of the portfolio should be in stocks?", "why": "A long horizon means you can absorb volatility, which means more stocks. A short horizon means less.", "options": [{"label": "Mostly stocks — I have time to absorb declines", "fb": "Correct. A long horizon lets you absorb volatility and capture growth. Time is your insurance."}, {"label": "All bonds, it's safer", "fb": "'Safe' is expensive here. Over 30 years, inflation will erode you — and that is a real risk too."}]}}},
  {t:"scenario",q:"אתה צריך את הכסף בעוד שנתיים לקניית דירה.",situation:"איפה שמים אותו?",
   options:[{label:"נכסים בטוחים ונזילים — לא בשוק המניות",verdict:"good",fb:"נכון. אם השוק ייפול שנה לפני שאתה צריך את הכסף — אין לך זמן להתאושש."},
    {label:"במניות, כדי להרוויח עוד קצת",verdict:"bad",fb:"מסוכן מאוד. מפולת בעיתוי הלא נכון תמחק לך את המקדמה. אופק קצר = אפס סובלנות לתנודתיות."}],
   why:"כסף שתצטרך בטווח קצר לא שייך לשוק המניות. נקודה.",tr:{en:{"q": "You need the money in two years to buy an apartment.", "situation": "Where should it sit?", "why": "Money you'll need in the short term does not belong in the stock market. Full stop.", "options": [{"label": "Safe, liquid assets — not in the stock market", "fb": "Correct. If the market falls a year before you need the money, you have no time to recover."}, {"label": "In stocks, to earn a bit more", "fb": "Very risky. A crash at the wrong moment erases your down payment. A short horizon means zero tolerance for volatility."}]}}},
  {t:"challenge",task:"כתוב לעצמך שני מספרים על פתק: (1) בעוד כמה שנים תצטרך את הכסף שאתה משקיע. (2) כמה ירידה באחוזים תוכל לראות בתיק בלי למכור. שמור את הפתק.",
   hint:"בפעם הבאה שהשוק יורד — תוציא את הפתק. הוא נכתב כשהיית רגוע. תסמוך עליו, לא על הבטן של אותו רגע.",tr:{en:{"task": "Write two numbers on a note: (1) In how many years you'll need the money you're investing. (2) What percentage decline you could watch in your portfolio without selling. Keep the note.", "hint": "Next time the market falls, take out that note. You wrote it while calm. Trust it — not the gut feeling of that moment."}}},
  {t:"summary",h:"מה למדת",points:["התיק הנכון תלוי באופק הזמן ובסובלנות שלך לתנודתיות",
    "אופק ארוך = יותר מניות. אופק קצר = פחות. פשוט",
    "כסף שתצטרך בעוד שנתיים לא שייך לשוק המניות",
    "תיק שגורם לך למכור בפאניקה הוא תיק שגוי — גם אם הוא 'מושלם' על הנייר"],tr:{en:{"h": "What you learned", "points": ["The right portfolio depends on your time horizon and your tolerance for volatility", "Long horizon = more stocks. Short horizon = fewer. It's that simple", "Money you'll need in two years doesn't belong in the stock market", "A portfolio that makes you panic-sell is the wrong portfolio — even if it's 'perfect' on paper"]}}}
 ]}
]},
{id:"c3",ic:"🧠",title:"פסיכולוגיית שוק",desc:"האויב הכי גדול שלך נמצא בראש",tr:{en:{"title": "Market Psychology", "desc": "Your biggest enemy sits between your ears"}},lessons:[
 {id:"l31",ic:"😱",title:"פחד וחמדנות",tier:"beginner",tr:{en:{"title": "Fear and greed"}},steps:[
  {t:"hook",ic:"🧠",q:"למה אנשים חכמים קונים ביוקר ומוכרים בזול — בדיוק ההפך ממה שצריך?",
   sub:"זו לא טיפשות. זו ביולוגיה. ואפשר לנצח אותה.",cta:"איך? →",tr:{en:{"q": "Why do intelligent people buy high and sell low — the exact opposite of what they should?", "sub": "It isn't stupidity. It's biology. And it can be beaten.", "cta": "How? →"}}},
  {t:"card",art:"fomo",ic:"🤩",h:"חמדנות: קונים בשיא",p:"כשהכל עולה וכולם מרוויחים — נוצר פחד להישאר בחוץ (FOMO). אתה קונה בדיוק כשהמחיר הכי גבוה והסיכון הכי גדול.",tr:{en:{"h": "Greed: buying at the peak", "p": "When everything is rising and everyone is making money, a fear of missing out takes hold. You buy precisely when the price is highest and the risk is greatest."}}},
  {t:"card",art:"panic",ic:"😱",h:"פחד: מוכרים בתחתית",p:"כשהכל אדום והכותרות שחורות — הבטן צועקת 'תברח'. אתה מוכר בדיוק בשפל, ומקבע את ההפסד לצמיתות.",tr:{en:{"h": "Fear: selling at the bottom", "p": "When everything is red and the headlines are grim, your gut screams 'run'. You sell precisely at the low, locking in the loss permanently."}}},
  {t:"sim",asset:"🎢 המחזור הרגשי",start:10000,
   why:"ראית את המלכודת המלאה: החמדנות משכה אותך לקנות בשיא, והפחד דחף אותך למכור בתחתית. הרגש עובד נגדך בדיוק ברגעים הקריטיים. הפתרון הוא לא 'להרגיש פחות' — אלא להחליט מראש.",
   events:[
    {ic:"🚀",t:"כולם מרוויחים",good:false,news:"המניה עלתה 80% החודש. כל החברים מדברים עליה. אתה מרגיש שאתה מפספס.",
     opts:[{l:"קונה עכשיו — לא רוצה לפספס!",r:-.05,fb:"זה FOMO. קנית אחרי שהמחיר כבר רץ — בדיוק בנקודת הסיכון הגבוהה."},
      {l:"בודק אם המחיר הגיוני לפני שאני קונה",r:.02,good:true,fb:"עצרת וחשבת. זה מה שמפריד משקיע ממי שרודף."}]},
    {ic:"🩸",t:"המפולת",good:false,news:"המניה מתרסקת 40%. הכותרות: 'קץ הבועה'. כולם מוכרים. הבטן שלך מתהפכת.",
     opts:[{l:"מוכר הכל — אני לא יכול לראות את זה",r:-.25,fb:"מכרת בתחתית. הפכת ירידה זמנית להפסד קבוע — בדיוק במקום הגרוע ביותר."},
      {l:"נצמד לתוכנית שכתבתי כשהייתי רגוע",r:0,good:true,fb:"התוכנית ניצחה את הבטן. זו כל האמנות."}]},
    {ic:"📈",t:"ההתאוששות",good:true,news:"השוק חוזר. מי שמכר בתחתית צופה מהצד ולא מאמין.",
     opts:[{l:"מחזיק — לפי התוכנית",r:.28,good:true,fb:"המשמעת שילמה. שוב."},
      {l:"קונה בחזרה אחרי שכבר עלה",r:.08,fb:"מכרת בזול וקנית ביוקר — המלכודת הקלאסית, בסיבוב מלא."}]}],tr:{en:{"asset": "🎢 The emotional cycle", "why": "You've seen the full trap: greed pulled you in at the top, and fear pushed you out at the bottom. Emotion works against you at exactly the critical moments. The solution isn't to feel less — it's to decide in advance.", "events": [{"t": "Everyone's making money", "news": "The stock is up 80% this month. All your friends are talking about it. You feel like you're missing out.", "opts": [{"l": "Buy now — I don't want to miss out!", "fb": "That's FOMO. You bought after the price had already run — precisely at the point of highest risk."}, {"l": "Check whether the price makes sense before buying", "fb": "You paused and thought. That's what separates an investor from someone chasing."}]}, {"t": "The crash", "news": "The stock plunges 40%. The headlines read 'the bubble bursts'. Everyone is selling. Your stomach turns.", "opts": [{"l": "Sell everything — I can't watch this", "fb": "You sold at the bottom. You turned a temporary decline into a permanent loss, at the worst possible moment."}, {"l": "Stick to the plan I wrote while calm", "fb": "The plan beat the gut. That is the entire art."}]}, {"t": "The recovery", "news": "The market comes back. Those who sold at the bottom watch from the sidelines in disbelief.", "opts": [{"l": "Hold — according to the plan", "fb": "Discipline paid off. Again."}, {"l": "Buy back in after it has already risen", "fb": "You sold low and bought high — the classic trap, completing a full circle."}]}]}}},
  {t:"quiz",q:"מתי הסיכון הגדול ביותר לקנות?",o:["כשכולם מפחדים","כשכולם חמדנים ומתלהבים","כשהשוק שקט","כשיורד"],a:1,
   why:"אופוריה = מחירים גבוהים = סיכון גבוה. הרגע שכולם בטוחים הוא הרגע להיזהר.",
   mentor:{why:"בחרת ברגע שמרגיש בטוח — אבל בשוק, מה שמרגיש בטוח הוא לרוב היקר ביותר.",
    analogy:"מתי כרטיסי טיסה הכי יקרים? כשכולם רוצים לטוס. מניות עובדות אותו דבר: כשכולם רוצים לקנות, אתה משלם את המחיר הגבוה ביותר.",
    q:"כל התקשורת מדברת על מניה, כולם קונים, היא עלתה 200%. מה זה אומר?",
    o:["הזדמנות — היא בכיוון","המחיר כבר מגלם את ההתלהבות — הסיכון גבוה","היא תמשיך לנצח","זה סימן בטוח"],a:1,
    hint:"אם כולם כבר קנו — מי נשאר לקנות אחריך ולדחוף את המחיר למעלה?",
    ok:"בדיוק. כשכולם כבר בפנים, אין מי שידחוף את המחיר. שם הסיכון הגדול."},tr:{en:{"q": "When is the risk of buying at its greatest?", "o": ["When everyone is afraid", "When everyone is greedy and excited", "When the market is quiet", "When it's falling"], "why": "Euphoria means high prices, which means high risk. The moment everyone feels certain is the moment to be careful.", "mentor": {"why": "You chose the moment that feels safe — but in markets, what feels safe is usually what costs the most.", "analogy": "When are flights most expensive? When everyone wants to fly. Stocks work the same way: when everyone wants to buy, you pay the highest price.", "q": "Every outlet is covering a stock, everyone is buying, and it's up 200%. What does that tell you?", "o": ["An opportunity — it's trending", "The price already reflects the excitement — risk is high", "It will keep winning", "It's a safe signal"], "hint": "If everyone has already bought, who is left to buy after you and push the price higher?", "ok": "Exactly. Once everyone is already in, nobody is left to push the price up. That's where the greatest risk lies."}}}},
  {t:"summary",h:"מה למדת",points:["חמדנות גורמת לקנות בשיא. פחד גורם למכור בתחתית",
    "זו ביולוגיה, לא טיפשות — היא קורית גם לחכמים",
    "הרגע שמרגיש הכי בטוח (אופוריה) הוא לרוב המסוכן ביותר",
    "הפתרון: להחליט מראש, בראש קר — ולהיצמד לתוכנית"],tr:{en:{"h": "What you learned", "points": ["Greed makes you buy at the peak. Fear makes you sell at the bottom", "This is biology, not stupidity — it happens to intelligent people too", "The moment that feels safest (euphoria) is usually the most dangerous", "The fix: decide in advance, with a cool head — then stick to the plan"]}}}
 ]},
 {id:"l32",ic:"📋",title:"התוכנית מנצחת את הבטן",tier:"intermediate",tr:{en:{"title": "The plan beats the gut"}},steps:[
  {t:"hook",ic:"📋",q:"מה עוזר נגד פאניקה בשוק? לא אומץ. משהו הרבה יותר משעמם.",
   sub:"וזה עובד גם כשכולם סביבך נשברים.",cta:"מה זה? →",tr:{en:{"q": "What actually helps against market panic? Not courage. Something far more boring.", "sub": "And it works even when everyone around you is breaking.", "cta": "What is it? →"}}},
  {t:"card",art:"exitplan",ic:"📋",h:"החלטות בראש קר",p:"בזמן מפולת אתה לא חושב — אתה מרגיש. לכן ההחלטות נכתבות מראש, כשאתה רגוע: כמה מניות, מתי קונה, מתי מוכר. אתה רק מבצע.",tr:{en:{"h": "Decisions made with a cool head", "p": "During a crash you don't think — you feel. That's why the decisions are written in advance, while you're calm: how much in stocks, when to buy, when to sell. You simply execute."}}},
  {t:"flip",q:"3 כלים נגד רגש. הקש לגלות:",
   cards:[{ic:"📅",t:"השקעה קבועה (DCA)",b:"סכום קבוע כל חודש, בלי קשר למחיר. אתה קונה אוטומטית יותר כשזול ופחות כשיקר — בלי להחליט."},
    {ic:"🎯",t:"תוכנית כתובה",b:"יעדים וכללים שנקבעו בראש קר. במפולת אתה לא מחליט — אתה מבצע מה שכבר החלטת."},
    {ic:"🚫",t:"לא לבדוק כל יום",b:"ככל שתסתכל יותר — כך תפעל יותר מרגש. משקיעים שבודקים פחות, מרוויחים יותר."}],tr:{en:{"q": "3 tools against emotion. Tap to reveal:", "cards": [{"t": "Regular investing (DCA)", "b": "A fixed amount every month, regardless of price. You automatically buy more when it's cheap and less when it's expensive — without deciding."}, {"t": "A written plan", "b": "Goals and rules set with a cool head. In a crash you don't decide — you execute what you already decided."}, {"t": "Don't check daily", "b": "The more you look, the more you act on emotion. Investors who check less, earn more."}]}}},
  {t:"quiz",q:"מה הכלי הכי חזק נגד רגש בשוק?",o:["אינטואיציה","תוכנית כתובה מראש","לעקוב אחרי חדשות","לשאול חברים"],a:1,
   why:"תוכנית שנכתבה בראש קר היא היחידה שמחזיקה כשהבטן צועקת.",
   mentor:{why:"בחרת בכלי שמושפע מרגש בדיוק ברגע שאתה צריך להיות רגוע. זו הבעיה.",
    analogy:"טייסים לא ממציאים פתרונות באמצע סערה — הם עוקבים אחרי צ'קליסט שנכתב על הקרקע. אתה צריך צ'קליסט.",
    q:"השוק נופל 25%. מה אתה עושה?",
    o:["מחליט לפי התחושה באותו רגע","מוציא את התוכנית שכתבתי מראש ומבצע","שואל בפורום","קורא כותרות"],a:1,
    hint:"מה כתבת כשהיית רגוע — ומה אתה מרגיש עכשיו? למי כדאי לתת להחליט?",
    ok:"בדיוק. אתה של אתמול, הרגוע, חכם יותר מאתה של עכשיו, המבוהל."},tr:{en:{"q": "What's the strongest tool against emotion in markets?", "o": ["Intuition", "A plan written in advance", "Following the news", "Asking friends"], "why": "A plan written with a cool head is the only thing that holds when your gut is screaming.", "mentor": {"why": "You chose a tool that is influenced by emotion at exactly the moment you need to be calm. That's the problem.", "analogy": "Pilots don't invent solutions in the middle of a storm — they follow a checklist written on the ground. You need a checklist.", "q": "The market falls 25%. What do you do?", "o": ["Decide based on how I feel in the moment", "Take out the plan I wrote in advance and execute it", "Ask on a forum", "Read the headlines"], "hint": "What did you write while calm — and what are you feeling now? Which of the two should decide?", "ok": "Exactly. Yesterday's calm version of you is wiser than today's panicked version."}}}},
  {t:"challenge",task:"כתוב תוכנית בת 3 שורות: (1) כמה אשקיע כל חודש. (2) מתי אמכור. (3) מה אעשה אם השוק ייפול 30%. שמור אותה איפשהו שתמצא.",
   hint:"התוכנית הזו שווה יותר מכל תחזית שתקרא. היא נכתבה כשהראש שלך היה צלול.",tr:{en:{"task": "Write a three-line plan: (1) How much I'll invest each month. (2) When I'll sell. (3) What I'll do if the market falls 30%. Keep it somewhere you'll find it.", "hint": "That plan is worth more than any forecast you'll read. It was written while your head was clear."}}},
  {t:"summary",h:"מה למדת",points:["במפולת אתה מרגיש, לא חושב — לכן מחליטים מראש",
    "DCA מנטרל תזמון: אותו סכום, כל חודש, בלי החלטות",
    "מי שבודק את התיק פחות — מרוויח יותר",
    "התוכנית של אתמול חכמה מהבטן של היום"],tr:{en:{"h": "What you learned", "points": ["In a crash you feel rather than think — which is why you decide in advance", "DCA removes timing: the same amount, every month, no decisions", "Those who check their portfolio less, earn more", "Yesterday's plan is wiser than today's gut"]}}}
 ]},
 {id:"l33",ic:"🐑",title:"עדר, רעש והטיות",tier:"advanced",tr:{en:{"title": "Herds, noise and bias"}},steps:[
  {t:"hook",ic:"🐑",q:"אם כולם קונים — זה סימן טוב או אזהרה?",
   sub:"רוב האנשים עונים הפוך. וזה עולה להם ביוקר.",cta:"תגיד לי →",tr:{en:{"q": "If everyone is buying — is that a good sign or a warning?", "sub": "Most people answer it backwards. And it costs them dearly.", "cta": "Tell me →"}}},
  {t:"card",art:"fomo",ic:"🐑",h:"אפקט העדר",p:"'כולם קונים' אינו נתון — הוא רעש. עד שהסיפור הגיע אליך, המחיר כבר מגלם אותו. אתה קונה את ההתלהבות של אחרים, לא הזדמנות.",tr:{en:{"h": "The herd effect", "p": "'Everyone is buying' isn't data — it's noise. By the time the story reached you, the price already reflects it. You're buying other people's excitement, not an opportunity."}}},
  {t:"swipe",q:"סיבה עניינית — או רעש? החלק כל כרטיס.",leftLabel:"❌ רעש",rightLabel:"✅ עניין",
   cards:[
    {text:"החברה הגדילה רווחים 3 שנים ברציפות",good:true,why:"נתון עסקי אמיתי ומדיד. זו סיבה עניינית."},
    {text:"משפיען בטיקטוק אמר שזו 'המניה של השנה'",good:false,why:"רעש טהור. אין מאחוריו שום ניתוח — רק חשיפה."},
    {text:"החברה מוכרת מוצר עם ביקוש גדל ורווחיות טובה",good:true,why:"הבסיס העסקי. זה מה שמניע מחיר בטווח הארוך."},
    {text:"כל החברים שלי קנו והרוויחו",good:false,why:"אפקט עדר. ההצלחה שלהם בעבר אינה תחזית לעתיד שלך."},
    {text:"המניה עלתה 200% החודש",good:false,why:"עלייה בעבר אינה סיבה לקנות. לרוב היא דווקא מעלה את הסיכון."},
    {text:"מכפיל הרווח נמוך מהממוצע בסקטור, והעסק יציב",good:true,why:"תמחור מול ערך — שיקול ענייני."}],tr:{en:{"q": "A substantive reason — or noise? Swipe each card.", "leftLabel": "❌ Noise", "rightLabel": "✅ Substance", "cards": [{"text": "The company grew earnings three years running", "why": "Real, measurable business data. That's a substantive reason."}, {"text": "An influencer said it's 'the stock of the year'", "why": "Pure noise. There's no analysis behind it — only reach."}, {"text": "The company sells a product with growing demand and healthy margins", "why": "The business fundamentals. That's what drives price over the long run."}, {"text": "All my friends bought it and made money", "why": "Herd effect. Their past success is not a forecast of your future."}, {"text": "The stock is up 200% this month", "why": "A past rise isn't a reason to buy. More often, it raises the risk."}, {"text": "Its P/E is below the sector average and the business is stable", "why": "Price against value — a substantive consideration."}]}}},
  {t:"quiz",q:"מה אומר לך 'כולם קונים'?",o:["שזו הזדמנות","שהמחיר כבר מגלם את ההתלהבות","שהיא תעלה בוודאות","שאין סיכון"],a:1,
   why:"עד שהסיפור הגיע אליך — המחיר כבר מגלם אותו. אתה קונה את ההתלהבות, לא את ההזדמנות.",
   mentor:{why:"התייחסת לפופולריות כאילו היא מידע. היא לא — היא בדיוק מה שכבר משוקלל במחיר.",
    analogy:"אם כולם כבר יודעים שהמסעדה מעולה — התור באורך שעתיים. ה'סוד' כבר לא סוד, ואתה משלם עליו במלוא המחיר.",
    q:"קראת בעיתון שמניה מסוימת 'עומדת לזנק'. מה כבר קרה?",
    o:["אף אחד לא יודע חוץ ממני","מיליוני אנשים קראו את זה — המחיר כבר הגיב","המחיר לא יכול להשתנות","זו הזדמנות בטוחה"],a:1,
    hint:"כמה אנשים קראו את אותה כתבה בדיוק?",
    ok:"נכון. מידע פומבי כבר מתומחר. היתרון שלך הוא לא מידע — הוא משמעת וסבלנות."},tr:{en:{"q": "What does 'everyone is buying' tell you?", "o": ["That it's an opportunity", "That the price already reflects the excitement", "That it will certainly rise", "That there's no risk"], "why": "By the time the story reached you, the price already reflects it. You're buying the excitement, not the opportunity.", "mentor": {"why": "You treated popularity as information. It isn't — it's precisely what's already priced in.", "analogy": "If everyone already knows the restaurant is excellent, the wait is two hours. The 'secret' is no longer a secret, and you pay full price for it.", "q": "You read in the paper that a certain stock is 'about to soar'. What has already happened?", "o": ["Nobody knows but me", "Millions of people read it — the price has already reacted", "The price can't change", "It's a sure thing"], "hint": "How many people read that exact same article?", "ok": "Right. Public information is already priced in. Your edge isn't information — it's discipline and patience."}}}},
  {t:"summary",h:"מה למדת",points:["'כולם קונים' זה רעש, לא נתון",
    "עד שהסיפור הגיע אליך — המחיר כבר מגלם אותו",
    "סיבה עניינית = רווחים, ביקוש, תמחור. לא פופולריות",
    "היתרון שלך אינו מידע — הוא משמעת וסבלנות"],tr:{en:{"h": "What you learned", "points": ["'Everyone is buying' is noise, not data", "By the time the story reached you, the price already reflects it", "A substantive reason means earnings, demand and valuation — not popularity", "Your edge isn't information — it's discipline and patience"]}}}
 ]}
]},
{id:"c4",ic:"🕯️",title:"קריאת גרפים",desc:"ללמוד לקרוא את השוק — בנגיעה",tr:{en:{"title": "Reading Charts", "desc": "Learn to read the market — one tap at a time"}},lessons:[
 {id:"l41",ic:"🕯️",title:"נר יפני אחד",tier:"beginner",tr:{en:{"title": "A single candlestick"}},steps:[
  {t:"hook",ic:"🕯️",q:"כל נר בגרף מספר סיפור של מאבק. אתה יודע לקרוא אותו?",sub:"ארבעה מספרים, ציור אחד — וכל מה שקרה באותו יום.",cta:"תלמד אותי →",tr:{en:{"q": "Every candle on a chart tells the story of a battle. Can you read it?", "sub": "Four numbers, one drawing — and everything that happened that day.", "cta": "Teach me →"}}},
  {t:"card",art:"candle",ic:"🕯️",h:"4 מספרים בציור אחד",p:"כל נר מסכם יום: פתיחה, סגירה, שיא, שפל. גוף ירוק = סגירה מעל הפתיחה (קונים ניצחו). אדום = ההפך. הפתילים הם הקצוות שהמחיר נגע בהם ונסוג.",tr:{en:{"h": "Four numbers in one drawing", "p": "Each candle summarises a day: open, close, high, low. A green body means it closed above the open (buyers won). Red means the opposite. The wicks are the extremes the price touched before retreating."}}},
  {t:"tapChart",q:"גע בנר הירוק החזק ביותר — היום שבו הקונים שלטו הכי הרבה (הגוף הכי גדול כלפי מעלה).",
   candles:candles([[100,101,102,99],[101,100,102,98],[100,112,113,100],[112,111,114,109],[111,113,115,110]]),
   target:2,why:"גוף ירוק ארוך = פער גדול בין פתיחה לסגירה כלפי מעלה = שליטה ברורה של הקונים באותו יום.",tr:{en:{"q": "Tap the strongest green candle — the day buyers were most in control (the largest upward body).", "why": "A long green body means a large gap between open and close to the upside, which means buyers clearly dominated that day."}}},
  {t:"tapChart",q:"גע בנר האדום החזק ביותר — היום שבו המוכרים שלטו (הגוף הגדול ביותר כלפי מטה).",
   candles:candles([[100,99,101,98],[99,100,101,98],[100,101,102,99],[101,90,102,89],[90,91,93,89]]),
   target:3,why:"גוף אדום ארוך = פתיחה גבוהה וסגירה נמוכה בהרבה = יום שבו המוכרים שלטו לחלוטין.",tr:{en:{"q": "Tap the strongest red candle — the day sellers were in control (the largest downward body).", "why": "A long red body means it opened high and closed far lower, which means sellers dominated completely that day."}}},
  {t:"tapChart",q:"גע בנר עם פתיל תחתון ארוך — היום שבו קונים בלמו ירידה חדה (המחיר צלל וחזר למעלה).",
   candles:candles([[100,101,102,99],[101,102,103,100],[102,103,105,90],[103,104,106,102],[104,105,107,103]]),
   target:2,why:"פתיל תחתון ארוך = המחיר ירד עמוק (שפל 90) אבל נסגר גבוה (103). לחץ מכירה שנבלם — הקונים חזרו.",tr:{en:{"q": "Tap the candle with a long lower wick — the day buyers halted a sharp decline (price plunged, then climbed back).", "why": "A long lower wick means price fell deep (a low of 90) but closed high (103). Selling pressure was absorbed — the buyers came back."}}},
  {t:"summary",h:"מה למדת",points:["נר = 4 מספרים: פתיחה, סגירה, שיא, שפל","גוף ירוק = הקונים ניצחו באותו יום. אדום = המוכרים","גוף גדול = שליטה ברורה. גוף קטן = היסוס","הפתילים מראים לאן המחיר הגיע — ונדחה"],tr:{en:{"h": "What you learned", "points": ["A candle = four numbers: open, close, high, low", "A green body means buyers won that day. Red means sellers did", "A large body means clear control. A small body means hesitation", "The wicks show where price reached — and was rejected"]}}}]},
 {id:"l42",ic:"🔎",title:"פתילים מספרים סיפור",tier:"beginner",tr:{en:{"title": "Wicks tell a story"}},steps:[
  {t:"hook",ic:"🔎",q:"הגוף מראה מי ניצח. הפתיל מראה כמה דם נשפך בדרך.",sub:"רוב המתחילים מתעלמים מהפתילים — וזו טעות.",cta:"בוא נראה →",tr:{en:{"q": "The body shows who won. The wick shows how much blood was spilled getting there.", "sub": "Most beginners ignore the wicks — and that's a mistake.", "cta": "Let's look →"}}},
  {t:"card",art:"wick",ic:"🔎",h:"הפתיל הוא הרגש",p:"הגוף מראה מי ניצח בסוף היום — הפתיל מראה את המאבק בדרך. פתיל עליון ארוך: קונים ניסו לדחוף למעלה ונדחו. פתיל תחתון ארוך: מוכרים לחצו למטה ונבלמו. פתיל ארוך = היסוס ומאבק.",tr:{en:{"h": "The wick is the emotion", "p": "The body shows who won by the close — the wick shows the struggle along the way. A long upper wick means buyers tried to push higher and were rejected. A long lower wick means sellers pressed down and were absorbed. A long wick means hesitation and conflict."}}},
  {t:"tapChart",q:"גע בנר עם פתיל עליון ארוך — היום שבו קונים ניסו לדחוף למעלה אבל נדחו בחזרה.",
   candles:candles([[100,101,102,99],[101,102,103,100],[102,103,114,102],[103,102,105,101],[102,103,104,101]]),
   target:2,why:"פתיל עליון ארוך = המחיר עלה עד 114 אבל נסגר ב-103 בלבד. הקונים ניסו — ונדחו. סימן להיסוס.",tr:{en:{"q": "Tap the candle with a long upper wick — the day buyers tried to push higher but were driven back.", "why": "A long upper wick means price rose as far as 114 but closed at only 103. The buyers tried — and were rejected. A sign of hesitation."}}},
  {t:"tapChart",q:"גע בנר ההיסוס — גוף קטן מאוד עם פתילים לשני הצדדים (אף צד לא שלט).",
   candles:candles([[100,101,103,98],[101,105,106,100],[105,110,111,104],[110,110.5,116,105],[110,112,113,109]]),
   target:3,why:"גוף זעיר עם פתילים ארוכים לשני הכיוונים = מאבק ללא הכרעה (נר 'דוג'י'). לעיתים מבשר שינוי כיוון.",tr:{en:{"q": "Tap the hesitation candle — a very small body with wicks on both sides (neither side took control).", "why": "A tiny body with long wicks in both directions means an unresolved struggle (a 'doji' candle). Sometimes it signals a change of direction."}}},
  {t:"summary",h:"מה למדת",points:["פתיל עליון ארוך = קונים ניסו לדחוף ונדחו","פתיל תחתון ארוך = מוכרים לחצו ונבלמו","גוף זעיר + פתילים לשני הצדדים = היסוס (דוג'י)","הפתיל הוא הרגש; הגוף הוא התוצאה"],tr:{en:{"h": "What you learned", "points": ["A long upper wick means buyers pushed and were rejected", "A long lower wick means sellers pressed and were absorbed", "A tiny body with wicks on both sides means hesitation (a doji)", "The wick is the emotion; the body is the result"]}}}]},
 {id:"l43",ic:"📈",title:"מגמות",tier:"intermediate",tr:{en:{"title": "Trends"}},steps:[
  {t:"hook",ic:"📈",q:"איך יודעים אם מגמה נשברה — לפני שכולם מבינים?",sub:"יש סימן אחד ברור. תלמד לזהות אותו במבט.",cta:"תראה לי →",tr:{en:{"q": "How do you know a trend has broken — before everyone else works it out?", "sub": "There's one clear signal. You'll learn to spot it at a glance.", "cta": "Show me →"}}},
  {t:"card",art:"uptrend",ic:"📈",h:"מהי מגמה?",p:"מגמת עלייה = שיאים עולים ושפלים עולים. ירידה = ההפך. בלי כיוון ברור = דשדוש. אל תילחם במגמה — אבל אל תניח שהיא נצחית.",tr:{en:{"h": "What is a trend?", "p": "An uptrend means higher highs and higher lows. A downtrend is the reverse. No clear direction means a range. Don't fight the trend — but don't assume it's eternal either."}}},
  {t:"tapChart",q:"גע בנר שבו מגמת העלייה נשברה — הראשון שסגר מתחת לקודמים אחרי סדרת עליות.",
   candles:candles([[100,104,105,99],[104,108,109,103],[108,112,113,107],[112,116,117,111],[116,109,117,107],[109,106,110,104],[106,108,110,105]]),
   target:4,why:"עד הנר הזה כל סגירה הייתה גבוהה מקודמתה. הנר האדום ששבר את הרצף הוא הסימן הראשון ששולטים התהפכו.",tr:{en:{"q": "Tap the candle where the uptrend broke — the first one to close below its predecessors after a run of gains.", "why": "Up to that candle, every close was higher than the last. The red candle that broke the sequence is the first sign that control has changed hands."}}},
  {t:"tapChart",q:"גע בנקודה שבה מגמת הירידה התהפכה לעלייה — התחתית שממנה המחיר התחיל לטפס.",
   candles:candles([[110,106,111,105],[106,102,107,101],[102,98,103,96],[98,102,104,97],[102,107,108,101],[107,112,113,106]]),
   target:2,why:"הנר האדום האחרון בשפל (96) הוא התחתית — אחריו השיאים והשפלים מתחילים לעלות. שם הכיוון התהפך.",tr:{en:{"q": "Tap the point where the downtrend turned into an uptrend — the bottom from which price began to climb.", "why": "The last red candle at the low (96) is the bottom — after it, the highs and lows begin rising. That's where direction reversed."}}}]},
 {id:"l44",ic:"🧲",title:"תמיכה והתנגדות",tier:"intermediate",tr:{en:{"title": "Support and resistance"}},steps:[
  {t:"hook",ic:"🧲",q:"למה מחיר עוצר שוב ושוב בדיוק באותו מקום?",sub:"השוק זוכר. וזה אחד הדברים השימושיים שאפשר לראות בגרף.",cta:"למה? →",tr:{en:{"q": "Why does price stop again and again at exactly the same place?", "sub": "The market remembers. And it's one of the genuinely useful things a chart shows you.", "cta": "Why? →"}}},
  {t:"card",art:"support",ic:"🧲",h:"רצפה ותקרה",p:"תמיכה = אזור מחיר שבו קונים עצרו ירידות שוב ושוב ('רצפה'). התנגדות = אזור שבו מוכרים בלמו עליות ('תקרה'). אלה אזורים שהשוק זוכר — לא קווים מדויקים.",tr:{en:{"h": "Floor and ceiling", "p": "Support is a price area where buyers have repeatedly halted declines (a 'floor'). Resistance is where sellers have repeatedly capped advances (a 'ceiling'). These are areas the market remembers — not precise lines."}}},
  {t:"tapChart",q:"גע בנר שנגע בתמיכה (הרצפה סביב 98) והתהפך כלפי מעלה — פעם שלישית שהמחיר בלם שם.",
   candles:candles([[106,99,107,98],[99,104,105,98],[104,101,105,99],[101,99,102,98],[99,106,107,98],[106,109,110,105]]),
   target:4,why:"המחיר נגע ב-98 שוב ושוב ולא שבר אותו — זו תמיכה. הנר שבלם שם ועלה חזק הוא ההוכחה שהרצפה מחזיקה.",tr:{en:{"q": "Tap the candle that touched support (the floor around 98) and turned back up — the third time price held there.", "why": "Price touched 98 repeatedly without breaking it — that's support. The candle that held there and rallied strongly is the proof the floor is holding."}}},
  {t:"card",art:"breakout",ic:"🚪",h:"פריצה",p:"כשמחיר שובר אזור התנגדות שהחזיק זמן רב — זו 'פריצה', ולעיתים תחילת מהלך חדש. אבל היזהר מפריצות שווא: מהלך אמין לרוב מלווה בהרבה פעילות מסחר (נפח).",tr:{en:{"h": "A breakout", "p": "When price breaks through a resistance area that has held for a long time, that's a 'breakout' — sometimes the start of a new move. But beware of false breakouts: a credible move is usually accompanied by heavy trading activity (volume)."}}}]},
 {id:"l45",ic:"🔊",title:"נפח מסחר",tier:"advanced",tr:{en:{"title": "Trading volume"}},steps:[
  {t:"hook",ic:"🔊",q:"איך מבדילים בין פריצה אמיתית לפריצת שווא?",sub:"יש מדד אחד שרוב המתחילים בכלל לא מסתכלים עליו.",cta:"מה הוא? →",tr:{en:{"q": "How do you tell a real breakout from a false one?", "sub": "There's one measure most beginners never even look at.", "cta": "What is it? →"}}},
  {t:"card",art:"volume",ic:"🔊",h:"נפח = אמינות",p:"נפח המסחר הוא כמה יחידות נסחרו. מהלך מחיר על נפח גבוה = הרבה משקיעים מאחוריו, אמין יותר. מהלך על נפח אפסי = לרוב רעש שלא יחזיק. הנפח הוא 'הדלק' מאחורי התנועה.",tr:{en:{"h": "Volume equals credibility", "p": "Trading volume is how many units changed hands. A price move on high volume has many investors behind it and is more credible. A move on almost no volume is usually noise that won't hold. Volume is the fuel behind the move."}}},
  {t:"tapChart",q:"גע בנר של הפריצה האמיתית — הזינוק הגדול שקרה עם הגוף החזק ביותר (המהלך המשכנע ביותר).",
   candles:candles([[100,101,102,99],[101,100,102,99],[100,101,103,99],[101,113,114,100],[113,114,116,112]]),
   target:3,why:"הנר הרביעי הוא קפיצה ענקית עם גוף מלא — מהלך משכנע. בשוק אמיתי, פריצה כזו מלווה בנפח גבוה שמאשר אותה.",tr:{en:{"q": "Tap the candle of the genuine breakout — the large surge with the strongest body (the most convincing move).", "why": "The fourth candle is a huge jump with a full body — a convincing move. In a real market, a breakout like this is accompanied by high volume confirming it."}}}]},
 {id:"l46",ic:"➰",title:"ממוצע נע",tier:"advanced",tr:{en:{"title": "Moving averages"}},steps:[
  {t:"hook",ic:"➰",q:"איך מסננים את הרעש היומי ורואים רק את הכיוון האמיתי?",sub:"כלי אחד פשוט עושה את זה.",cta:"תראה לי →",tr:{en:{"q": "How do you filter out the daily noise and see only the real direction?", "sub": "One simple tool does exactly that.", "cta": "Show me →"}}},
  {t:"card",art:"movingavg",ic:"➰",h:"מחליק את הרעש",p:"ממוצע נע לוקח את ממוצע המחיר על פני תקופה (למשל 50 יום) ומצייר קו חלק. הוא עוזר לראות את הכיוון הכללי בלי להיסחף מכל קפיצה יומית. מחיר מעל הממוצע = מגמה חיובית, מתחתיו = שלילית.",tr:{en:{"h": "Smoothing out the noise", "p": "A moving average takes the average price over a period (say 50 days) and draws a smooth line. It helps you see the overall direction without being swept up by every daily jump. Price above the average means a positive trend; below it, negative."}}},
  {t:"tapChart",q:"גע בנר שבו המחיר ירד וחצה מתחת לפסגה — הסימן הראשון שהמגמה מתקררת.",
   candles:candles([[100,104,105,99],[104,108,109,103],[108,110,112,107],[110,107,111,105],[107,103,108,102],[103,104,106,101]]),
   target:3,why:"אחרי סדרת עליות, הנר שסוגר נמוך יותר ושובר את הרצף העולה הוא ההתקררות הראשונה — לרוב גם החצייה מתחת לממוצע הנע.",tr:{en:{"q": "Tap the candle where price fell and crossed below the peak — the first sign the trend is cooling.", "why": "After a run of gains, the candle that closes lower and breaks the rising sequence is the first cooling — usually also the crossing below the moving average."}}}]},
 {id:"l47",ic:"🔮",title:"מלכודת הניתוח הטכני",tier:"advanced",tr:{en:{"title": "The technical analysis trap"}},steps:[
  {t:"hook",ic:"🔮",q:"אם הגרף באמת מנבא את העתיד — למה מי שמוכר קורסים לא פשוט מתעשר מהשוק?",sub:"השאלה הזו שווה יותר מכל תבנית שתלמד.",cta:"טוב, למה? →",tr:{en:{"q": "If charts really predicted the future, why don't the people selling courses simply get rich from the market instead?", "sub": "That question is worth more than any pattern you'll ever learn.", "cta": "All right, why? →"}}},
  {t:"card",art:"crystalball",ic:"🔮",h:"הגרף מתאר עבר",p:"תבניות עוזרות להבין מה קרה ומי שולט — לא לנבא עתיד. בטווח הקצר השוק קרוב לרעש. מי שמבטיח 'הגרף אומר שתעלה' מוכר ודאות שלא קיימת.",tr:{en:{"h": "A chart describes the past", "p": "Patterns help you understand what happened and who is in control — not predict the future. Over short horizons, markets are close to noise. Anyone promising 'the chart says it will rise' is selling a certainty that doesn't exist."}}},
  {t:"scenario",q:"אתה מזהה 'תבנית מנצחת' יפה בגרף.",situation:"מה הגישה הנכונה?",
   options:[{label:"להשתמש בה כהקשר — לא כנבואה ודאית",verdict:"good",fb:"נכון. תבניות מגדילות הבנה, לא ודאות. בטווח קצר הן נשברות הרבה. הן כלי, לא כדור בדולח."},
    {label:"להמר את כל התיק כי התבנית 'תמיד עובדת'",verdict:"bad",fb:"אין תבנית שתמיד עובדת. מי שמהמר על ודאות בגרף לרוב נכווה — הטווח הקצר קרוב לרעש."}],
   why:"גרף הוא מד רגש של ההמון — מצוין להקשר, אפס לנבואה. השתמש בו כדי לא לקנות בשיא היסטריה.",tr:{en:{"q": "You spot a beautiful 'winning pattern' on a chart.", "situation": "What's the right approach?", "why": "A chart is a crowd sentiment gauge — excellent for context, useless for prophecy. Use it to avoid buying at peak hysteria.", "options": [{"label": "Use it as context — not as a certain prediction", "fb": "Correct. Patterns add understanding, not certainty. Over short horizons they break often. They're a tool, not a crystal ball."}, {"label": "Bet the whole portfolio because the pattern 'always works'", "fb": "No pattern always works. Betting on chart certainty usually ends badly — short horizons are close to noise."}]}}},
  {t:"card",art:"crashcurve",ic:"🧭",h:"אז למה ללמוד גרפים?",p:"כדי לזהות פאניקה, אופוריה, ואזורים שהשוק זוכר — ולא להיסחף עם ההמון. גרף הוא כלי הגנה: הוא עוזר לך לראות מתי כולם מפחדים (הזדמנות) ומתי כולם חמדנים (סכנה).",tr:{en:{"h": "So why learn charts at all?", "p": "To recognise panic, euphoria, and the areas the market remembers — so you don't get swept along with the crowd. A chart is a defensive tool: it helps you see when everyone is afraid (opportunity) and when everyone is greedy (danger)."}}}]}
]},
{id:"c5",ic:"💰",title:"כסף אישי",desc:"הבסיס שבלעדיו אסור בכלל להשקיע",tr:{en:{"title": "Personal Finance", "desc": "The foundation you must never invest without"}},lessons:[
 {id:"l51",ic:"🚨",title:"קרן חירום קודמת להכול",tier:"beginner",tr:{en:{"title": "An emergency fund comes first"}},steps:[
  {t:"hook",ic:"🚨",q:"נשבר לך המקרר. ₪4,000. אין לך מזומן. מה אתה מוכר?",
   sub:"וכן — זה יקרה בדיוק כשהשוק למטה. תמיד.",cta:"אוי. תסביר →",tr:{en:{"q": "Your fridge breaks. ₪4,000. You have no cash. What do you sell?", "sub": "And yes — it will happen precisely when the market is down. It always does.", "cta": "Ouch. Explain →"}}},
  {t:"card",art:"emergency",ic:"🚨",h:"3–6 חודשי הוצאות",p:"לפני שקל בשוק — קרן חירום נזילה של 3–6 חודשי מחיה. בלעדיה כל תקלה תכריח אותך למכור השקעות בתזמון הגרוע ביותר.",tr:{en:{"h": "Three to six months of expenses", "p": "Before a single shekel goes into the market, build a liquid emergency fund covering 3-6 months of living costs. Without one, any mishap forces you to sell investments at the worst possible time."}}},
  {t:"sim",asset:"🏠 החיים האמיתיים",start:10000,
   why:"ראית את ההבדל: בלי כרית מזומן, החיים מכריחים אותך למכור בדיוק כשאסור. קרן החירום לא מייצרת תשואה — היא מגינה על התשואה שלך.",
   events:[
    {ic:"🔧",t:"תקלה יקרה",good:false,news:"הרכב נתקע. ₪6,000 תיקון. השוק במקרה יורד 20% החודש.",
     opts:[{l:"מוכר מהתיק — אין ברירה",r:-.22,fb:"נאלצת למכור בשפל. הפסד שנכפה עליך — לא נבחר."},
      {l:"משתמש בקרן החירום",r:0,good:true,fb:"התיק לא נגע. זה בדיוק מה שהקרן קיימת בשבילו."}]},
    {ic:"💼",t:"אובדן הכנסה",good:false,news:"פוטרת. ייקח 3 חודשים למצוא עבודה. השוק עדיין למטה.",
     opts:[{l:"מחסל את התיק כדי לחיות",r:-.30,fb:"מכרת הכל בתחתית. שנים של השקעה נמחקו בגלל חודשיים בלי הכנסה."},
      {l:"הקרן מכסה 3 חודשי מחיה",r:0,good:true,fb:"שרדת בלי לגעת בתיק. הקרן קנתה לך זמן — וזה שווה הון."}]},
    {ic:"📈",t:"השוק מתאושש",good:true,news:"השוק חוזר לשיא. מי שנאלץ למכור — לא נכח.",
     opts:[{l:"התיק שלי שלם — משתתף בעלייה",r:.25,good:true,fb:"בגלל כרית מזומן משעממת, נשארת במשחק."},
      {l:"אין לי תיק, מכרתי הכל",r:0,fb:"התאוששת מהמשבר — אבל בלי התיק שיכולת לשמור."}]}],tr:{en:{"asset": "🏠 Real life", "why": "You saw the difference: without a cash cushion, life forces you to sell exactly when you shouldn't. The emergency fund doesn't generate returns — it protects your returns.", "events": [{"t": "An expensive breakdown", "news": "Your car breaks down. A ₪6,000 repair. The market happens to be down 20% this month.", "opts": [{"l": "Sell from the portfolio — no choice", "fb": "You were forced to sell at a low. A loss imposed on you rather than chosen."}, {"l": "Use the emergency fund", "fb": "The portfolio was untouched. That's exactly what the fund exists for."}]}, {"t": "Loss of income", "news": "You're laid off. It will take three months to find work. The market is still down.", "opts": [{"l": "Liquidate the portfolio to live on", "fb": "You sold everything at the bottom. Years of investing erased by two months without income."}, {"l": "The fund covers three months of living costs", "fb": "You got through it without touching the portfolio. The fund bought you time — and that's worth a fortune."}]}, {"t": "The market recovers", "news": "The market returns to its highs. Those forced to sell weren't there for it.", "opts": [{"l": "My portfolio is intact — I take part in the rise", "fb": "Because of a boring cash cushion, you stayed in the game."}, {"l": "I have no portfolio, I sold it all", "fb": "You recovered from the crisis — but without the portfolio you could have kept."}]}]}}},
  {t:"quiz",q:"איפה שמים קרן חירום?",o:["מניות טק","פיקדון נזיל / קרן כספית","קריפטו","נעליים"],a:1,
   why:"נזילות וביטחון. הקרן הזו קונה שקט — לא תשואה.",
   mentor:{why:"שמת את כרית הביטחון במקום שיכול לרדת 40% בדיוק כשתצטרך אותה. זה מבטל את כל המטרה.",
    analogy:"גלגל רזרבי לא אמור להיות 'מושקע'. הוא אמור להיות שם, מלא אוויר, כשאתה צריך אותו — עכשיו.",
    q:"למה קרן חירום לא הולכת לשוק המניות?",
    o:["כי מניות תמיד יורדות","כי היא חייבת להיות זמינה ויציבה בדיוק כשקורה משבר","כי אסור בחוק","כי אין תשואה"],a:1,
    hint:"מתי בדרך כלל תצטרך את הקרן — ומה עושה השוק באותו רגע?",
    ok:"בדיוק. משברים אישיים נוטים להגיע יחד עם משברי שוק. הקרן חייבת להיות מוכנה."},tr:{en:{"q": "Where should an emergency fund be held?", "o": ["Tech stocks", "A liquid deposit / money market fund", "Crypto", "Shoes"], "why": "Liquidity and safety. This fund buys peace of mind, not returns.", "mentor": {"why": "You put your safety cushion somewhere that can fall 40% precisely when you need it. That defeats the entire purpose.", "analogy": "A spare tyre isn't meant to be 'invested'. It's meant to be there, inflated, the moment you need it — right now.", "q": "Why doesn't an emergency fund belong in the stock market?", "o": ["Because stocks always fall", "Because it must be available and stable precisely when a crisis hits", "Because it's illegal", "Because there's no return"], "hint": "When will you typically need the fund — and what is the market doing at that same moment?", "ok": "Exactly. Personal crises tend to arrive alongside market crises. The fund has to be ready."}}}},
  {t:"challenge",task:"חשב כמה עולים לך 3 חודשי מחיה (שכר דירה + אוכל + חשבונות + הוצאות קבועות). זה היעד של קרן החירום שלך. רשום את המספר.",
   hint:"אפשר להשתמש בכלי 'קרן חירום' בלשונית 🧰 שלנו. אם עוד אין לך את הסכום — זה היעד הראשון שלך, לפני כל השקעה.",tr:{en:{"task": "Work out what three months of living costs come to (rent + food + bills + fixed expenses). That's your emergency fund target. Write the number down.", "hint": "You can use our 'emergency fund' tool in the 🧰 tab. If you don't have that amount yet, it's your first goal — before any investing."}}},
  {t:"summary",h:"מה למדת",points:["קרן חירום קודמת לכל השקעה. בלי יוצא מן הכלל",
    "3–6 חודשי מחיה, נזילים וזמינים מיד",
    "בלעדיה — החיים יכריחו אותך למכור בתחתית",
    "הקרן לא מייצרת תשואה. היא מגינה על התשואה שלך"],tr:{en:{"h": "What you learned", "points": ["An emergency fund comes before any investment. No exceptions", "Three to six months of living costs, liquid and instantly available", "Without one, life will force you to sell at the bottom", "The fund doesn't generate returns. It protects your returns"]}}}
 ]},
 {id:"l52",ic:"📊",title:"תקציב ומה נשאר להשקיע",tier:"intermediate",tr:{en:{"title": "Budgeting and what's left to invest"}},steps:[
  {t:"hook",ic:"📊",q:"כמה כסף באמת נשאר לך בסוף החודש? לא ניחוש — מספר.",
   sub:"רוב האנשים טועים ב-30%. ואי אפשר להשקיע כסף שלא ידעת שאין לך.",cta:"בוא נבדוק →",tr:{en:{"q": "How much money is actually left at the end of your month? Not a guess — a number.", "sub": "Most people are off by 30%. And you can't invest money you didn't know you didn't have.", "cta": "Let's check →"}}},
  {t:"card",art:"feebite",ic:"📊",h:"כלל 50/30/20",p:"50% צרכים (דיור, אוכל, חשבונות), 30% רצונות, 20% חיסכון והשקעה. זה לא חוק קדוש — זו נקודת התחלה שעובדת.",tr:{en:{"h": "The 50/30/20 rule", "p": "50% needs (housing, food, bills), 30% wants, 20% savings and investment. It isn't sacred law — it's a starting point that works."}}},
  {t:"flip",q:"3 טעויות תקציב נפוצות. הקש לגלות:",
   cards:[{ic:"🫥",t:"'אני יודע בערך'",b:"לא. אתה לא. רוב האנשים טועים בעשרות אחוזים. תמדוד חודש אחד ותופתע."},
    {ic:"💳",t:"מנויים שנשכחו",b:"מנויים קטנים מצטברים למאות שקלים בחודש. עבור על החיובים — תמצא לפחות אחד מיותר."},
    {ic:"🎯",t:"להשקיע מה שנשאר",b:"הפוך: קודם מפרישים להשקעה, ואז חיים מהשאר. 'מה שנשאר' לרוב שווה אפס."}],tr:{en:{"q": "3 common budgeting mistakes. Tap to reveal:", "cards": [{"t": "'I roughly know'", "b": "No, you don't. Most people are off by tens of percent. Measure one month and you'll be surprised."}, {"t": "Forgotten subscriptions", "b": "Small subscriptions add up to hundreds a month. Go through your charges — you'll find at least one you don't need."}, {"t": "Investing what's left", "b": "Reverse it: set aside for investing first, then live on the rest. 'What's left' usually equals zero."}]}}},
  {t:"quiz",q:"מה הסדר הנכון?",o:["קודם מוציאים, ומשקיעים מה שנשאר","קודם מפרישים להשקעה, ואז חיים מהשאר","משקיעים רק כשיש בונוס","לא משנה"],a:1,
   why:"'שלם לעצמך קודם'. מה שנשאר בסוף החודש נוטה להיות אפס.",
   mentor:{why:"בחרת בסדר שנשמע הגיוני — אבל בפועל הוא מבטיח שלא תשקיע כמעט כלום.",
    analogy:"אם תשתה מים רק אחרי שכולם שתו — לא יישאר לך. אתה צריך למלא את הכוס שלך קודם.",
    q:"למה 'להשקיע מה שנשאר' כמעט תמיד נכשל?",
    o:["כי אין תשואה","כי ההוצאות מתרחבות לגודל ההכנסה — ולא נשאר כלום","כי הבנק אוסר","כי זה חוקי"],a:1,
    hint:"מה קורה להוצאות שלך כשיש קצת יותר כסף בחשבון?",
    ok:"בדיוק. ההוצאות תופחות למלא כל שקל פנוי. לכן מפרישים ראשון — אוטומטית."},tr:{en:{"q": "What's the right order?", "o": ["Spend first, and invest whatever's left", "Set aside for investing first, then live on the rest", "Only invest when there's a bonus", "It doesn't matter"], "why": "Pay yourself first. Whatever is left at the end of the month tends to be nothing.", "mentor": {"why": "You chose the order that sounds sensible — but in practice it guarantees you'll invest almost nothing.", "analogy": "If you only drink after everyone else has, there'll be nothing left. You have to fill your own glass first.", "q": "Why does 'invest what's left' almost always fail?", "o": ["Because there's no return", "Because spending expands to fill your income — and nothing remains", "Because the bank forbids it", "Because it's legal"], "hint": "What happens to your spending when there's a little more money in the account?", "ok": "Exactly. Spending swells to fill every spare shekel. That's why you set money aside first — automatically."}}}},
  {t:"challenge",task:"פתח את אפליקציית הבנק שלך ועבור על החיובים של החודש האחרון. סמן כל מנוי או הוצאה שאתה לא באמת צריך. חבר את הסכום.",
   hint:"הסכום הזה, מושקע כל חודש ל-20 שנה, יכול להיות עשרות אלפי שקלים. זה לא 'רק ₪50 בחודש'.",tr:{en:{"task": "Open your banking app and go through last month's charges. Mark every subscription or expense you don't genuinely need. Add up the total.", "hint": "That sum, invested monthly for 20 years, could be tens of thousands of shekels. It isn't 'just ₪50 a month'."}}},
  {t:"summary",h:"מה למדת",points:["50/30/20 — נקודת פתיחה טובה לתקציב",
    "'אני יודע בערך' = אתה טועה. תמדוד באמת",
    "שלם לעצמך קודם: מפרישים להשקעה, ואז חיים מהשאר",
    "'מה שנשאר בסוף החודש' נוטה מאוד להיות אפס"],tr:{en:{"h": "What you learned", "points": ["50/30/20 — a good starting point for a budget", "'I roughly know' means you're wrong. Actually measure it", "Pay yourself first: set aside for investing, then live on the rest", "'Whatever's left at month's end' has a strong tendency to be zero"]}}}
 ]},
 {id:"l53",ic:"💳",title:"חוב — האויב שאוכל תשואה",tier:"advanced",tr:{en:{"title": "Debt — the enemy that eats returns"}},steps:[
  {t:"hook",ic:"💳",q:"יש לך חוב בכרטיס אשראי ב-12% ריבית. כדאי להשקיע במקום להחזיר?",
   sub:"התשובה מתמטית — ורוב האנשים עונים לא נכון.",cta:"תחשב לי →",tr:{en:{"q": "You have credit card debt at 12% interest. Should you invest instead of paying it off?", "sub": "The answer is mathematical — and most people get it wrong.", "cta": "Do the maths for me →"}}},
  {t:"card",art:"riskreturn",ic:"💳",h:"תשואה מובטחת",p:"החזרת חוב בריבית 12% = תשואה מובטחת של 12%. שום השקעה בשוק לא מבטיחה את זה. חוב יקר קודם להשקעה — תמיד.",tr:{en:{"h": "A guaranteed return", "p": "Paying off debt at 12% interest is a guaranteed 12% return. No market investment guarantees that. Expensive debt comes before investing — always."}}},
  {t:"predict",q:"חוב של ₪20,000 בריבית 12%. השקעה מניבה ~8% בממוצע (ולא מובטח). מה עדיף?",
   min:0,max:100,step:10,unit:"% להחזר חוב",answer:100,tol:15,
   reveal:"100% להחזר החוב. 12% מובטח מנצח 8% לא-מובטח. זה לא קרוב.",
   why:"החזר חוב הוא ההשקעה היחידה עם תשואה מובטחת. ריבית גבוהה = עדיפות עליונה.",tr:{en:{"q": "A ₪20,000 debt at 12% interest. Investing returns roughly 8% on average (and isn't guaranteed). What's better?", "unit": "% toward debt", "reveal": "100% toward the debt. A guaranteed 12% beats an unguaranteed 8%. It isn't close.", "why": "Repaying debt is the only investment with a guaranteed return. High interest means top priority."}}},
  {t:"quiz",q:"מתי כן משקיעים במקום להחזיר חוב?",o:["תמיד","כשריבית החוב נמוכה מאוד (למשל משכנתא בריבית נמוכה)","אף פעם","כשמשעמם"],a:1,
   why:"חוב זול (ריבית נמוכה) יכול לחיות במקביל להשקעה. חוב יקר — מחזירים קודם.",
   mentor:{why:"התייחסת לכל החוב אותו דבר. אבל ריבית של 3% וריבית של 15% הם שני עולמות.",
    analogy:"חוב בריבית 15% הוא כמו דלי מחורר: כל שקל שאתה שופך פנימה נוזל החוצה מהר יותר ממה שתוכל למלא.",
    q:"יש לך משכנתא ב-3% וחוב אשראי ב-15%. יש לך ₪10,000. מה קודם?",
    o:["מחזיר משכנתא","מחזיר את חוב האשראי (15%)","משקיע הכל","מחלק שווה"],a:1,
    hint:"איזה חוב 'מרוויח' נגדך הכי מהר?",
    ok:"בדיוק. תמיד תוקפים קודם את הריבית הגבוהה ביותר."},tr:{en:{"q": "When does it make sense to invest rather than repay debt?", "o": ["Always", "When the debt's interest is very low (a low-rate mortgage, for instance)", "Never", "When you're bored"], "why": "Cheap debt (low interest) can coexist with investing. Expensive debt gets repaid first.", "mentor": {"why": "You treated all debt the same. But 3% interest and 15% interest are two different worlds.", "analogy": "Debt at 15% is a leaking bucket: every shekel you pour in drains out faster than you can fill it.", "q": "You have a mortgage at 3% and credit card debt at 15%. You have ₪10,000. What comes first?", "o": ["Pay down the mortgage", "Pay off the credit card debt (15%)", "Invest it all", "Split it evenly"], "hint": "Which debt is 'earning' against you the fastest?", "ok": "Exactly. You always attack the highest interest rate first."}}}},
  {t:"summary",h:"מה למדת",points:["החזר חוב בריבית X = תשואה מובטחת של X",
    "חוב יקר (אשראי, הלוואות) קודם לכל השקעה",
    "חוב זול (משכנתא בריבית נמוכה) יכול לחיות לצד השקעה",
    "תמיד תוקפים קודם את הריבית הגבוהה ביותר"],tr:{en:{"h": "What you learned", "points": ["Repaying debt at X% interest is a guaranteed X% return", "Expensive debt (credit cards, loans) comes before any investment", "Cheap debt (a low-rate mortgage) can coexist with investing", "Always attack the highest interest rate first"]}}}
 ]}
]},
{id:"c6",ic:"🌊",title:"בועות והתרסקויות",desc:"למה גאונים מפסידים כשכולם בטוחים",tr:{en:{"title": "Bubbles and Crashes", "desc": "Why brilliant people lose when everyone feels certain"}},lessons:[
 {id:"l61",ic:"🎈",title:"אנטומיה של בועה",tier:"beginner",tr:{en:{"title": "Anatomy of a bubble"}},steps:[
  {t:"hook",ic:"🫧",q:"איך יודעים שאתה בתוך בועה — לפני שהיא מתפוצצת?",sub:"יש סימנים. הם חוזרים על עצמם כל פעם מחדש.",cta:"בוא נגלה →",tr:{en:{"q": "How do you know you're inside a bubble — before it bursts?", "sub": "There are signs. They repeat themselves every single time.", "cta": "Let's find out →"}}},
  {t:"card",art:"fomo",ic:"🎈",h:"5 שלבי הבועה",p:"כל בועה חוזרת על אותו מסלול: התלהבות שקטה → תשומת לב תקשורתית → אופוריה ('כולם מתעשרים!') → שיא → קריסה → ייאוש. הבעיה: בשיא זה מרגיש הכי בטוח — ובדיוק שם הכי מסוכן.",tr:{en:{"h": "The 5 stages of a bubble", "p": "Every bubble follows the same path: quiet enthusiasm → media attention → euphoria ('everyone's getting rich!') → the peak → collapse → despair. The problem: at the peak it feels safest — and that's exactly where it's most dangerous."}}},
  {t:"swipe",q:"סיבה טובה לקנות — או דחף? החלק כל כרטיס.",leftLabel:"❌ דחף",rightLabel:"✅ נימוק",
   cards:[
    {text:"כולם ברשתות מדברים על זה, אסור לפספס",good:false,why:"זה FOMO טהור — ההתלהבות של אחרים היא לא מידע על העסק."},
    {text:"החברה מגדילה רווחים 5 שנים ברציפות",good:true,why:"נתון עסקי אמיתי ובר-בדיקה. זו סיבה, לא דחף."},
    {text:"המחיר עלה 300% החודש",good:false,why:"עלייה שכבר קרתה = עבר, לא הבטחה. לרוב זה שיא סיכון."},
    {text:"נסחרת בזול ביחס לרווחים ויש לה יתרון ברור",good:true,why:"תזה עסקית עם בסיס. עדיין דורש בדיקה — אבל זו חשיבה נכונה."},
    {text:"משפיען אמר שזה 'הולך לירח'",good:false,why:"אף אחד לא יודע את העתיד. הבטחת ודאות = דגל אדום."}],tr:{en:{"q": "A good reason to buy — or an impulse? Swipe each card.", "leftLabel": "❌ Impulse", "rightLabel": "✅ Reasoning", "cards": [{"text": "Everyone online is talking about it, I can't miss out", "why": "Pure FOMO — other people's excitement tells you nothing about the business."}, {"text": "The company has grown earnings five years running", "why": "Real, verifiable business data. That's a reason, not an impulse."}, {"text": "The price is up 300% this month", "why": "A rise that already happened is the past, not a promise. Usually it marks peak risk."}, {"text": "It trades cheaply relative to earnings and has a clear advantage", "why": "A business thesis with a foundation. It still needs checking — but that's the right kind of thinking."}, {"text": "An influencer said it's 'going to the moon'", "why": "Nobody knows the future. Promising certainty is a red flag."}]}}},
  {t:"quiz",q:"מתי בועה מרגישה הכי בטוחה?",o:["בתחתית","בשיא, רגע לפני הקריסה","באמצע","אף פעם"],a:1,why:"דווקא באופוריה, כשכולם בטוחים — שם הסיכון מקסימלי. זה מה שהופך בועות לכל כך מסוכנות.",
   mentor:{why:"בחרת ברגע שנשמע הגיוני — אבל בועות עובדות הפוך: הן מרגישות הכי בטוחות בדיוק כשהן הכי מסוכנות.",
    analogy:"ככל שיותר אנשים עומדים בצד אחד של סירה — כך היא מרגישה יציבה יותר לרגע. ואז היא מתהפכת.",
    q:"כל התקשורת חוגגת, השכן מרוויח, וכולם אומרים 'הפעם זה שונה'. מה זה?",
    o:["סימן מצוין להיכנס","הסימן הקלאסי לשיא בועה","סימן ניטרלי","הוכחה שהשוק בריא"],a:1,
    hint:"אם כולם כבר בפנים — מי נשאר לקנות ולדחוף את המחיר?",
    ok:"בדיוק. הביטחון המוחלט של ההמון הוא האזהרה, לא האישור."},tr:{en:{"q": "When does a bubble feel safest?", "o": ["At the bottom", "At the peak, moments before the collapse", "In the middle", "Never"], "why": "Precisely during euphoria, when everyone feels certain — that's when risk is at its maximum. It's what makes bubbles so dangerous.", "mentor": {"why": "You chose the moment that sounds logical — but bubbles work in reverse: they feel safest exactly when they're most dangerous.", "analogy": "The more people standing on one side of a boat, the steadier it feels — for a moment. Then it capsizes.", "q": "The media is celebrating, your neighbour is making money, and everyone says 'this time it's different'. What is that?", "o": ["An excellent signal to get in", "The classic sign of a bubble peak", "A neutral signal", "Proof the market is healthy"], "hint": "If everyone is already in — who's left to buy and push the price higher?", "ok": "Exactly. The crowd's absolute confidence is the warning, not the confirmation."}}}},
 
  {t:"summary",h:"מה למדת",points:["בועה = מחיר שמנותק לחלוטין מהערך העסקי","הסימן: כולם מדברים על זה, אף אחד לא שואל על רווחים","'הפעם זה שונה' — המשפט היקר ביותר בהיסטוריה","בועות תמיד מתפוצצות. השאלה היא רק מתי"],tr:{en:{"h": "What you learned", "points": ["A bubble = a price completely detached from business value", "The sign: everyone is talking about it, nobody is asking about earnings", "'This time it's different' — the most expensive phrase in history", "Bubbles always burst. The only question is when"]}}}]},
 {id:"l62",ic:"📜",title:"לקחים מההיסטוריה",tier:"intermediate",tr:{en:{"title": "Lessons from history"}},steps:[
  {t:"hook",ic:"💥",q:"למה כל מפולת מרגישה כמו סוף העולם — ואף פעם היא לא?",sub:"ההיסטוריה עקבית להחריד בנקודה הזו.",cta:"בוא נגלה →",tr:{en:{"q": "Why does every crash feel like the end of the world — and never actually is?", "sub": "History is startlingly consistent on this point.", "cta": "Let's find out →"}}},
  {t:"card",art:"fomo",ic:"📜",h:"'הפעם זה שונה'",p:"מצניחי הצבעונים בהולנד ועד בועת הדוט-קום — כל בועה שוכנעה שהיא יוצאת דופן. ארבע המילים 'הפעם זה שונה' הן היקרות ביותר בהיסטוריה של השווקים.",tr:{en:{"h": "'This time it's different'", "p": "From Dutch tulip mania to the dot-com bubble, every bubble was convinced it was the exception. Those four words — 'this time it's different' — are the most expensive in market history."}}},
  {t:"scenario",q:"חבר מתקשר נרגש:",situation:"'המניה הזו רק עולה כבר חודשים! הפעם זה שונה — קח משכנתא ותשקיע הכל, אי אפשר להפסיד!'",
   options:[
    {label:"משקיע הכל מיד",verdict:"bad",fb:"'אי אפשר להפסיד' + מינוף = מתכון קלאסי לאסון. כשזה מתהפך, אתה מפסיד כסף שאין לך."},
    {label:"עוצר, בודק את העסק, ואם בכלל — סכום קטן שאני מוכן להפסיד",verdict:"good",fb:"בדיוק. ספקנות + פוזיציה קטנה = אתה מוגן גם אם טעית."},
    {label:"לווה כסף כדי לקנות עוד יותר",verdict:"bad",fb:"מינוף מגדיל גם רווח וגם הרס. בהתלהבות של אחרים — זו הדרך המהירה להימחק."}],
   why:"הרגש של אחרים הוא אף פעם לא אנליזה. פוזיציה קטנה מכסף פנוי היא ההגנה הטובה ביותר מפני 'הפעם זה שונה'.",tr:{en:{"q": "An excited friend calls you:", "situation": "'This stock has done nothing but rise for months! This time it's different — take out a mortgage and put everything in, you can't lose!'", "why": "Other people's emotion is never analysis. A small position funded with spare cash is the best protection against 'this time it's different'.", "options": [{"label": "Invest everything immediately", "fb": "'You can't lose' plus leverage is the classic recipe for disaster. When it turns, you lose money you don't have."}, {"label": "Pause, examine the business, and if at all — a small amount I can afford to lose", "fb": "Exactly. Scepticism plus a small position means you're protected even if you were wrong."}, {"label": "Borrow money to buy even more", "fb": "Leverage magnifies both gains and ruin. Riding someone else's excitement, it's the fastest route to being wiped out."}]}}},
  {t:"quiz",q:"מהי הסכנה הגדולה במינוף (כסף בהלוואה) בבועה?",o:["עמלות גבוהות","הפסד כסף שאין לך + מחיקה","זה משעמם","מס גבוה"],a:1,why:"מינוף מגדיל את שני הכיוונים. בקריסה הוא יכול למחוק אותך לגמרי — לא רק להפסיד.",
   mentor:{why:"לא זיהית שמינוף לא רק מגדיל הפסד — הוא יכול לכפות עליך למכור בדיוק בתחתית.",
    analogy:"בלי מינוף אתה יכול לחכות שהסערה תעבור. עם מינוף — הבנק מוציא אותך מהסירה באמצע הסערה.",
    q:"קנית במינוף. השוק יורד 40%. מה קורה?",
    o:["אני מחכה בסבלנות שיתאושש","קריאת מרג\"ן — נאלץ למכור בשפל, גם אם השוק יתאושש מחר","לא קורה כלום","הבנק סופג את ההפסד"],a:1,
    hint:"מי מחליט מתי אתה מוכר — אתה, או מי שהלווה לך?",
    ok:"נכון. מינוף שולל ממך את הנשק החזק ביותר: הזמן."},tr:{en:{"q": "What's the greatest danger of leverage (borrowed money) in a bubble?", "o": ["High fees", "Losing money you don't have + being wiped out", "It's boring", "High taxes"], "why": "Leverage magnifies both directions. In a collapse it can wipe you out entirely — not merely lose you money.", "mentor": {"why": "You didn't spot that leverage doesn't just magnify losses — it can force you to sell at precisely the bottom.", "analogy": "Without leverage you can wait for the storm to pass. With leverage, the bank pulls you out of the boat mid-storm.", "q": "You bought on leverage. The market falls 40%. What happens?", "o": ["I wait patiently for a recovery", "A margin call — I'm forced to sell at the low, even if the market recovers tomorrow", "Nothing happens", "The bank absorbs the loss"], "hint": "Who decides when you sell — you, or the person who lent you the money?", "ok": "Right. Leverage strips you of your most powerful weapon: time."}}}},
 
  {t:"summary",h:"מה למדת",points:["מפולות הן חלק נורמלי מהשוק, לא תקלה","בכל מפולת בהיסטוריה — מי שנשאר, התאושש","הפחד המרבי מגיע בתחתית, בדיוק כשאסור למכור","מפולת היא הזדמנות למי שהתכונן — ואסון למי שלא"],tr:{en:{"h": "What you learned", "points": ["Crashes are a normal part of markets, not a malfunction", "In every crash in history, those who stayed recovered", "Maximum fear arrives at the bottom, exactly when you must not sell", "A crash is an opportunity for the prepared — and a disaster for everyone else"]}}}]},
 {id:"l63",ic:"🧊",title:"למה קשה להחזיק",tier:"advanced",tr:{en:{"title": "Why holding is so hard"}},steps:[
  {t:"hook",ic:"🧯",q:"מה עושים כשהתיק אדום ואתה לא מצליח לישון?",sub:"יש תשובה מעשית — והיא לא 'תתאמץ יותר'.",cta:"בוא נגלה →",tr:{en:{"q": "What do you do when your portfolio is red and you can't sleep?", "sub": "There's a practical answer — and it isn't 'try harder'.", "cta": "Let's find out →"}}},
  {t:"card",art:"crashcurve",ic:"🧊",h:"הקריסה היא מבחן אופי",p:"בירידה של 30% הגוף צועק 'תברח'. אבל היסטורית, מי שהחזיק דרך המפולות קיבל את התשואה — ומי שמכר בתחתית קיבע את ההפסד. הידע לבד לא מספיק; צריך לתרגל את הרגע.",tr:{en:{"h": "The crash is a test of character", "p": "In a 30% decline your body screams 'run'. But historically, those who held through the crashes captured the returns — and those who sold at the bottom locked in the loss. Knowledge alone isn't enough; you have to rehearse the moment."}}},
  {t:"scenario",q:"התיק שלך ירד 25% בשבוע. הכותרות שחורות.",situation:"מה ההחלטה?",
   options:[
    {label:"מוכר הכל עכשיו, לפני שיגרע",verdict:"bad",fb:"זו מכירת פאניקה. אתה הופך הפסד על הנייר להפסד אמיתי — לרוב סמוך לתחתית."},
    {label:"בודק אם משהו השתנה בעסקים עצמם. אם לא — לא נוגע",verdict:"good",fb:"החלטה של משקיע. הירידה לבדה אינה סיבה למכור — רק שבירת התזה היא."},
    {label:"אם יש לי מזומן פנוי — שוקל לקנות בזול",verdict:"good",fb:"מצוין. מפולות הן הזמן שבו נכסים איכותיים 'במבצע' — למי שבנה קרן חירום מראש."}],
   why:"סיים את השיעור — ואז נסה את אתגר 'שרוד את המפולת' במסך הלימוד. שם תתרגל את הרגע הזה תחת לחץ אמיתי.",tr:{en:{"q": "Your portfolio is down 25% in a week. The headlines are grim.", "situation": "What's the decision?", "why": "Finish this lesson — then try the 'Survive the Crash' challenge on the learning screen. That's where you rehearse this moment under real pressure.", "options": [{"label": "Sell everything now, before it gets worse", "fb": "That's a panic sale. You're converting a paper loss into a real one — usually close to the bottom."}, {"label": "Check whether anything changed in the businesses themselves. If not — don't touch it", "fb": "An investor's decision. The decline alone isn't a reason to sell — only a broken thesis is."}, {"label": "If I have spare cash — consider buying cheaply", "fb": "Excellent. Crashes are when quality assets go on sale — for anyone who built an emergency fund in advance."}]}}},
  {t:"quiz",q:"מתי ירידה חדה כן מצדיקה מכירה?",o:["תמיד, מיד","כשהעסק עצמו נשבר, לא רק המחיר","כשחבר מוכר","אף פעם"],a:1,why:"מוכרים כשהתזה נשברה — לא כשהמסך אדום. הירידה עצמה אינה מידע חדש על העסק.",tr:{en:{"q": "When does a sharp decline genuinely justify selling?", "o": ["Always, immediately", "When the business itself breaks, not just the price", "When a friend sells", "Never"], "why": "You sell when the thesis breaks — not when the screen is red. The decline itself is not new information about the business."}}},
 
  {t:"summary",h:"מה למדת",points:["אל תבדוק את התיק כל יום — זה מזין את הרגש","הקטן פוזיציות עד שאתה ישן טוב. תיק נכון = תיק שאתה מחזיק","זכור: זו תנודה, לא הפסד — עד שמכרת","אם אתה לא ישן, הבעיה היא רמת הסיכון — לא השוק"],tr:{en:{"h": "What you learned", "points": ["Don't check your portfolio daily — it feeds the emotion", "Shrink positions until you sleep well. The right portfolio is the one you'll actually hold", "Remember: it's a swing, not a loss — until you sell", "If you can't sleep, the problem is your risk level — not the market"]}}}]}
]},
{id:"c7",ic:"📄",title:"קריאת דוחות ושווי",desc:"איך יודעים אם חברה שווה את המחיר",tr:{en:{"title": "Reading Financials and Valuation", "desc": "How to tell whether a company is worth its price"}},lessons:[
 {id:"l71",ic:"📑",title:"שלושת הדוחות",tier:"beginner",tr:{en:{"title": "The three statements"}},steps:[
  {t:"hook",ic:"📄",q:"אתה יודע לקרוא דוח כספי? רוב המשקיעים לא — והם משקיעים בכל זאת.",sub:"3 מספרים והבנת את רוב הסיפור.",cta:"בוא נגלה →",tr:{en:{"q": "Can you read a financial statement? Most investors can't — and they invest anyway.", "sub": "Three numbers and you've grasped most of the story.", "cta": "Let's find out →"}}},
  {t:"card",art:"pe",ic:"📑",h:"3 דוחות, 3 שאלות",p:"דוח רווח והפסד: כמה החברה הרוויחה בתקופה? מאזן: מה יש לה ומה היא חייבת ברגע נתון? תזרים מזומנים: כמה כסף אמיתי נכנס ויצא? רווח 'על הנייר' יכול להיות יפה בזמן שהמזומן נגמר.",tr:{en:{"h": "Three statements, three questions", "p": "The income statement: how much did the company earn over the period? The balance sheet: what does it own and owe at a point in time? The cash flow statement: how much real money came in and went out? Profit 'on paper' can look lovely while the cash runs out."}}},
  {t:"sort",q:"סדר את הנכסים מהבטוח (1) לתנודתי ביותר (4). גע בהם לפי הסדר.",
   items:[{label:"🏛️ אג\"ח ממשלתי",rank:1},{label:"🌐 מדד מניות רחב",rank:2},{label:"💻 מניה בודדת",rank:3},{label:"🪙 מטבע קריפטו",rank:4}],
   why:"ככל שהתשואה הפוטנציאלית גבוהה יותר — כך גם התנודתיות. אין תשואה גבוהה בלי סיכון גבוה.",tr:{en:{"q": "Order the assets from safest (1) to most volatile (4). Tap them in order.", "items":[{"label": "🏛️ Government bonds"}, {"label": "🌐 Broad stock index"}, {"label": "💻 A single stock"}, {"label": "🪙 Cryptocurrency"}], "why": "The higher the potential return, the higher the volatility. There is no high return without high risk."}}},
  {t:"quiz",q:"מה מראה דוח תזרים המזומנים?",o:["כמה מניות יש","כסף אמיתי שנכנס ויצא","מחיר המניה","כמה עובדים יש"],a:1,why:"רווח חשבונאי אפשר 'לייפות'; מזומן קשה לזייף. חברה יכולה להראות רווח ולפשוט רגל מחוסר מזומן.",
   mentor:{why:"בלבלת בין רווח חשבונאי לכסף אמיתי. חברה יכולה לרשום רווח יפה ועדיין להיגמר לה המזומן.",
    analogy:"מכרת סחורה ב-₪100,000 — אבל הלקוח ישלם רק בעוד שנה. בדוח יש רווח. בכיס אין שקל. ומהמשכורות צריך לשלם החודש.",
    q:"חברה מדווחת על רווח גדול, אבל התזרים מהפעילות שלילי כבר 3 שנים. מה זה אומר?",
    o:["הכל מצוין, רווח זה מה שחשוב","דגל אדום — הרווח קיים על הנייר אבל מזומן לא נכנס","זה נורמלי לכל חברה","סימן לצמיחה בריאה"],a:1,
    hint:"אפשר לשלם משכורות ב'רווח חשבונאי'?",
    ok:"בדיוק. תזרים לא משקר — רווח חשבונאי לפעמים כן."},tr:{en:{"q": "What does the cash flow statement show?", "o": ["How many shares exist", "Real money that came in and went out", "The share price", "How many employees there are"], "why": "Accounting profit can be dressed up; cash is hard to fake. A company can show a profit and go bankrupt for lack of cash.", "mentor": {"why": "You confused accounting profit with real money. A company can post a handsome profit and still run out of cash.", "analogy": "You sold ₪100,000 of goods — but the customer only pays in a year. The statement shows a profit. Your pocket holds nothing. And salaries are due this month.", "q": "A company reports large profits, but operating cash flow has been negative for three years. What does that mean?", "o": ["It's all fine, profit is what matters", "A red flag — the profit exists on paper but cash isn't coming in", "That's normal for every company", "A sign of healthy growth"], "hint": "Can you pay salaries with 'accounting profit'?", "ok": "Exactly. Cash flow doesn't lie — accounting profit sometimes does."}}}},
 
  {t:"summary",h:"מה למדת",points:["הכנסות = כמה נכנס. רווח = כמה נשאר באמת","חברה יכולה לגדול בהכנסות ולהפסיד כסף","תזרים מזומנים לא משקר — רווח חשבונאי לפעמים כן","קרא את הדוח לפני שאתה קונה. תמיד"],tr:{en:{"h": "What you learned", "points": ["Revenue = what came in. Profit = what actually remained", "A company can grow its revenue and still lose money", "Cash flow doesn't lie — accounting profit sometimes does", "Read the statements before you buy. Always"]}}}]},
 {id:"l72",ic:"🏷️",title:"מכפיל רווח (P/E)",tier:"intermediate",tr:{en:{"title": "The price-to-earnings ratio (P/E)"}},steps:[
  {t:"hook",ic:"💎",q:"מה ההבדל בין מניה זולה למניה במחיר טוב?",sub:"זה לא אותו דבר. וזו הטעות הכי יקרה של מתחילים.",cta:"בוא נגלה →",tr:{en:{"q": "What's the difference between a cheap stock and a stock at a good price?", "sub": "They aren't the same thing. And it's the most expensive mistake beginners make.", "cta": "Let's find out →"}}},
  {t:"card",art:"pe",ic:"🏷️",h:"כמה שנים אתה משלם?",p:"מכפיל רווח (P/E) = מחיר המניה חלקי הרווח למניה. P/E של 15 אומר: אתה משלם 15 שנות רווח נוכחי. גבוה = השוק מצפה לצמיחה. נמוך = זול... או שיש בעיה.",tr:{en:{"h": "How many years are you paying for?", "p": "The price-to-earnings ratio (P/E) is the share price divided by earnings per share. A P/E of 15 means you're paying 15 years of current earnings. High means the market expects growth. Low means it's cheap... or that something is wrong."}}},
  {t:"predict",q:"חברה מרוויחה ₪10 למניה בשנה. מחיר המניה ₪150. מה מכפיל הרווח (P/E)? גרר את הניחוש.",
   min:5,max:40,step:1,unit:"P/E",answer:15,tol:3,reveal:"P/E = 150 ÷ 10 = 15",why:"מכפיל = מחיר ÷ רווח. הוא מתרגם 'יקר/זול' למספר אחד בר-השוואה בין חברות.",tr:{en:{"q": "A company earns ₪10 per share a year. The share price is ₪150. What's the P/E ratio? Drag your guess.", "unit": "P/E", "reveal": "P/E = 150 ÷ 10 = 15", "why": "The ratio is price divided by earnings. It translates 'expensive or cheap' into a single number you can compare across companies."}}},
  {t:"quiz",q:"P/E גבוה מאוד אומר בדרך כלל:",o:["המניה זולה","השוק מצפה לצמיחה גבוהה","אין סיכון","החברה מפסידה"],a:1,why:"מכפיל גבוה = ציפיות גבוהות. אם הצמיחה לא מתממשת — המניה עלולה ליפול חזק.",
   mentor:{why:"התייחסת ל-P/E כאילו הוא אומר 'טוב' או 'רע'. הוא לא — הוא אומר כמה ציפיות כבר מתומחרות.",
    analogy:"מכפיל גבוה = השוק כבר משלם היום על הצמיחה של מחר. אם היא לא תגיע — המחיר נופל, גם אם החברה בסדר גמור.",
    q:"מניה במכפיל 80. החברה צומחת יפה — אבל קצת פחות מהצפי. מה קורה למחיר?",
    o:["עולה, היא עדיין צומחת","נופל חזק — הציפיות הגבוהות לא התממשו","לא משתנה","תלוי במזל"],a:1,
    hint:"כשמשלמים מראש על ציפיות — מה קורה כשהציפיות לא מתממשות?",
    ok:"נכון. מכפיל גבוה = מרווח ביטחון קטן. אין מקום לאכזבה."},tr:{en:{"q": "A very high P/E usually means:", "o": ["The stock is cheap", "The market expects high growth", "There's no risk", "The company is losing money"], "why": "A high multiple means high expectations. If the growth doesn't materialise, the stock can fall hard.", "mentor": {"why": "You treated the P/E as if it says 'good' or 'bad'. It doesn't — it tells you how much expectation is already priced in.", "analogy": "A high multiple means the market is already paying today for tomorrow's growth. If that growth doesn't arrive, the price falls — even if the company is perfectly fine.", "q": "A stock trades at a multiple of 80. The company grows nicely — but slightly below expectations. What happens to the price?", "o": ["It rises, it's still growing", "It falls hard — the high expectations weren't met", "It doesn't change", "It depends on luck"], "hint": "When you pay up front for expectations, what happens when those expectations aren't met?", "ok": "Right. A high multiple means a thin margin of safety. There's no room for disappointment."}}}},
 
  {t:"summary",h:"מה למדת",points:["מחיר נמוך ≠ זול. השווי הוא מה שקובע","מכפיל רווח = כמה שנים של רווח אתה משלם","מכפיל נמוך יכול להיות מציאה — או מלכודת","תמיד השווה מכפיל מול הסקטור, לא במנותק"],tr:{en:{"h": "What you learned", "points": ["A low price ≠ cheap. Value is what decides", "The P/E ratio is how many years of earnings you're paying for", "A low multiple can be a bargain — or a trap", "Always compare a multiple against its sector, never in isolation"]}}}]},
 {id:"l73",ic:"🪤",title:"מלכודת ה'זול'",tier:"advanced",tr:{en:{"title": "The 'cheap' trap"}},steps:[
  {t:"card",art:"pe",ic:"🪤",h:"זול מסיבה טובה",p:"מניה שנפלה 70% נראית 'זולה' — אבל מחיר נמוך הוא לא הנחה. לפעמים העסק באמת גוסס. זו 'מלכודת ערך': נראה זול, ממשיך לרדת. השאלה אינה 'כמה ירד' אלא 'האם העסק עדיין בריא'.",tr:{en:{"h": "Cheap for a good reason", "p": "A stock that has fallen 70% looks 'cheap' — but a low price isn't a discount. Sometimes the business really is dying. That's a value trap: it looks cheap and keeps falling. The question isn't 'how far has it dropped' but 'is the business still healthy'."}}},
  {t:"scenario",q:"מניה מוכרת נפלה 70%.",situation:"היא נראית 'זולה מתמיד'. מה עושים?",
   options:[
    {label:"קונה — זה מבצע!",verdict:"bad",fb:"מחיר נמוך אינו הנחה. אולי העסק נשבר — וזו מלכודת ערך שתמשיך לרדת."},
    {label:"בודק קודם אם ההכנסות והרווחים עדיין בריאים",verdict:"good",fb:"בדיוק. 'זול' משמעותי רק אם העסק עצמו איתן. מחיר בלי הקשר הוא רק מספר."},
    {label:"קונה כפול כדי 'למצע כלפי מטה'",verdict:"bad",fb:"מיצוע לתוך עסק גוסס = לזרוק עוד כסף למטה. קודם מוודאים שהתזה עדיין נכונה."}],
   why:"ערך אמיתי = מחיר נמוך יחסית לעסק בריא. מחיר נמוך יחסית לעסק שבור זו מלכודת.",tr:{en:{"q": "A well-known stock has fallen 70%.", "situation": "It looks 'cheaper than ever'. What do you do?", "why": "Real value means a low price relative to a healthy business. A low price relative to a broken business is a trap.", "options": [{"label": "Buy — it's a bargain!", "fb": "A low price isn't a discount. The business may be broken — and that's a value trap that will keep falling."}, {"label": "First check whether revenue and profits are still healthy", "fb": "Exactly. 'Cheap' only means something if the business itself is sound. A price without context is just a number."}, {"label": "Buy double to 'average down'", "fb": "Averaging into a dying business means throwing more money after bad. First confirm the thesis still holds."}]}}},
  {t:"quiz",q:"מהי 'מלכודת ערך'?",o:["מניה יקרה","מניה שנראית זולה אך העסק שלה מתדרדר","קרן מדד","סוג של אג\"ח"],a:1,why:"היא מפתה בזול המדומה וממשיכה לרדת. תמיד בדוק את בריאות העסק, לא רק את המחיר.",
   mentor:{why:"חשבת שמחיר נמוך = מציאה. אבל לפעמים המחיר נמוך כי העסק באמת גוסס.",
    analogy:"דירה בחצי מחיר נשמעת מעולה — עד שמגלים שהבניין מיועד להריסה. הזול היה מוצדק.",
    q:"מניה במכפיל 4 (זול מאוד). הרווחים יורדים 5 שנים ברציפות. מה זה?",
    o:["מציאה — לקנות מיד","כנראה מלכודת ערך — זול כי העסק מתדרדר","טעות של השוק","מניית צמיחה"],a:1,
    hint:"למה השוק מתמחר אותה כל כך נמוך? הוא יודע משהו?",
    ok:"בדיוק. זול צריך להיות זול *ביחס לעסק בריא* — לא זול כי העסק גוסס."},tr:{en:{"q": "What is a 'value trap'?", "o": ["An expensive stock", "A stock that looks cheap but whose business is deteriorating", "An index fund", "A type of bond"], "why": "It lures you in with apparent cheapness and keeps falling. Always check the health of the business, not just the price.", "mentor": {"why": "You assumed a low price means a bargain. But sometimes the price is low precisely because the business is dying.", "analogy": "An apartment at half price sounds wonderful — until you discover the building is scheduled for demolition. The cheapness was justified.", "q": "A stock trades at a multiple of 4 (very cheap). Its earnings have fallen five years running. What is it?", "o": ["A bargain — buy immediately", "Probably a value trap — cheap because the business is deteriorating", "A market mistake", "A growth stock"], "hint": "Why is the market pricing it so low? Does it know something?", "ok": "Exactly. Cheap has to mean cheap *relative to a healthy business* — not cheap because the business is dying."}}}}
 ]}
]},
{id:"c8",ic:"🌐",title:"מאקרו וקריאת דוחות",desc:"ריבית, מחזורים, ואיך קוראים דוח כספי",tr:{en:{"title": "Macro and Financial Statements", "desc": "Interest rates, cycles, and how to read a company's numbers"}},lessons:[
 {id:"l81",ic:"🏦",title:"ריבית מזיזה הכל",tier:"beginner",tr:{en:{"title": "Interest rates move everything"}},steps:[
  {t:"hook",ic:"🌍",q:"למה העלאת ריבית מפילה מניות טכנולוגיה דווקא?",sub:"הקשר הזה שולט בשווקים — וכמעט אף אחד לא מסביר אותו.",cta:"בוא נגלה →",tr:{en:{"q": "Why does a rate hike hit technology stocks hardest of all?", "sub": "This relationship rules markets — and almost nobody explains it.", "cta": "Let's find out →"}}},
  {t:"card",art:"cycle",ic:"🏦",h:"הכוח הגדול בשווקים",p:"ריבית היא 'מחיר הכסף'. כשהבנק המרכזי מעלה ריבית — הלוואות מתייקרות, חברות צומחות לאט, ומניות צמיחה/טק נלחצות. כשהוא מוריד — ההפך. באפליקציה תראה 'משטר מאקרו' משתנה שמזיז את השוק בזמן אמת.",tr:{en:{"h": "The great force in markets", "p": "Interest is the price of money. When the central bank raises rates, borrowing gets more expensive, companies grow more slowly, and growth and tech stocks come under pressure. When it cuts, the reverse. In the app you'll see a shifting 'macro regime' that moves the market in real time."}}},
  {t:"scenario",q:"הבנק המרכזי מעלה ריבית באופן חד.",situation:"אילו נכסים צפויים להיפגע הכי הרבה, ואילו להחזיק טוב יותר?",
   options:[
    {label:"טק וצמיחה נפגעים, בנקים וערך מחזיקים טוב יותר",verdict:"good",fb:"בדיוק. מניות צמיחה מתומחרות על רווחי עתיד — ריבית גבוהה מוזילה אותם. בנקים דווקא מרוויחים ממרווחי ריבית."},
    {label:"הכל עולה יחד",verdict:"bad",fb:"ריבית משפיעה שונה על כל סקטור. זה בדיוק העניין — לא הכל זז יחד."},
    {label:"רק זהב מושפע",verdict:"bad",fb:"ההשפעה רחבה: טק, נדל\"ן, אג\"ח ובנקים כולם מגיבים לריבית, כל אחד אחרת."}],
   why:"ריבית עולה = לחץ על נכסי 'צמיחה ארוכת-טווח' (טק, נדל\"ן, קריפטו) ורוח גבית לבנקים. שים לב איך המשטר באפליקציה משנה את הגרפים.",tr:{en:{"q": "The central bank raises rates sharply.", "situation": "Which assets are likely to suffer most, and which should hold up better?", "why": "Rising rates mean pressure on long-duration growth assets (tech, real estate, crypto) and a tailwind for banks. Watch how the regime in the app changes the charts.", "options": [{"label": "Tech and growth suffer, banks and value hold up better", "fb": "Exactly. Growth stocks are priced on future earnings — high rates discount those downward. Banks actually benefit from wider interest margins."}, {"label": "Everything rises together", "fb": "Rates affect each sector differently. That's precisely the point — not everything moves together."}, {"label": "Only gold is affected", "fb": "The effect is broad: tech, real estate, bonds and banks all respond to rates, each in its own way."}]}}},
  {t:"quiz",q:"כשהריבית עולה, מניות צמיחה נוטות...",o:["לעלות חזק","לרדת/להילחץ","לא להגיב","להפוך לאג\"ח"],a:1,why:"שוויין נשען על רווחי עתיד רחוקים — ריבית גבוהה 'מהוונת' אותם כלפי מטה.",tr:{en:{"q": "When rates rise, growth stocks tend to...", "o": ["Rise sharply", "Fall or come under pressure", "Not react", "Turn into bonds"], "why": "Their value rests on distant future earnings — high rates discount those downward."}}},
 
  {t:"sim",asset:"🌍 תיק בסביבת ריבית",start:10000,
   why:"זה הקשר שמסביר חצי מהתנועות בשוק: ריבית עולה = כסף יקר = מניות צמיחה נפגעות ואג\"ח נעשה אטרקטיבי. ריבית יורדת = ההפך. אתה לא צריך לנבא את הריבית — אבל אתה חייב להבין מה היא עושה לתיק שלך.",
   events:[
    {ic:"📈",t:"הריבית מזנקת",good:false,news:"הבנק המרכזי מעלה ריבית חדות כדי לרסן אינפלציה. מניות הטק צונחות.",
     opts:[{l:"מוכר הכל בפאניקה",r:-.22,fb:"מכרת בתחתית. שינוי ריבית הוא מחזורי — לא סוף העולם."},
      {l:"מבין את הקשר, מאזן לכיוון ערך ואג\"ח",r:-.05,good:true,fb:"נכון. הבנת את המנגנון וספגת הרבה פחות."}]},
    {ic:"💸",t:"אינפלציה שוחקת",good:false,news:"האינפלציה 6%. המזומן שלך מאבד כוח קנייה בשקט.",
     opts:[{l:"מחזיק הכל במזומן — 'בטוח'",r:-.06,fb:"מזומן אינו בטוח באינפלציה. אתה מפסיד 6% בשנה, בוודאות."},
      {l:"מחזיק נכסים ריאליים שמייצרים ערך",r:.04,good:true,fb:"בדיוק. מניות ונדל\"ן מתמחרים מחדש — מזומן לא."}]},
    {ic:"📉",t:"הריבית יורדת",good:true,news:"האינפלציה נרגעת, הריבית יורדת. הכסף נעשה זול שוב.",
     opts:[{l:"נשאר מפוזר לפי התוכנית",r:.20,good:true,fb:"מצוין. נכחת כשהשוק התאושש — כי לא נמחקת בדרך."},
      {l:"קופץ להכל-טק עכשיו",r:.08,fb:"שוב רודף אחרי הגל האחרון, אחרי שכבר עלה."}]}],tr:{en:{"asset": "🌍 A portfolio in a rate environment", "why": "This relationship explains half the moves in markets: rates up means expensive money, which hurts growth stocks and makes bonds attractive. Rates down means the reverse. You don't need to forecast rates — but you must understand what they do to your portfolio.", "events": [{"t": "Rates spike", "news": "The central bank raises rates sharply to rein in inflation. Tech stocks plunge.", "opts": [{"l": "Panic and sell everything", "fb": "You sold at the bottom. A rate shift is cyclical — not the end of the world."}, {"l": "Understand the link, rebalance toward value and bonds", "fb": "Correct. You grasped the mechanism and absorbed far less damage."}]}, {"t": "Inflation erodes", "news": "Inflation is running at 6%. Your cash is quietly losing purchasing power.", "opts": [{"l": "Hold everything in cash — it's 'safe'", "fb": "Cash isn't safe under inflation. You're losing 6% a year, with certainty."}, {"l": "Hold real assets that produce value", "fb": "Exactly. Stocks and property reprice — cash doesn't."}]}, {"t": "Rates fall", "news": "Inflation cools and rates come down. Money is cheap again.", "opts": [{"l": "Stay diversified, per the plan", "fb": "Excellent. You were present when the market recovered — because you weren't wiped out along the way."}, {"l": "Jump into all-tech now", "fb": "Chasing the last wave again, after it has already risen."}]}]}}},
  {t:"summary",h:"מה למדת",points:["ריבית עולה = כסף יקר = מניות צמיחה נפגעות","ריבית יורדת = כסף זול = השוק חוגג","אינפלציה שוחקת מזומן — לכן מחזיקים נכסים","מאקרו לא מנבא מחר, אבל מסביר את הכיוון"],tr:{en:{"h": "What you learned", "points": ["Rates up = expensive money = growth stocks suffer", "Rates down = cheap money = the market celebrates", "Inflation erodes cash — which is why you hold assets", "Macro doesn't predict tomorrow, but it explains the direction"]}}}]},
 {id:"l82",ic:"🔄",title:"מחזורי שוק",tier:"beginner",tr:{en:{"title": "Market cycles"}},steps:[
  {t:"card",art:"cycle",ic:"🔄",h:"הכל נע במעגל",p:"כלכלה ושוק נעים במחזור: צמיחה → שיא/אופוריה → האטה/מיתון → התאוששות → ושוב. אף שלב לא נצחי. מי שמבין באיזה שלב נמצאים — פחות מופתע ופחות נבהל.",tr:{en:{"h": "Everything moves in a circle", "p": "Economies and markets move in a cycle: growth → peak and euphoria → slowdown and recession → recovery → and round again. No stage lasts forever. Those who understand which stage they're in are less surprised and less easily panicked."}}},
  {t:"sort",q:"סדר את שלבי המחזור לפי הסדר הטבעי שלהם (1→4).",
