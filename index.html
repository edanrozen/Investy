   items:[{label:"🌱 צמיחה",rank:1},{label:"🚀 שיא / אופוריה",rank:2},{label:"🐻 האטה / מיתון",rank:3},{label:"🌤️ התאוששות",rank:4}],
   why:"אחרי כל שיא מגיעה האטה, ואחרי כל תחתית מגיעה התאוששות. זו מחזוריות — לא סוף העולם ולא גן עדן נצחי.",tr:{en:{"q": "Put the stages of the cycle in their natural order (1→4).", "items": [{"label": "🌱 Growth"}, {"label": "🚀 Peak / euphoria"}, {"label": "🐻 Slowdown / recession"}, {"label": "🌤️ Recovery"}], "why": "After every peak comes a slowdown, and after every bottom comes a recovery. It's a cycle — neither the end of the world nor eternal paradise."}}},
  {t:"quiz",q:"מתי הכי מסוכן, פסיכולוגית?",o:["בהאטה","בשיא/אופוריה כשכולם בטוחים","בהתאוששות","בצמיחה"],a:1,why:"באופוריה הביטחון מקסימלי והמחירים מנופחים — בדיוק שם נבנות בועות.",tr:{en:{"q": "When is it most dangerous, psychologically?", "o": ["During a slowdown", "At the peak / euphoria, when everyone feels certain", "During a recovery", "During growth"], "why": "In euphoria, confidence is at its maximum and prices are inflated — that's exactly where bubbles are built."}}}
 ]},
 {id:"l83",ic:"📄",title:"קריאת דוח רווח והפסד",tier:"intermediate",tr:{en:{"title": "Reading an income statement"}},steps:[
  {t:"card",art:"pe",ic:"📄",h:"3 שורות, סיפור אחד",p:"דוח רווח והפסד יורד מלמעלה למטה: הכנסות (כמה נכנס) → פחות עלויות והוצאות → שווה רווח נקי (מה נשאר). זה הבסיס לכל הערכת שווי.",tr:{en:{"h": "Three lines, one story", "p": "An income statement flows from top to bottom: revenue (what came in) → less costs and expenses → equals net profit (what remained). That's the foundation of every valuation."}}},
  {t:"statement",company:"נוטרי-פוד · דוח רווח והפסד (שנתי)",
   rows:[{k:"הכנסות",v:1000},{k:"עלות המכר",v:-550},{k:"הוצאות תפעול",v:-250},{k:"רווח נקי",v:200,bold:true}],
   q:"מהו הרווח הנקי של החברה?",o:["₪1,000M","₪800M","₪200M","₪550M"],a:2,why:"רווח נקי = הכנסות פחות כל העלויות: 1000 − 550 − 250 = 200 מיליון ₪.",tr:{en:{"q": "What is the company's net profit?", "company": "Nutri-Food · Income statement (annual)", "o": ["₪1,000M", "₪800M", "₪200M", "₪550M"], "rows": [{"k": "Revenue", "v": 1000}, {"k": "Cost of goods sold", "v": -550}, {"k": "Operating expenses", "v": -250}, {"k": "Net profit", "v": 200, "bold": true}], "why": "Net profit = revenue less all costs: 1,000 − 550 − 250 = ₪200 million."}}},
  {t:"statement",company:"טק-נובה · דוח רווח והפסד (שנתי)",
   rows:[{k:"הכנסות",v:2000},{k:"עלות המכר",v:-800},{k:"רווח גולמי",v:1200,bold:true},{k:"הוצאות תפעול",v:-700},{k:"רווח נקי",v:500,bold:true}],
   q:"מהו הרווח הגולמי (הכנסות פחות עלות המכר)?",o:["₪2,000M","₪1,200M","₪500M","₪700M"],a:1,why:"רווח גולמי = הכנסות − עלות המכר = 2000 − 800 = 1,200 מיליון ₪. ממנו מורידים הוצאות תפעול כדי להגיע לרווח הנקי.",tr:{en:{"q": "What is the gross profit (revenue less cost of goods sold)?", "company": "Tech-Nova · Income statement (annual)", "o": ["₪2,000M", "₪1,200M", "₪500M", "₪700M"], "rows": [{"k": "Revenue", "v": 2000}, {"k": "Cost of goods sold", "v": -800}, {"k": "Gross profit", "v": 1200, "bold": true}, {"k": "Operating expenses", "v": -700}, {"k": "Net profit", "v": 500, "bold": true}], "why": "Gross profit = revenue − cost of goods sold = 2,000 − 800 = ₪1,200 million. Operating expenses are then deducted to reach net profit."}}},
  {t:"quiz",q:"למה חברה יכולה להראות רווח ועדיין להיקלע לצרות?",o:["אי אפשר","אם אין לה מזומן בפועל (תזרים שלילי)","רק אם אין לה עובדים","בגלל צבע הלוגו"],a:1,why:"רווח חשבונאי אינו מזומן. חברה יכולה 'להרוויח על הנייר' ולפשוט רגל אם אין לה כסף נזיל — לכן קוראים גם את דוח התזרים.",tr:{en:{"q": "Why can a company show a profit and still get into trouble?", "o": ["It can't", "If it has no actual cash (negative cash flow)", "Only if it has no employees", "Because of its logo colour"], "why": "Accounting profit isn't cash. A company can 'profit on paper' and go bankrupt without liquid money — which is why you also read the cash flow statement."}}}
 ]},
 {id:"l84",ic:"🏷️",title:"מכפיל בפעולה",tier:"advanced",tr:{en:{"title": "The multiple in action"}},steps:[
  {t:"card",art:"cycle",ic:"🏷️",h:"מחברים הכל יחד",p:"עכשיו שאתה יודע לקרוא רווח — מכפיל הרווח (P/E) פשוט לוקח את המחיר ומחלק ברווח למניה. הוא הופך 'יקר/זול' למספר בר-השוואה בין חברות.",tr:{en:{"h": "Putting it all together", "p": "Now that you can read profit, the P/E ratio simply takes the price and divides by earnings per share. It turns 'expensive or cheap' into a number you can compare across companies."}}},
  {t:"statement",company:"בנק אטלס · תמצית",
   rows:[{k:"רווח למניה (EPS)",v:6},{k:"מחיר המניה",v:60,bold:true}],
   q:"מהו מכפיל הרווח (P/E)? (מחיר ÷ רווח למניה)",o:["6","10","60","360"],a:1,why:"P/E = 60 ÷ 6 = 10. מכפיל נמוך יחסית — אופייני לבנקים ולמניות ערך.",tr:{en:{"q": "What is the P/E ratio? (price ÷ earnings per share)", "company": "Atlas Bank · Summary", "o": ["6", "10", "60", "360"], "rows": [{"k": "Earnings per share (EPS)", "v": 6}, {"k": "Share price", "v": 60, "bold": true}], "why": "P/E = 60 ÷ 6 = 10. A relatively low multiple — typical of banks and value stocks."}}},
  {t:"quiz",q:"בין שתי חברות דומות, מכפיל 10 מול מכפיל 40. מה זה אומר?",o:["ה-40 תמיד עדיפה","על ה-40 משלמים הרבה יותר יקר יחסית לרווח","הן זהות","ה-10 פושטת רגל"],a:1,why:"מכפיל גבוה = מחיר יקר יחסית לרווח הנוכחי, על סמך ציפיות צמיחה. אם הצמיחה לא תגיע — הנפילה כואבת.",tr:{en:{"q": "Between two similar companies, a multiple of 10 versus a multiple of 40. What does that tell you?", "o": ["The 40 is always better", "You're paying far more for the 40 relative to its earnings", "They're identical", "The 10 is going bankrupt"], "why": "A high multiple means an expensive price relative to current earnings, based on growth expectations. If that growth doesn't arrive, the fall is painful."}}}
 ]}
]},
{id:"c9",ic:"🎯",title:"איך מתחילים באמת",desc:"פקודות, ברוקר, והפקדה קבועה",tr:{en:{"title": "How to Actually Start", "desc": "Orders, brokers, and investing on a schedule"}},lessons:[
 {id:"l91",ic:"🕹️",title:"פקודות קנייה ומכירה",tier:"beginner",tr:{en:{"title": "Buy and sell orders"}},steps:[
  {t:"hook",ic:"🚀",q:"יש לך ₪1,000. מה הצעד הראשון — באמת?",sub:"לא מניה. לא קריפטו. משהו אחר לגמרי.",cta:"בוא נגלה →",tr:{en:{"q": "You have ₪1,000. What's the first step — really?", "sub": "Not a stock. Not crypto. Something else entirely.", "cta": "Let's find out →"}}},
  {t:"card",art:"support",ic:"🕹️",h:"פקודת שוק מול לימיט",p:"פקודת שוק = 'קנה עכשיו במחיר הנוכחי' — מהיר, אבל אתה מקבל מה שיש. פקודת לימיט = 'קנה רק אם המחיר יגיע ל-X' — אתה שולט במחיר, אבל אולי לא תתבצע.",tr:{en:{"h": "Market orders versus limit orders", "p": "A market order says 'buy now at the current price' — fast, but you take whatever is available. A limit order says 'buy only if the price reaches X' — you control the price, but it might never execute."}}},
  {t:"quiz",q:"רוצה לקנות מיד, לא משנה המחיר המדויק. איזו פקודה?",o:["פקודת לימיט","פקודת שוק","סטופ-לוס","פקודת המתנה"],a:1,why:"פקודת שוק מתבצעת מיד במחיר הזמין. לימיט ממתינה למחיר שקבעת.",tr:{en:{"q": "You want to buy immediately, whatever the exact price. Which order?", "o": ["A limit order", "A market order", "A stop-loss", "A pending order"], "why": "A market order executes immediately at the available price. A limit order waits for the price you set."}}},
  {t:"card",art:"exitplan",ic:"🛑",h:"סטופ-לוס — רשת ביטחון",p:"פקודת סטופ-לוס מוכרת אוטומטית אם המחיר יורד מתחת לגבול שהגדרת. היא מגבילה הפסד מראש — אבל בשוק תנודתי היא יכולה 'להיזרק' בירידה זמנית.",tr:{en:{"h": "Stop-loss — a safety net", "p": "A stop-loss order sells automatically if the price falls below a threshold you set. It caps your loss in advance — but in a volatile market it can be triggered by a temporary dip."}}},
  {t:"scenario",q:"אתה מאמין במניה אבל רוצה להגן על עצמך מהפסד גדול.",situation:"המניה ב-100. איך תגן על ההשקעה?",
   options:[
    {label:"סטופ-לוס ב-85 — הפסד מקסימלי מוגבל ל-15%",verdict:"good",fb:"נכון. הגדרת מראש כמה אתה מוכן להפסיד — לפני שהרגש נכנס לתמונה."},
    {label:"בלי כלום, אמכור כשארגיש",verdict:"bad",fb:"'ארגיש' = החלטה רגשית תחת לחץ. בלי גבול מוגדר מראש, פאניקה תחליט במקומך."},
    {label:"קונה כפול אם יורד, בלי גבול",verdict:"bad",fb:"מיצוע בלי תוכנית = לזרוק עוד כסף בלי לדעת מתי לעצור."}],
   why:"משקיע טוב מחליט מראש מה הרף — לא באמצע הנפילה. סטופ-לוס הוא משמעת, לא נבואה.",tr:{en:{"q": "You believe in a stock but want to protect yourself from a large loss.", "situation": "The stock is at 100. How will you protect the investment?", "why": "A good investor decides the threshold in advance — not mid-fall. A stop-loss is discipline, not prophecy.", "options": [{"label": "A stop-loss at 85 — maximum loss capped at 15%", "fb": "Correct. You defined in advance how much you're willing to lose — before emotion enters the picture."}, {"label": "Nothing, I'll sell when it feels right", "fb": "'Feels right' is an emotional decision under pressure. Without a predefined limit, panic decides for you."}, {"label": "Buy double if it falls, with no limit", "fb": "Averaging without a plan means throwing in more money with no idea when to stop."}]}}},
  {t:"quiz",q:"פקודת לימיט לקנייה מבטיחה ש...",o:["תמיד תתבצע","תתבצע רק במחיר שקבעת או טוב יותר","המחיר יעלה","אין עמלה"],a:1,why:"לימיט שולטת במחיר אך לא מבטיחה ביצוע — אם המחיר לא הגיע, הפקודה ממתינה.",tr:{en:{"q": "A limit buy order guarantees that...", "o": ["It will always execute", "It will only execute at your price or better", "The price will rise", "There's no commission"], "why": "A limit order controls the price but doesn't guarantee execution — if the price never arrives, the order simply waits."}}},
 
  {t:"summary",h:"מה למדת",points:["פתח חשבון בברוקר מפוקח, לא באפליקציה אקראית","התחל בקרן מדד רחבה — לא במניה בודדת","DCA: סכום קבוע כל חודש. אל תנסה לתזמן","אל תשקיע כסף שתצטרך בשנתיים הקרובות"],tr:{en:{"h": "What you learned", "points": ["Open an account with a regulated broker, not a random app", "Start with a broad index fund — not a single stock", "DCA: a fixed amount every month. Don't try to time it", "Never invest money you'll need within two years"]}}}]},
 {id:"l92",ic:"💧",title:"מרווח, נזילות וברוקר",tier:"intermediate",tr:{en:{"title": "Spread, liquidity and brokers"}},steps:[
  {t:"card",art:"feebite",ic:"↔️",h:"מרווח קנייה-מכירה (Spread)",p:"תמיד יש פער קטן בין המחיר שקונים מוכנים לשלם (Bid) למחיר שמוכרים דורשים (Ask). הפער הזה הוא עלות נסתרת — במיוחד בנכסים לא נזילים.",tr:{en:{"h": "The bid-ask spread", "p": "There's always a small gap between what buyers will pay (the bid) and what sellers demand (the ask). That gap is a hidden cost — especially in illiquid assets."}}},
  {t:"quiz",q:"מרווח (spread) גדול בדרך כלל מעיד על...",o:["נכס פופולרי מאוד","נכס לא נזיל / מסחר דליל","רווח מובטח","עמלה נמוכה"],a:1,why:"כשמעטים סוחרים בנכס, הפער בין קונים למוכרים גדל — וזה עולה לך בכל עסקה.",tr:{en:{"q": "A large spread usually indicates...", "o": ["A very popular asset", "An illiquid asset / thin trading", "A guaranteed profit", "A low commission"], "why": "When few people trade an asset, the gap between buyers and sellers widens — and it costs you on every transaction."}}},
  {t:"card",art:"volume",ic:"💧",h:"נזילות = קלות יציאה",p:"נזילות היא כמה קל לקנות או למכור בלי להזיז את המחיר. מדד רחב = נזיל מאוד. מניה קטנה או נכס אקזוטי = קשה למכור בדיוק כשצריך.",tr:{en:{"h": "Liquidity = ease of exit", "p": "Liquidity is how easily you can buy or sell without moving the price. A broad index is highly liquid. A small-cap stock or an exotic asset can be hard to sell exactly when you need to."}}},
  {t:"card",art:"negotiate",ic:"🏦",h:"איך בוחרים ברוקר",p:"שלושה דברים לבדוק: עמלות (קנייה, מכירה, המרת מט\"ח), רגולציה ופיקוח (ברוקר מפוקח = כספך מוגן יותר), וממשק פשוט. אל תבחר ברוקר לפי פרסומת נוצצת.",tr:{en:{"h": "How to choose a broker", "p": "Three things to check: fees (buying, selling, currency conversion), regulation and oversight (a regulated broker means your money is better protected), and a simple interface. Don't pick a broker because of a glossy advert."}}},
  {t:"quiz",q:"מה הכי חשוב לבדוק בברוקר?",o:["צבע האפליקציה","עמלות ורגולציה","כמה עוקבים יש לו","מתנת הצטרפות"],a:1,why:"עמלות אוכלות תשואה לאורך זמן, ורגולציה מגנה על הכסף שלך. פרסום ומתנות לא רלוונטיים.",tr:{en:{"q": "What matters most when choosing a broker?", "o": ["The app's colour scheme", "Fees and regulation", "How many followers it has", "The sign-up bonus"], "why": "Fees eat returns over time, and regulation protects your money. Advertising and gifts are irrelevant."}}},
 
  {t:"flip",q:"4 מונחים שכל מתחיל חייב להכיר. הקש לגלות:",
   cards:[{ic:"↔️",t:"מרווח (Spread)",b:"הפער בין מחיר הקנייה למחיר המכירה. זו עלות נסתרת שאתה משלם בכל עסקה."},
    {ic:"💧",t:"נזילות",b:"כמה קל למכור בלי להזיז את המחיר. נכס לא נזיל = תיתקע איתו."},
    {ic:"🏦",t:"ברוקר",b:"המתווך שדרכו אתה קונה. חייב להיות מפוקח — אחרת הכסף שלך לא מוגן."},
    {ic:"📋",t:"פקודת לימיט",b:"קונה רק במחיר שקבעת. שולט בעלות — במקום לתת לשוק להחליט בשבילך."}],tr:{en:{"q": "4 terms every beginner must know. Tap to reveal:", "cards": [{"t": "Spread", "b": "The gap between the buying price and the selling price. It's a hidden cost you pay on every transaction."}, {"t": "Liquidity", "b": "How easily you can sell without moving the price. An illiquid asset means you'll be stuck with it."}, {"t": "Broker", "b": "The intermediary you buy through. It must be regulated — otherwise your money isn't protected."}, {"t": "Limit order", "b": "Buys only at the price you set. You control the cost, instead of letting the market decide for you."}]}}}]},
 {id:"l93",ic:"📅",title:"הפקדה קבועה (DCA)",tier:"advanced",tr:{en:{"title": "Investing on a schedule (DCA)"}},steps:[
  {t:"card",art:"movingavg",ic:"📅",h:"סכום קבוע, כל חודש",p:"הפקדה קבועה (Dollar-Cost Averaging) = להשקיע סכום קבוע במועד קבוע, בלי קשר למחיר. כשיקר קונים פחות יחידות, כשזול — יותר. התוצאה: ממוצעים את המחיר ומנטרלים את הצורך לתזמן.",tr:{en:{"h": "A fixed amount, every month", "p": "Dollar-cost averaging means investing a fixed amount on a fixed date, regardless of price. When it's expensive you buy fewer units; when it's cheap, more. The result: you average out the price and remove any need to time the market."}}},
  {t:"predict",q:"איזה אחוז ממנהלי ההשקעות המקצועיים מצליחים לתזמן את השוק (להיכנס ולצאת בזמן) לאורך שנים?",min:0,max:60,step:5,unit:"%",answer:10,tol:12,
   reveal:"מיעוט קטן — ולרוב לא באופן עקבי.",why:"אם המקצוענים כמעט לא מצליחים לתזמן — למתחיל אין סיכוי. לכן הפקדה קבועה מנצחת: היא לא דורשת לנחש.",tr:{en:{"q": "What percentage of professional fund managers successfully time the market (getting in and out at the right moments) over many years?", "unit": "%", "reveal": "A small minority — and rarely with any consistency.", "why": "If the professionals barely manage to time markets, a beginner has no chance. That's why regular investing wins: it doesn't require guessing."}}},
  {t:"scenario",q:"קיבלת בונוס גדול. השוק בשיא כל הזמנים ואתה חושש.",situation:"איך להשקיע אותו?",
   options:[
    {label:"לפרוס להפקדות קבועות על פני כמה חודשים",verdict:"good",fb:"פריסה מקטינה את החרטה אם השוק יורד מיד, ומרגיעה את הראש — כך שתישאר במשחק."},
    {label:"לחכות 'עד שירד' עם כל הכסף במזומן",verdict:"bad",fb:"תזמון שוק. השוק יכול להמשיך לעלות חודשים — ואתה מפסיד תשואה בזמן שהמזומן נשחק."},
    {label:"להשקיע הכל ברגע אחד במניה אחת חמה",verdict:"bad",fb:"גם תזמון וגם ריכוזיות. שילוב מסוכן במיוחד בשיא."}],
   why:"אין תשובה 'מושלמת' לתזמון — ולכן שיטה קבועה שמנטרלת רגש עדיפה על ניחוש.",tr:{en:{"q": "You've received a large bonus. The market is at an all-time high and you're nervous.", "situation": "How should you invest it?", "why": "There's no 'perfect' answer to timing — which is why a fixed method that removes emotion beats guesswork.", "options": [{"label": "Spread it into regular deposits over several months", "fb": "Spreading reduces regret if the market falls immediately, and settles your mind — so you stay in the game."}, {"label": "Wait 'until it drops' with everything in cash", "fb": "That's market timing. The market can keep rising for months — and you lose returns while your cash erodes."}, {"label": "Put it all into one hot stock at once", "fb": "That's both timing and concentration. A particularly dangerous combination at a peak."}]}}},
  {t:"quiz",q:"היתרון הפסיכולוגי הגדול של הפקדה קבועה:",o:["מבטיחה רווח","מסירה את הצורך לתזמן ולנחש","מכפילה כסף","חוסכת מס"],a:1,why:"היא הופכת השקעה מהחלטה מלחיצה כל פעם — להרגל אוטומטי ורגוע.",tr:{en:{"q": "The great psychological advantage of investing on a schedule:", "o": ["It guarantees a profit", "It removes the need to time and guess", "It doubles your money", "It saves tax"], "why": "It turns investing from a stressful decision each time into a calm, automatic habit."}}}
 ]}
]},
{id:"c10",ic:"🧾",title:"מיסים, עמלות ועלויות",desc:"מה באמת נשאר לך ביד",tr:{en:{"title": "Tax, Fees and Costs", "desc": "What actually ends up in your pocket"}},lessons:[
 {id:"l101",ic:"💸",title:"עמלות שוחקות בשקט",tier:"beginner",tr:{en:{"title": "Fees erode quietly"}},steps:[
  {t:"hook",ic:"🏛️",q:"הרווחת ₪10,000 בשוק. כמה באמת נשאר לך?",sub:"המדינה שותפה שלך. כדאי לדעת בכמה.",cta:"בוא נגלה →",tr:{en:{"q": "You made ₪10,000 in the market. How much actually stays with you?", "sub": "The state is your partner. It's worth knowing by how much.", "cta": "Let's find out →"}}},
  {t:"card",art:"fees",ic:"💸",h:"3 סוגי עלויות",p:"בכל השקעה משלמים: עמלת קנייה/מכירה (לברוקר), דמי ניהול (לקרן), והמרווח (spread). כל אחת נשמעת זעירה — יחד, לאורך שנים, הן חותכות נתח רציני.",tr:{en:{"h": "Three kinds of cost", "p": "Every investment carries costs: buying and selling commissions (to the broker), management fees (to the fund), and the spread. Each sounds trivial on its own — together, over years, they take a serious bite."}}},
  {t:"predict",q:"שני משקיעים זהים, אחד משלם 0.1% דמי ניהול והשני 1.1%. אחרי 30 שנה, כמה אחוז מהתיק הסופי 'אכלו' דמי הניהול הגבוהים יותר?",min:5,max:40,step:5,unit:"%",answer:25,tol:12,
   reveal:"בסביבות רבע מהתיק — עשרות אלפי שקלים.",why:"1% נשמע קטן, אבל הוא נלקח כל שנה מהסכום שגדל — האפקט המצטבר עצום. תמיד השווה דמי ניהול.",tr:{en:{"q": "Two identical investors, one paying 0.1% in management fees and the other 1.1%. After 30 years, what percentage of the final portfolio did the higher fees consume?", "unit": "%", "reveal": "Around a quarter of the portfolio — tens of thousands of shekels.", "why": "One percent sounds small, but it's taken every year from a growing sum — the cumulative effect is enormous. Always compare management fees."}}},
  {t:"quiz",q:"למה דמי ניהול של 1% מסוכנים לטווח ארוך?",o:["הם לא","הם נלקחים כל שנה ומצטברים לסכום עצום","הם חד-פעמיים","הם פטורים ממס"],a:1,why:"העלות מצטברת שנה אחר שנה על סכום שגדל — ולכן הופכת לנתח ענק בטווח הארוך.",tr:{en:{"q": "Why is a 1% management fee dangerous over the long run?", "o": ["It isn't", "It's charged every year and compounds into an enormous sum", "It's a one-off charge", "It's tax-exempt"], "why": "The cost accumulates year after year on a growing balance — which makes it a huge slice over the long term."}}},
 
  {t:"predict",q:"שתי קרנות זהות. אחת גובה 0.1% דמי ניהול, השנייה 1.1%. על ₪100,000 במשך 30 שנה (8% תשואה) — כמה יותר יישאר לך בקרן הזולה?",
   min:0,max:500,step:25,unit:"אלף ₪",answer:250,tol:90,
   reveal:"בערך ₪250,000 יותר — רבע מיליון שקל. על אחוז אחד בשנה.",
   why:"עמלות נראות זניחות כי הן קטנות ורציפות. על 30 שנה, אחוז אחד שווה מכונית ודירת נופש.",tr:{en:{"q": "Two identical funds. One charges 0.1% in management fees, the other 1.1%. On ₪100,000 over 30 years (at an 8% return), how much more will you keep in the cheaper fund?", "unit": "thousand ₪", "reveal": "Roughly ₪250,000 more — a quarter of a million shekels. For one percent a year.", "why": "Fees look negligible because they're small and continuous. Over 30 years, a single percent is worth a car and a holiday home."}}},
  {t:"summary",h:"מה למדת",points:["מס רווחי הון נגבה על הרווח בעת מכירה","עמלות ומיסים אוכלים נתח משמעותי לאורך שנים","דחיית מכירה = דחיית מס = יותר כסף שממשיך לעבוד","תמיד חשב תשואה נטו — אחרי מס ועמלות"],tr:{en:{"h": "What you learned", "points": ["Capital gains tax is charged on your profit when you sell", "Fees and taxes consume a meaningful slice over the years", "Deferring a sale defers the tax — leaving more money working for you", "Always calculate net returns — after tax and fees"]}}}]},
 {id:"l102",ic:"🏛️",title:"מס על רווחי הון",tier:"intermediate",tr:{en:{"title": "Capital gains tax"}},steps:[
  {t:"card",art:"feebite",ic:"🏛️",h:"ברוטו מול נטו",p:"על רווח מהשקעות משלמים מס רווחי הון (בישראל — בדרך כלל 25% על הרווח הריאלי). כלומר: מה שאתה 'מרוויח על הנייר' אינו מה שנשאר בכיס. תמיד תחשוב במונחי נטו. (חינוך כללי, לא ייעוץ מס.)",tr:{en:{"h": "Gross versus net", "p": "Profits from investments are subject to capital gains tax (in Israel, generally 25% on the real gain). In other words, what you 'earn on paper' isn't what stays in your pocket. Always think in net terms. (General education, not tax advice.)"}}},
  {t:"statement",company:"חישוב רווח נטו · עסקה לדוגמה",
   rows:[{k:"רווח מהמכירה",v:1000},{k:"מס רווחי הון (25%)",v:-250},{k:"רווח נטו ביד",v:750,bold:true}],
   q:"מהו הרווח שנשאר לך ביד אחרי מס?",o:["₪1,000","₪250","₪750","₪500"],a:2,why:"רווח ₪1,000 פחות 25% מס = ₪750 נטו. תמיד חשב את הנטו — לא רק את הרווח 'על הנייר'.",tr:{en:{"q": "What profit actually remains after tax?", "company": "Net profit calculation · Sample transaction", "o": ["₪1,000", "₪250", "₪750", "₪500"], "rows": [{"k": "Profit on the sale", "v": 1000}, {"k": "Capital gains tax (25%)", "v": -250}, {"k": "Net profit in hand", "v": 750, "bold": true}], "why": "A ₪1,000 profit less 25% tax leaves ₪750 net. Always work out the net figure — not just the profit 'on paper'."}}},
  {t:"card",art:"compound",ic:"⏳",h:"היתרון של לא למכור",p:"כל עוד לא מכרת — לא שילמת מס. הכסף שהיה הולך למס ממשיך לעבוד בשבילך ולצבור ריבית דריבית. זו עוד סיבה חזקה לא לסחור יותר מדי.",tr:{en:{"h": "The advantage of not selling", "p": "As long as you haven't sold, you haven't paid tax. The money that would have gone to tax keeps working for you and compounding. That's another strong reason not to trade too much."}}},
  {t:"quiz",q:"מתי בדרך כלל משלמים מס רווחי הון?",o:["בכל יום","רק כשמוכרים ומממשים רווח","כשקונים","אף פעם"],a:1,why:"המס חל על מימוש הרווח. עד שלא מכרת — הרווח 'על הנייר' והמס נדחה, לטובתך.",tr:{en:{"q": "When is capital gains tax generally paid?", "o": ["Every day", "Only when you sell and realise a gain", "When you buy", "Never"], "why": "The tax applies when the gain is realised. Until you sell, the profit is on paper and the tax is deferred — in your favour."}}}
 ,
  {t:"challenge",task:"היכנס לחשבון ההשקעות/פנסיה שלך ומצא את דמי הניהול שאתה משלם בפועל. רשום את המספר.",
   hint:"אם זה מעל 1% — יש לך מקום למשא ומתן. רוב האנשים פשוט לא מבקשים, ומשלמים על זה מאות אלפי שקלים.",tr:{en:{"task": "Log into your investment or pension account and find the management fee you're actually paying. Write the number down.", "hint": "If it's above 1%, you have room to negotiate. Most people simply never ask — and it costs them hundreds of thousands over a lifetime."}}}]},
 {id:"l103",ic:"🛡️",title:"מכשירים מוטבי מס",tier:"advanced",tr:{en:{"title": "Tax-advantaged accounts"}},steps:[
  {t:"card",art:"feebite",ic:"🛡️",h:"למה זה משנה",p:"יש מכשירי חיסכון ארוך-טווח עם הטבות מס (כמו קרן השתלמות, קופת גמל להשקעה או פנסיה — משתנה בין מדינות). ההטבה יכולה לשפר משמעותית את התשואה נטו לאורך שנים.",tr:{en:{"h": "Why it matters", "p": "There are long-term savings vehicles with tax advantages (such as a study fund, an investment provident fund, or a pension — the specifics vary by country). The benefit can meaningfully improve your net return over the years."}}},
  {t:"quiz",q:"מה היתרון המרכזי של מכשיר מוטב מס?",o:["רווח מובטח","שיפור התשואה נטו דרך הקלת מס","אין בו סיכון","הוא חינמי"],a:1,why:"פחות מס = יותר נשאר ומצטבר. זה לא מבטל סיכון שוק — אבל משפר את מה שנשאר ביד.",tr:{en:{"q": "What's the main advantage of a tax-advantaged vehicle?", "o": ["A guaranteed profit", "Improving your net return through tax relief", "It carries no risk", "It's free"], "why": "Less tax means more remains and compounds. It doesn't remove market risk — but it improves what you actually keep."}}},
  {t:"scenario",q:"חוסך לטווח ארוך (פנסיה) מול טווח קצר (חופשה בעוד שנה).",situation:"איפה מתאים מכשיר מוטב-מס ארוך טווח?",
   options:[
    {label:"לחיסכון הפנסיוני ארוך הטווח",verdict:"good",fb:"נכון. הטבות המס וההפקדה לטווח ארוך מתאימות בדיוק לכסף שלא צריך בקרוב."},
    {label:"לכסף לחופשה בעוד שנה",verdict:"bad",fb:"כסף לטווח קצר צריך להיות נזיל ובטוח — לא נעול במכשיר ארוך-טווח."}],
   why:"כלל אצבע: כסף שתצטרך בקרוב — נזיל ובטוח. כסף לעשורים — שם הטבות המס והשוק עובדים לטובתך.",tr:{en:{"q": "Saving for the long term (a pension) versus the short term (a holiday next year).", "situation": "Where does a long-term tax-advantaged vehicle fit?", "why": "A rule of thumb: money you'll need soon should be liquid and safe. Money for decades is where tax benefits and the market work in your favour.", "options": [{"label": "For long-term pension savings", "fb": "Correct. The tax benefits and long-term lock-in suit exactly the money you won't need soon."}, {"label": "For holiday money needed next year", "fb": "Short-term money needs to be liquid and safe — not locked into a long-term vehicle."}]}}}
 ]}
]},
{id:"c11",ic:"🧠",title:"הטיות התנהגותיות",desc:"המלכודות שהמוח מכין לך",tr:{en:{"title": "Behavioural Biases", "desc": "The traps your own mind sets for you"}},lessons:[
 {id:"l111",ic:"⚓",title:"עוגן וביטחון יתר",tier:"beginner",tr:{en:{"title": "Anchoring and overconfidence"}},steps:[
  {t:"hook",ic:"🎭",q:"המוח שלך מסבוטז' אותך בשוק — בדרכים שאתה לא מרגיש.",sub:"הטיות הן לא טיפשות. הן ברירת מחדל אנושית.",cta:"בוא נגלה →",tr:{en:{"q": "Your own mind sabotages you in markets — in ways you never feel.", "sub": "Biases aren't stupidity. They're the human default setting.", "cta": "Let's find out →"}}},
  {t:"card",art:"support",ic:"⚓",h:"עיגון (Anchoring)",p:"המוח 'נתקע' על מספר ראשון ששמע — למשל המחיר שקנית בו, או שיא היסטורי — ומודד הכל ביחס אליו. אבל לשוק לא אכפת מהעוגן שלך. ההחלטה צריכה להתבסס על העתיד, לא על מספר מקרי.",tr:{en:{"h": "Anchoring", "p": "The mind fixates on the first number it heard — the price you paid, say, or a historical high — and measures everything against it. But the market doesn't care about your anchor. Decisions should rest on the future, not on an arbitrary number."}}},
  {t:"scenario",q:"מניה עלתה פעם ל-200 ועכשיו היא ב-120.",situation:"אתה חושב 'זה זול, פעם היא הייתה 200!'. מה הבעיה?",
   options:[
    {label:"אני מעגן על מחיר עבר במקום לבדוק את העסק היום",verdict:"good",fb:"בדיוק. ה-200 הוא עוגן חסר משמעות. השאלה היחידה: האם העסק שווה 120 היום?"},
    {label:"צודק, זה בטוח יעלה חזרה ל-200",verdict:"bad",fb:"זו בדיוק הטיית העיגון. אין שום כוח שמושך מחיר 'בחזרה' לשיא ישן."}],
   why:"מחיר עבר אינו תחזית. עגן על הערך הכלכלי היום — לא על מספרים שהמוח שלך נתפס עליהם.",tr:{en:{"q": "A stock once reached 200 and now trades at 120.", "situation": "You think 'that's cheap, it used to be 200!'. What's the problem?", "why": "A past price isn't a forecast. Anchor on today's economic value — not on numbers your mind latched onto.", "options": [{"label": "I'm anchoring on a past price instead of examining the business today", "fb": "Exactly. The 200 is a meaningless anchor. The only question is whether the business is worth 120 today."}, {"label": "Right, it's bound to climb back to 200", "fb": "That is precisely anchoring bias. No force pulls a price 'back' to an old high."}]}}},
  {t:"card",art:"fomo",ic:"😎",h:"ביטחון יתר",p:"אחרי כמה עסקאות מוצלחות קל להרגיש 'גאון'. אבל לרוב זה מזל, לא כישרון. ביטחון יתר מוביל לפוזיציות גדולות מדי ולקיחת סיכונים מיותרים — בדיוק לפני שהשוק מלמד ענווה.",tr:{en:{"h": "Overconfidence", "p": "After a few successful trades it's easy to feel like a genius. But it's usually luck, not skill. Overconfidence leads to oversized positions and unnecessary risk — right before the market teaches humility."}}},
  {t:"quiz",q:"רצף רווחים גורם לרבים ל...",o:["ענווה","ביטחון יתר וסיכון מוגזם","למכור הכל","להפסיק לסחור"],a:1,why:"הצלחה מוקדמת מולידה ביטחון יתר — הדלק להימורים גדולים מדי. תישאר צנוע.",
   mentor:{why:"לא זיהית את ההטיה. רצף הצלחות מייצר ביטחון יתר — וזה בדיוק מתי אנשים מסתכנים יותר מדי.",
    analogy:"מהמר שזכה 5 פעמים ברצף מרגיש 'חם' ומעלה את ההימור. הסיכוי לא השתנה — רק תחושת הביטחון שלו.",
    q:"הרווחת 5 עסקאות ברצף. אתה מרגיש שאתה 'מבין את השוק'. מה הסיכון?",
    o:["אין סיכון, אני באמת טוב","ביטחון יתר — אקח סיכון גדול מדי ואמחק את הרווחים","זה אומר שאמשיך לנצח","כדאי להכפיל הכל"],a:1,
    hint:"מה קורה לגודל ההימור שלך אחרי רצף הצלחות?",
    ok:"נכון. הרווח הכי מסוכן הוא זה שגורם לך להרגיש בלתי מנוצח."},tr:{en:{"q": "A winning streak leads many people to...", "o": ["Humility", "Overconfidence and excessive risk", "Sell everything", "Stop trading"], "why": "Early success breeds overconfidence — the fuel for oversized bets. Stay humble.", "mentor": {"why": "You didn't spot the bias. A run of success generates overconfidence — and that's exactly when people take on too much risk.", "analogy": "A gambler who has won five times in a row feels 'hot' and raises the stake. The odds haven't changed — only his sense of confidence.", "q": "You've won five trades in a row. You feel you 'understand the market'. What's the risk?", "o": ["No risk, I really am good", "Overconfidence — I'll take too much risk and erase the gains", "It means I'll keep winning", "I should double everything"], "hint": "What happens to the size of your bet after a run of success?", "ok": "Right. The most dangerous profit is the one that makes you feel invincible."}}}},
 
  {t:"sim",asset:"🧠 המוח שלך",start:10000,
   why:"ראית 3 הטיות פועלות עליך: עוגן (נצמדת למחיר הקנייה), אישוש (חיפשת רק מידע שמסכים איתך), ושנאת הפסד (החזקת מפסידה כדי לא 'לממש' את הכאב). ההטיות האלה לא נעלמות כשמכירים אותן — אבל אפשר לבנות כללים שמנטרלים אותן.",
   events:[
    {ic:"⚓",t:"עוגן",good:false,news:"קנית ב-₪100. המניה ב-₪70. העסק הידרדר באמת. אתה חושב: 'אמכור כשתחזור ל-100'.",
     opts:[{l:"מחכה שתחזור ל-100",r:-.15,fb:"זו הטיית עוגן. המחיר שקנית בו לא מעניין את השוק — רק את הרגש שלך."},
      {l:"שואל: הייתי קונה אותה היום ב-70?",r:.03,good:true,fb:"זו השאלה הנכונה. אם התשובה לא — תמכור. המחיר ההיסטורי לא רלוונטי."}]},
    {ic:"🔍",t:"הטיית אישוש",good:false,news:"אתה מחפש בגוגל 'למה המניה תעלה' — ומוצא רק מאמרים שמסכימים איתך.",
     opts:[{l:"מתחזק בדעה, קונה עוד",r:-.12,fb:"חיפשת אישור, לא אמת. זו הטיית אישוש — המלכודת הכי שקטה."},
      {l:"מחפש דווקא את הטיעון ההפוך",r:.05,good:true,fb:"מצוין. משקיע טוב מחפש למה הוא טועה, לא למה הוא צודק."}]},
    {ic:"😖",t:"שנאת הפסד",good:false,news:"יש לך שתי מניות: אחת ברווח 20%, אחת בהפסד 20%. אתה צריך מזומן. איזו תמכור?",
     opts:[{l:"מוכר את המרוויחה — 'לממש רווח'",r:-.08,fb:"זו שנאת הפסד: מוכרים מנצחות ומחזיקים מפסידות, כדי לא להודות בטעות."},
      {l:"מוכר את הגרועה יותר עסקית — לא הרגשית",r:.10,good:true,fb:"בדיוק. ההחלטה צריכה להתבסס על העסק, לא על מחיר הקנייה שלך."}]}],tr:{en:{"asset": "🧠 Your own mind", "why": "You watched three biases act on you: anchoring (fixating on your purchase price), confirmation (seeking only information that agrees with you), and loss aversion (holding a loser to avoid 'realising' the pain). These biases don't vanish once you know them — but you can build rules that neutralise them.", "events": [{"t": "Anchoring", "news": "You bought at ₪100. The stock is at ₪70. The business genuinely deteriorated. You think: 'I'll sell when it gets back to 100.'", "opts": [{"l": "Wait for it to return to 100", "fb": "That's anchoring bias. The market doesn't care what you paid — only your emotions do."}, {"l": "Ask: would I buy it today at 70?", "fb": "That's the right question. If the answer is no, sell. The historical price is irrelevant."}]}, {"t": "Confirmation bias", "news": "You search online for 'why the stock will rise' — and find only articles that agree with you.", "opts": [{"l": "Feel reassured, buy more", "fb": "You sought reassurance, not truth. That's confirmation bias — the quietest trap of all."}, {"l": "Deliberately look for the opposing argument", "fb": "Excellent. A good investor looks for why they're wrong, not why they're right."}]}, {"t": "Loss aversion", "news": "You hold two stocks: one up 20%, one down 20%. You need cash. Which do you sell?", "opts": [{"l": "Sell the winner — to 'lock in a gain'", "fb": "That's loss aversion: selling winners and holding losers, to avoid admitting a mistake."}, {"l": "Sell whichever is worse as a business — not emotionally", "fb": "Exactly. The decision should rest on the business, not on your purchase price."}]}]}}},
  {t:"summary",h:"מה למדת",points:["הטיית אישוש: אתה מחפש רק מידע שמסכים איתך","שנאת הפסד: הכאב כפול מההנאה — וזה מעוות החלטות","עוגן: המחיר שקנית בו לא רלוונטי לשווי היום","הכר את ההטיות — זו הדרך היחידה לנטרל אותן"],tr:{en:{"h": "What you learned", "points": ["Confirmation bias: you seek only information that agrees with you", "Loss aversion: the pain is twice the pleasure — and it distorts decisions", "Anchoring: the price you paid is irrelevant to today's value", "Know the biases — it's the only way to neutralise them"]}}}]},
 {id:"l112",ic:"🔍",title:"הטיית אישור ועדריות",tier:"intermediate",tr:{en:{"title": "Confirmation bias and herding"}},steps:[
  {t:"card",art:"fomo",ic:"🔍",h:"הטיית אישור",p:"אנחנו מחפשים מידע שמאשר את מה שכבר החלטנו, ומתעלמים ממה שסותר. קנית מניה? פתאום כל חדשה חיובית 'מוכיחה' שצדקת. המשקיע החכם מחפש דווקא את הטיעון ההפוך.",tr:{en:{"h": "Confirmation bias", "p": "We look for information that confirms what we've already decided, and ignore what contradicts it. Bought a stock? Suddenly every positive headline 'proves' you were right. The wise investor deliberately seeks the opposing argument."}}},
  {t:"swipe",q:"חשיבה ביקורתית — או הטיית אישור? החלק כל כרטיס.",leftLabel:"❌ הטיה",rightLabel:"✅ ביקורתי",
   cards:[
    {text:"קראתי רק כתבות שאומרות שצדקתי",good:false,why:"זו הטיית אישור קלאסית — סינון מידע שנוח לך."},
    {text:"חיפשתי בכוונה את הטיעון החזק נגד ההשקעה שלי",good:true,why:"מעולה. לחפש את הצד ההפוך זו החשיבה של משקיע בוגר."},
    {text:"התעלמתי מנתון רע כי 'הם לא מבינים'",good:false,why:"פסילת מידע סותר = הטיית אישור בפעולה."},
    {text:"שיניתי דעה כשהעובדות השתנו",good:true,why:"בדיוק. גמישות מול עובדות חדשות היא חוזק, לא חולשה."}],tr:{en:{"q": "Critical thinking — or confirmation bias? Swipe each card.", "leftLabel": "❌ Bias", "rightLabel": "✅ Critical", "cards": [{"text": "I only read articles saying I was right", "why": "Classic confirmation bias — filtering for information that's comfortable."}, {"text": "I deliberately looked for the strongest argument against my investment", "why": "Excellent. Seeking the other side is the thinking of a mature investor."}, {"text": "I ignored a bad data point because 'they don't understand'", "why": "Dismissing contradictory information is confirmation bias in action."}, {"text": "I changed my mind when the facts changed", "why": "Exactly. Flexibility in the face of new facts is a strength, not a weakness."}]}}},
  {t:"card",art:"fomo",ic:"🐑",h:"עדריות (Herd)",p:"'כולם קונים, אז גם אני' — הדחף להצטרף לעדר. אבל כשכולם כבר בפנים, לרוב המחיר כבר מנופח. העדר נכנס בשיא ובורח בתחתית. משקיע עצמאי חושב בעצמו.",tr:{en:{"h": "Herding", "p": "'Everyone's buying, so I will too' — the urge to join the herd. But once everyone is already in, the price is usually inflated. The herd enters at the peak and flees at the bottom. An independent investor thinks for themselves."}}},
  {t:"quiz",q:"מתי העדר בדרך כלל טועה הכי הרבה?",o:["אף פעם","בקיצוניות — קונה בשיא, מוכר בתחתית","רק במניות קטנות","רק בקריפטו"],a:1,why:"רגשות ההמון מגיעים לשיא בדיוק ברגעים הכי גרועים. עצמאות מחשבתית שווה כסף.",
   mentor:{why:"בחרת בזמן שנראה רגוע. אבל העדר טועה הכי הרבה דווקא בקצוות — בשיא האופוריה ובשיא הפאניקה.",
    analogy:"בשיא הבועה כולם קונים; בתחתית המפולת כולם מוכרים. שני הרגעים האלה הם בדיוק ההפך ממה שהיה נכון.",
    q:"מתי הרוב טועה הכי הרבה?",
    o:["כשהשוק משעמם ושקט","בקצוות — בשיא ההתלהבות ובשיא הפחד","אף פעם, לרוב יש חוכמה","באמצע מגמה"],a:1,
    hint:"מתי הרגש הכי חזק — ומתי ההחלטות הכי גרועות?",
    ok:"בדיוק. הרוב צודק ברוב הזמן — וטועה קשות ברגעים הקריטיים."},tr:{en:{"q": "When does the herd usually get it most wrong?", "o": ["Never", "At the extremes — buying at the peak, selling at the bottom", "Only in small caps", "Only in crypto"], "why": "Crowd emotion peaks at precisely the worst moments. Independent thinking is worth money.", "mentor": {"why": "You chose a period that seems calm. But the herd is most wrong at the extremes — at peak euphoria and peak panic.", "analogy": "At the top of a bubble everyone buys; at the bottom of a crash everyone sells. Both moments are the exact opposite of what was right.", "q": "When is the majority most wrong?", "o": ["When the market is quiet and dull", "At the extremes — at peak excitement and peak fear", "Never, crowds are usually wise", "In the middle of a trend"], "hint": "When is emotion strongest — and when are decisions worst?", "ok": "Exactly. The majority is right most of the time — and badly wrong at the critical moments."}}}}
 ,
  {t:"challenge",task:"פתח את התיק שלך (או רשימת מעקב) ולכל החזקה שאל: 'הייתי קונה אותה היום, במחיר הנוכחי, אילו לא הייתה לי כבר?' רשום כן/לא ליד כל אחת.",
   hint:"כל 'לא' הוא החזקה שאתה שומר מסיבות רגשיות, לא עסקיות. זו התרגילת הכי חזקה נגד עוגן.",tr:{en:{"task": "Open your portfolio (or watchlist) and ask of every holding: 'Would I buy this today, at the current price, if I didn't already own it?' Write yes or no beside each one.", "hint": "Every 'no' is a holding you're keeping for emotional rather than business reasons. It's the most powerful exercise there is against anchoring."}}}]},
 {id:"l113",ic:"🎰",title:"כשל המהמר ועדכניות",tier:"advanced",tr:{en:{"title": "The gambler's fallacy and recency"}},steps:[
  {t:"card",art:"panic",ic:"🎰",h:"כשל המהמר",p:"'ירדה 5 ימים ברצף, אז חייבת לעלות מחר' — טעות. לשוק אין זיכרון ואין 'חוב' לתקן. כל יום עצמאי. ההנחה שרצף חייב להתהפך היא כשל מחשבתי קלאסי.",tr:{en:{"h": "The gambler's fallacy", "p": "'It's fallen five days running, so it must rise tomorrow' — wrong. The market has no memory and owes no correction. Each day is independent. Assuming a streak must reverse is a classic thinking error."}}},
  {t:"quiz",q:"מניה ירדה 5 ימים ברצף. מה נכון?",o:["חייבת לעלות מחר","העבר לא קובע את המחר — כל יום עצמאי","תמשיך לרדת בוודאות","זה באג"],a:1,why:"אין חוק שמחייב תיקון. תנועות עבר אינן מכתיבות את הבא — זה כשל המהמר.",
   mentor:{why:"נפלת לכשל המהמר: להניח שאחרי רצף ירידות 'חייבת' לבוא עלייה. השוק לא זוכר ולא חייב כלום.",
    analogy:"מטבע שנפל 5 פעמים על 'עץ' — הסיכוי בזריקה הבאה עדיין 50%. למטבע אין זיכרון.",
    q:"מניה ירדה 5 ימים ברצף. מה הסיכוי שתעלה מחר?",
    o:["גבוה — היא 'חייבת' לתקן","לא ידוע — הימים הקודמים לא קובעים את מחר","נמוך — המגמה תימשך","100%"],a:1,
    hint:"האם לשוק יש חובה מוסרית 'לפצות' אותך?",
    ok:"נכון. השאלה היחידה שחשובה: מה מצב העסק — לא כמה ימים הוא ירד."},tr:{en:{"q": "A stock has fallen five days in a row. What's true?", "o": ["It must rise tomorrow", "The past doesn't determine tomorrow — each day is independent", "It will certainly keep falling", "It's a bug"], "why": "No law requires a correction. Past moves don't dictate the next one — that's the gambler's fallacy.", "mentor": {"why": "You fell for the gambler's fallacy: assuming that after a run of declines a rise 'must' follow. The market doesn't remember and owes nothing.", "analogy": "A coin that has landed on heads five times still has a 50% chance on the next toss. The coin has no memory.", "q": "A stock has fallen five days in a row. What's the chance it rises tomorrow?", "o": ["High — it 'has to' correct", "Unknown — the previous days don't determine tomorrow", "Low — the trend will continue", "100%"], "hint": "Does the market have a moral obligation to 'compensate' you?", "ok": "Right. The only question that matters is the state of the business — not how many days it has fallen."}}}},
  {t:"card",art:"fomo",ic:"🕐",h:"הטיית עדכניות",p:"אנחנו נותנים משקל יתר למה שקרה ממש עכשיו. שוק עולה חודש? 'זה ימשיך לתמיד'. יורד שבוע? 'הכל נגמר'. המציאות: הטווח הקצר רועש, המגמות הגדולות ארוכות בהרבה.",tr:{en:{"h": "Recency bias", "p": "We give excessive weight to what just happened. The market rises for a month? 'This will go on forever.' Falls for a week? 'It's all over.' The reality: short horizons are noisy, and the big trends are far longer."}}},
  {t:"scenario",q:"השוק עלה חזק 3 חודשים ברציפות.",situation:"חבר אומר 'זה כבר לא ירד, בוא נכניס הכל!'. מה קורה כאן?",
   options:[
    {label:"הטיית עדכניות — הוא מקרין עבר קרוב על העתיד",verdict:"good",fb:"נכון. שלושה חודשים טובים לא מבטלים את מחזוריות השוק. עדיין צריך פיזור וזהירות."},
    {label:"הוא צודק, מגמה עולה נמשכת לנצח",verdict:"bad",fb:"שום מגמה לא נמשכת לנצח. זו בדיוק הטיית העדכניות שמזינה בועות."}],
   why:"מה שקרה לאחרונה מרגיש כמו כלל — אבל לרוב הוא רק רעש. תסתכל על התמונה הרחבה.",tr:{en:{"q": "The market has risen strongly for three consecutive months.", "situation": "A friend says 'it doesn't fall anymore, let's put everything in!'. What's happening here?", "why": "What happened recently feels like a rule — but usually it's just noise. Look at the wider picture.", "options": [{"label": "Recency bias — he's projecting the recent past onto the future", "fb": "Correct. Three good months don't repeal the market cycle. Diversification and caution still apply."}, {"label": "He's right, an uptrend continues forever", "fb": "No trend lasts forever. That is precisely the recency bias that feeds bubbles."}]}}}
 ]}
]},
{id:"c12",ic:"🛡️",title:"הונאות ומלכודות",desc:"איך לא לאבד כסף לרמאים",tr:{en:{"title": "Scams and Traps", "desc": "How not to lose money to fraudsters"}},lessons:[
 {id:"l121",ic:"🚩",title:"תשואה מובטחת = דגל אדום",tier:"beginner",tr:{en:{"title": "A guaranteed return = a red flag"}},steps:[
  {t:"hook",ic:"🚩",q:"'תשואה מובטחת של 15% בחודש'. איפה הדגל האדום?",sub:"כל הונאה נראית מצוין — עד הרגע שהיא לא.",cta:"בוא נגלה →",tr:{en:{"q": "'A guaranteed 15% return every month.' Where's the red flag?", "sub": "Every scam looks excellent — right up until the moment it doesn't.", "cta": "Let's find out →"}}},
  {t:"card",art:"riskreturn",ic:"🚩",h:"הכלל שמציל כסף",p:"אין תשואה גבוהה בלי סיכון, ואין רווח 'מובטח' בשוק. כל מי שמבטיח לך אחוזים קבועים וגבוהים — או טועה, או מנסה לרמות אותך. זה הדגל האדום מספר אחת.",tr:{en:{"h": "The rule that saves money", "p": "There is no high return without risk, and no 'guaranteed' profit in markets. Anyone promising you fixed, high percentages is either mistaken or trying to defraud you. That's red flag number one."}}},
  {t:"swipe",q:"הצעה לגיטימית — או הונאה? החלק כל כרטיס.",leftLabel:"🚨 הונאה",rightLabel:"✅ סביר",
   cards:[
    {text:"'12% תשואה מובטחת כל חודש, אפס סיכון!'",good:false,why:"תשואה גבוהה ומובטחת בלי סיכון לא קיימת. הונאה קלאסית."},
    {text:"קרן מדד רחבה עם תשואה היסטורית משתנה ולא מובטחת",good:true,why:"שקיפות לגבי סיכון ותנודתיות = סימן ללגיטימיות."},
    {text:"'תכניס עכשיו, ההזדמנות נגמרת בעוד שעה!'",good:false,why:"לחץ זמן מלאכותי הוא כלי מניפולציה קלאסי של רמאים."},
    {text:"מוצר מפוקח שמסביר בפירוש שאפשר גם להפסיד",good:true,why:"גילוי הסיכון בגלוי הוא בדיוק מה שמרמה לא יעשה."}],tr:{en:{"q": "A legitimate offer — or a scam? Swipe each card.", "leftLabel": "🚨 Scam", "rightLabel": "✅ Reasonable", "cards": [{"text": "'A guaranteed 12% return every month, zero risk!'", "why": "A high, guaranteed, risk-free return doesn't exist. A classic scam."}, {"text": "A broad index fund with a variable, unguaranteed historical return", "why": "Transparency about risk and volatility is a sign of legitimacy."}, {"text": "'Get in now, the opportunity closes in an hour!'", "why": "Artificial time pressure is a classic manipulation tool used by fraudsters."}, {"text": "A regulated product that explicitly explains you could lose money", "why": "Disclosing risk openly is precisely what a fraudster would never do."}]}}},
  {t:"quiz",q:"מה הדגל האדום הכי חשוב בהשקעה?",o:["תנודתיות","הבטחת תשואה גבוהה ובטוחה","דמי ניהול","פיזור"],a:1,why:"'מובטח + גבוה + בלי סיכון' = שקר. זהו סימן ההיכר של כמעט כל הונאה פיננסית.",
   mentor:{why:"בחרת בסימן משני. הדגל האדום החזק ביותר הוא הבטחת תשואה — כי היא בלתי אפשרית מטבעה.",
    analogy:"אם באמת הייתה דרך להרוויח 15% בחודש בלי סיכון — הבנקים היו עושים את זה עם כל הכסף שלהם. למה שיציעו לך?",
    q:"מה המשפט שמסגיר הונאה כמעט תמיד?",
    o:["'ההשקעה כרוכה בסיכון'","'תשואה גבוהה ומובטחת'","'דמי ניהול 0.2%'","'הקרן מפוקחת'"],a:1,
    hint:"איזה משפט מבטיח משהו שאי אפשר להבטיח?",
    ok:"בדיוק. 'גבוה' ו'מובטח' לא יכולים לחיות יחד. זו הסתירה שחושפת כל הונאה."},tr:{en:{"q": "What's the most important red flag in investing?", "o": ["Volatility", "A promise of a high, safe return", "Management fees", "Diversification"], "why": "'Guaranteed + high + risk-free' is a lie. It's the hallmark of almost every financial scam.", "mentor": {"why": "You picked a secondary signal. The strongest red flag is a promised return — because it's inherently impossible.", "analogy": "If there really were a way to earn 15% a month with no risk, the banks would be doing it with all of their own money. Why would they offer it to you?", "q": "Which phrase gives away a scam almost every time?", "o": ["'This investment carries risk'", "'A high and guaranteed return'", "'Management fees of 0.2%'", "'The fund is regulated'"], "hint": "Which phrase promises something that cannot be promised?", "ok": "Exactly. 'High' and 'guaranteed' cannot coexist. That contradiction exposes every scam."}}}},
 
  {t:"sim",asset:"💰 'הזדמנות' של חבר",start:10000,
   why:"זו בדיוק הצורה של כל פונזי בהיסטוריה: תשואות מושלמות בהתחלה (כדי לפתות אותך להכניס עוד), לחץ להגדיל, ואז — הקריסה. הכסף שקיבלת בהתחלה היה הכסף של המצטרפים אחריך. שום דבר לא הושקע באמת.",
   events:[
    {ic:"🤝",t:"ההצעה",good:false,news:"חבר טוב מציע: '3% בחודש, מובטח. אני כבר שנה בפנים ומקבל כל חודש בזמן.' הוא באמת מקבל.",
     opts:[{l:"מכניס — הוא חבר, וזה עובד לו",r:0,fb:"נכנסת. שים לב: העובדה שהוא מקבל לא מוכיחה כלום — היא בדיוק מה שמושך אותך פנימה."},
      {l:"שואל: מאיפה בדיוק מגיע הרווח?",r:0,good:true,fb:"השאלה הנכונה. אם אין תשובה ברורה ומוכחת — זה דגל אדום."}]},
    {ic:"📈",t:"3 חודשים מושלמים",good:false,news:"קיבלת 3% כל חודש, בזמן, בדיוק כמו שהובטח. אתה מרגיש טיפש שלא הכנסת יותר. הוא מציע: 'תכפיל'.",
     opts:[{l:"מכפיל את ההשקעה",r:0,fb:"זה השלב שבו פונזי גובה את המחיר האמיתי. התשלומים המושלמים הם הפיתיון, לא ההוכחה."},
      {l:"מושך את הכסף החוצה",r:.09,good:true,fb:"יצאת ברווח. הרוב לא מצליחים — כי התשלומים הסדירים משכנעים אותם להכניס עוד."}]},
    {ic:"💀",t:"הקריסה",good:false,news:"פתאום 'עיכוב טכני'. אחר כך 'בעיה עם הבנק'. אחר כך — הוא נעלם. מתברר: מעולם לא הייתה השקעה. הכסף שלך שילם למי שנכנס לפניך.",
     opts:[{l:"מנסה לתבוע",r:0,good:true,fb:"נכון לנסות — אבל ברוב מקרי הפונזי הכסף כבר לא קיים. ההגנה היחידה היא לא להיכנס."},
      {l:"מכניס עוד כדי 'להציל' את ההשקעה",r:-.60,fb:"זו הטעות הקטלנית — כלכלת שקיעה. אף פעם אל תזרוק כסף טוב אחרי רע."}]}],tr:{en:{"asset": "💰 A friend's 'opportunity'", "why": "This is the exact shape of every Ponzi scheme in history: perfect returns at the start (to tempt you into putting in more), pressure to increase, and then the collapse. The money you received early on was the money of those who joined after you. Nothing was ever actually invested.", "events": [{"t": "The offer", "news": "A good friend offers: '3% a month, guaranteed. I've been in a year and I get paid on time every month.' And he genuinely does.", "opts": [{"l": "Put money in — he's a friend, and it works for him", "fb": "You went in. Note carefully: the fact that he gets paid proves nothing — it's precisely what draws you in."}, {"l": "Ask: where exactly does the profit come from?", "fb": "The right question. If there's no clear, verifiable answer, that's a red flag."}]}, {"t": "Three perfect months", "news": "You received 3% every month, on time, exactly as promised. You feel foolish for not putting in more. He suggests: 'double it.'", "opts": [{"l": "Double the investment", "fb": "This is the stage where a Ponzi extracts the real price. The perfect payments are the bait, not the proof."}, {"l": "Withdraw the money", "fb": "You got out with a profit. Most people don't — because the regular payments persuade them to put in more."}]}, {"t": "The collapse", "news": "Suddenly there's a 'technical delay'. Then 'a problem with the bank'. Then he disappears. It turns out there was never any investment. Your money paid whoever joined before you.", "opts": [{"l": "Try to sue", "fb": "Worth trying — but in most Ponzi cases the money no longer exists. The only defence is never getting in."}, {"l": "Put in more to 'rescue' the investment", "fb": "That's the fatal mistake — the sunk cost trap. Never throw good money after bad."}]}]}}},
  {t:"summary",h:"מה למדת",points:["תשואה גבוהה + 'מובטח' = הונאה. תמיד","לחץ להחליט מהר = דגל אדום ענק","אם אתה לא מבין איך מרוויחים — אל תשקיע","גוף לא מפוקח = הכסף שלך לא מוגן"],tr:{en:{"h": "What you learned", "points": ["A high return + 'guaranteed' = a scam. Always", "Pressure to decide quickly is an enormous red flag", "If you don't understand how the money is made — don't invest", "An unregulated entity means your money isn't protected"]}}}]},
 {id:"l122",ic:"🏔️",title:"פירמידות ופונזי",tier:"intermediate",tr:{en:{"title": "Pyramids and Ponzi schemes"}},steps:[
  {t:"card",art:"fomo",ic:"🏔️",h:"איך פונזי עובד",p:"בתרמית פונזי, כספם של המשקיעים החדשים משמש כדי לשלם 'רווחים' לוותיקים — אין עסק אמיתי מאחורי זה. זה עובד כל עוד נכנסים חדשים, וקורס ברגע שהזרם נעצר. כולם בסוף מפסידים חוץ מהיוזם.",tr:{en:{"h": "How a Ponzi works", "p": "In a Ponzi scheme, new investors' money is used to pay 'returns' to earlier ones — there's no real business behind it. It works as long as new people keep joining, and collapses the moment the flow stops. Everyone loses in the end except the organiser."}}},
  {t:"scenario",q:"מכר מזמין אותך ל'הזדמנות'.",situation:"'תרוויח 20% בחודש, וכל חבר שתביא — תקבל בונוס!'. מה זה מריח?",
   options:[
    {label:"תרמית פירמידה/פונזי — הרווח מגיוס אנשים, לא מעסק",verdict:"good",fb:"בדיוק. כשהתמריץ הוא לגייס אנשים ולא מוצר אמיתי — זה מבנה פירמידה. ברח."},
    {label:"נשמע מעולה, בוא נכניס את כל החברים",verdict:"bad",fb:"זה בדיוק המנגנון שמזין את התרמית — גיוס חדשים כדי לשלם לוותיקים."}],
   why:"רווח שמגיע מכניסת אנשים חדשים ולא מעסק אמיתי = פירמידה. הוא תמיד קורס בסוף.",tr:{en:{"q": "An acquaintance invites you into an 'opportunity'.", "situation": "'You'll earn 20% a month, and for every friend you bring, you get a bonus!'. What does that smell like?", "why": "Profit that comes from recruiting new people rather than a real business is a pyramid. It always collapses eventually.", "options": [{"label": "A pyramid or Ponzi scheme — the profit comes from recruitment, not a business", "fb": "Exactly. When the incentive is recruiting people rather than a real product, it's a pyramid structure. Run."}, {"label": "Sounds great, let's bring all our friends in", "fb": "That's precisely the mechanism that feeds the fraud — recruiting new members to pay the earlier ones."}]}}},
  {t:"quiz",q:"מה מאפיין תרמית פונזי?",o:["עסק רווחי אמיתי","תשלום לוותיקים מכספם של החדשים","פיקוח הדוק","דמי ניהול נמוכים"],a:1,why:"אין מנוע רווח אמיתי — רק העברת כסף מחדשים לוותיקים, עד הקריסה.",
   mentor:{why:"לא זיהית את המנגנון. בפונזי אין השקעה אמיתית — הכסף של החדשים משלם לוותיקים.",
    analogy:"זה כמו לשלם משכורת לעובד מהכסף של העובד הבא שנכנס. זה עובד מצוין — עד שאין עוד עובדים.",
    q:"למה כל פונזי חייב לקרוס בסוף?",
    o:["כי הרגולטור תמיד תופס","כי הוא תלוי בגיוס אינסופי של מצטרפים חדשים — וזה נגמר","כי השוק יורד","הוא לא חייב לקרוס"],a:1,
    hint:"מאיפה מגיע הכסף לשלם לוותיקים — ומה קורה כשהזרם נעצר?",
    ok:"נכון. פונזי הוא לא השקעה שנכשלה — הוא הונאה שהזמן שלה נגמר."},tr:{en:{"q": "What characterises a Ponzi scheme?", "o": ["A genuinely profitable business", "Paying earlier investors with new investors' money", "Tight regulation", "Low management fees"], "why": "There's no real profit engine — only money transferred from new investors to old ones, until the collapse.", "mentor": {"why": "You didn't identify the mechanism. In a Ponzi there's no real investment — new members' money pays the older ones.", "analogy": "It's like paying one employee's salary out of the next employee's wages. It works beautifully — until there are no more employees.", "q": "Why must every Ponzi scheme eventually collapse?", "o": ["Because regulators always catch them", "Because it depends on recruiting new members forever — and that runs out", "Because the market falls", "It doesn't have to collapse"], "hint": "Where does the money to pay the earlier investors come from — and what happens when the flow stops?", "ok": "Right. A Ponzi isn't a failed investment — it's a fraud whose time ran out."}}}}
 ,
  {t:"swipe",q:"דגל אדום — או לגיטימי? החלק כל כרטיס.",leftLabel:"🚩 הונאה",rightLabel:"✅ תקין",
   cards:[
    {text:"'תשואה מובטחת של 15% בחודש'",good:false,why:"תשואה גבוהה + 'מובטח' = סתירה. זו ההגדרה של הונאה."},
    {text:"קרן מדד מפוקחת שמפרסמת דמי ניהול ואחזקות",good:true,why:"שקיפות מלאה + פיקוח = תקין."},
    {text:"'תחליט היום, ההזדמנות נסגרת בחצות'",good:false,why:"לחץ זמן הוא כלי מניפולציה קלאסי. השקעה טובה תהיה שם גם מחר."},
    {text:"'אל תספר לאף אחד, זה סוד'",good:false,why:"סודיות = דגל אדום ענק. עסק לגיטימי לא מפחד מאור."},
    {text:"ברוקר מפוקח עם רישיון שאפשר לאמת",good:true,why:"פיקוח ורישיון ניתן לאימות — זה מה שמגן עליך."},
    {text:"'תגייס חברים ותקבל בונוס על כל אחד'",good:false,why:"תגמול על גיוס = מבנה פירמידה. הרווח מגיע מהמצטרפים, לא מעסק."}],tr:{en:{"q": "A red flag — or legitimate? Swipe each card.", "leftLabel": "🚩 Scam", "rightLabel": "✅ Sound", "cards": [{"text": "'A guaranteed 15% return every month'", "why": "A high return + 'guaranteed' is a contradiction. That's the definition of fraud."}, {"text": "A regulated index fund that publishes its fees and holdings", "why": "Full transparency plus regulation means it's sound."}, {"text": "'Decide today, the opportunity closes at midnight'", "why": "Time pressure is a classic manipulation tool. A good investment will still be there tomorrow."}, {"text": "'Don't tell anyone, it's a secret'", "why": "Secrecy is an enormous red flag. A legitimate business isn't afraid of daylight."}, {"text": "A regulated broker with a licence you can verify", "why": "Oversight and a verifiable licence — that's what protects you."}, {"text": "'Recruit friends and get a bonus for each one'", "why": "Rewards for recruitment means a pyramid structure. The profit comes from new joiners, not a business."}]}}}]},
 {id:"l123",ic:"📉",title:"פאמפ, דאמפ וקריפטו",tier:"advanced",tr:{en:{"title": "Pump, dump and crypto"}},steps:[
  {t:"card",art:"fomo",ic:"🎺",h:"פאמפ אנד דאמפ",p:"קבוצה מנפחת מלאכותית מחיר של נכס קטן ('פאמפ'), משכנעת המון לקנות בהתלהבות — ואז מוכרת הכל בשיא ('דאמפ') ומשאירה את כולם עם נכס מתרסק. נפוץ במניות זעירות ובקריפטו.",tr:{en:{"h": "Pump and dump", "p": "A group artificially inflates the price of a small asset (the 'pump'), persuades a crowd to buy in excitement — then sells everything at the peak (the 'dump'), leaving everyone holding a collapsing asset. Common in micro-cap stocks and crypto."}}},
  {t:"card",art:"fomo",ic:"🪙",h:"דגלים אדומים בקריפטו",p:"מטבע חדש שאף אחד לא הבין מה הוא עושה, 'מובטח x100', משפיענים שמקבלים תשלום להריץ אותו, ולחץ 'תיכנס עכשיו'. ככל שההבטחה גדולה והלחץ חזק — כך גדל הסיכון שאתה הדאמפ של מישהו.",tr:{en:{"h": "Red flags in crypto", "p": "A new coin nobody can explain the purpose of, a 'guaranteed 100x', influencers paid to promote it, and pressure to 'get in now'. The bigger the promise and the stronger the pressure, the greater the chance you're somebody else's dump."}}},
  {t:"swipe",q:"מטבע/מניה — דגל אדום או סביר? החלק.",leftLabel:"🚩 חשוד",rightLabel:"✅ סביר",
   cards:[
    {text:"'מובטח x100 עד סוף השבוע!'",good:false,why:"הבטחת רווח קיצוני בזמן קצוב — קלאסיקה של פאמפ אנד דאמפ."},
    {text:"נכס מוכר, נזיל, עם היסטוריה שקופה",good:true,why:"שקיפות ונזילות מקטינות סיכון למניפולציה."},
    {text:"משפיען שקיבל תשלום כדי לקדם אותו",good:false,why:"קידום בתשלום = ניגוד אינטרסים. הוא מרוויח גם אם אתה מפסיד."}],tr:{en:{"q": "A coin or stock — red flag or reasonable? Swipe.", "leftLabel": "🚩 Suspicious", "rightLabel": "✅ Reasonable", "cards": [{"text": "'Guaranteed 100x by the end of the week!'", "why": "Promising extreme profit within a deadline — a pump-and-dump classic."}, {"text": "A well-known, liquid asset with a transparent history", "why": "Transparency and liquidity reduce the risk of manipulation."}, {"text": "An influencer who was paid to promote it", "why": "Paid promotion means a conflict of interest. They profit whether or not you lose."}]}}},
  {t:"quiz",q:"בפאמפ אנד דאמפ, מי מרוויח?",o:["כל הקונים","מי שניפח וברח בשיא","אף אחד","הרגולטור"],a:1,why:"היוזמים מוכרים בשיא המלאכותי; ההמון שקנה בהתלהבות נשאר עם ההפסד.",
   mentor:{why:"פספסת את מבנה הרווח: מי שקנה בזול לפני ההייפ הוא זה שמוכר לך ביוקר.",
    analogy:"מישהו קונה כרטיסים לפני שההופעה מפורסמת, מייצר באזז — ואז מוכר לך ביוקר. ההייפ הוא המוצר, לא ההופעה.",
    q:"קיבלת טיפ 'חם' על מניה קטנה שמזנקת. מי כנראה שלח אותו?",
    o:["משקיע נדיב שרוצה לעזור","מי שכבר מחזיק וצריך שמישהו יקנה ממנו ביוקר","הרגולטור","החברה עצמה"],a:1,
    hint:"למה שמישהו יחלוק איתך 'סוד' שיקטין את הרווח שלו?",
    ok:"בדיוק. אם הטיפ הגיע אליך בחינם — אתה כנראה לא הלקוח. אתה המוצר."},tr:{en:{"q": "In a pump and dump, who profits?", "o": ["All the buyers", "Whoever inflated it and got out at the peak", "Nobody", "The regulator"], "why": "The organisers sell at the artificial peak; the crowd that bought in excitement is left with the loss.", "mentor": {"why": "You missed the profit structure: whoever bought cheaply before the hype is the one selling to you expensively.", "analogy": "Someone buys tickets before a show is announced, generates buzz — then sells them to you at a premium. The hype is the product, not the show.", "q": "You received a 'hot tip' about a small stock that's surging. Who most likely sent it?", "o": ["A generous investor who wants to help", "Someone who already holds it and needs a buyer at a high price", "The regulator", "The company itself"], "hint": "Why would anyone share a 'secret' with you that would reduce their own profit?", "ok": "Exactly. If the tip reached you for free, you're probably not the customer. You're the product."}}}}
 ,
  {t:"challenge",task:"קח הצעת השקעה אחת שראית ברשת (או שמישהו הציע לך) ובדוק 3 דברים: (1) מי הגוף ומה הרישיון שלו? (2) מאיפה בדיוק מגיע הרווח? (3) מה קורה אם אני רוצה למשוך מחר?",
   hint:"אם על שאלה אחת אין תשובה ברורה — אל תשקיע. אין 'חצי ברור'.",tr:{en:{"task": "Take one investment offer you've seen online (or that someone pitched you) and check three things: (1) Who is the entity and what is its licence? (2) Where exactly does the profit come from? (3) What happens if I want to withdraw tomorrow?", "hint": "If even one question lacks a clear answer, don't invest. There's no such thing as 'half clear'."}}}]}
]},
{id:"c13",ic:"♟️",title:"אסטרטגיות השקעה",desc:"איך בונים תוכנית, לא ניחוש",tr:{en:{"title": "Investment Strategies", "desc": "How to build a plan rather than a guess"}},lessons:[
 {id:"l131",ic:"⚖️",title:"ערך מול צמיחה",tier:"beginner",tr:{en:{"title": "Value versus growth"}},steps:[
  {t:"hook",ic:"🎯",q:"ערך או צמיחה? פאסיבי או אקטיבי? יש תשובה נכונה?",sub:"יש — אבל היא לא מה שרוב האנשים חושבים.",cta:"בוא נגלה →",tr:{en:{"q": "Value or growth? Passive or active? Is there a right answer?", "sub": "There is — but it isn't what most people think.", "cta": "Let's find out →"}}},
  {t:"card",art:"riskreturn",ic:"⚖️",h:"שתי גישות קלאסיות",p:"השקעת ערך = לחפש חברות טובות שנסחרות בזול יחסית לרווח (מכפיל נמוך, דיבידנד). השקעת צמיחה = לשלם יקר על חברות שצומחות מהר (טק, חדשנות). אין 'נכונה' — יש מתאימה לך ולתקופה.",tr:{en:{"h": "Two classic approaches", "p": "Value investing means seeking good companies trading cheaply relative to earnings (a low multiple, a dividend). Growth investing means paying up for companies growing fast (tech, innovation). Neither is 'correct' — one suits you and the period better."}}},
  {t:"quiz",q:"מניית ערך טיפוסית מאופיינת ב...",o:["מכפיל גבוה מאוד","מכפיל נמוך ולעיתים דיבידנד","אפס הכנסות","סיכון אפס"],a:1,why:"ערך = לשלם מעט יחסית לרווח נוכחי. צמיחה = לשלם הרבה על פוטנציאל עתידי.",tr:{en:{"q": "A typical value stock is characterised by...", "o": ["A very high multiple", "A low multiple and often a dividend", "Zero revenue", "Zero risk"], "why": "Value means paying little relative to current earnings. Growth means paying a lot for future potential."}}},
  {t:"card",art:"coresat",ic:"🏰",h:"חפיר כלכלי (Moat)",p:"יתרון תחרותי בר-קיימא שמגן על החברה מתחרים: מותג חזק, פטנטים, רשת משתמשים, יתרון עלות. חברה עם 'חפיר' רחב יכולה לשמור על רווחיות לאורך שנים — לב ההשקעה האיכותית.",tr:{en:{"h": "An economic moat", "p": "A durable competitive advantage that protects a company from rivals: a strong brand, patents, a network of users, a cost advantage. A company with a wide moat can sustain profitability for years — the heart of quality investing."}}},
  {t:"quiz",q:"מהו 'חפיר כלכלי'?",o:["חוב של החברה","יתרון תחרותי שקשה להעתיק","סוג מס","מחיר המניה"],a:1,why:"חפיר מגן על הרווחים מתחרות. ככל שהוא רחב, כך העסק עמיד יותר לאורך זמן.",tr:{en:{"q": "What is an 'economic moat'?", "o": ["The company's debt", "A competitive advantage that's hard to copy", "A type of tax", "The share price"], "why": "A moat protects profits from competition. The wider it is, the more durable the business over time."}}},
 
  {t:"swipe",q:"מניית ערך או מניית צמיחה? החלק כל כרטיס.",leftLabel:"💎 ערך",rightLabel:"🚀 צמיחה",
   cards:[
    {text:"חברה ותיקה, רווחית, מכפיל נמוך, מחלקת דיבידנד",good:false,why:"זו מניית ערך קלאסית: יציבה, מתומחרת בזול יחסית, מחזירה כסף לבעלים."},
    {text:"סטארטאפ טכנולוגי, מכפיל עצום, לא מחלק דיבידנד, גדל 40% בשנה",good:true,why:"מניית צמיחה: משקיעים את כל הרווח חזרה בצמיחה, והמחיר מגלם עתיד."},
    {text:"בנק יציב עם מכפיל 8 ותשואת דיבידנד 5%",good:false,why:"ערך. תמחור נמוך, תזרים יציב, דיבידנד גבוה."},
    {text:"חברה שמפסידה כסף אבל מכפילה הכנסות כל שנה",good:true,why:"צמיחה טהורה — ההימור הוא על העתיד, לא על ההווה."}],tr:{en:{"q": "A value stock or a growth stock? Swipe each card.", "leftLabel": "💎 Value", "rightLabel": "🚀 Growth", "cards": [{"text": "An established, profitable company with a low multiple that pays a dividend", "why": "A classic value stock: stable, priced cheaply, returning cash to its owners."}, {"text": "A tech start-up on an enormous multiple, no dividend, growing 40% a year", "why": "A growth stock: all profits are reinvested into growth, and the price reflects the future."}, {"text": "A stable bank on a multiple of 8 with a 5% dividend yield", "why": "Value. Low valuation, steady cash flow, a high dividend."}, {"text": "A company losing money but doubling revenue every year", "why": "Pure growth — the bet is on the future, not the present."}]}}},
  {t:"challenge",task:"בחר אסטרטגיה אחת (מדד פאסיבי / ערך / צמיחה) וכתוב בשורה אחת למה היא מתאימה לך — לאופי שלך ולאופק שלך. התחייב אליה ל-12 חודשים.",
   hint:"האסטרטגיה הכי טובה היא לא הכי חכמה — היא זו שתחזיק בה גם כשקשה. עקביות מנצחת גאונות.",tr:{en:{"task": "Choose one strategy (passive index / value / growth) and write a single line on why it suits you — your temperament and your horizon. Commit to it for 12 months.", "hint": "The best strategy isn't the cleverest — it's the one you'll stick with when things get hard. Consistency beats brilliance."}}},
  {t:"summary",h:"מה למדת",points:["השקעה פאסיבית במדד מנצחת את רוב המנהלים האקטיביים","ערך = לקנות זול. צמיחה = לקנות עתיד. שניהם עובדים","האסטרטגיה הכי טובה היא זו שתחזיק בה 20 שנה","עקביות מנצחת גאונות"],tr:{en:{"h": "What you learned", "points": ["Passive index investing beats most active managers", "Value means buying cheap. Growth means buying the future. Both work", "The best strategy is the one you'll hold for 20 years", "Consistency beats brilliance"]}}}]},
 {id:"l132",ic:"🔧",title:"איזון מחדש (Rebalancing)",tier:"intermediate",tr:{en:{"title": "Rebalancing"}},steps:[
  {t:"card",art:"trim",ic:"🔧",h:"להחזיר את התיק לפרופורציה",p:"עם הזמן, נכס שהצליח תופס נתח גדול מדי מהתיק ומגדיל את הסיכון. איזון מחדש = למכור קצת מהמנצח ולהוסיף למי שנשאר מאחור, כדי לחזור להקצאה המקורית. זה 'קנה בזול, מכור ביוקר' אוטומטי ומשמעתי.",tr:{en:{"h": "Restoring the portfolio's proportions", "p": "Over time, a winning asset takes up too large a share of the portfolio and raises your risk. Rebalancing means selling a little of the winner and adding to whatever lagged, to return to your original allocation. It's automatic, disciplined 'buy low, sell high'."}}},
  {t:"scenario",q:"תכננת 70% מניות / 30% אג\"ח. אחרי עלייה חזקה זה הפך ל-85/15.",situation:"מה עושים?",
   options:[
    {label:"מאזן חזרה ל-70/30 — מוכר קצת מניות, מוסיף אג\"ח",verdict:"good",fb:"נכון. אתה ממש את חלק מהרווח ומחזיר את רמת הסיכון לזו שתכננת מראש."},
    {label:"נותן למניות לרוץ, 'למה לגעת במנצח'",verdict:"bad",fb:"ההצלחה הגדילה לך את הסיכון בלי ששמת לב. מפולת עכשיו תכאב הרבה יותר."}],
   why:"איזון מחדש שומר על רמת הסיכון שבחרת, וממשמע אותך למכור יקר ולקנות זול — בדיוק ההפך מהאינסטינקט.",tr:{en:{"q": "You planned 70% stocks / 30% bonds. After a strong rally it has become 85/15.", "situation": "What do you do?", "why": "Rebalancing maintains the risk level you chose, and disciplines you to sell high and buy low — exactly the opposite of instinct.", "options": [{"label": "Rebalance back to 70/30 — sell some stocks, add bonds", "fb": "Correct. You realise part of the gain and return your risk to the level you planned in advance."}, {"label": "Let the stocks run, 'why touch a winner'", "fb": "Success has quietly raised your risk. A crash now would hurt far more."}]}}},
  {t:"quiz",q:"מה המטרה של איזון מחדש?",o:["למקסם רווח מיידי","להחזיר את התיק לרמת הסיכון המתוכננת","להימנע ממס","להכפיל פוזיציות"],a:1,why:"הוא מנטרל את ה'סחף' שבו מנצח אחד משתלט על התיק, ומחזיר את הפיזור המתוכנן.",tr:{en:{"q": "What's the purpose of rebalancing?", "o": ["To maximise immediate profit", "To return the portfolio to its planned risk level", "To avoid tax", "To double positions"], "why": "It counteracts the drift where one winner takes over the portfolio, and restores your planned diversification."}}}
 ]},
 {id:"l133",ic:"🎚️",title:"הקצאת נכסים וסיכון",tier:"advanced",tr:{en:{"title": "Asset allocation and risk"}},steps:[
  {t:"card",art:"coresat",ic:"🎚️",h:"הקצאה לפי אופק וגיל",p:"ככל שאופק ההשקעה ארוך יותר (גיל צעיר, כסף שלא צריך שנים) — אפשר יותר מניות, כי יש זמן להתאושש ממפולות. ככל שמתקרבים למועד המשיכה — מגדילים את חלק האג\"ח והיציב. ההקצאה היא ההחלטה הכי חשובה בתיק.",tr:{en:{"h": "Allocating by horizon and age", "p": "The longer your investment horizon (a younger age, money you won't need for years), the more you can hold in stocks, because there's time to recover from crashes. As the withdrawal date approaches, you increase the bond and stable portion. Allocation is the single most important decision in a portfolio."}}},
  {t:"scenario",q:"בן 25 שחוסך לפנסיה מול בן 63 שפורש בעוד שנתיים.",situation:"למי מתאים חלק מניות גבוה יותר?",
   options:[
    {label:"לבן 25 — יש לו עשורים להתאושש ממפולות",verdict:"good",fb:"נכון. אופק ארוך = יכולת לספוג תנודתיות ולהרוויח מהצמיחה ארוכת הטווח."},
    {label:"לבן 63 — שיסתכן כדי להשלים",verdict:"bad",fb:"מסוכן. מפולת שנה לפני הפרישה עלולה למחוק חלק מהחיסכון בלי זמן להתאושש."}],
   why:"אופק זמן קובע כמה סיכון אפשר לשאת. צעיר = יותר מניות; קרוב למשיכה = יותר יציבות.",tr:{en:{"q": "A 25-year-old saving for retirement versus a 63-year-old retiring in two years.", "situation": "Who should hold a higher proportion of stocks?", "why": "Time horizon determines how much risk you can bear. Young means more stocks; close to withdrawal means more stability.", "options": [{"label": "The 25-year-old — they have decades to recover from crashes", "fb": "Correct. A long horizon means the capacity to absorb volatility and benefit from long-term growth."}, {"label": "The 63-year-old — take risk to catch up", "fb": "Dangerous. A crash a year before retirement could erase part of the savings with no time to recover."}]}}},
  {t:"card",art:"riskreturn",ic:"🎯",h:"יחס סיכון-סיכוי וגודל פוזיציה",p:"לפני כל השקעה שאל: כמה אני מסכן מול כמה אוכל להרוויח? ואל תשים בפוזיציה בודדת יותר ממה שתוכל לספוג אם היא תיפול. ניהול גודל הפוזיציה חשוב יותר מבחירת המניה עצמה.",tr:{en:{"h": "Risk-reward and position sizing", "p": "Before every investment ask: how much am I risking against how much I could gain? And never put more into a single position than you could absorb losing. Managing position size matters more than picking the stock itself."}}},
  {t:"quiz",q:"מה מגן עליך הכי הרבה מטעות בבחירת מניה?",o:["ביטחון עצמי","גודל פוזיציה מרוסן ופיזור","טיפים","מזל"],a:1,why:"גם אם טעית לגמרי במניה — פוזיציה קטנה ומפוזרת מגבילה את הנזק. זה לב ניהול הסיכונים.",tr:{en:{"q": "What protects you most from picking the wrong stock?", "o": ["Self-confidence", "Restrained position sizing and diversification", "Tips", "Luck"], "why": "Even if you were completely wrong about a stock, a small and diversified position limits the damage. That's the heart of risk management."}}}
 ]}
]},
{id:"c14",ic:"💳",title:"כסף אישי מתקדם",desc:"חוב, אשראי, ושווי נקי",tr:{en:{"title": "Personal Finance, Advanced", "desc": "Debt, credit, and net worth"}},lessons:[
 {id:"l141",ic:"⚖️",title:"חוב טוב מול חוב רע",tier:"beginner",tr:{en:{"title": "Good debt versus bad debt"}},steps:[
  {t:"hook",ic:"🏦",q:"כמה כסף אתה באמת צריך כדי להיות חופשי?",sub:"יש נוסחה. והיא פשוטה יותר ממה שחשבת.",cta:"בוא נגלה →",tr:{en:{"q": "How much money do you actually need to be free?", "sub": "There's a formula. And it's simpler than you'd think.", "cta": "Let's find out →"}}},
  {t:"card",art:"leverage",ic:"⚖️",h:"לא כל חוב שווה",p:"חוב 'רע' = ריבית גבוהה על צריכה שמאבדת ערך (אשראי, הלוואות מהירות). חוב 'טוב' = ריבית נמוכה על נכס שבונה עתיד (משכנתא, לימודים). הכלל: סלק קודם את החוב היקר ביותר — הוא התשואה השלילית שהכי כדאי לעצור.",tr:{en:{"h": "Not all debt is equal", "p": "'Bad' debt means high interest on consumption that loses value (credit cards, payday loans). 'Good' debt means low interest on an asset that builds a future (a mortgage, education). The rule: clear the most expensive debt first — it's the negative return most worth stopping."}}},
  {t:"scenario",q:"יש לך ₪10,000 פנויים. גם חוב אשראי בריבית 14% וגם הזדמנות להשקיע.",situation:"מה עדיף לרוב?",
   options:[
    {label:"לסלק קודם את חוב האשראי היקר",verdict:"good",fb:"נכון. סילוק חוב ב-14% = תשואה בטוחה של 14%. כמעט אף השקעה לא מנצחת את זה בוודאות."},
    {label:"להשקיע ולהשאיר את החוב",verdict:"bad",fb:"אתה מקווה להרוויח יותר מ-14% בזמן שהחוב אוכל אותך בוודאות ב-14%. הסתברותית מפסיד."}],
   why:"סילוק חוב יקר הוא 'השקעה' עם תשואה מובטחת — קודם עוצרים את הדימום, אחר כך משקיעים.",tr:{en:{"q": "You have ₪10,000 spare. You also have credit card debt at 14% interest and an opportunity to invest.", "situation": "Which is usually better?", "why": "Clearing expensive debt is an 'investment' with a guaranteed return — first stop the bleeding, then invest.", "options": [{"label": "Clear the expensive credit card debt first", "fb": "Correct. Clearing debt at 14% is a certain 14% return. Almost no investment beats that with certainty."}, {"label": "Invest and leave the debt in place", "fb": "You're hoping to earn more than 14% while the debt eats you at a guaranteed 14%. Probabilistically, you lose."}]}}},
  {t:"quiz",q:"למה סילוק חוב בריבית גבוהה נחשב 'השקעה מצוינת'?",o:["הוא לא","כי הוא חוסך ריבית בוודאות = תשואה בטוחה","כי מקבלים מתנה","בגלל מס"],a:1,why:"כל שקל שמסלקים חוסך את הריבית עליו — רווח ודאי, בלי סיכון שוק.",tr:{en:{"q": "Why is clearing high-interest debt considered an 'excellent investment'?", "o": ["It isn't", "Because it saves the interest with certainty = a guaranteed return", "Because you get a gift", "Because of tax"], "why": "Every shekel you clear saves the interest on it — a certain gain, with no market risk."}}},
 
  {t:"summary",h:"מה למדת",points:["חופש כלכלי = ההשקעות מכסות את ההוצאות","כלל 4%: תיק פי 25 מההוצאות השנתיות","להקטין הוצאות עוזר פי שניים — פחות צריך, מהר יותר מגיע","הזמן והעקביות עושים את רוב העבודה"],tr:{en:{"h": "What you learned", "points": ["Financial freedom = your investments cover your expenses", "The 4% rule: a portfolio 25 times your annual expenses", "Reducing expenses works twice over — you need less, and you get there sooner", "Time and consistency do most of the work"]}}}]},
 {id:"l142",ic:"📊",title:"דירוג אשראי ומשכנתא",tier:"intermediate",tr:{en:{"title": "Credit score and mortgages"}},steps:[
  {t:"card",art:"feebite",ic:"📊",h:"דירוג אשראי",p:"דירוג/היסטוריית אשראי הוא 'תעודת יושר פיננסית': הוא משקף כמה אמין אתה בהחזר חובות. דירוג טוב = ריבית נמוכה יותר על הלוואות ומשכנתא. נבנה מתשלומים בזמן ומשימוש אחראי באשראי.",tr:{en:{"h": "Your credit score", "p": "A credit score or history is a financial character reference: it reflects how reliably you repay debt. A good score means lower interest on loans and mortgages. It's built through on-time payments and responsible use of credit."}}},
  {t:"quiz",q:"מה משפר דירוג אשראי?",o:["איחור בתשלומים","החזר חובות בזמן ושימוש אחראי","להימנע מכל אשראי לתמיד","הלוואות רבות במקביל"],a:1,why:"עמידה בהתחייבויות לאורך זמן בונה אמון — ומורידה לך את מחיר הכסף בעתיד.",tr:{en:{"q": "What improves a credit score?", "o": ["Late payments", "Repaying debts on time and using credit responsibly", "Avoiding all credit forever", "Many simultaneous loans"], "why": "Meeting obligations over time builds trust — and lowers the price of money for you in future."}}},
  {t:"card",art:"leverage",ic:"🏠",h:"משכנתא — בקצרה",p:"משכנתא היא הלוואה גדולה לטווח ארוך לרכישת נכס. הריבית והתקופה קובעות כמה תשלם בסוף — הפרש קטן בריבית שווה מאות אלפי שקלים על 25 שנה. תמיד השווה הצעות, ואל תמתח את ההחזר החודשי עד הקצה.",tr:{en:{"h": "Mortgages in brief", "p": "A mortgage is a large, long-term loan used to buy a property. The interest rate and term determine what you ultimately pay — a small difference in rate is worth hundreds of thousands over 25 years. Always compare offers, and never stretch the monthly payment to its limit."}}},
  {t:"quiz",q:"למה כדאי להשוות הצעות משכנתא?",o:["זה לא משנה","הפרש ריבית קטן שווה סכומי עתק לאורך שנים","כדי לבזבז זמן","בגלל האותיות הקטנות בלבד"],a:1,why:"על הלוואה ענקית ולטווח ארוך, אפילו חצי אחוז ריבית מצטבר להון שלם.",tr:{en:{"q": "Why is it worth comparing mortgage offers?", "o": ["It makes no difference", "A small rate difference compounds into vast sums over the years", "To waste time", "Only because of the small print"], "why": "On an enormous, long-term loan, even half a percent accumulates into a fortune."}}},
 
  {t:"predict",q:"שתי משכנתאות זהות של ₪1,000,000 ל-25 שנה. אחת בריבית 4%, השנייה ב-5%. כמה יותר תשלם בסך הכל על ה-5%?",
   min:0,max:400,step:20,unit:"אלף ₪",answer:180,tol:70,
   reveal:"בערך ₪180,000 יותר — על אחוז אחד. דירוג אשראי טוב שווה הון אמיתי.",
   why:"אחוז אחד בריבית נשמע זניח. על 25 שנה ומיליון שקל — הוא שווה מכונית.",tr:{en:{"q": "Two identical ₪1,000,000 mortgages over 25 years. One at 4% interest, the other at 5%. How much more will you pay in total on the 5%?", "unit": "thousand ₪", "reveal": "Roughly ₪180,000 more — for one percentage point. A good credit score is worth real money.", "why": "One percent of interest sounds negligible. Over 25 years on a million shekels, it's worth a car."}}}]},
 {id:"l143",ic:"🧭",title:"יעדים, שווי נקי ופנסיה",tier:"advanced",tr:{en:{"title": "Goals, net worth and pensions"}},steps:[
  {t:"card",art:"exitplan",ic:"🧭",h:"יעדים חכמים (SMART)",p:"יעד פיננסי טוב הוא ספציפי, מדיד, בר-השגה, רלוונטי ותחום בזמן. 'לחסוך יותר' זו משאלה. '₪30,000 לקרן חירום תוך 18 חודשים' זה יעד — כזה שאפשר לתכנן ולעקוב אחריו.",tr:{en:{"h": "SMART goals", "p": "A good financial goal is specific, measurable, achievable, relevant and time-bound. 'Save more' is a wish. '₪30,000 for an emergency fund within 18 months' is a goal — one you can plan for and track."}}},
  {t:"card",art:"compound",ic:"📈",h:"שווי נקי (Net Worth)",p:"שווי נקי = כל מה שיש לך (נכסים, חסכונות, השקעות) פחות כל מה שאתה חייב (חובות). זה המספר האחד שמסכם את הבריאות הפיננסית שלך — והמטרה היא שיעלה בהתמדה עם הזמן.",tr:{en:{"h": "Net worth", "p": "Net worth is everything you own (assets, savings, investments) minus everything you owe (debts). It's the single number that summarises your financial health — and the aim is for it to rise steadily over time."}}},
  {t:"quiz",q:"איך מחשבים שווי נקי?",o:["רק כמה כסף בבנק","נכסים פחות התחייבויות (חובות)","המשכורת החודשית","שווי הבית בלבד"],a:1,why:"שווי נקי = נכסים − חובות. זו התמונה המלאה, לא רק מה שיש בעו\"ש.",tr:{en:{"q": "How is net worth calculated?", "o": ["Just how much cash is in the bank", "Assets minus liabilities (debts)", "Your monthly salary", "The value of your home alone"], "why": "Net worth = assets − debts. That's the complete picture, not just what's in your current account."}}},
  {t:"card",art:"compound",ic:"⏳",h:"פנסיה: הכוח של להתחיל מוקדם",p:"בזכות ריבית דריבית, מי שמתחיל לחסוך לפנסיה בגיל צעיר מגיע לרוב לסכום גדול בהרבה — עם פחות כסף מושקע — ממי שמתחיל מאוחר. הזמן הוא הנכס הכי חזק שלך, והיום הוא ההתחלה הכי מוקדמת שתהיה לך.",tr:{en:{"h": "Pensions: the power of starting early", "p": "Thanks to compounding, someone who starts saving for retirement young usually ends up with a far larger sum — having invested less money — than someone who starts late. Time is your most powerful asset, and today is the earliest start you'll ever have."}}},
  {t:"quiz",q:"מה המשתנה החזק ביותר בחיסכון פנסיוני?",o:["גובה המשכורת","כמה מוקדם התחלת","מזל","בחירת מניה אחת מנצחת"],a:1,why:"זמן + ריבית דריבית מנצחים כמעט הכל. להתחיל מוקדם שווה יותר מלהפקיד סכומים גדולים מאוחר.",tr:{en:{"q": "What's the most powerful variable in pension saving?", "o": ["The size of your salary", "How early you started", "Luck", "Picking one winning stock"], "why": "Time plus compounding beats almost everything. Starting early is worth more than depositing large sums late."}}},
 
  {t:"flip",q:"3 מספרים שכל אחד צריך לדעת על עצמו. הקש לגלות:",
   cards:[{ic:"💎",t:"שווי נקי",b:"כל מה שיש לך פחות כל מה שאתה חייב. המספר האמיתי היחיד שמודד התקדמות."},
    {ic:"📉",t:"שיעור החיסכון",b:"כמה אחוז מההכנסה אתה מפריש. זה המנוע — חשוב יותר מהתשואה בשנים הראשונות."},
    {ic:"🏖️",t:"מספר החופש",b:"ההוצאות השנתיות שלך × 25. זה הסכום שמאפשר לחיות מהתיק."}],tr:{en:{"q": "3 numbers everyone should know about themselves. Tap to reveal:", "cards": [{"t": "Net worth", "b": "Everything you own minus everything you owe. The only number that truly measures progress."}, {"t": "Savings rate", "b": "What percentage of your income you set aside. That's the engine — more important than returns in the early years."}, {"t": "Your freedom number", "b": "Your annual expenses × 25. That's the sum that lets you live off your portfolio."}]}}}]}
]},
{id:"c15",ic:"🏢",title:"נדל\"ן להשקעה ו-REIT",desc:"להשקיע בנדל\"ן בלי לקנות דירה",tr:{en:{"title": "Property Investing and REITs", "desc": "Invest in real estate without buying an apartment"}},lessons:[
 {id:"l151",ic:"🏢",title:"מה זו קרן REIT",tier:"beginner",tr:{en:{"title": "What a REIT is"}},steps:[
  {t:"hook",ic:"🏘️",q:"נדל\"ן בלי לקנות דירה — ובלי דיירים שמתקשרים ב-2 בלילה.",sub:"זה קיים. וזה נקרא REIT.",cta:"בוא נגלה →",tr:{en:{"q": "Property without buying an apartment — and without tenants calling at 2am.", "sub": "It exists. It's called a REIT.", "cta": "Let's find out →"}}},
