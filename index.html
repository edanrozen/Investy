05de\u05d4 (\u05e0\u05e9\u05de\u05e8\u05ea \u05d0\u05da \u05d5\u05e8\u05e7 \u05db\u05d2\u05d9\u05d1\u05d5\u05d1 \u05e7\u05e8\u05d9\u05e4\u05d8\u05d5\u05d2\u05e8\u05e4\u05d9 \u05e2\u05dd \u05de\u05dc\u05d7 \u2014 \u05dc\u05e2\u05d5\u05dc\u05dd \u05dc\u05d0 \u05d1\u05d8\u05e7\u05e1\u05d8 \u05e7\u05e8\u05d9\u05d0); \u05e9\u05dd \u05ea\u05e6\u05d5\u05d2\u05d4, \u05d0\u05d5\u05d5\u05d8\u05d0\u05e8 \u05d5\u05d4\u05e2\u05d3\u05e4\u05ea \u05e9\u05e4\u05d4; \u05db\u05dc \u05d4\u05d5\u05d3\u05e2\u05d4 \u05e9\u05ea\u05e9\u05dc\u05d7 \u05dc\u05ea\u05de\u05d9\u05db\u05d4.\n\n**1.2 \u05de\u05d9\u05d3\u05e2 \u05d4\u05e0\u05d5\u05e6\u05e8 \u05de\u05e9\u05d9\u05de\u05d5\u05e9\u05da.** \u05e9\u05d9\u05e2\u05d5\u05e8\u05d9\u05dd \u05e9\u05d4\u05d5\u05e9\u05dc\u05de\u05d5, \u05ea\u05e9\u05d5\u05d1\u05d5\u05ea \u05dc\u05d7\u05d9\u05d3\u05d5\u05e0\u05d9\u05dd, \u05e0\u05e7\u05d5\u05d3\u05d5\u05ea \u05e0\u05d9\u05e1\u05d9\u05d5\u05df, \u05e8\u05de\u05d5\u05ea, \u05e8\u05e6\u05e4\u05d9\u05dd \u05d5\u05d4\u05d9\u05e9\u05d2\u05d9\u05dd; \u05d0\u05d7\u05d6\u05e7\u05d5\u05ea \u05d1\u05ea\u05d9\u05e7 \u05d5\u05d9\u05e8\u05d8\u05d5\u05d0\u05dc\u05d9 \u05d5\u05e2\u05e1\u05e7\u05d0\u05d5\u05ea \u05de\u05d3\u05d5\u05de\u05d5\u05ea; \u05d4\u05e2\u05d3\u05e4\u05d5\u05ea\u05d9\u05da \u05dc\u05e9\u05e4\u05d4, \u05e2\u05e8\u05db\u05ea \u05e0\u05d5\u05e9\u05d0, \u05d2\u05d5\u05d3\u05dc \u05d8\u05e7\u05e1\u05d8, \u05e6\u05dc\u05d9\u05dc \u05d5\u05d4\u05ea\u05e8\u05d0\u05d5\u05ea.\n\n**1.3 \u05de\u05d9\u05d3\u05e2 \u05d4\u05e0\u05d0\u05e1\u05e3 \u05d0\u05d5\u05d8\u05d5\u05de\u05d8\u05d9\u05ea.** \u05e1\u05d5\u05d2 \u05de\u05db\u05e9\u05d9\u05e8, \u05de\u05e2\u05e8\u05db\u05ea \u05d4\u05e4\u05e2\u05dc\u05d4, \u05e1\u05d5\u05d2 \u05d5\u05d2\u05e8\u05e1\u05ea \u05d3\u05e4\u05d3\u05e4\u05df \u05d5\u05de\u05de\u05d3\u05d9 \u05de\u05e1\u05da; \u05d3\u05d9\u05d5\u05d5\u05d7\u05d9 \u05e9\u05d2\u05d9\u05d0\u05d5\u05ea \u05d5\u05d9\u05d5\u05de\u05e0\u05d9 \u05e7\u05e8\u05d9\u05e1\u05d4. \u05d0\u05d9\u05e0\u05e0\u05d5 \u05de\u05e4\u05e2\u05d9\u05dc\u05d9\u05dd \u05db\u05e8\u05d2\u05e2 \u05e9\u05d9\u05e8\u05d5\u05ea \u05d0\u05e0\u05dc\u05d9\u05d8\u05d9\u05e7\u05d4 \u05e9\u05dc \u05e6\u05d3 \u05e9\u05dc\u05d9\u05e9\u05d9. \u05d0\u05dd \u05d9\u05d9\u05d5\u05d5\u05e1\u05e3 \u05e9\u05d9\u05e8\u05d5\u05ea \u05db\u05d6\u05d4, \u05de\u05d3\u05d9\u05e0\u05d9\u05d5\u05ea \u05d6\u05d5 \u05ea\u05e2\u05d5\u05d3\u05db\u05df \u05dc\u05e4\u05e0\u05d9 \u05d4\u05e4\u05e2\u05dc\u05ea\u05d5.\n\n**1.4 \u05de\u05d9\u05d3\u05e2 \u05e9\u05d0\u05d9\u05e0\u05e0\u05d5 \u05d0\u05d5\u05e1\u05e4\u05d9\u05dd.** \u05d0\u05d9\u05e0\u05e0\u05d5 \u05d0\u05d5\u05e1\u05e4\u05d9\u05dd, \u05de\u05d1\u05e7\u05e9\u05d9\u05dd \u05d0\u05d5 \u05e9\u05d5\u05de\u05e8\u05d9\u05dd \u05e4\u05e8\u05d8\u05d9 \u05d7\u05e9\u05d1\u05d5\u05e0\u05d5\u05ea \u05e4\u05d9\u05e0\u05e0\u05e1\u05d9\u05d9\u05dd \u05d0\u05de\u05d9\u05ea\u05d9\u05d9\u05dd, \u05d0\u05d9\u05e9\u05d5\u05e8\u05d9 \u05d1\u05e0\u05e7 \u05d0\u05d5 \u05d1\u05e8\u05d5\u05e7\u05e8, \u05de\u05e1\u05e4\u05e8\u05d9 \u05db\u05e8\u05d8\u05d9\u05e1\u05d9 \u05d0\u05e9\u05e8\u05d0\u05d9, \u05de\u05e1\u05e4\u05e8\u05d9 \u05d6\u05d4\u05d5\u05ea, \u05de\u05d9\u05e7\u05d5\u05dd \u05d2\u05d9\u05d0\u05d5\u05d2\u05e8\u05e4\u05d9 \u05de\u05d3\u05d5\u05d9\u05e7, \u05d0\u05e0\u05e9\u05d9 \u05e7\u05e9\u05e8, \u05ea\u05de\u05d5\u05e0\u05d5\u05ea, \u05d0\u05d5 \u05e0\u05ea\u05d5\u05e0\u05d9 \u05de\u05d9\u05e7\u05e8\u05d5\u05e4\u05d5\u05df \u05d5\u05de\u05e6\u05dc\u05de\u05d4.\n\n## 2. \u05db\u05d9\u05e6\u05d3 \u05d0\u05e0\u05d5 \u05de\u05e9\u05ea\u05de\u05e9\u05d9\u05dd \u05d1\u05de\u05d9\u05d3\u05e2\n\n\u05db\u05d3\u05d9 \u05dc\u05e1\u05e4\u05e7, \u05dc\u05d4\u05e4\u05e2\u05d9\u05dc \u05d5\u05dc\u05ea\u05d7\u05d6\u05e7 \u05d0\u05ea \u05d4\u05e9\u05d9\u05e8\u05d5\u05ea; \u05dc\u05e9\u05de\u05d5\u05e8 \u05d5\u05dc\u05e1\u05e0\u05db\u05e8\u05df \u05d0\u05ea \u05d4\u05ea\u05e7\u05d3\u05de\u05d5\u05ea\u05da \u05d1\u05d9\u05df \u05de\u05db\u05e9\u05d9\u05e8\u05d9\u05dd; \u05dc\u05d4\u05ea\u05d0\u05d9\u05dd \u05d0\u05d9\u05e9\u05d9\u05ea \u05ea\u05d5\u05db\u05df \u05dc\u05d9\u05de\u05d5\u05d3\u05d9; \u05dc\u05e9\u05dc\u05d5\u05d7 \u05d4\u05d5\u05d3\u05e2\u05d5\u05ea \u05e9\u05d9\u05e8\u05d5\u05ea \u05db\u05d2\u05d5\u05df \u05d0\u05d9\u05de\u05d5\u05ea \u05d7\u05e9\u05d1\u05d5\u05df \u05d5\u05d0\u05d9\u05e4\u05d5\u05e1 \u05e1\u05d9\u05e1\u05de\u05d4; \u05dc\u05e9\u05dc\u05d5\u05d7 \u05ea\u05d6\u05db\u05d5\u05e8\u05d5\u05ea \u05dc\u05d9\u05de\u05d5\u05d3 \u05d0\u05d5\u05e4\u05e6\u05d9\u05d5\u05e0\u05dc\u05d9\u05d5\u05ea \u05e9\u05e0\u05d9\u05ea\u05df \u05dc\u05db\u05d1\u05d5\u05ea \u05d1\u05db\u05dc \u05e2\u05ea; \u05dc\u05d0\u05d1\u05d7\u05df \u05ea\u05e7\u05dc\u05d5\u05ea, \u05dc\u05de\u05e0\u05d5\u05e2 \u05e9\u05d9\u05de\u05d5\u05e9 \u05dc\u05e8\u05e2\u05d4 \u05d5\u05dc\u05e9\u05e4\u05e8 \u05d0\u05ea \u05d4\u05e9\u05d9\u05e8\u05d5\u05ea; \u05d5\u05dc\u05e2\u05de\u05d5\u05d3 \u05d1\u05d7\u05d5\u05d1\u05d5\u05ea \u05de\u05e9\u05e4\u05d8\u05d9\u05d5\u05ea.\n\n**\u05d0\u05d9\u05e0\u05e0\u05d5 \u05de\u05d5\u05db\u05e8\u05d9\u05dd \u05d0\u05ea \u05d4\u05de\u05d9\u05d3\u05e2 \u05d4\u05d0\u05d9\u05e9\u05d9 \u05e9\u05dc\u05da \u05d5\u05d0\u05d9\u05e0\u05e0\u05d5 \u05de\u05e9\u05ea\u05de\u05e9\u05d9\u05dd \u05d1\u05d5 \u05dc\u05e4\u05e8\u05e1\u05d5\u05dd \u05e6\u05d3 \u05e9\u05dc\u05d9\u05e9\u05d9.**\n\n## 3. \u05d4\u05d1\u05e1\u05d9\u05e1 \u05d4\u05d7\u05d5\u05e7\u05d9 \u05dc\u05e2\u05d9\u05d1\u05d5\u05d3 (GDPR)\n\n\u05d1\u05de\u05e7\u05d5\u05dd \u05e9\u05d1\u05d5 \u05d7\u05dc\u05d4 \u05ea\u05e7\u05e0\u05ea \u05d4-GDPR \u05d4\u05d0\u05d9\u05e8\u05d5\u05e4\u05d9\u05ea, \u05d0\u05e0\u05d5 \u05de\u05e2\u05d1\u05d3\u05d9\u05dd \u05de\u05d9\u05d3\u05e2 \u05d0\u05d9\u05e9\u05d9 \u05e2\u05dc \u05d1\u05e1\u05d9\u05e1: **\u05d7\u05d5\u05d6\u05d4**, \u05dc\u05d0\u05e1\u05e4\u05e7\u05ea \u05d4\u05e9\u05d9\u05e8\u05d5\u05ea \u05e9\u05d1\u05d9\u05e7\u05e9\u05ea; **\u05d0\u05d9\u05e0\u05d8\u05e8\u05e1\u05d9\u05dd \u05dc\u05d2\u05d9\u05d8\u05d9\u05de\u05d9\u05d9\u05dd**, \u05dc\u05d0\u05d1\u05d8\u05d7\u05d4, \u05ea\u05d7\u05d6\u05d5\u05e7\u05d4 \u05d5\u05e9\u05d9\u05e4\u05d5\u05e8 \u05d4\u05e9\u05d9\u05e8\u05d5\u05ea; **\u05d4\u05e1\u05db\u05de\u05d4**, \u05dc\u05d4\u05ea\u05e8\u05d0\u05d5\u05ea \u05d0\u05d5\u05e4\u05e6\u05d9\u05d5\u05e0\u05dc\u05d9\u05d5\u05ea \u05d5\u05d0\u05e0\u05dc\u05d9\u05d8\u05d9\u05e7\u05d4 \u05e9\u05d0\u05d9\u05e0\u05d4 \u05d7\u05d9\u05d5\u05e0\u05d9\u05ea, \u05d0\u05d5\u05ea\u05d4 \u05e0\u05d9\u05ea\u05df \u05dc\u05de\u05e9\u05d5\u05da \u05d1\u05db\u05dc \u05e2\u05ea; \u05d5**\u05d7\u05d5\u05d1\u05d4 \u05d7\u05d5\u05e7\u05d9\u05ea**, \u05db\u05d0\u05e9\u05e8 \u05d4\u05e2\u05d9\u05d1\u05d5\u05d3 \u05e0\u05d3\u05e8\u05e9 \u05e2\u05dc \u05e4\u05d9 \u05d3\u05d9\u05df.\n\n## 4. \u05d0\u05d7\u05e1\u05d5\u05df \u05d5\u05d0\u05d1\u05d8\u05d7\u05ea \u05de\u05d9\u05d3\u05e2\n\n\u05d4\u05e0\u05ea\u05d5\u05e0\u05d9\u05dd \u05de\u05d0\u05d5\u05d7\u05e1\u05e0\u05d9\u05dd \u05d1\u05ea\u05e9\u05ea\u05d9\u05ea \u05d4\u05de\u05d5\u05e4\u05e2\u05dc\u05ea \u05e2\u05dc \u05d9\u05d3\u05d9 Supabase, Inc., \u05d4\u05de\u05e9\u05ea\u05de\u05e9\u05ea \u05d1\u05de\u05e8\u05db\u05d6\u05d9 \u05e0\u05ea\u05d5\u05e0\u05d9\u05dd \u05e9\u05dc Amazon Web Services. \u05d4\u05e0\u05ea\u05d5\u05e0\u05d9\u05dd \u05e2\u05e9\u05d5\u05d9\u05d9\u05dd \u05dc\u05d4\u05d9\u05d5\u05ea \u05de\u05e2\u05d5\u05d1\u05d3\u05d9\u05dd \u05d1\u05d0\u05d9\u05d7\u05d5\u05d3 \u05d4\u05d0\u05d9\u05e8\u05d5\u05e4\u05d9, \u05d1\u05d0\u05e8\u05e6\u05d5\u05ea \u05d4\u05d1\u05e8\u05d9\u05ea \u05d0\u05d5 \u05d1\u05d0\u05d6\u05d5\u05e8\u05d9\u05dd \u05d0\u05d7\u05e8\u05d9\u05dd \u05e9\u05d1\u05d4\u05dd \u05e4\u05d5\u05e2\u05dc\u05d9\u05dd \u05e1\u05e4\u05e7\u05d9\u05e0\u05d5.\n\n\u05d0\u05de\u05e6\u05e2\u05d9 \u05d4\u05d0\u05d1\u05d8\u05d7\u05d4 \u05db\u05d5\u05dc\u05dc\u05d9\u05dd \u05d4\u05e6\u05e4\u05e0\u05d4 \u05d1\u05d4\u05e2\u05d1\u05e8\u05d4 (TLS) \u05d5\u05d1\u05de\u05e0\u05d5\u05d7\u05d4; \u05e1\u05d9\u05e1\u05de\u05d0\u05d5\u05ea \u05d4\u05e0\u05e9\u05de\u05e8\u05d5\u05ea \u05d0\u05da \u05d5\u05e8\u05e7 \u05db\u05d2\u05d9\u05d1\u05d5\u05d1 \u05e7\u05e8\u05d9\u05e4\u05d8\u05d5\u05d2\u05e8\u05e4\u05d9 \u05e2\u05dd \u05de\u05dc\u05d7; \u05de\u05d3\u05d9\u05e0\u05d9\u05d5\u05ea Row Level Security \u05d4\u05de\u05d2\u05d1\u05d9\u05dc\u05d4 \u05db\u05dc \u05de\u05e9\u05ea\u05de\u05e9 \u05dc\u05e0\u05ea\u05d5\u05e0\u05d9\u05dd \u05e9\u05dc\u05d5 \u05d1\u05dc\u05d1\u05d3; \u05d5\u05d1\u05e7\u05e8\u05d5\u05ea \u05d2\u05d9\u05e9\u05d4 \u05d4\u05de\u05d2\u05d1\u05d9\u05dc\u05d5\u05ea \u05d2\u05d9\u05e9\u05ea \u05e6\u05d5\u05d5\u05ea \u05dc\u05e0\u05ea\u05d5\u05e0\u05d9 \u05d9\u05d9\u05e6\u05d5\u05e8.\n\n**\u05e9\u05d5\u05dd \u05de\u05e2\u05e8\u05db\u05ea \u05d0\u05d9\u05e0\u05d4 \u05de\u05d0\u05d5\u05d1\u05d8\u05d7\u05ea \u05dc\u05d7\u05dc\u05d5\u05d8\u05d9\u05df.** \u05d0\u05e3 \u05e9\u05d0\u05e0\u05d5 \u05e0\u05d5\u05e7\u05d8\u05d9\u05dd \u05d0\u05de\u05e6\u05e2\u05d9\u05dd \u05e1\u05d1\u05d9\u05e8\u05d9\u05dd, \u05d0\u05d9\u05e0\u05e0\u05d5 \u05d9\u05db\u05d5\u05dc\u05d9\u05dd \u05dc\u05d4\u05d1\u05d8\u05d9\u05d7 \u05d0\u05d1\u05d8\u05d7\u05d4 \u05de\u05d5\u05d7\u05dc\u05d8\u05ea.\n\n**\u05d0\u05d7\u05e1\u05d5\u05df \u05de\u05e7\u05d5\u05de\u05d9.** \u05d7\u05dc\u05e7 \u05de\u05d4\u05e0\u05ea\u05d5\u05e0\u05d9\u05dd \u05e0\u05e9\u05de\u05e8\u05d9\u05dd \u05d1\u05d0\u05d7\u05e1\u05d5\u05df \u05d4\u05de\u05e7\u05d5\u05de\u05d9 \u05e9\u05dc \u05d4\u05d3\u05e4\u05d3\u05e4\u05df \u05db\u05d3\u05d9 \u05e9\u05d4\u05e9\u05d9\u05e8\u05d5\u05ea \u05d9\u05e2\u05d1\u05d5\u05d3 \u05d2\u05dd \u05dc\u05dc\u05d0 \u05d7\u05d9\u05d1\u05d5\u05e8. \u05d0\u05dd \u05ea\u05de\u05d7\u05e7 \u05d0\u05ea \u05e0\u05ea\u05d5\u05e0\u05d9 \u05d4\u05d3\u05e4\u05d3\u05e4\u05df \u05dc\u05dc\u05d0 \u05d7\u05e9\u05d1\u05d5\u05df \u05d1\u05e2\u05e0\u05df \u2014 \u05dc\u05d0 \u05e0\u05d5\u05db\u05dc \u05dc\u05e9\u05d7\u05d6\u05e8 \u05d0\u05ea \u05d4\u05d4\u05ea\u05e7\u05d3\u05de\u05d5\u05ea \u05d4\u05de\u05e7\u05d5\u05de\u05d9\u05ea.\n\n## 5. \u05e9\u05d9\u05e8\u05d5\u05ea\u05d9 \u05e6\u05d3 \u05e9\u05dc\u05d9\u05e9\u05d9\n\n**Supabase, Inc.** \u2014 \u05de\u05e1\u05d3 \u05e0\u05ea\u05d5\u05e0\u05d9\u05dd, \u05d0\u05d9\u05de\u05d5\u05ea \u05d5\u05d0\u05d7\u05e1\u05d5\u05df (supabase.com/privacy). **GitHub, Inc. (GitHub Pages)** \u2014 \u05d0\u05d9\u05e8\u05d5\u05d7 \u05d4\u05d0\u05ea\u05e8 (docs.github.com/site-policy). **Google LLC** \u2014 \u05db\u05e0\u05d9\u05e1\u05d4 \u05e2\u05dd Google, \u05d0\u05d5\u05e4\u05e6\u05d9\u05d5\u05e0\u05dc\u05d9 (policies.google.com/privacy). **Apple Inc.** \u2014 \u05db\u05e0\u05d9\u05e1\u05d4 \u05e2\u05dd Apple, \u05d0\u05d5\u05e4\u05e6\u05d9\u05d5\u05e0\u05dc\u05d9 (apple.com/legal/privacy).\n\n\u05e1\u05e4\u05e7\u05d9\u05dd \u05d0\u05dc\u05d4 \u05de\u05e2\u05d1\u05d3\u05d9\u05dd \u05e0\u05ea\u05d5\u05e0\u05d9\u05dd \u05d1\u05e9\u05de\u05e0\u05d5 \u05ea\u05d7\u05ea \u05d4\u05ea\u05d7\u05d9\u05d9\u05d1\u05d5\u05d9\u05d5\u05ea \u05d7\u05d5\u05d6\u05d9\u05d5\u05ea. \u05d0\u05d9\u05e0\u05e0\u05d5 \u05de\u05ea\u05d9\u05e8\u05d9\u05dd \u05dc\u05d4\u05dd \u05dc\u05d4\u05e9\u05ea\u05de\u05e9 \u05d1\u05e0\u05ea\u05d5\u05e0\u05d9\u05dd \u05e9\u05dc\u05da \u05dc\u05de\u05d8\u05e8\u05d5\u05ea\u05d9\u05d4\u05dd.\n\n## 6. \u05e9\u05de\u05d9\u05e8\u05ea \u05de\u05d9\u05d3\u05e2\n\n\u05d0\u05e0\u05d5 \u05e9\u05d5\u05de\u05e8\u05d9\u05dd \u05e0\u05ea\u05d5\u05e0\u05d9 \u05d7\u05e9\u05d1\u05d5\u05df \u05db\u05dc \u05e2\u05d5\u05d3 \u05d4\u05d7\u05e9\u05d1\u05d5\u05df \u05e4\u05e2\u05d9\u05dc. \u05d0\u05dd \u05ea\u05de\u05d7\u05e7 \u05d0\u05ea \u05d7\u05e9\u05d1\u05d5\u05e0\u05da, \u05d4\u05de\u05d9\u05d3\u05e2 \u05d4\u05d0\u05d9\u05e9\u05d9 \u05d9\u05d9\u05de\u05d7\u05e7 \u05d1\u05ea\u05d5\u05da **30 \u05d9\u05d5\u05dd**, \u05dc\u05de\u05e2\u05d8 \u05de\u05e7\u05e8\u05d9\u05dd \u05e9\u05d1\u05d4\u05dd \u05e9\u05de\u05d9\u05e8\u05d4 \u05e0\u05d3\u05e8\u05e9\u05ea \u05e2\u05dc \u05e4\u05d9 \u05d3\u05d9\u05df. \u05e1\u05d8\u05d8\u05d9\u05e1\u05d8\u05d9\u05e7\u05d5\u05ea \u05d0\u05e0\u05d5\u05e0\u05d9\u05de\u05d9\u05d5\u05ea \u05d5\u05de\u05e6\u05d8\u05d1\u05e8\u05d5\u05ea \u05e9\u05d0\u05d9\u05e0\u05df \u05de\u05d0\u05e4\u05e9\u05e8\u05d5\u05ea \u05dc\u05d6\u05d4\u05d5\u05ea\u05da \u05e2\u05e9\u05d5\u05d9\u05d5\u05ea \u05dc\u05d4\u05d9\u05e9\u05de\u05e8 \u05dc\u05dc\u05d0 \u05d4\u05d2\u05d1\u05dc\u05ea \u05d6\u05de\u05df.\n\n## 7. \u05d4\u05d6\u05db\u05d5\u05d9\u05d5\u05ea \u05e9\u05dc\u05da\n\n**7.1 \u05dc\u05e4\u05d9 GDPR (\u05d4\u05d0\u05d9\u05d7\u05d5\u05d3 \u05d4\u05d0\u05d9\u05e8\u05d5\u05e4\u05d9, \u05d1\u05e8\u05d9\u05d8\u05e0\u05d9\u05d4, \u05e9\u05d5\u05d5\u05d9\u05d9\u05e5).** \u05e2\u05d5\u05de\u05d3\u05ea \u05dc\u05da \u05d4\u05d6\u05db\u05d5\u05ea \u05dc\u05e2\u05d9\u05d9\u05df \u05d1\u05e0\u05ea\u05d5\u05e0\u05d9\u05da; \u05dc\u05d1\u05e7\u05e9 \u05ea\u05d9\u05e7\u05d5\u05df \u05de\u05d9\u05d3\u05e2 \u05e9\u05d2\u05d5\u05d9; \u05dc\u05d1\u05e7\u05e9 \u05de\u05d7\u05d9\u05e7\u05d4; \u05dc\u05d4\u05d2\u05d1\u05d9\u05dc \u05e2\u05d9\u05d1\u05d5\u05d3; \u05dc\u05d4\u05ea\u05e0\u05d2\u05d3 \u05dc\u05e2\u05d9\u05d1\u05d5\u05d3 \u05d4\u05de\u05d1\u05d5\u05e1\u05e1 \u05e2\u05dc \u05d0\u05d9\u05e0\u05d8\u05e8\u05e1\u05d9\u05dd \u05dc\u05d2\u05d9\u05d8\u05d9\u05de\u05d9\u05d9\u05dd; \u05dc\u05e7\u05d1\u05dc \u05d0\u05ea \u05e0\u05ea\u05d5\u05e0\u05d9\u05da \u05d1\u05e4\u05d5\u05e8\u05de\u05d8 \u05e0\u05d9\u05d9\u05d3; \u05d5\u05dc\u05de\u05e9\u05d5\u05da \u05d4\u05e1\u05db\u05de\u05d4 \u05d1\u05db\u05dc \u05e2\u05ea. \u05ea\u05d5\u05db\u05dc \u05d2\u05dd \u05dc\u05d4\u05d2\u05d9\u05e9 \u05ea\u05dc\u05d5\u05e0\u05d4 \u05dc\u05e8\u05e9\u05d5\u05ea \u05d4\u05e4\u05d9\u05e7\u05d5\u05d7 \u05d4\u05dc\u05d0\u05d5\u05de\u05d9\u05ea \u05e9\u05dc\u05da.\n\n**7.2 \u05dc\u05e4\u05d9 CCPA/CPRA (\u05e7\u05dc\u05d9\u05e4\u05d5\u05e8\u05e0\u05d9\u05d4).** \u05e2\u05d5\u05de\u05d3\u05ea \u05dc\u05da \u05d4\u05d6\u05db\u05d5\u05ea \u05dc\u05d3\u05e2\u05ea \u05d0\u05d9\u05d6\u05d4 \u05de\u05d9\u05d3\u05e2 \u05e0\u05d0\u05e1\u05e3 \u05d5\u05db\u05d9\u05e6\u05d3 \u05e0\u05e2\u05e9\u05d4 \u05d1\u05d5 \u05e9\u05d9\u05de\u05d5\u05e9; \u05dc\u05d1\u05e7\u05e9 \u05de\u05d7\u05d9\u05e7\u05d4; \u05dc\u05d1\u05e7\u05e9 \u05ea\u05d9\u05e7\u05d5\u05df; \u05dc\u05d1\u05d8\u05dc \u05d4\u05e1\u05db\u05de\u05d4 \u05dc\u05de\u05db\u05d9\u05e8\u05d4 \u05d0\u05d5 \u05e9\u05d9\u05ea\u05d5\u05e3 \u2014 **\u05d0\u05d9\u05e0\u05e0\u05d5 \u05de\u05d5\u05db\u05e8\u05d9\u05dd \u05d0\u05d5 \u05de\u05e9\u05ea\u05e4\u05d9\u05dd \u05de\u05d9\u05d3\u05e2 \u05d0\u05d9\u05e9\u05d9**; \u05d5\u05dc\u05d0 \u05dc\u05d4\u05d9\u05d5\u05ea \u05de\u05d5\u05e4\u05dc\u05d4 \u05d1\u05e9\u05dc \u05de\u05d9\u05de\u05d5\u05e9 \u05d6\u05db\u05d5\u05d9\u05d5\u05ea \u05d0\u05dc\u05d4.\n\n**7.3 \u05de\u05d9\u05de\u05d5\u05e9 \u05d4\u05d6\u05db\u05d5\u05d9\u05d5\u05ea.** \u05e4\u05e0\u05d4 \u05d0\u05dc **investyrozen@gmail.com**. \u05e0\u05e9\u05d9\u05d1 \u05d1\u05ea\u05d5\u05da \u05e4\u05e8\u05e7 \u05d4\u05d6\u05de\u05df \u05d4\u05e0\u05d3\u05e8\u05e9 \u05d1\u05d7\u05d5\u05e7 \u05d4\u05d7\u05dc (\u05d1\u05d3\u05e8\u05da \u05db\u05dc\u05dc 30 \u05d9\u05d5\u05dd \u05dc\u05e4\u05d9 GDPR, 45 \u05d9\u05d5\u05dd \u05dc\u05e4\u05d9 CCPA). \u05d9\u05d9\u05ea\u05db\u05df \u05e9\u05e0\u05d9\u05d3\u05e8\u05e9 \u05dc\u05d0\u05de\u05ea \u05d0\u05ea \u05d6\u05d4\u05d5\u05ea\u05da.\n\n## 8. \u05de\u05d7\u05d9\u05e7\u05ea \u05d7\u05e9\u05d1\u05d5\u05df \u05d5\u05e0\u05ea\u05d5\u05e0\u05d9\u05dd\n\n\u05e4\u05ea\u05d7 \u05d0\u05ea \u05d4\u05d0\u05e4\u05dc\u05d9\u05e7\u05e6\u05d9\u05d4, \u05e2\u05d1\u05d5\u05e8 \u05d0\u05dc **\u05e4\u05e8\u05d5\u05e4\u05d9\u05dc \u2192 \u05d4\u05d2\u05d3\u05e8\u05d5\u05ea**, \u05d1\u05d7\u05e8 **\u05de\u05d7\u05e7 \u05d7\u05e9\u05d1\u05d5\u05df**, \u05d5\u05d0\u05e9\u05e8. \u05dc\u05d7\u05dc\u05d5\u05e4\u05d9\u05df \u05e9\u05dc\u05d7 \u05de\u05d9\u05d9\u05dc \u05d0\u05dc **investyrozen@gmail.com** \u05e2\u05dd \u05d4\u05e0\u05d5\u05e9\u05d0 \"\u05de\u05d7\u05d9\u05e7\u05ea \u05d7\u05e9\u05d1\u05d5\u05df\".\n\n\u05d4\u05de\u05d7\u05d9\u05e7\u05d4 \u05de\u05e1\u05d9\u05e8\u05d4 \u05d0\u05ea 5e1\u05d9\u05de\u05d5\u05dc\u05e6\u05d9\u05d5\u05ea, \u05de\u05d5\u05e0\u05d7\u05d9 \u05de\u05d9\u05dc\u05d5\u05df, \u05d4\u05d5\u05d3\u05e2\u05d5\u05ea \u05de\u05d0\u05de\u05df \u05d5\u05ea\u05e8\u05d7\u05d9\u05e9\u05d9\u05dd \u05d4\u05d9\u05e1\u05d8\u05d5\u05e8\u05d9\u05d9\u05dd \u2014 \u05de\u05e1\u05d5\u05e4\u05e7 **\u05dc\u05de\u05d8\u05e8\u05d5\u05ea \u05d7\u05d9\u05e0\u05d5\u05db\u05d9\u05d5\u05ea \u05d5\u05de\u05d9\u05d3\u05e2\u05d9\u05d5\u05ea \u05db\u05dc\u05dc\u05d9\u05d5\u05ea \u05d1\u05dc\u05d1\u05d3**.\n\n## 3. \u05d0\u05d9\u05df \u05d9\u05d9\u05e2\u05d5\u05e5 \u05e4\u05d9\u05e0\u05e0\u05e1\u05d9, \u05d4\u05e9\u05e7\u05e2\u05d5\u05ea, \u05de\u05e9\u05e4\u05d8\u05d9 \u05d0\u05d5 \u05de\u05e1\n\n**3.1** \u05e9\u05d5\u05dd \u05d3\u05d1\u05e8 \u05d1\u05e9\u05d9\u05e8\u05d5\u05ea \u05d0\u05d9\u05e0\u05d5 \u05de\u05d4\u05d5\u05d5\u05d4, \u05d5\u05d0\u05d9\u05df \u05dc\u05e4\u05e8\u05e9\u05d5 \u05db\u05be\u05d9\u05d9\u05e2\u05d5\u05e5 \u05d4\u05e9\u05e7\u05e2\u05d5\u05ea, \u05d9\u05d9\u05e2\u05d5\u05e5 \u05e4\u05d9\u05e0\u05e0\u05e1\u05d9, \u05e9\u05d9\u05d5\u05d5\u05e7 \u05d4\u05e9\u05e7\u05e2\u05d5\u05ea, \u05e0\u05d9\u05d4\u05d5\u05dc \u05ea\u05d9\u05e7\u05d9\u05dd, \u05d9\u05d9\u05e2\u05d5\u05e5 \u05de\u05e1, \u05d9\u05d9\u05e2\u05d5\u05e5 \u05d7\u05e9\u05d1\u05d5\u05e0\u05d0\u05d9 \u05d0\u05d5 \u05d9\u05d9\u05e2\u05d5\u05e5 \u05de\u05e9\u05e4\u05d8\u05d9.\n\n**3.2** \u05d0\u05d9\u05e0\u05e0\u05d5 \u05d9\u05d5\u05e2\u05e5 \u05d4\u05e9\u05e7\u05e2\u05d5\u05ea \u05de\u05d5\u05e8\u05e9\u05d4, \u05de\u05e9\u05d5\u05d5\u05e7 \u05d4\u05e9\u05e7\u05e2\u05d5\u05ea, \u05de\u05e0\u05d4\u05dc \u05ea\u05d9\u05e7\u05d9\u05dd, \u05d7\u05d1\u05e8 \u05d1\u05d5\u05e8\u05e1\u05d4, \u05d1\u05e0\u05e7 \u05d0\u05d5 \u05de\u05d5\u05e1\u05d3 \u05e4\u05d9\u05e0\u05e0\u05e1\u05d9, \u05d5\u05d0\u05d9\u05e0\u05e0\u05d5 \u05e8\u05e9\u05d5\u05de\u05d9\u05dd \u05db\u05db\u05d0\u05dc\u05d4 \u05d1\u05e9\u05d5\u05dd \u05ea\u05d7\u05d5\u05dd \u05e9\u05d9\u05e4\u05d5\u05d8.\n\n**3.3** \u05e9\u05d5\u05dd \u05ea\u05d5\u05db\u05df \u05d0\u05d9\u05e0\u05d5 \u05d4\u05de\u05dc\u05e6\u05d4, \u05d4\u05e6\u05e2\u05d4 \u05d0\u05d5 \u05e9\u05d9\u05d3\u05d5\u05dc \u05dc\u05e8\u05db\u05d5\u05e9, \u05dc\u05de\u05db\u05d5\u05e8 \u05d0\u05d5 \u05dc\u05d4\u05d7\u05d6\u05d9\u05e7 \u05e0\u05d9\u05d9\u05e8 \u05e2\u05e8\u05da, \u05de\u05db\u05e9\u05d9\u05e8 \u05e4\u05d9\u05e0\u05e0\u05e1\u05d9, \u05de\u05d8\u05d1\u05e2 \u05e7\u05e8\u05d9\u05e4\u05d8\u05d5\u05d2\u05e8\u05e4\u05d9 \u05d0\u05d5 \u05e0\u05db\u05e1 \u05d0\u05d7\u05e8.\n\n**3.4** \u05d4\u05ea\u05d5\u05db\u05df \u05db\u05dc\u05dc\u05d9 \u05d1\u05d0\u05d5\u05e4\u05d9\u05d5 \u05d5\u05d0\u05d9\u05e0\u05d5 \u05de\u05ea\u05d7\u05e9\u05d1 \u05d1\u05e0\u05e1\u05d9\u05d1\u05d5\u05ea\u05d9\u05da \u05d4\u05d0\u05d9\u05e9\u05d9\u05d5\u05ea, \u05d1\u05de\u05e6\u05d1\u05da \u05d4\u05e4\u05d9\u05e0\u05e0\u05e1\u05d9, \u05d1\u05d9\u05e2\u05d3\u05d9\u05da, \u05d1\u05e1\u05d5\u05d1\u05dc\u05e0\u05d5\u05ea \u05d4\u05e1\u05d9\u05db\u05d5\u05df \u05e9\u05dc\u05da \u05d0\u05d5 \u05d1\u05e6\u05e8\u05db\u05d9\u05da.\n\n**3.5 \u05e2\u05dc\u05d9\u05da \u05dc\u05d4\u05ea\u05d9\u05d9\u05e2\u05e5 \u05e2\u05dd \u05d0\u05d9\u05e9 \u05de\u05e7\u05e6\u05d5\u05e2 \u05de\u05d5\u05e8\u05e9\u05d4 \u05dc\u05e4\u05e0\u05d9 \u05e7\u05d1\u05dc\u05ea \u05db\u05dc \u05d4\u05d7\u05dc\u05d8\u05d4 \u05e4\u05d9\u05e0\u05e0\u05e1\u05d9\u05ea.**\n\n## 4. \u05d0\u05d7\u05e8\u05d9\u05d5\u05ea\u05da \u05dc\u05d4\u05d7\u05dc\u05d8\u05d5\u05ea\u05d9\u05da\n\n**4.1** \u05d0\u05ea\u05d4 \u05d4\u05d0\u05d7\u05e8\u05d0\u05d9 \u05d4\u05d1\u05dc\u05e2\u05d3\u05d9 \u05dc\u05db\u05dc \u05d4\u05d7\u05dc\u05d8\u05d4 \u05e4\u05d9\u05e0\u05e0\u05e1\u05d9\u05ea \u05e9\u05ea\u05e7\u05d1\u05dc.\n\n**4.2** \u05d4\u05e9\u05e7\u05e2\u05d4 \u05db\u05e8\u05d5\u05db\u05d4 \u05d1\u05e1\u05d9\u05db\u05d5\u05df, **\u05dc\u05e8\u05d1\u05d5\u05ea \u05e1\u05d9\u05db\u05d5\u05df \u05dc\u05d0\u05d5\u05d1\u05d3\u05df \u05de\u05dc\u05d0 \u05e9\u05dc \u05d4\u05e7\u05e8\u05df**. \u05ea\u05e9\u05d5\u05d0\u05d5\u05ea \u05e2\u05d1\u05e8 \u05d0\u05d9\u05e0\u05df \u05de\u05e2\u05d9\u05d3\u05d5\u05ea \u05e2\u05dc \u05ea\u05e9\u05d5\u05d0\u05d5\u05ea \u05e2\u05ea\u05d9\u05d3.\n\n**4.3** \u05d0\u05d9\u05e0\u05e0\u05d5 \u05d0\u05d7\u05e8\u05d0\u05d9\u05dd \u05dc\u05db\u05dc \u05d4\u05e4\u05e1\u05d3 \u05d0\u05d5 \u05e0\u05d6\u05e7 \u05d4\u05e0\u05d5\u05d1\u05e2 \u05de\u05d4\u05d7\u05dc\u05d8\u05d5\u05ea \u05e9\u05e7\u05d9\u05d1\u05dc\u05ea, \u05d1\u05d9\u05df \u05d0\u05dd \u05d4\u05d5\u05e9\u05e4\u05e2\u05d5 \u05de\u05ea\u05d5\u05db\u05df \u05d1\u05e9\u05d9\u05e8\u05d5\u05ea \u05d5\u05d1\u05d9\u05df \u05d0\u05dd \u05dc\u05d0\u05d5.\n\n## 5. \u05de\u05e1\u05d7\u05e8 \u05de\u05d3\u05d5\u05de\u05d4\n\n**5.1** \u05e1\u05d9\u05de\u05d5\u05dc\u05d8\u05d5\u05e8 \u05d4\u05de\u05e1\u05d7\u05e8 \u05de\u05e9\u05ea\u05de\u05e9 **\u05d1\u05de\u05d8\u05d1\u05e2 \u05d5\u05d9\u05e8\u05d8\u05d5\u05d0\u05dc\u05d9 \u05d1\u05dc\u05d1\u05d3**. \u05d0\u05d9\u05df \u05d1\u05d5 \u05db\u05e1\u05e3 \u05d0\u05de\u05d9\u05ea\u05d9, \u05e0\u05d9\u05d9\u05e8\u05d5\u05ea \u05e2\u05e8\u05da \u05d0\u05de\u05d9\u05ea\u05d9\u05d9\u05dd \u05d0\u05d5 \u05e2\u05e1\u05e7\u05d0\u05d5\u05ea \u05d0\u05de\u05d9\u05ea\u05d9\u05d5\u05ea.\n\n**5.2** \u05d4\u05d7\u05d1\u05e8\u05d5\u05ea, \u05d4\u05de\u05d7\u05d9\u05e8\u05d9\u05dd \u05d5\u05d0\u05d9\u05e8\u05d5\u05e2\u05d9 \u05d4\u05e9\u05d5\u05e7 \u05d1\u05e1\u05d9\u05de\u05d5\u05dc\u05d8\u05d5\u05e8 \u05d4\u05dd **\u05d1\u05d3\u05d9\u05d5\u05e0\u05d9\u05d9\u05dd \u05d0\u05d5 \u05de\u05e4\u05d5\u05e9\u05d8\u05d9\u05dd \u05dc\u05e6\u05d5\u05e8\u05db\u05d9 \u05d4\u05d5\u05e8\u05d0\u05d4**, \u05d5\u05d0\u05d9\u05e0\u05dd \u05de\u05d9\u05d9\u05e6\u05d2\u05d9\u05dd \u05e0\u05d9\u05d9\u05e8\u05d5\u05ea \u05e2\u05e8\u05da \u05d0\u05de\u05d9\u05ea\u05d9\u05d9\u05dd \u05d0\u05d5 \u05ea\u05e0\u05d0\u05d9 \u05e9\u05d5\u05e7 \u05d0\u05de\u05d9\u05ea\u05d9\u05d9\u05dd.\n\n**5.3** \u05ea\u05e8\u05d7\u05d9\u05e9\u05d9 \u05d4\u05de\u05e4\u05d5\u05dc\u05d5\u05ea \u05d4\u05d4\u05d9\u05e1\u05d8\u05d5\u05e8\u05d9\u05d5\u05ea \u05de\u05d1\u05d5\u05e1\u05e1\u05d9\u05dd \u05e2\u05dc \u05de\u05d9\u05d3\u05e2 \u05e6\u05d9\u05d1\u05d5\u05e8\u05d9 \u05e9\u05e0\u05d7\u05e7\u05e8, \u05d0\u05da \u05e4\u05d5\u05e9\u05d8\u05d5 \u05dc\u05e6\u05d5\u05e8\u05db\u05d9 \u05d4\u05d5\u05e8\u05d0\u05d4. **\u05ea\u05d5\u05e6\u05d0\u05d5\u05ea \u05d1\u05e1\u05d9\u05de\u05d5\u05dc\u05d8\u05d5\u05e8 \u05d0\u05d9\u05e0\u05df \u05de\u05e2\u05d9\u05d3\u05d5\u05ea \u05e2\u05dc \u05ea\u05d5\u05e6\u05d0\u05d5\u05ea \u05d1\u05e2\u05d5\u05dc\u05dd \u05d4\u05d0\u05de\u05d9\u05ea\u05d9.**\n\n## 6. \u05d7\u05e9\u05d1\u05d5\u05e0\u05d5\u05ea\n\n**6.1** \u05e2\u05dc\u05d9\u05da \u05dc\u05e1\u05e4\u05e7 \u05de\u05d9\u05d3\u05e2 \u05de\u05d3\u05d5\u05d9\u05e7 \u05d1\u05d9\u05e6\u05d9\u05e8\u05ea \u05d7\u05e9\u05d1\u05d5\u05df \u05d5\u05dc\u05e9\u05de\u05d5\u05e8 \u05e2\u05dc \u05e2\u05d3\u05db\u05e0\u05d9\u05d5\u05ea\u05d5.\n\n**6.2** \u05d0\u05ea\u05d4 \u05d0\u05d7\u05e8\u05d0\u05d9 \u05dc\u05e1\u05d5\u05d3\u05d9\u05d5\u05ea \u05e4\u05e8\u05d8\u05d9 \u05d4\u05db\u05e0\u05d9\u05e1\u05d4 \u05e9\u05dc\u05da \u05d5\u05dc\u05db\u05dc \u05e4\u05e2\u05d9\u05dc\u05d5\u05ea \u05ea\u05d7\u05ea \u05d7\u05e9\u05d1\u05d5\u05e0\u05da.\n\n**6.3** \u05e2\u05dc\u05d9\u05da \u05dc\u05d4\u05d9\u05d5\u05ea \u05d1\u05df **13 \u05dc\u05e4\u05d7\u05d5\u05ea**, \u05d0\u05d5 **16** \u05d1\u05de\u05e7\u05d5\u05dd \u05e9\u05d4\u05d3\u05d9\u05df \u05d4\u05de\u05e7\u05d5\u05de\u05d9 \u05de\u05d7\u05d9\u05d9\u05d1. \u05d0\u05dd \u05d0\u05ea\u05d4 \u05e7\u05d8\u05d9\u05df \u05d1\u05ea\u05d7\u05d5\u05dd \u05d4\u05e9\u05d9\u05e4\u05d5\u05d8 \u05e9\u05dc\u05da, \u05d4\u05e9\u05d9\u05de\u05d5\u05e9 \u05de\u05d5\u05ea\u05e8 \u05e8\u05e7 \u05d1\u05d4\u05e1\u05db\u05de\u05ea \u05d4\u05d5\u05e8\u05d4 \u05d0\u05d5 \u05d0\u05e4\u05d5\u05d8\u05e8\u05d5\u05e4\u05d5\u05e1 \u05d5\u05d1\u05e4\u05d9\u05e7\u05d5\u05d7\u05d5.\n\n**6.4** \u05d0\u05d3\u05dd \u05d0\u05d7\u05d3 \u05d0\u05d9\u05e0\u05d5 \u05e8\u05e9\u05d0\u05d9 \u05dc\u05d4\u05d7\u05d6\u05d9\u05e7 \u05de\u05e1\u05e4\u05e8 \u05d7\u05e9\u05d1\u05d5\u05e0\u05d5\u05ea \u05dc\u05e6\u05d5\u05e8\u05da \u05de\u05e0\u05d9\u05e4\u05d5\u05dc\u05e6\u05d9\u05d4 \u05e9\u05dc \u05dc\u05d5\u05d7\u05d5\u05ea \u05ea\u05d5\u05e6\u05d0\u05d5\u05ea, \u05d4\u05d9\u05e9\u05d2\u05d9\u05dd \u05d0\u05d5 \u05ea\u05d2\u05de\u05d5\u05dc\u05d9\u05dd.\n\n## 7. \u05de\u05e0\u05d5\u05d9\u05d9\u05dd \u05d5\u05ea\u05e9\u05dc\u05d5\u05de\u05d9\u05dd\n\n**7.1** \u05ea\u05db\u05d5\u05e0\u05d5\u05ea \u05de\u05e1\u05d5\u05d9\u05de\u05d5\u05ea \u05e2\u05e9\u05d5\u05d9\u05d5\u05ea \u05dc\u05d3\u05e8\u05d5\u05e9 \u05de\u05e0\u05d5\u05d9 \u05d1\u05ea\u05e9\u05dc\u05d5\u05dd (\"\u05e4\u05e8\u05d9\u05de\u05d9\u05d5\u05dd\").\n\n**7.2** \u05d1\u05e8\u05db\u05d9\u05e9\u05d4 \u05d3\u05e8\u05da App Store \u05d0\u05d5 Google Play, \u05d4\u05ea\u05e9\u05dc\u05d5\u05dd \u05de\u05e2\u05d5\u05d1\u05d3 \u05e2\u05dc \u05d9\u05d3\u05d9 \u05d0\u05d5\u05ea\u05d4 \u05e4\u05dc\u05d8\u05e4\u05d5\u05e8\u05de\u05d4 \u05d5\u05db\u05e4\u05d5\u05e3 \u05dc\u05ea\u05e0\u05d0\u05d9\u05d4. \u05d0\u05d9\u05e0\u05e0\u05d5 \u05de\u05e7\u05d1\u05dc\u05d9\u05dd \u05d0\u05d5 \u05e9\u05d5\u05de\u05e8\u05d9\u05dd \u05d0\u05ea \u05e4\u05e8\u05d8\u05d9 \u05db\u05e8\u05d8\u05d9\u05e1 \u05d4\u05d0\u05e9\u05e8\u05d0\u05d9 \u05e9\u05dc\u05da.\n\n**7.3** \u05de\u05e0\u05d5\u05d9\u05d9\u05dd \u05de\u05ea\u05d7\u05d3\u05e9\u05d9\u05dd \u05d0\u05d5\u05d8\u05d5\u05de\u05d8\u05d9\u05ea \u05d0\u05dc\u05d0 \u05d0\u05dd \u05d1\u05d5\u05d8\u05dc\u05d5 **24 \u05e9\u05e2\u05d5\u05ea \u05dc\u05e4\u05d7\u05d5\u05ea** \u05dc\u05e4\u05e0\u05d9 \u05ea\u05d5\u05dd \u05d4\u05ea\u05e7\u05d5\u05e4\u05d4 \u05d4\u05e0\u05d5\u05db\u05d7\u05d9\u05ea. \u05e0\u05d9\u05d4\u05d5\u05dc \u05d5\u05d1\u05d9\u05d8\u05d5\u05dc \u05de\u05ea\u05d1\u05e6\u05e2\u05d9\u05dd \u05d3\u05e8\u05da \u05d4\u05d2\u05d3\u05e8\u05d5\u05ea \u05d4\u05d7\u05e9\u05d1\u05d5\u05df \u05d1\u05e4\u05dc\u05d8\u05e4\u05d5\u05e8\u05de\u05d4.\n\n**7.4** \u05d4\u05de\u05d7\u05d9\u05e8\u05d9\u05dd \u05e2\u05e9\u05d5\u05d9\u05d9\u05dd \u05dc\u05d4\u05e9\u05ea\u05e0\u05d5\u05ea. \u05e0\u05d5\u05d3\u05d9\u05e2 \u05de\u05e8\u05d0\u05e9 \u05dc\u05e4\u05e0\u05d9 \u05db\u05e0\u05d9\u05e1\u05ea \u05e9\u05d9\u05e0\u05d5\u05d9 \u05dc\u05ea\u05d5\u05e7\u05e3 \u05e2\u05d1\u05d5\u05e8 \u05de\u05e0\u05d5\u05d9\u05d9\u05dd \u05e7\u05d9\u05d9\u05de\u05d9\u05dd.\n\n**7.5 \u05d4\u05d7\u05d6\u05e8\u05d9\u05dd.** \u05d4\u05e9\u05d9\u05e8\u05d5\u05ea \u05d7\u05d9\u05e0\u05de\u05d9 \u05db\u05e8\u05d2\u05e2 \u05d5\u05d0\u05d9\u05df \u05d1\u05d5 \u05e8\u05db\u05d9\u05e9\u05d5\u05ea. \u05d0\u05dd \u05d9\u05d9\u05d5\u05d5\u05e1\u05e4\u05d5 \u05ea\u05db\u05d5\u05e0\u05d5\u05ea \u05d1\u05ea\u05e9\u05dc\u05d5\u05dd, \u05e8\u05db\u05d9\u05e9\u05d5\u05ea \u05d3\u05e8\u05da App Store \u05d0\u05d5 Google Play \u05d9\u05d4\u05d9\u05d5 \u05db\u05e4\u05d5\u05e4\u05d5\u05ea \u05dc\u05de\u05d3\u05d9\u05e0\u05d9\u05d5\u05ea \u05d4\u05d4\u05d7\u05d6\u05e8\u05d9\u05dd \u05e9\u05dc \u05d0\u05d5\u05ea\u05d4 \u05e4\u05dc\u05d8\u05e4\u05d5\u05e8\u05de\u05d4, \u05d5\u05e1\u05e2\u05d9\u05e3 \u05d6\u05d4 \u05d9\u05e2\u05d5\u05d3\u05db\u05df \u05dc\u05e4\u05e0\u05d9 \u05e9\u05d9\u05d9\u05d2\u05d1\u05d4 \u05ea\u05e9\u05dc\u05d5\u05dd \u05db\u05dc\u05e9\u05d4\u05d5.\n\n## 8. \u05e7\u05e0\u05d9\u05d9\u05df \u05e8\u05d5\u05d7\u05e0\u05d9\n\n**8.1** \u05d4\u05e9\u05d9\u05e8\u05d5\u05ea, \u05dc\u05e8\u05d1\u05d5\u05ea \u05db\u05dc \u05d4\u05d8\u05e7\u05e1\u05d8\u05d9\u05dd, \u05d4\u05e9\u05d9\u05e2\u05d5\u05e8\u05d9\u05dd, \u05d4\u05d0\u05d9\u05d5\u05e8\u05d9\u05dd, \u05d4\u05e7\u05d5\u05d3, \u05d4\u05e2\u05d9\u05e6\u05d5\u05d1, \u05e1\u05d9\u05de\u05e0\u05d9 \u05d4\u05de\u05e1\u05d7\u05e8 \u05d5\u05d4\u05e9\u05dd InvestIQ, \u05d4\u05dd \u05d1\u05d1\u05e2\u05dc\u05d5\u05ea \u05e2\u05d9\u05d3\u05df \u05e8\u05d5\u05d6\u05df \u05d0\u05d5 \u05e0\u05d5\u05ea\u05e0\u05d9 \u05d4\u05e8\u05d9\u05e9\u05d9\u05d5\u05df \u05e9\u05dc\u05d4 \u05d5\u05de\u05d5\u05d2\u05e0\u05d9\u05dd \u05d1\u05d3\u05d9\u05e0\u05d9 \u05e7\u05e0\u05d9\u05d9\u05df \u05e8\u05d5\u05d7\u05e0\u05d9.\n\n**8.2** \u05d0\u05e0\u05d5 \u05de\u05e2\u05e0\u05d9\u05e7\u05d9\u05dd \u05dc\u05da \u05e8\u05d9\u05e9\u05d9\u05d5\u05df \u05de\u05d5\u05d2\u05d1\u05dc, \u05d0\u05d9\u05e9\u05d9, \u05dc\u05d0 \u05d1\u05dc\u05e2\u05d3\u05d9, \u05dc\u05d0 \u05e0\u05d9\u05ea\u05df \u05dc\u05d4\u05e2\u05d1\u05e8\u05d4 \u05d5\u05e0\u05d9\u05ea\u05df \u05dc\u05d1\u05d9\u05d8\u05d5\u05dc, \u05dc\u05e9\u05d9\u05de\u05d5\u05e9 \u05d1\u05e9\u05d9\u05e8\u05d5\u05ea \u05dc\u05e6\u05e8\u05db\u05d9\u05da \u05d4\u05d7\u05d9\u05e0\u05d5\u05db\u05d9\u05d9\u05dd \u05d4\u05dc\u05d0\u05be\u05de\u05e1\u05d7\u05e8\u05d9\u05d9\u05dd.\n\n**8.3** \u05d0\u05d9\u05e0\u05da \u05e8\u05e9\u05d0\u05d9 \u05dc\u05d4\u05e2\u05ea\u05d9\u05e7, \u05dc\u05e9\u05db\u05e4\u05dc, \u05dc\u05d4\u05e4\u05d9\u05e5, \u05dc\u05e9\u05e0\u05d5\u05ea, \u05dc\u05ea\u05e8\u05d2\u05dd, \u05dc\u05d4\u05e6\u05d9\u05d2 \u05d1\u05e4\u05d5\u05de\u05d1\u05d9, \u05dc\u05de\u05db\u05d5\u05e8, \u05dc\u05d4\u05e2\u05e0\u05d9\u05e7 \u05e8\u05d9\u05e9\u05d9\u05d5\u05df, \u05dc\u05d4\u05e0\u05d3\u05e1 \u05dc\u05d0\u05d7\u05d5\u05e8 \u05d0\u05d5 \u05dc\u05d9\u05e6\u05d5\u05e8 \u05d9\u05e6\u05d9\u05e8\u05d5\u05ea \u05e0\u05d2\u05d6\u05e8\u05d5\u05ea \u05de\u05db\u05dc \u05d7\u05dc\u05e7 \u05e9\u05dc \u05d4\u05e9\u05d9\u05e8\u05d5\u05ea \u05dc\u05dc\u05d0 \u05d0\u05d9\u05e9\u05d5\u05e8\u05e0\u05d5 \u05de\u05e8\u05d0\u05e9 \u05d5\u05d1\u05db\u05ea\u05d1.\n\n**8.4** \u05de\u05e9\u05d5\u05d1 \u05e9\u05ea\u05e9\u05dc\u05d7 \u05d0\u05dc\u05d9\u05e0\u05d5 \u05e2\u05e9\u05d5\u05d9 \u05dc\u05e9\u05de\u05e9 \u05d0\u05d5\u05ea\u05e0\u05d5 \u05dc\u05dc\u05d0 \u05d4\u05d2\u05d1\u05dc\u05d4 \u05d5\u05dc\u05dc\u05d0 \u05ea\u05de\u05d5\u05e8\u05d4.\n\n## 9. \u05db\u05dc\u05dc\u05d9 \u05d4\u05ea\u05e0\u05d4\u05d2\u05d5\u05ea\n\n\u05d0\u05ea\u05d4 \u05de\u05ea\u05d7\u05d9\u05d9\u05d1 \u05e9\u05dc\u05d0 \u05dc\u05d4\u05e9\u05ea\u05de\u05e9 \u05d1\u05e9\u05d9\u05e8\u05d5\u05ea \u05dc\u05de\u05d8\u05e8\u05d4 \u05d1\u05dc\u05ea\u05d9 \u05d7\u05d5\u05e7\u05d9\u05ea; \u05dc\u05d0 \u05dc\u05e0\u05e1\u05d5\u05ea \u05dc\u05e7\u05d1\u05dc \u05d2\u05d9\u05e9\u05d4 \u05d1\u05dc\u05ea\u05d9 \u05de\u05d5\u05e8\u05e9\u05d9\u05ea \u05dc\u05e9\u05d9\u05e8\u05d5\u05ea, \u05dc\u05d7\u05e9\u05d1\u05d5\u05e0\u05d5\u05ea \u05d0\u05d7\u05e8\u05d9\u05dd \u05d0\u05d5 \u05dc\u05de\u05e2\u05e8\u05db\u05d5\u05ea\u05d9\u05e0\u05d5; \u05dc\u05d0 \u05dc\u05d4\u05e4\u05e8\u05d9\u05e2 \u05dc\u05e9\u05d9\u05e8\u05d5\u05ea, \u05dc\u05e9\u05d1\u05e9\u05d5 \u05d0\u05d5 \u05dc\u05d4\u05e2\u05de\u05d9\u05e1\u05d5; \u05dc\u05d0 \u05dc\u05d4\u05e9\u05ea\u05de\u05e9 \u05d1\u05d0\u05de\u05e6\u05e2\u05d9\u05dd \u05d0\u05d5\u05d8\u05d5\u05de\u05d8\u05d9\u05d9\u05dd \u05dc\u05d2\u05d9\u05e9\u05d4, \u05d2\u05e8\u05d9\u05e4\u05d4 \u05d0\u05d5 \u05d4\u05e2\u05ea\u05e7\u05d4; \u05dc\u05d0 \u05dc\u05d1\u05e6\u05e2 \u05de\u05e0\u05d9\u05e4\u05d5\u05dc\u05e6\u05d9\u05d4 \u05d1\u05e0\u05e7\u05d5\u05d3\u05d5\u05ea \u05e0\u05d9\u05e1\u05d9\u05d5\u05df, \u05d4\u05d9\u05e9\u05d2\u05d9\u05dd, \u05dc\u05d5\u05d7\u05d5\u05ea \u05ea\u05d5\u05e6\u05d0\u05d5\u05ea \u05d0\u05d5 \u05de\u05e0\u05d2\u05e0\u05d5\u05e0\u05d9 \u05d4\u05ea\u05e7\u05d3\u05de\u05d5\u05ea; \u05dc\u05d0 \u05dc\u05d4\u05e2\u05dc\u05d5\u05ea \u05e7\u05d5\u05d3 \u05d6\u05d3\u05d5\u05e0\u05d9 \u05d0\u05d5 \u05ea\u05d5\u05db\u05df \u05d1\u05dc\u05ea\u05d9 \u05d7\u05d5\u05e7\u05d9, \u05e4\u05d5\u05d2\u05e2\u05e0\u05d9, \u05de\u05e9\u05de\u05d9\u05e5, \u05de\u05d8\u05e8\u05d9\u05d3 \u05d0\u05d5 \u05de\u05e4\u05e8 \u05d6\u05db\u05d5\u05d9\u05d5\u05ea; \u05dc\u05d0 \u05dc\u05d4\u05ea\u05d7\u05d6\u05d5\u05ea \u05dc\u05d0\u05d3\u05dd \u05d0\u05d7\u05e8; \u05d5\u05dc\u05d0 \u05dc\u05d4\u05e9\u05ea\u05de\u05e9 \u05d1\u05e9\u05d9\u05e8\u05d5\u05ea \u05db\u05d3\u05d9 \u05dc\u05e1\u05e4\u05e7 \u05d9\u05d9\u05e2\u05d5\u05e5 \u05d4\u05e9\u05e7\u05e2\u05d5\u05ea \u05dc\u05d0\u05d7\u05e8\u05d9\u05dd.\n\n## 10. \u05d4\u05e9\u05e2\u05d9\u05d4 \u05d5\u05e1\u05d9\u05d5\u05dd\n\n**10.1** \u05d0\u05e0\u05d5 \u05e8\u05e9\u05d0\u05d9\u05dd \u05dc\u05d4\u05e9\u05e2\u05d5\u05ea \u05d0\u05d5 \u05dc\u05e1\u05d9\u05d9\u05dd \u05d0\u05ea \u05d2\u05d9\u05e9\u05ea\u05da \u05d1\u05db\u05dc \u05e2\u05ea, \u05e2\u05dd \u05d0\u05d5 \u05d1\u05dc\u05d9 \u05d4\u05d5\u05d3\u05e2\u05d4, \u05d0\u05dd \u05d4\u05e4\u05e8\u05ea \u05ea\u05e0\u05d0\u05d9\u05dd \u05d0\u05dc\u05d4 \u05d0\u05d5 \u05d0\u05dd \u05d0\u05e0\u05d5 \u05e1\u05d1\u05d5\u05e8\u05d9\u05dd \u05d1\u05d0\u05d5\u05e4\u05df \u05e1\u05d1\u05d9\u05e8 \u05e9\u05d4\u05e9\u05d9\u05de\u05d5\u05e9 \u05e9\u05dc\u05da \u05e4\u05d5\u05d2\u05e2 \u05d1\u05e9\u05d9\u05e8\u05d5\u05ea \u05d0\u05d5 \u05d1\u05de\u05e9\u05ea\u05de\u05e9\u05d9\u05dd \u05d0\u05d7\u05e8\u05d9\u05dd.\n\n**10.2** \u05d0\u05ea\u05d4 \u05e8\u05e9\u05d0\u05d9 \u05dc\u05d4\u05e4\u05e1\u05d9\u05e7 \u05d0\u05ea \u05d4\u05e9\u05d9\u05de\u05d5\u05e9 \u05d5\u05dc\u05de\u05d7\u05d5\u05e7 \u05d0\u05ea \u05d7\u05e9\u05d1\u05d5\u05e0\u05da \u05d1\u05db\u05dc \u05e2\u05ea.\n\n**10.3** \u05e2\u05dd \u05d4\u05e1\u05d9\u05d5\u05dd \u05d4\u05e8\u05d9\u05e9\u05d9\u05d5\u05df \u05e9\u05dc\u05da \u05e4\u05d5\u05e7\u05e2 \u05de\u05d9\u05d3. \u05e1\u05e2\u05d9\u05e4\u05d9\u05dd 3, 4, 8, 11, 12, 13 \u05d5-14 \u05d9\u05de\u05e9\u05d9\u05db\u05d5 \u05dc\u05d7\u05d5\u05dc.\n\n## 11. \u05e9\u05d9\u05e8\u05d5\u05ea\u05d9 \u05e6\u05d3 \u05e9\u05dc\u05d9\u05e9\u05d9 \u05d5\u05e7\u05d9\u05e9\u05d5\u05e8\u05d9\u05dd\n\n\u05d4\u05e9\u05d9\u05e8\u05d5\u05ea \u05e2\u05e9\u05d5\u05d9 \u05dc\u05e7\u05e9\u05e8 \u05dc\u05e9\u05d9\u05e8\u05d5\u05ea\u05d9 \u05e6\u05d3 \u05e9\u05dc\u05d9\u05e9\u05d9 \u05d0\u05d5 \u05dc\u05d4\u05e1\u05ea\u05de\u05da \u05e2\u05dc\u05d9\u05d4\u05dd. \u05d0\u05d9\u05e0\u05e0\u05d5 \u05e9\u05d5\u05dc\u05d8\u05d9\u05dd \u05d1\u05d4\u05dd \u05d5\u05d0\u05d9\u05e0\u05e0\u05d5 \u05d0\u05d7\u05e8\u05d0\u05d9\u05dd \u05dc\u05ea\u05d5\u05db\u05e0\u05dd, \u05dc\u05de\u05d3\u05d9\u05e0\u05d9\u05d5\u05ea\u05dd \u05d0\u05d5 \u05dc\u05e4\u05e8\u05e7\u05d8\u05d9\u05e7\u05d5\u05ea \u05e9\u05dc\u05d4\u05dd. \u05d4\u05e9\u05d9\u05de\u05d5\u05e9 \u05e9\u05dc\u05da \u05d1\u05e9\u05d9\u05e8\u05d5\u05ea \u05e6\u05d3 \u05e9\u05dc\u05d9\u05e9\u05d9 \u05db\u05e4\u05d5\u05e3 \u05dc\u05ea\u05e0\u05d0\u05d9\u05d5.\n\n## 12. \u05d4\u05e1\u05e8\u05ea \u05d0\u05d7\u05e8\u05d9\u05d5\u05ea\n\n**\u05d4\u05e9\u05d9\u05e8\u05d5\u05ea \u05e0\u05d9\u05ea\u05df \"\u05db\u05de\u05d5\u05ea \u05e9\u05d4\u05d5\u05d0\" (AS IS) \u05d5\"\u05db\u05e4\u05d9 \u05e9\u05d6\u05de\u05d9\u05df\", \u05dc\u05dc\u05d0 \u05d0\u05d7\u05e8\u05d9\u05d5\u05ea \u05de\u05db\u05dc \u05e1\u05d5\u05d2, \u05de\u05e4\u05d5\u05e8\u05e9\u05ea \u05d0\u05d5 \u05de\u05e9\u05ea\u05de\u05e2\u05ea.**\n\n\u05d1\u05de\u05d9\u05d3\u05d4 \u05d4\u05de\u05e8\u05d1\u05d9\u05ea \u05d4\u05de\u05d5\u05ea\u05e8\u05ea \u05d1\u05d3\u05d9\u05df \u05d0\u05e0\u05d5 \u05de\u05e1\u05d9\u05e8\u05d9\u05dd \u05db\u05dc \u05d0\u05d7\u05e8\u05d9\u05d5\u05ea \u05dc\u05e8\u05d1\u05d5\u05ea \u05e1\u05d7\u05d9\u05e8\u05d5\u05ea, \u05d4\u05ea\u05d0\u05de\u05d4 \u05dc\u05de\u05d8\u05e8\u05d4 \u05de\u05e1\u05d5\u05d9\u05de\u05ea, \u05d0\u05d9\u05be\u05d4\u05e4\u05e8\u05d4, \u05d5\u05db\u05dc \u05d0\u05d7\u05e8\u05d9\u05d5\u05ea \u05dc\u05d2\u05d1\u05d9 \u05d3\u05d9\u05d5\u05e7, \u05e9\u05dc\u05de\u05d5\u05ea, \u05d0\u05de\u05d9\u05e0\u05d5\u05ea \u05d0\u05d5 \u05d6\u05de\u05d9\u05e0\u05d5\u05ea. \u05d0\u05d9\u05e0\u05e0\u05d5 \u05de\u05ea\u05d7\u05d9\u05d9\u05d1\u05d9\u05dd \u05e9\u05d4\u05e9\u05d9\u05e8\u05d5\u05ea \u05d9\u05d4\u05d9\u05d4 \u05e8\u05e6\u05d9\u05e3, \u05e0\u05d8\u05d5\u05dc \u05e9\u05d2\u05d9\u05d0\u05d5\u05ea \u05d0\u05d5 \u05de\u05d0\u05d5\u05d1\u05d8\u05d7, \u05d0\u05d5 \u05e9\u05d4\u05ea\u05d5\u05db\u05df \u05de\u05d3\u05d5\u05d9\u05e7 \u05d0\u05d5 \u05e2\u05d3\u05db\u05e0\u05d9.\n\n## 13. \u05d4\u05d2\u05d1\u05dc\u05ea \u05d0\u05d7\u05e8\u05d9\u05d5\u05ea\n\n**13.1** \u05d1\u05de\u05d9\u05d3\u05d4 \u05d4\u05de\u05e8\u05d1\u05d9\u05ea \u05d4\u05de\u05d5\u05ea\u05e8\u05ea \u05d1\u05d3\u05d9\u05df, \u05dc\u05d0 \u05e0\u05d4\u05d9\u05d4 \u05d0\u05d7\u05e8\u05d0\u05d9\u05dd \u05dc\u05db\u05dc \u05e0\u05d6\u05e7 \u05e2\u05e7\u05d9\u05e3, \u05de\u05e7\u05e8\u05d9, \u05de\u05d9\u05d5\u05d7\u05d3, \u05ea\u05d5\u05e6\u05d0\u05ea\u05d9 \u05d0\u05d5 \u05e2\u05d5\u05e0\u05e9\u05d9, \u05d0\u05d5 \u05dc\u05db\u05dc \u05d0\u05d5\u05d1\u05d3\u05df \u05e8\u05d5\u05d5\u05d7\u05d9\u05dd, \u05d4\u05db\u05e0\u05e1\u05d5\u05ea, \u05e0\u05ea\u05d5\u05e0\u05d9\u05dd, \u05de\u05d5\u05e0\u05d9\u05d8\u05d9\u05df \u05d0\u05d5 \u05d4\u05e4\u05e1\u05d3\u05d9 \u05d4\u05e9\u05e7\u05e2\u05d4, \u05d4\u05e0\u05d5\u05d1\u05e2\u05d9\u05dd \u05de\u05d4\u05e9\u05d9\u05de\u05d5\u05e9 \u05d1\u05e9\u05d9\u05e8\u05d5\u05ea \u05d0\u05d5 \u05e7\u05e9\u05d5\u05e8\u05d9\u05dd \u05d0\u05dc\u05d9\u05d5.\n\n**13.2** \u05d0\u05d7\u05e8\u05d9\u05d5\u05ea\u05e0\u05d5 \u05d4\u05db\u05d5\u05dc\u05dc\u05ea \u05d4\u05de\u05e6\u05d8\u05d1\u05e8\u05ea \u05dc\u05d0 \u05ea\u05e2\u05dc\u05d4 \u05e2\u05dc \u05d4\u05d2\u05d1\u05d5\u05d4 \u05de\u05d1\u05d9\u05df \u05d4\u05e1\u05db\u05d5\u05dd \u05e9\u05e9\u05d9\u05dc\u05de\u05ea \u05dc\u05e0\u05d5 \u05d1**\u05e9\u05e0\u05d9\u05dd\u05be\u05e2\u05e9\u05e8 (12) \u05d4\u05d7\u05d5\u05d3\u05e9\u05d9\u05dd** \u05e9\u05e7\u05d3\u05de\u05d5 \u05dc\u05ea\u05d1\u05d9\u05e2\u05d4, \u05d0\u05d5 **500 \u05e9\"\u05d7**.\n\n**13.3** \u05ea\u05d7\u05d5\u05de\u05d9 \u05e9\u05d9\u05e4\u05d5\u05d8 \u05de\u05e1\u05d5\u05d9\u05de\u05d9\u05dd \u05d0\u05d9\u05e0\u05dd \u05de\u05ea\u05d9\u05e8\u05d9\u05dd \u05d4\u05d7\u05e8\u05d2\u05d5\u05ea \u05d0\u05d5 \u05d4\u05d2\u05d1\u05dc\u05d5\u05ea \u05de\u05e1\u05d5\u05d9\u05de\u05d5\u05ea. \u05d1\u05d0\u05d5\u05ea\u05dd \u05ea\u05d7\u05d5\u05de\u05d9\u05dd, \u05d0\u05d7\u05e8\u05d9\u05d5\u05ea\u05e0\u05d5 \u05de\u05d5\u05d2\u05d1\u05dc\u05ea \u05dc\u05de\u05d9\u05d3\u05d4 \u05d4\u05de\u05e8\u05d1\u05d9\u05ea \u05d4\u05de\u05d5\u05ea\u05e8\u05ea \u05d1\u05d3\u05d9\u05df.\n\n## 14. \u05e9\u05d9\u05e4\u05d5\u05d9\n\n\u05d0\u05ea\u05d4 \u05de\u05e1\u05db\u05d9\u05dd \u05dc\u05e9\u05e4\u05d5\u05ea \u05d5\u05dc\u05e4\u05d8\u05d5\u05e8 \u05d0\u05ea \u05e2\u05d9\u05d3\u05df \u05e8\u05d5\u05d6\u05df, \u05e0\u05d5\u05e9\u05d0\u05d9 \u05d4\u05de\u05e9\u05e8\u05d4, \u05d4\u05e2\u05d5\u05d1\u05d3\u05d9\u05dd \u05d5\u05d4\u05e1\u05d5\u05db\u05e0\u05d9\u05dd \u05e9\u05dc\u05d4 \u05de\u05db\u05dc \u05ea\u05d1\u05d9\u05e2\u05d4, \u05d3\u05e8\u05d9\u05e9\u05d4, \u05d4\u05e4\u05e1\u05d3 \u05d0\u05d5 \u05d4\u05d5\u05e6\u05d0\u05d4 (\u05dc\u05e8\u05d1\u05d5\u05ea \u05e9\u05db\u05e8 \u05d8\u05e8\u05d7\u05ea \u05e2\u05d5\u05e8\u05da \u05d3\u05d9\u05df \u05e1\u05d1\u05d9\u05e8) \u05d4\u05e0\u05d5\u05d1\u05e2\u05d9\u05dd \u05de\u05e9\u05d9\u05de\u05d5\u05e9\u05da \u05d1\u05e9\u05d9\u05e8\u05d5\u05ea, \u05de\u05d4\u05e4\u05e8\u05ea \u05ea\u05e0\u05d0\u05d9\u05dd \u05d0\u05dc\u05d4, \u05d0\u05d5 \u05de\u05d4\u05e4\u05e8\u05ea \u05db\u05dc \u05d3\u05d9\u05df \u05d0\u05d5 \u05d6\u05db\u05d5\u05ea \u05e6\u05d3 \u05e9\u05dc\u05d9\u05e9\u05d9.\n\n## 15. \u05e9\u05d9\u05e0\u05d5\u05d9\u05d9\u05dd \u05d1\u05e9\u05d9\u05e8\u05d5\u05ea \u05d5\u05d1\u05ea\u05e0\u05d0\u05d9\u05dd\n\n**15.1** \u05d0\u05e0\u05d5 \u05e8\u05e9\u05d0\u05d9\u05dd \u05dc\u05e9\u05e0\u05d5\u05ea, \u05dc\u05d4\u05e9\u05e2\u05d5\u05ea \u05d0\u05d5 \u05dc\u05d4\u05e4\u05e1\u05d9\u05e7 \u05db\u05dc \u05d7\u05dc\u05e7 \u05de\u05d4\u05e9\u05d9\u05e8\u05d5\u05ea \u05d1\u05db\u05dc \u05e2\u05ea.\n\n**15.2** \u05d0\u05e0\u05d5 \u05e8\u05e9\u05d0\u05d9\u05dd \u05dc\u05e2\u05d3\u05db\u05df \u05ea\u05e0\u05d0\u05d9\u05dd \u05d0\u05dc\u05d4. \u05e9\u05d9\u05e0\u05d5\u05d9\u05d9\u05dd \u05de\u05d4\u05d5\u05ea\u05d9\u05d9\u05dd \u05d9\u05d5\u05db\u05e8\u05d6\u05d5 **14 \u05d9\u05d5\u05dd \u05dc\u05e4\u05d7\u05d5\u05ea** \u05dc\u05e4\u05e0\u05d9 \u05db\u05e0\u05d9\u05e1\u05ea\u05dd \u05dc\u05ea\u05d5\u05e7\u05e3. \u05d4\u05de\u05e9\u05da \u05e9\u05d9\u05de\u05d5\u05e9 \u05dc\u05d0\u05d7\u05e8 \u05de\u05d5\u05e2\u05d3 \u05d6\u05d4 \u05de\u05d4\u05d5\u05d5\u05d4 \u05d4\u05e1\u05db\u05de\u05d4.\n\n## 16. \u05d3\u05d9\u05df \u05d7\u05dc \u05d5\u05d9\u05d9\u05e9\u05d5\u05d1 \u05e1\u05db\u05e1\u05d5\u05db\u05d9\u05dd\n\n**16.1** \u05ea\u05e0\u05d0\u05d9\u05dd \u05d0\u05dc\u05d4 \u05db\u05e4\u05d5\u05e4\u05d9\u05dd \u05dc\u05d3\u05d9\u05e0\u05d9 **\u05de\u05d3\u05d9\u05e0\u05ea \u05d9\u05e9\u05e8\u05d0\u05dc**, \u05dc\u05dc\u05d0 \u05d4\u05ea\u05d7\u05e9\u05d1\u05d5\u05ea \u05d1\u05db\u05dc\u05dc\u05d9 \u05d1\u05e8\u05d9\u05e8\u05ea \u05d4\u05d3\u05d9\u05df.\n\n**16.2** \u05dc\u05d1\u05ea\u05d9 \u05d4\u05de\u05e9\u05e4\u05d8 \u05d4\u05de\u05d5\u05e1\u05de\u05db\u05d9\u05dd \u05d1**\u05ea\u05dc \u05d0\u05d1\u05d9\u05d1, \u05d9\u05e9\u05e8\u05d0\u05dc** \u05ea\u05d4\u05d9\u05d4 \u05e1\u05de\u05db\u05d5\u05ea \u05e9\u05d9\u05e4\u05d5\u05d8 \u05d9\u05d9\u05d7\u05d5\u05d3\u05d9\u05ea, \u05dc\u05de\u05e2\u05d8 \u05d1\u05de\u05e7\u05d5\u05dd \u05e9\u05d1\u05d5 \u05d3\u05d9\u05e0\u05d9 \u05d4\u05d2\u05e0\u05ea \u05d4\u05e6\u05e8\u05db\u05df \u05d4\u05db\u05d5\u05e4\u05d9\u05dd \u05de\u05e7\u05e0\u05d9\u05dd \u05dc\u05da \u05d6\u05db\u05d5\u05ea \u05dc\u05e0\u05e7\u05d5\u05d8 \u05d4\u05dc\u05d9\u05db\u05d9\u05dd \u05d1\u05de\u05e7\u05d5\u05dd \u05de\u05d2\u05d5\u05e8\u05d9\u05da.\n\n## 17. \u05db\u05dc\u05dc\u05d9\n\n**17.1 \u05d4\u05e4\u05e8\u05d3\u05d4.** \u05d0\u05dd \u05d4\u05d5\u05e8\u05d0\u05d4 \u05db\u05dc\u05e9\u05d4\u05d9 \u05ea\u05d9\u05de\u05e6\u05d0 \u05d1\u05dc\u05ea\u05d9 \u05ea\u05e7\u05e4\u05d4, \u05d9\u05ea\u05e8 \u05d4\u05d4\u05d5\u05e8\u05d0\u05d5\u05ea \u05d9\u05e2\u05de\u05d3\u05d5 \u05d1\u05ea\u05d5\u05e7\u05e4\u05df. **17.2 \u05d0\u05d9\u05be\u05d5\u05d9\u05ea\u05d5\u05e8.** \u05d0\u05d9\u05be\u05d0\u05db\u05d9\u05e4\u05d4 \u05e9\u05dc \u05d4\u05d5\u05e8\u05d0\u05d4 \u05d0\u05d9\u05e0\u05d4 \u05de\u05d4\u05d5\u05d5\u05d4 \u05d5\u05d9\u05ea\u05d5\u05e8 \u05e2\u05dc\u05d9\u05d4. **17.3 \u05d4\u05e1\u05db\u05dd \u05de\u05dc\u05d0.** \u05ea\u05e0\u05d0\u05d9\u05dd \u05d0\u05dc\u05d4 \u05d5\u05de\u05d3\u05d9\u05e0\u05d9\u05d5\u05ea \u05d4\u05e4\u05e8\u05d8\u05d9\u05d5\u05ea \u05de\u05d4\u05d5\u05d5\u05d9\u05dd \u05d0\u05ea \u05d4\u05d4\u05e1\u05db\u05dd \u05d4\u05de\u05dc\u05d0 \u05d1\u05d9\u05e0\u05d9\u05e0\u05d5 \u05dc\u05d2\u05d1\u05d9 \u05d4\u05e9\u05d9\u05e8\u05d5\u05ea. **17.4 \u05d4\u05de\u05d7\u05d0\u05d4.** \u05d0\u05d9\u05e0\u05da \u05e8\u05e9\u05d0\u05d9 \u05dc\u05d4\u05de\u05d7\u05d5\u05ea \u05ea\u05e0\u05d0\u05d9\u05dd \u05d0\u05dc\u05d4; \u05d0\u05e0\u05d5 \u05e8\u05e9\u05d0\u05d9\u05dd \u05dc\u05d4\u05de\u05d7\u05d5\u05ea\u05dd \u05d1\u05e7\u05e9\u05e8 \u05dc\u05de\u05d9\u05d6\u05d5\u05d2, \u05e8\u05db\u05d9\u05e9\u05d4 \u05d0\u05d5 \u05de\u05db\u05d9\u05e8\u05ea \u05e0\u05db\u05e1\u05d9\u05dd.\n\n## 18. \u05d9\u05e6\u05d9\u05e8\u05ea \u05e7\u05e9\u05e8\n\n**\u05e2\u05d9\u05d3\u05df \u05e8\u05d5\u05d6\u05df**, \u05ea\u05dc \u05d0\u05d1\u05d9\u05d1, \u05d9\u05e9\u05e8\u05d0\u05dc\n\u05d0\u05d9\u05de\u05d9\u05d9\u05dc: **investyrozen@gmail.com**"}};

const Legal = {
  doc: "terms",
  lang: null,

  open(which, opts){
    this.doc = which || "terms";
    this.lang = this.lang || I18N.get();
    /* If opened from the consent dialog, hide that dialog while reading and
       restore it afterwards — with the user's ticks preserved — so reading
       the terms never abandons a signup in progress. */
    const cst = document.getElementById("iq-consent");
    this._fromConsent = !!cst;
    if(cst){
      this._cstState = {
        age:  (document.getElementById("cst-age")||{}).checked,
        terms:(document.getElementById("cst-terms")||{}).checked
      };
      cst.style.display = "none";
    }
    this.render();
    Sound.open();
    document.getElementById("sh-legal").classList.add("on");
  },
  close(){
    Sound.close();
    document.getElementById("sh-legal").classList.remove("on");
    if(this._fromConsent){
      const cst = document.getElementById("iq-consent");
      if(cst){
        cst.style.display = "";
        const st = this._cstState || {};
        const a = document.getElementById("cst-age"), t2 = document.getElementById("cst-terms");
        if(a)  a.checked  = !!st.age;
        if(t2) t2.checked = !!st.terms;
      }
      this._fromConsent = false;
    }
  },
  setLang(l){ this.lang = l; this.render() },
  setDoc(d){ this.doc = d; this.render();
    const b = document.querySelector("#sh-legal .sh-body"); if(b) b.scrollTop = 0 },

  /* Escape first, then apply structure, so nothing in the source can inject markup. */
  fmt(md){
    const e = x => String(x).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
    return e(md)
      .replace(/^# (.+)$/gm,  '<h2 class="lg-h1 disp">$1</h2>')
      .replace(/^## (.+)$/gm, '<h3 class="lg-h2">$1</h3>')
      .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
      .replace(/\[([^\]]+)\]/g, '<span class="lg-ph">[$1]</span>')
      .split(/\n{2,}/)
      .map(p => /^<h[23]/.test(p.trim()) ? p : '<p class="lg-p">' + p.trim().replace(/\n/g,"<br>") + "</p>")
      .join("");
  },

  render(){
    const l = this.lang || I18N.get();
    const rtl = l === "he";
    const md = (LEGAL_DOCS[this.doc] && LEGAL_DOCS[this.doc][l]) || LEGAL_DOCS[this.doc].en;
    document.getElementById("sh-legal").innerHTML =
     `<div class="sh-head"><button class="sh-x" aria-label="${t("close")}" onclick="Legal.close()">\u2715</button>
       <div style="flex:1;display:flex;gap:6px;justify-content:center">
         <button class="chip ${this.doc==="terms"?"dn":""}" onclick="Legal.setDoc(&#39;terms&#39;)">${t("legalTerms")}</button>
         <button class="chip ${this.doc==="privacy"?"dn":""}" onclick="Legal.setDoc(&#39;privacy&#39;)">${t("legalPrivacy")}</button>
       </div><div style="width:36px"></div></div>
      <div class="sh-body">
        <div class="lg-lang">
          <button class="${l==="en"?"on":""}" onclick="Legal.setLang(&#39;en&#39;)" aria-pressed="${l==="en"}">\uD83C\uDDFA\uD83C\uDDF8 English</button>
          <button class="${l==="he"?"on":""}" onclick="Legal.setLang(&#39;he&#39;)" aria-pressed="${l==="he"}">\uD83C\uDDEE\uD83C\uDDF1 \u05e2\u05d1\u05e8\u05d9\u05ea</button>
        </div>
        <article class="lg-doc" dir="${rtl?"rtl":"ltr"}" lang="${l}">${this.fmt(md)}</article>
      </div>`;
  }
};

 go(v){this.cur=v;Haptics.tap();document.querySelectorAll(".view").forEach(e=>e.classList.remove("on"));

 tween(id,to){const el=document.getElementById(id);if(!el)return;
  const from=parseInt((el.textContent||"0").replace(/\D/g,""))||0;
  if(from===to){el.textContent=to;return}
  const t0=performance.now(),dur=550;
  const step=t=>{const k=Math.min(1,(t-t0)/dur),v=Math.round(from+(to-from)*(1-Math.pow(1-k,3)));
    el.textContent=v;if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)},
 /* ask — in-app confirmation. Replaces window.confirm(), which iOS Safari
    lets the user suppress permanently ("Don't show more alerts"); once
    suppressed it returns false silently and the calling button looks dead. */
 ask(title,body,okLabel,onOk){
  const prev=document.getElementById("iq-ask"); if(prev)prev.remove();
  const el=document.createElement("div");
  el.id="iq-ask"; el.className="askwrap";
  el.innerHTML=`<div class="askbox">
    <div class="askt disp">${esc(title)}</div>
    ${body?`<div class="askb">${esc(body)}</div>`:""}
    <div class="askrow">
      <button class="btn ghost" id="iq-ask-no">${t("cancel")}</button>
      <button class="btn dn" id="iq-ask-yes">${esc(okLabel||"אישור")}</button>
    </div></div>`;
  document.body.appendChild(el);
  const close=()=>{try{el.remove()}catch(e){}};
  el.querySelector("#iq-ask-no").onclick=()=>{try{Sound.close&&Sound.close()}catch(e){}close()};
  el.querySelector("#iq-ask-yes").onclick=()=>{close();try{onOk&&onOk()}catch(e){Err.fatal(e,"אישור פעולה")}};
  el.onclick=e=>{if(e.target===el)close()};
 },
 /* Toasts are the app's main feedback channel (XP, achievements, errors).

 /* Text size. Everything sizes from the root, so scaling the root scales

 simPick(i){const L=this.L,st=this.curStep(),sm=L.sim,ev=st.events[sm.stage];

  if(!chap)return;
  const li=chap.lessons.findIndex(l=>l.id===lesson.id);
  const next=chap.lessons[li+1];

  // עוד שיעורים בפרק — ממשיכים
  if(next){
   if(!this.lessonUnlocked(chap,next))return;   // נעול (רמת קושי) — לא כופים
   setTimeout(()=>{
    if(document.getElementById("sh-lesson").classList.contains("on"))return; // המשתמש כבר פתח משהו
    this.openLesson(next.id);
   },900);
   return;
  }

  // הפרק הסתיים
  const ci=CURRICULUM.findIndex(c=>c.id===chap.id);
  const nextChap=CURRICULUM[ci+1];
  setTimeout(()=>this.rChapDone(chap,nextChap,ci+1),700);

       <div style="text-align:end"><div class="muted">${t("marketExposure")}</div><div class="disp" style="font-size:22px;font-weight:800;color:${C.exp>1?"var(--dn)":"var(--tx)"}">${Math.round(C.exp*100)}%${C.exp>1?" ⚡":""}</div></div></div>

   </div>`;
  Charts.candles(document.getElementById("cv-crash"),cnds,160);
  let tt=20;const tel=document.getElementById("ctimer");
  this.crashTimer=setInterval(()=>{tt--;if(tel)tel.textContent="⏱"+tt;if(tt<=5&&tt>0)Sound.tick();
    if(tt<=0){clearInterval(this.crashTimer);this.crashPick(-1)}},1000)},
 crashPick(i){const C=this.C,sc=C.sc,b=sc.beats[C.i];clearInterval(this.crashTimer);
  const opt=i<0?{exp:C.exp}:b.opts[i];Sound.select();Haptics.tap();
  C.exp=opt.exp;
  C.val*=(1+C.exp*b.r);C.hold*=(1+b.r);
  if(C.val<0)C.val=0;
  // מינוף גבוה בירידה חדה = מחיקה (קריאת מרג'ין) — הלקח של 1929
  if(C.exp>1&&b.r<=-.2){C.val=0;C.wiped=true}
  if(C.exp===0&&b.r<=-.15)C.soldBottom=true;
  C.i++;if(C.i>=sc.beats.length)this.rCrashEnd();else this.rCrashBeat()},
 rCrashEnd(){const C=this.C,sc=C.sc,passed=!C.wiped&&C.val>=C.hold*.95;
  if(!S.scenDone)S.scenDone={};
  if(passed&&(!S.scenDone[sc.id]||C.val>S.scenDone[sc.id]))S.scenDone[sc.id]=Math.round(C.val);
  if(passed){S.crashDone=true;if(C.val>S.crashBest)S.crashBest=Math.round(C.val)}
  Store.save();
  const nDone=Object.keys(S.scenDone).length;
  const xp=passed?(sc.diff==="אכזרי"?200:sc.diff==="קשה"?170:sc.diff==="בינוני"?140:120):40;
  Game.addXP(xp);Game.checkAchs();
  if(passed){FX.confetti();Sound.levelup();Haptics.level()}else{Sound.wrong();Haptics.err()}
  document.getElementById("sh-crash").innerHTML=
   `<div class="sh-head"><button class="sh-x" aria-label="${t('close')}" onclick="UI.closeCrash()">✕</button>
     <div style="flex:1;text-align:center"><span class="chip ${passed?"up":"dn"}">${sc.ic} ${sc.year}</span></div><div style="width:36px"></div></div>
   <div class="sh-body"><div class="teach"><div class="big">${C.wiped?"💀":passed?"🏆":"😰"}</div>
     <h2 class="disp">${C.wiped?"נמחקת — קריאת מרג'ין":passed?t("survived")+" "+I18N.tr(sc,"name")+"!":"הפאניקה ניצחה הפעם"}</h2>
     <p>${C.wiped?"המינוף מחק אותך. כשאתה ממונף, ירידה חדה לא רק פוגעת — היא מסיימת את המשחק. בדיוק מה שקרה לאלפי אנשים ב-1929.":
        passed?"החזקת את הראש בזמן שאחרים נבהלו — וזה בדיוק מה שהפריד את מי ששרד ממי שנמחק.":
        "מכרת בשפל ופספסת את ההתאוששות. זה קרה למיליונים באמת — וזו הסיבה שמתרגלים."}</p></div>
     <div class="score" style="margin-bottom:14px">
       <div class="card"><div class="v num" style="color:var(--${C.val>=100000?"up":"dn"})">${fmt(C.val)}</div><div class="k">${t("yourPortfolio")}</div></div>
       <div class="card"><div class="v num">${fmt(C.hold)}</div><div class="k">מי ש"לא נגע"</div></div></div>
     <div class="card co good"><b>${t("histLesson")}</b>
       <p class="muted" style="margin-top:5px;line-height:1.65">${I18N.tr(sc,"lesson")}</p></div>
     ${(C.soldBottom&&C.val<C.hold)?`<div class="card co risk"><b>📉 מה עשית</b><p class="muted" style="margin-top:4px">מכרת בשיא הפאניקה וקיבעת את ההפסד — ואז השוק התאושש בלעדיך. ירידה הופכת קבועה רק כשמוכרים.</p></div>`:""}
     <div class="chip amber" style="display:block;text-align:center;padding:10px"><bdi>+${xp} XP</bdi> · שרדת <bdi>${nDone}/${SCENARIOS.length}</bdi> מפולות</div>
   </div>
   <div class="sh-foot"><button class="btn" onclick="UI.rScenarioPick()">${t("moreScenarios")}</button></div>`},

 /* בדיקת סיסמה חיה — המשתמש רואה בזמן אמת מה חסר */
 pwCheck(){
  const pw=(document.getElementById("gPw")||{}).value||"";
  const pw2=(document.getElementById("gPw2")||{}).value||"";
  const set=(id,ok)=>{const e=document.getElementById(id);if(!e)return;
   e.classList.toggle("ok",ok);
   const x=e.querySelector(".pwr-x");if(x)x.textContent=ok?"✓":"○"};
  set("pwr-len",pw.length>=4);

 },
 pwToggle(id,btn){

  const show=e.type==="password";

 },

 /* Shown before an account is created, never before sign-in.
    Two separate confirmations rather than one combined tick: bundling age
    and terms makes neither a meaningful acknowledgement, and age is the one
    the app stores look for specifically. Nothing is pre-ticked. */
 askConsent(onAgree){
  const prev=document.getElementById("iq-consent"); if(prev)prev.remove();
  const el=document.createElement("div");
  el.id="iq-consent"; el.className="askwrap";
  el.innerHTML=`<div class="askbox" style="max-width:360px">
    <div class="askt disp">${t("consentTitle")}</div>
    <div class="askb" style="text-align:start;margin-top:14px">
      <label class="cst-row"><input type="checkbox" id="cst-age"><span>${t("consentAge")}</span></label>
      <label class="cst-row"><input type="checkbox" id="cst-terms"><span>${t("consentTerms")}</span></label>
      <button class="chip" style="width:100%;margin-top:10px" onclick="Legal.open(&#39;terms&#39;)">${t("consentRead")}</button>
      <div id="cst-err" class="muted" style="color:var(--dn);font-size:12.5px;margin-top:10px;display:none;text-align:center"></div>
    </div>
    <div class="askrow">
      <button class="btn ghost" id="cst-no">${t("cancel")}</button>
      <button class="btn" id="cst-yes">${t("consentGo")}</button>
    </div></div>`;
  document.body.appendChild(el);
  const close=()=>{try{el.remove()}catch(e){}};
  el.querySelector("#cst-no").onclick=()=>{try{Sound.close&&Sound.close()}catch(e){}close()};
  el.querySelector("#cst-yes").onclick=()=>{
    const age=document.getElementById("cst-age").checked;
    const tos=document.getElementById("cst-terms").checked;
    if(!age||!tos){
      const e2=document.getElementById("cst-err");
      e2.textContent=!age?t("consentNeedAge"):t("consentNeedTerms");
      e2.style.display="block";
      try{Haptics.err();Sound.wrong()}catch(e){}
      return;
    }
    /* Record what was agreed and when, in case consent is ever queried. */
    try{ Storage.setSync("iq_consent",{age16:true,terms:true,at:new Date().toISOString()}) }catch(e){}
    close();
    try{ onAgree() }catch(e){}
  };
  el.onclick=e=>{ if(e.target===el) close() };
 },

 doAuth(){const name=(document.getElementById("gName")||{}).value||"";
  const pw=(document.getElementById("gPw")||{}).value||"";
  const creating=this.gTab==="setup"||this.gTab==="signup";
  try{
   if(creating){
    const pw2=(document.getElementById("gPw2")||{}).value||"";
    if(pw!==pw2)throw new Error("שתי הסיסמאות לא זהות — בדוק שהקלדת אותו דבר פעמיים");
    /* Validate credentials first: no point interrupting with a consent
       dialog only to reject the form afterwards. */
    Auth.validateNew(name,pw);
    this.askConsent(()=>{
      try{
        Auth.register(name,pw,this.gAv);
        Auth.login(name,pw);
        Sound.levelup();Haptics.level();
        location.reload();
      }catch(e){ this.gErr("\u26a0\ufe0f "+e.message);Haptics.err();Sound.wrong() }
    });
    return;
   }
   Auth.login(name,pw);   // ← שומר סשן קבוע ב-localStorage. מכאן: כניסה אוטומטית.
   Sound.levelup();Haptics.level();
   location.reload();
  }catch(e){this.gErr("⚠️ "+e.message);Haptics.err();Sound.wrong()}},

/* =====================================================================
   REMINDERS

   What works without a server:
     - notification permission
     - a reminder while the tab is open or the PWA is in the background
     - the message library and choosing the right message
   What does NOT work without a server:
     - waking a closed app. Browsers cannot schedule that, and iOS has no
       Notification Triggers API. Real "come back" pushes need a push
       service holding a subscription (see Notify.subscribe below).

   So this module does two things now: it nudges in-app when the user has
   been away or a streak is at risk, and it prepares the subscription path
   for when a backend exists.
   ===================================================================== */
const REMIND_MSGS = {"he": {"streak": [["\ud83d\udd25 \u05d4\u05e8\u05e6\u05e3 \u05e9\u05dc\u05da \u05d1\u05e1\u05db\u05e0\u05d4", "{n} \u05d9\u05de\u05d9\u05dd \u05e8\u05e6\u05d5\u05e4\u05d9\u05dd. 5 \u05d3\u05e7\u05d5\u05ea \u05d5\u05d4\u05d5\u05d0 \u05e0\u05e9\u05de\u05e8."], ["\ud83d\udd25 \u05d0\u05dc \u05ea\u05e9\u05d1\u05d5\u05e8 \u05e2\u05db\u05e9\u05d9\u05d5", "{n} \u05d9\u05de\u05d9\u05dd \u05d1\u05e0\u05d9\u05ea \u05d0\u05ea \u05d6\u05d4. \u05e9\u05d9\u05e2\u05d5\u05e8 \u05d0\u05d7\u05d3 \u05de\u05e6\u05d9\u05dc \u05d0\u05d5\u05ea\u05d5."], ["\u23f3 \u05e0\u05d5\u05ea\u05e8\u05d5 \u05db\u05de\u05d4 \u05e9\u05e2\u05d5\u05ea", "\u05d4\u05e8\u05e6\u05e3 \u05e9\u05dc {n} \u05d9\u05de\u05d9\u05dd \u05de\u05d7\u05db\u05d4 \u05dc\u05da."]], "away": [["\ud83d\udcc8 \u05d4\u05e9\u05d5\u05e7 \u05dc\u05d0 \u05e2\u05e6\u05e8", "\u05d5\u05d2\u05dd \u05d0\u05ea\u05d4 \u05dc\u05d0 \u05e6\u05e8\u05d9\u05da. \u05e9\u05d9\u05e2\u05d5\u05e8 \u05e7\u05e6\u05e8 \u05de\u05d7\u05db\u05d4."], ["\ud83e\udde0 \u05d7\u05d6\u05e8\u05ea?", "\u05d4\u05de\u05d5\u05e9\u05d2 \u05d4\u05d1\u05d0 \u05e9\u05dc\u05da \u05dc\u05d5\u05e7\u05d7 3 \u05d3\u05e7\u05d5\u05ea."], ["\ud83d\udcb0 \u05db\u05dc \u05d9\u05d5\u05dd \u05e9\u05d0\u05ea\u05d4 \u05dc\u05d0 \u05dc\u05d5\u05de\u05d3", "\u05de\u05d9\u05e9\u05d4\u05d5 \u05d0\u05d7\u05e8 \u05de\u05e8\u05d5\u05d5\u05d9\u05d7 \u05de\u05d4\u05d8\u05e2\u05d5\u05ea \u05e9\u05dc\u05da."], ["\u23f0 5 \u05d3\u05e7\u05d5\u05ea \u05d4\u05d9\u05d5\u05dd", "\u05e9\u05d5\u05d5\u05d5\u05ea \u05d9\u05d5\u05ea\u05e8 \u05de\u05e9\u05e2\u05d4 \u05d1\u05e2\u05d5\u05d3 \u05e9\u05e0\u05d4."]], "close": [["\ud83c\udfaf \u05d0\u05ea\u05d4 \u05e7\u05e8\u05d5\u05d1", "\u05e2\u05d5\u05d3 \u05e9\u05d9\u05e2\u05d5\u05e8 \u05d0\u05d7\u05d3 \u05dc\u05e8\u05de\u05d4 {n}."], ["\ud83e\udd47 \u05d4\u05e4\u05e8\u05e7 \u05db\u05de\u05e2\u05d8 \u05e9\u05dc\u05da", "\u05e0\u05d5\u05ea\u05e8\u05d5 {n} \u05e9\u05d9\u05e2\u05d5\u05e8\u05d9\u05dd."]], "plain": [["\ud83d\udcda \u05d6\u05de\u05df \u05dc\u05dc\u05de\u05d5\u05d3", "\u05d4\u05e9\u05d9\u05e2\u05d5\u05e8 \u05d4\u05d9\u05d5\u05de\u05d9 \u05de\u05d7\u05db\u05d4."], ["\ud83d\udca1 \u05d9\u05d3\u05e2 \u05dc\u05e4\u05e0\u05d9 \u05db\u05e1\u05e3", "\u05d4\u05ea\u05e9\u05d5\u05d0\u05d4 \u05d4\u05d1\u05d8\u05d5\u05d7\u05d4 \u05d1\u05d9\u05d5\u05ea\u05e8 \u05e9\u05e7\u05d9\u05d9\u05de\u05ea."], ["\ud83d\udcca \u05d4\u05d0\u05ea\u05d2\u05e8 \u05d4\u05d9\u05d5\u05de\u05d9 \u05de\u05d5\u05db\u05df", "\u05d3\u05e7\u05d4 \u05d0\u05d7\u05ea. \u05d1\u05d5\u05d0 \u05e0\u05e8\u05d0\u05d4 \u05d0\u05dd \u05ea\u05d3\u05e2."]]}, "en": {"streak": [["\ud83d\udd25 Your streak is at risk", "{n} days running. Five minutes saves it."], ["\ud83d\udd25 Don't break it now", "You built {n} days. One lesson keeps it alive."], ["\u23f3 A few hours left", "Your {n}-day streak is waiting."]], "away": [["\ud83d\udcc8 The market didn't stop", "Neither do you have to. A short lesson is waiting."], ["\ud83e\udde0 Back for more?", "Your next concept takes three minutes."], ["\ud83d\udcb0 Every day you don't learn", "someone else profits from your mistakes."], ["\u23f0 Five minutes today", "worth more than an hour a year from now."]], "close": [["\ud83c\udfaf You're close", "One more lesson to level {n}."], ["\ud83e\udd47 This chapter is nearly yours", "{n} lessons left."]], "plain": [["\ud83d\udcda Time to learn", "Your daily lesson is waiting."], ["\ud83d\udca1 Knowledge before money", "The safest return there is."], ["\ud83d\udcca Today's challenge is ready", "One minute. Let's see if you know it."]]}};

const Remind = {
  KEY_ASKED: "iq_notif_asked",
  KEY_LAST:  "iq_notif_last",

  supported(){ return typeof Notification !== "undefined" && "serviceWorker" in navigator },
  granted(){ return this.supported() && Notification.permission === "granted" },

  /* Pick a message that fits the user's actual situation, so a reminder
     never feels generic. Falls back through: streak > nearly-there > away. */
  pick(){
    const lang = I18N.get() === "en" ? "en" : "he";
    const L = REMIND_MSGS[lang];
    const pickOne = a => a[Math.floor(Math.random() * a.length)];
    let m, n = 0;

    if(S.streak >= 2){ m = pickOne(L.streak); n = S.streak; }
    else {
      const lvl = Game.level(S.xp), need = Game.xpForLevel ? Game.xpForLevel(lvl+1) : null;
      if(need && need - S.xp <= 60){ m = pickOne(L.close); n = lvl + 1; }
      else if(S.lastDay && S.lastDay !== new Date().toDateString()) m = pickOne(L.away);
      else m = pickOne(L.plain);
    }
    return { title: m[0], body: String(m[1]).replace("{n}", n) };
  },

  /* Ask only after the user has finished something, never on first load —
     a permission prompt before any value is delivered gets denied and can
     never be asked again. */
  maybeAsk(){
    if(!this.supported() || Notification.permission !== "default") return;
    if(Storage.getSync(this.KEY_ASKED, false)) return;
    if(Object.keys(S.doneLessons || {}).length < 2) return;
    Storage.setSync(this.KEY_ASKED, true);
    setTimeout(() => {
      UI.ask(t("notifTitle"), t("notifBody"), t("notifYes"), () => {
        Notification.requestPermission().then(p => {
          if(p === "granted") this.show(this.pick());
        });
      });
    }, 1200);
  },

  show(msg){
    if(!this.granted()) return false;
    try{
      new Notification(msg.title, {
        body: msg.body, icon: "icon-192.png", badge: "icon-192.png",
        tag: "investiq-reminder", lang: I18N.get(), dir: I18N.dir()
      });
      Storage.setSync(this.KEY_LAST, Date.now());
      return true;
    }catch(e){ return false }
  },

  /* Placeholder for the server-backed path. Once a push endpoint exists,
     this returns a PushSubscription to store against the user row. */
  async subscribe(vapidPublicKey){
    if(!this.supported()) return null;
    const reg = await navigator.serviceWorker.ready;
    return reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: vapidPublicKey
    });
  }
};

/* =====================================================================
   ZOOM CONTROL — deliberate trade-off, documented.

   touch-action:manipulation (root, then every element) and a timing-based
   touchend guard were both tried and both failed: Safari kept zooming on
   double-tap inside the lesson sheet. Browser zoom is therefore blocked
   outright, in the viewport tag and via the gesture events.

   Accessibility is NOT abandoned. Blocking browser zoom without an
   alternative would fail WCAG 1.4.4, so text scaling moves in-app:
   Profile -> Text size offers Normal / Large / Extra large (up to 1.3x),
   which scales the entire interface from the root font size. That is the
   same pattern native apps use, and it is more reliable than pinch-zoom
   because the layout reflows instead of overflowing.
   ===================================================================== */
["gesturestart","gesturechange","gestureend"].forEach(function(ev){
  document.addEventListener(ev, function(e){ e.preventDefault(); }, { passive:false });
});

/* =====================================================================
   DOUBLE-TAP ZOOM GUARD
   touch-action:manipulation covers most cases, but Safari still zooms on a
   fast second tap inside scrollable containers. This cancels the second tap
   only when it lands within 300ms AND within 30px of the first — i.e. the
   actual double-tap gesture, never two deliberate taps on different targets.

   Pinch-to-zoom is deliberately NOT blocked: we never touch gesturestart,
   so users who need to magnify text still can.
   ===================================================================== */
(function(){
  var lastT = 0, lastX = 0, lastY = 0;
  document.addEventListener("touchend", function(e){
    if(!e.changedTouches || e.changedTouches.length !== 1) return;
    var t = e.changedTouches[0], now = Date.now();
    var near = Math.abs(t.clientX - lastX) < 30 && Math.abs(t.clientY - lastY) < 30;
    if(now - lastT < 300 && near){
      e.preventDefault();          // cancels the zoom, click already fired
    }
    lastT = now; lastX = t.clientX; lastY = t.clientY;
  }, { passive: false });
})();

/* =====================================================================
   SPLASH DISMISSAL

   Called at the end of boot, so it covers both entry paths: the login gate
   for a signed-out visitor, and the app itself for a signed-in one.

   A minimum display time avoids a jarring flash on fast connections — a
   splash that appears and vanishes in 40ms reads as a glitch. A hard
   fallback timer guarantees it clears even if boot throws, so a failure can
   never leave the user staring at a logo.
   ===================================================================== */
const Splash = {
  _shownAt: Date.now(),
  MIN_MS: 620,
  hide(){
    const el = document.getElementById("splash");
    if(!el || el._going) return;
    el._going = true;
    const wait = Math.max(0, this.MIN_MS - (Date.now() - this._shownAt));
    setTimeout(() => {
      el.classList.add("gone");
      /* Removed rather than left hidden: a full-screen overlay that lingers
         can still swallow taps if a stylesheet fails to load. */
      setTimeout(() => { try{ el.remove() }catch(e){} }, 500);
    }, wait);
  }
};
setTimeout(() => { try{ Splash.hide() }catch(e){} }, 4000);   // safety net

/* ---------- BOOT ---------- */
/* רשת ביטחון: כל שגיאה שלא נתפסה → מסך הסבר, לא מסך קפוא.
   שגיאות מכוונות (כמו "סיסמה שגויה") נתפסות במקום ולא מגיעות לכאן. */
window.addEventListener("error",e=>{
  Err.fatal(e.error||new Error(e.message||"שגיאה לא ידועה"),"האפליקציה");
});
window.addEventListener("unhandledrejection",e=>{
  Err.fatal(e.reason||new Error("פעולה ברקע נכשלה"),"רקע");
});

/* ספארי חוסם אודיו עד אינטראקציה אמיתית — משחררים במגע הראשון */
["pointerdown","touchstart","keydown"].forEach(ev=>
  document.addEventListener(ev,()=>{Sound.init();Sound.resume()},{once:true,passive:true}));

/* Ripple גלובלי — micro-interaction בכל לחיצה */
document.addEventListener("pointerdown",e=>{
  const b=e.target.closest(".btn,.opt,.chip,.card,.tab,.pill,.qcard,.node,.flipcard");
  if(!b)return;
  const cs=getComputedStyle(b);
  if(cs.position==="static")b.style.position="relative";
  if(cs.overflow!=="hidden")b.style.overflow="hidden";
  const r=b.getBoundingClientRect(),d=Math.max(r.width,r.height);
  const s=document.createElement("span");s.className="rip";
  s.style.width=s.style.height=d+"px";
  s.style.left=(e.clientX-r.left-d/2)+"px";
  s.style.top=(e.clientY-r.top-d/2)+"px";
  b.appendChild(s);setTimeout(()=>s.remove(),560);
},{passive:true});

try{
Err.checkStorage();
try{ Cloud.init() }catch(e){}   // never blocks boot

/* Deep links for the app stores: ?legal=terms, #terms, #privacy.
   Keeps the documents in one file while still giving each a shareable URL. */
try{
  var _lg = (location.hash || "").replace("#","").toLowerCase();
  if(!_lg){
    var _m = (location.search || "").match(/[?&]legal=(\w+)/);
    if(_m) _lg = _m[1].toLowerCase();
  }
  if(_lg === "terms" || _lg === "privacy") setTimeout(function(){ Legal.open(_lg) }, 400);
}catch(e){}          // מזהיר מראש אם הדפדפן חוסם שמירה
NOTIFY.flush();              // שולח התראות שנתקעו בלי רשת

I18N.apply();
document.querySelectorAll("[data-i18n]").forEach(e=>{e.textContent=t(e.dataset.i18n)});
document.querySelectorAll("[data-ic]").forEach(e=>{e.innerHTML=Icon.svg(e.dataset.ic,22)});
document.body.dataset.theme=S.theme||"light";
document.body.dataset.fsize=S.fsize||"";
if(!Auth.current()){
  // אין סשן פעיל → מסך התחברות/הרשמה. האפליקציה לא נטענת עד אימות.
  UI.showGate();
}else{
  try{NOTIFY.visit(Auth.current())}catch(e){}   // חזרה — ממוצה לפעם ביום
  Game.touchDay();Market.init();if(!S.nwHist.length)S.nwHist.push(100000);
  UI.headRefresh();UI.go("learn");Game.checkMissions();Game.checkAchs();Store.save();try{Remind.maybeAsk()}catch(e){}
  document.addEventListener("touchstart",()=>Sound.init(),{once:true});
  if(Auth.isAdmin())setTimeout(()=>UI.toast("👑","ברוך הבא, המנהל ימלך — גישה מלאה לכל התוכן"),600);
  if(!S.onboarded)setTimeout(()=>UI.startOnboard(),300);
}
try{ Splash.hide() }catch(e){}   // gate or app — whichever boot chose
}catch(e){
  // אם אפילו ההפעלה נכשלה — מסך הסבר, לא דף לבן
  try{ Splash.hide() }catch(_){}
  Err.fatal(e,"הפעלת האפליקציה");
}
