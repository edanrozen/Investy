<style>
/* ============ DESIGN SYSTEM ============
   Premium · Minimal · Apple-level polish
   ערכה בהירה כברירת מחדל · כהה כאופציה */
:root{
  /* Surfaces */
  --bg:#FAFAFC; --bg2:#F4F4F7; --card:#FFFFFF; --card2:#F6F7F9; --line:#E5E7EB;
  /* Text */
  --tx:#111827; --tx2:#6B7280; --tx3:#9CA3AF;
  /* Semantic */
  --pri:#2563EB; --pri-soft:rgba(37,99,235,.08); --pri-glow:rgba(37,99,235,.28);
  --up:#22C55E; --up-soft:rgba(34,197,94,.10);
  --dn:#EF4444; --dn-soft:rgba(239,68,68,.09);
  --amber:#F59E0B; --amber-soft:rgba(245,158,11,.11); --glow:rgba(245,158,11,.30);
  --peri:#2563EB; --peri-soft:rgba(37,99,235,.08);
  /* Radii — 20–28px */
  --r:24px; --r-lg:28px; --r-sm:18px; --r-xs:12px;
  /* Soft shadows only — layered, never harsh */
  --sh-xs:0 1px 2px rgba(17,24,39,.04);
  --sh-sm:0 2px 8px rgba(17,24,39,.05), 0 1px 2px rgba(17,24,39,.03);
  --shadow:0 4px 16px rgba(17,24,39,.06), 0 1px 3px rgba(17,24,39,.04);
  --sh-lg:0 12px 32px rgba(17,24,39,.08), 0 2px 8px rgba(17,24,39,.04);
  --sh-xl:0 24px 56px rgba(17,24,39,.11), 0 4px 12px rgba(17,24,39,.05);
  /* Motion — spring curves, 60fps */
  --spring:cubic-bezier(.34,1.56,.64,1);
  --ease:cubic-bezier(.22,1,.36,1);
  --glass:rgba(255,255,255,.72);
  --disp:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic Pro",system-ui,sans-serif;
}
[data-theme="dark"]{
  --bg:#0B0D12; --bg2:#12151C; --card:#161A22; --card2:#1D222C; --line:#262C38;
  --tx:#F3F4F6; --tx2:#9CA3AF; --tx3:#6B7280;
  --pri:#3B82F6; --pri-soft:rgba(59,130,246,.14); --pri-glow:rgba(59,130,246,.4);
  --up:#34D399; --up-soft:rgba(52,211,153,.13);
  --dn:#F87171; --dn-soft:rgba(248,113,113,.13);
  --amber:#FBBF24; --amber-soft:rgba(251,191,36,.14); --glow:rgba(251,191,36,.35);
  --peri:#3B82F6; --peri-soft:rgba(59,130,246,.13);
  --sh-xs:0 1px 2px rgba(0,0,0,.3);
  --sh-sm:0 2px 8px rgba(0,0,0,.35);
  --shadow:0 4px 18px rgba(0,0,0,.4);
  --sh-lg:0 14px 38px rgba(0,0,0,.5);
  --sh-xl:0 26px 62px rgba(0,0,0,.6);
  --glass:rgba(22,26,34,.72);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Heebo","Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;user-select:none;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:embed;letter-spacing:-.02em}
.disp{font-family:var(--disp);letter-spacing:-.03em}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer}
canvas{display:block;width:100%}

/* ============ LAYOUT ============ */
#app{max-width:520px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden}
header{padding:calc(env(safe-area-inset-top) + 14px) 20px 14px;display:flex;align-items:center;
  justify-content:space-between;gap:10px;z-index:5;
  background:linear-gradient(var(--bg) 70%,transparent)}
.brand{font-size:20px;font-weight:800;display:flex;align-items:center;gap:7px}
.brand em{font-style:normal;color:var(--amber)}
.flame{display:inline-block;width:16px;height:22px;position:relative}
.flame::before{content:"";position:absolute;inset:6px 2px 0;background:linear-gradient(var(--amber),#FF7A3E);
  border-radius:50% 50% 50% 50%/60% 60% 40% 40%;box-shadow:0 0 12px var(--glow);animation:flick 1.6s ease-in-out infinite}
@keyframes flick{50%{transform:scaleY(1.12) translateY(-1px)}}
.pills{display:flex;gap:8px}
.pill{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);
  padding:8px 13px;border-radius:999px;font-weight:700;font-size:13.5px;box-shadow:var(--sh-xs);
  transition:transform .3s var(--spring)}
.pill:active{transform:scale(.94)}
.pill.amber{border-color:var(--amber);color:var(--amber);box-shadow:0 0 0 3px var(--amber-soft)}
.pill.iq{border-color:var(--peri);color:var(--peri);box-shadow:0 0 0 3px var(--peri-soft)}
.glass{background:color-mix(in srgb,var(--card) 72%,transparent);backdrop-filter:blur(16px) saturate(1.3);
  -webkit-backdrop-filter:blur(16px) saturate(1.3);border:1px solid color-mix(in srgb,var(--tx) 10%,transparent)}
/* IQ hero */
.iqhero{position:relative;overflow:hidden;text-align:center;padding:22px 16px;
  background:radial-gradient(120% 120% at 50% 0%,var(--peri-soft),transparent 60%),linear-gradient(150deg,var(--card),var(--card2))}
.iqring{position:relative;width:150px;height:150px;margin:4px auto 8px}
.iqring .v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.iqring .v b{font-family:var(--disp);font-size:44px;font-weight:800;line-height:1}
.iqring .v span{font-size:11px;font-weight:800;color:var(--tx2);letter-spacing:1px}
.iqband{font-family:var(--disp);font-size:17px;font-weight:800}
.floaty{animation:floaty 4s ease-in-out infinite}
@keyframes floaty{50%{transform:translateY(-6px)}}
/* milestone ladder */
.mile{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.mile:last-child{border-bottom:none}
.mile .dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:16px;flex:none;
  background:var(--card2);border:2px solid var(--line)}
.mile.hit .dot{background:var(--up-soft);border-color:var(--up)}
.mile.next .dot{border-color:var(--amber);box-shadow:0 0 0 4px var(--amber-soft);animation:bob 2s ease-in-out infinite}
.mile.locked{opacity:.4}
/* event breaking banner */
.breaking{position:relative;overflow:hidden;border:1px solid var(--amber);
  background:linear-gradient(120deg,var(--amber-soft),transparent)}
.breaking::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--amber) 18%,transparent),transparent);
  transform:translateX(-100%);animation:sweep 2.4s ease-in-out infinite}
@keyframes sweep{60%,100%{transform:translateX(100%)}}
/* animated progress shimmer */
.prog i,.strength i{position:relative;overflow:hidden}
.prog i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);
  transform:translateX(-100%);animation:sweep 2s ease-in-out infinite}
/* page transition */

/* card entrance stagger */
.pop{animation:cardpop .4s cubic-bezier(.2,1,.3,1) both}
@keyframes cardpop{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
/* count badge */
.dailychip{position:relative}
.dailychip .dot2{position:absolute;top:-3px;left:-3px;width:9px;height:9px;border-radius:50%;background:var(--dn);border:2px solid var(--bg)}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:2px 18px 112px}
.view{display:none}
.view.on{display:block;animation:vin .42s var(--ease)}
@keyframes vin{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ============ TABS ============ */
nav{position:absolute;bottom:0;left:0;right:0;z-index:10;display:flex;justify-content:space-around;
  padding:10px 8px calc(env(safe-area-inset-bottom) + 10px);
  background:var(--glass);backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);
  border-top:1px solid var(--line)}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--tx3);
  font-weight:700;padding:6px 12px;border-radius:14px;position:relative;flex:1;
  transition:color .25s,transform .3s var(--spring)}
.tab:active{transform:scale(.9)}
.tab .tic{font-size:21px;line-height:1;transition:transform .35s var(--spring)}
.tab.on{color:var(--pri)}
.tab.on .tic{transform:translateY(-3px) scale(1.18)}
.tab.on::after{content:"";position:absolute;bottom:1px;left:50%;transform:translateX(-50%);
  width:5px;height:5px;border-radius:99px;background:var(--pri);animation:tabdot .4s var(--spring)}
@keyframes tabdot{from{transform:translateX(-50%) scale(0)}}
.tinp{width:100%;padding:12px 14px;border-radius:13px;border:1px solid var(--line);background:var(--card2);
  color:var(--tx);font-size:16px;font-family:var(--disp);font-weight:800;text-align:center}
.tlabel{font-size:12.5px;font-weight:800;color:var(--tx2);margin:12px 0 6px}
.tbig{font-family:var(--disp);font-size:34px;font-weight:800;text-align:center;margin:6px 0}
.split{display:flex;height:14px;border-radius:99px;overflow:hidden;margin:10px 0}
.split i{height:100%}
.subseg{display:flex;background:var(--card2);border-radius:13px;padding:4px;margin-bottom:14px;gap:2px;overflow-x:auto}
.subseg::-webkit-scrollbar{display:none}
.subseg button{flex:1;white-space:nowrap;padding:9px 8px;border-radius:10px;font-weight:800;font-size:12.5px;color:var(--tx3)}
.subseg button.on{background:var(--amber);color:#2A1800}
.onb{display:flex;flex-direction:column;align-items:center;text-align:center;
  justify-content:center;min-height:100%;padding:24px;overflow-y:auto;
  -webkit-overflow-scrolling:touch}
.onb .big{font-size:64px;filter:drop-shadow(0 4px 20px var(--glow));margin-bottom:8px}
.goalpick{display:flex;flex-direction:column;gap:10px;width:100%;margin-top:16px}
.goalpick button{padding:16px;border-radius:16px;border:2px solid var(--line);background:var(--card);
  font-weight:800;font-size:15px;text-align:start;display:flex;justify-content:space-between;align-items:center}
.goalpick button.on{border-color:var(--amber);background:var(--amber-soft)}
.strength{height:5px;border-radius:99px;background:var(--card2);overflow:hidden;margin-top:6px}
.strength i{display:block;height:100%;border-radius:99px}
/* Gate (מסך התחברות) */
#gate{position:fixed;inset:0;z-index:300;display:none;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:radial-gradient(120% 90% at 50% 0%,var(--amber-soft),transparent 55%),var(--bg)}
#gate.on{display:block}
.gbox{max-width:420px;margin:0 auto;padding:34px 20px 40px;min-height:100%;display:flex;flex-direction:column;justify-content:center}
.gtitle{font-family:var(--disp);font-size:30px;font-weight:800;text-align:center}
.ginp{width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);
  color:var(--tx);font-size:16px;font-family:inherit;margin-top:10px;text-align:start}
.ginp:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 3px var(--amber-soft)}
.gerr{color:var(--dn);font-weight:700;font-size:13px;text-align:center;margin-top:10px;min-height:18px}
.gtabs{display:flex;background:var(--card2);border-radius:13px;padding:4px;margin:18px 0 6px;gap:2px}
.gtabs button{flex:1;padding:10px;border-radius:10px;font-weight:800;font-size:13.5px;color:var(--tx3)}
.gtabs button.on{background:var(--amber);color:#2A1800}
.badge-admin{background:linear-gradient(120deg,#F5C451,#E88A3C);color:#2A1800;font-weight:800;
  font-size:11px;padding:3px 7px;border-radius:99px}
/* ===== CHAPTER COMPLETE ===== */
#sh-chapdone{background:linear-gradient(170deg,var(--pri-soft),var(--bg) 45%)}
.cdwrap{padding:calc(env(safe-area-inset-top) + 40px) 22px 30px;display:flex;flex-direction:column;
  align-items:center;text-align:center;height:100%;overflow-y:auto}
.cdburst{font-size:66px;animation:cdpop .7s var(--spring) both}
@keyframes cdpop{from{transform:scale(0) rotate(-25deg);opacity:0}}
.cdlbl{font-size:11.5px;font-weight:800;color:var(--pri);letter-spacing:.12em;
  margin-top:8px;text-transform:uppercase}
.cdtitle{font-size:25px;font-weight:800;margin-top:5px;line-height:1.3}
.cdstats{display:flex;gap:10px;margin:22px 0;width:100%}
.cdstat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:13px 6px;box-shadow:var(--sh-xs)}
.cdstat b{display:block;font-family:var(--disp);font-size:21px;font-weight:800;color:var(--pri)}
.cdstat span{font-size:11px;color:var(--tx2);font-weight:700}
.cdnext{background:var(--card);border:1.5px solid var(--pri);border-radius:22px;
  padding:20px 18px;width:100%;margin-bottom:20px;box-shadow:var(--sh-lg)}
.cdnext.locked{border-color:var(--line);opacity:.85}
.cdnext.done{border-color:var(--amber);background:linear-gradient(150deg,var(--amber-soft),var(--card))}
.cdna{font-size:11px;font-weight:800;color:var(--tx3);letter-spacing:.1em;margin-bottom:8px}
.cdni{font-size:38px;margin-bottom:6px}
.cdnt{font-family:var(--disp);font-size:17px;font-weight:800;margin-bottom:5px}
.cdnd{font-size:12.5px;color:var(--tx2);line-height:1.6}

/* ===== PASSWORD FIELD ===== */
.pwwrap{position:relative;display:flex;align-items:center}
.pwwrap .ginp{flex:1;padding-inline-end:44px}
.pweye{position:absolute;inset-inline-end:8px;font-size:17px;padding:8px;opacity:.55;
  background:none;border:none;transition:opacity .2s,transform .25s var(--spring)}
.pweye:active{transform:scale(.88)}
.pwreq{background:var(--card2);border-radius:14px;padding:11px 13px;margin:-4px 0 10px;
  display:flex;flex-direction:column;gap:6px}
.pwr{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--tx2);
  font-weight:600;transition:color .25s}
.pwr.ok{color:var(--up)}
.pwr-x{font-size:13px;width:14px;text-align:center;flex-shrink:0}

/* ===== ERROR HANDLING ===== */
.errtoast{position:fixed;inset-inline:14px;bottom:calc(env(safe-area-inset-bottom) + 82px);z-index:200;
  display:flex;gap:11px;align-items:flex-start;padding:14px 15px;border-radius:18px;
  background:var(--card);border:1.5px solid var(--amber);box-shadow:var(--sh-xl);
  opacity:0;transform:translateY(16px) scale(.96);transition:all .4s var(--spring)}
.errtoast.on{opacity:1;transform:none}
.et-ic{font-size:22px;line-height:1}
.et-body{flex:1;min-width:0}
.et-t{font-weight:800;font-size:14px;margin-bottom:3px}
.et-m{font-size:12.5px;color:var(--tx2);line-height:1.5}
.et-f{font-size:12px;color:var(--amber);font-weight:700;margin-top:6px;line-height:1.45}
.et-x{color:var(--tx3);font-size:16px;padding:2px 4px;flex-shrink:0}

.errscreen{position:fixed;inset:0;z-index:999;background:var(--bg);
  display:grid;place-items:center;padding:24px;overflow-y:auto;
  -webkit-overflow-scrolling:touch;animation:vin .4s var(--ease)}
.es-box{max-width:400px;width:100%;text-align:center}
.es-ic{font-size:56px;margin-bottom:10px}
.es-t{font-size:24px;font-weight:800;margin-bottom:10px}
.es-p{color:var(--tx2);font-size:14.5px;line-height:1.65;margin-bottom:20px}
.es-what{background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:13px 15px;margin-bottom:20px;text-align:start}
.es-lbl{font-size:11px;font-weight:800;color:var(--tx3);margin-bottom:5px}
.es-code{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--dn);
  line-height:1.5;word-break:break-word;direction:ltr;text-align:start}
.es-hint{margin-top:18px;font-size:12px;color:var(--tx3);line-height:1.7}
.es-hint a{color:var(--dn);font-weight:700}

/* ===== BiDi: בידוד רצפים לטיניים/מספריים בתוך עברית ===== */
bdi{unicode-bidi:isolate;direction:ltr}

/* ===== MICRO-INTERACTIONS ===== */
.rip{position:absolute;border-radius:50%;background:currentColor;opacity:.16;
  transform:scale(0);animation:rip .6s var(--ease) forwards;pointer-events:none;z-index:0}
@keyframes rip{to{transform:scale(1);opacity:0}}
.btn>*,.opt>*,.chip>*,.card>*{position:relative;z-index:1}

/* ===== CHART TOOLTIP + CROSSHAIR ===== */
.chov{position:absolute;inset-inline-start:0;top:0;width:100%;pointer-events:none;z-index:2}
.chtip{position:absolute;z-index:3;pointer-events:none;padding:5px 10px;border-radius:10px;
  background:var(--glass);backdrop-filter:blur(14px) saturate(1.6);-webkit-backdrop-filter:blur(14px) saturate(1.6);
  border:1px solid var(--line);box-shadow:var(--sh-lg);
  font-size:12px;font-weight:800;font-variant-numeric:tabular-nums;direction:ltr;
  opacity:0;transform:translateY(4px) scale(.94);transition:opacity .16s,transform .16s var(--spring);white-space:nowrap}
.chtip.on{opacity:1;transform:none}

/* ===== PAGE TRANSITION (spring) ===== */
.pgin{animation:vin .42s var(--ease) both}

/* ===== CIRCULAR PROGRESS ===== */
.cprog{position:relative;width:72px;height:72px;flex-shrink:0}
.cprog svg{transform:rotate(-90deg)}
.cprog circle{fill:none;stroke-width:7;stroke-linecap:round}
.cprog .cbg{stroke:var(--line)}
.cprog .cfg{stroke:var(--pri);transition:stroke-dashoffset 1s var(--ease)}
.cprog .cval{position:absolute;inset:0;display:grid;place-items:center;
  font-family:var(--disp);font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}

/* ===== SHIMMER (רק בעיבוד אמיתי) ===== */
.sk{background:linear-gradient(100deg,var(--card2) 30%,var(--line) 50%,var(--card2) 70%);
  background-size:220% 100%;animation:sh 1.4s infinite;border-radius:12px}
@keyframes sh{to{background-position:-220% 0}}

/* ===== ICONS (Lucide, inline) ===== */
.ic{display:inline-block;vertical-align:-3px;flex-shrink:0;
  stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ===== QUEST STRIP (רצועת משימות אופקית) ===== */
.qstrip{display:flex;gap:9px;overflow-x:auto;padding:2px 0 6px;margin-bottom:6px;
  scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.qstrip::-webkit-scrollbar{display:none}
.qcard{position:relative;flex:0 0 132px;scroll-snap-align:start;background:var(--card);
  border:1px solid var(--line);border-radius:16px;padding:12px 11px;text-align:start;
  display:flex;flex-direction:column;gap:2px;transition:transform .15s}
.qcard:active{transform:scale(.96)}
.qcard.peri{border-color:var(--peri)}
.qcard.up{border-color:var(--up)}
.qcard.amber{border-color:var(--amber)}
.qcard.dn{border-color:var(--dn);background:linear-gradient(140deg,#3A1730,var(--card))}
.qic{font-size:26px;margin-bottom:3px}
.qt{font-weight:800;font-size:12.5px;line-height:1.25}
.qs{font-size:11px;color:var(--tx2);font-weight:600}
.qdot{position:absolute;top:9px;inset-inline-end:9px;width:8px;height:8px;border-radius:99px;
  background:var(--dn);box-shadow:0 0 0 0 var(--dn);animation:qpulse 1.8s infinite}
@keyframes qpulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--dn) 60%,transparent)}
  70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}

/* ===== SECTION BAR ===== */
.secbar{display:flex;align-items:center;gap:8px;margin:26px 0 10px;padding:9px 13px;border-radius:14px;
  background:linear-gradient(120deg,var(--card),var(--card2));border:1px solid var(--line)}
.secbar.lk{opacity:.5}
.secic{font-size:19px}
.secn{font-family:var(--disp);font-weight:800;font-size:15px}
.secneed{font-size:11px;color:var(--amber);font-weight:800;background:var(--amber-soft);padding:3px 8px;border-radius:99px}
.secline{flex:1;height:1px;background:var(--line)}

/* ===== TIER BAR ===== */
.tierbar{display:flex;align-items:center;gap:9px;margin:14px 0 6px;position:relative;z-index:2}
.tierbar.lk{opacity:.45}
.tiertag{font-size:11px;font-weight:800;padding:4px 10px;border-radius:99px;white-space:nowrap}
.tierline{flex:1;height:1px;background:var(--line)}

/* ===== HOOK ===== */
.hookwrap{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  min-height:58vh;padding:10px 4px}
.hookic{font-size:64px;margin-bottom:16px}
.hookq{font-size:26px;font-weight:800;line-height:1.35;letter-spacing:-.4px;
  background:linear-gradient(120deg,var(--tx),var(--amber));-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;animation:hookIn .6s cubic-bezier(.2,1,.3,1) both}
.hooksub{color:var(--tx2);margin-top:14px;font-size:14.5px;line-height:1.6;max-width:330px;
  animation:hookIn .6s .2s cubic-bezier(.2,1,.3,1) both}
.hookbtn{margin-top:28px;max-width:260px;animation:hookIn .6s .4s cubic-bezier(.2,1,.3,1) both}
@keyframes hookIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.hookdots{display:flex;gap:6px;margin-top:20px}
.hookdots i{width:6px;height:6px;border-radius:99px;background:var(--tx3);animation:hdot 1.4s infinite}
.hookdots i:nth-child(2){animation-delay:.2s}.hookdots i:nth-child(3){animation-delay:.4s}
@keyframes hdot{0%,100%{opacity:.3}50%{opacity:1;transform:translateY(-3px)}}

/* ===== FLIP CARDS ===== */
.flipgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.flipcard{position:relative;height:132px;perspective:900px;background:none;padding:0}
.fc-face{position:absolute;inset:0;border-radius:16px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:12px;backface-visibility:hidden;transition:transform .55s cubic-bezier(.4,.2,.2,1);
  border:1px solid var(--line)}
.fc-front{background:var(--card2)}
.fc-back{background:linear-gradient(140deg,var(--amber-soft),var(--card));border-color:var(--amber);transform:rotateY(180deg)}
.flipcard.on .fc-front{transform:rotateY(-180deg)}
.flipcard.on .fc-back{transform:rotateY(0)}
.fc-t{font-weight:800;font-size:13.5px;margin-top:7px;text-align:center;line-height:1.3}
.fc-hint{font-size:11px;color:var(--tx3);margin-top:6px;font-weight:700}
.fc-b{font-size:12.5px;line-height:1.5;text-align:center;font-weight:600}

/* ===== SIM ===== */
.simhead{display:flex;align-items:center;justify-content:space-between;background:var(--card);
  border:1px solid var(--line);border-radius:16px;padding:13px 15px;margin-bottom:10px}
.simval{font-size:27px;font-weight:800}
.simevent{animation:simIn .45s cubic-bezier(.2,1,.3,1) both}
@keyframes simIn{from{opacity:0;transform:translateY(-8px) scale(.98)}to{opacity:1;transform:none}}
.simlog{background:var(--card2);border-radius:13px;padding:9px 11px;font-size:11.5px;color:var(--tx2)}
.simlogline{padding:3px 0;border-bottom:1px solid var(--line)}
.simlogline:last-child{border:none}

/* ===== SUMMARY ===== */
.sumwrap{padding:6px 0}
.sumtop{text-align:center;margin-bottom:18px}
.sumtitle{font-size:22px;font-weight:800;margin-top:6px}
.sumpoint{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);
  border-radius:15px;padding:13px 14px;margin-bottom:9px;animation:sumIn .5s cubic-bezier(.2,1,.3,1) both}
@keyframes sumIn{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.sumnum{width:26px;height:26px;border-radius:9px;background:var(--amber);color:#2A1800;display:grid;
  place-items:center;font-weight:800;font-size:13px;flex-shrink:0}
.sumtext{font-size:13.5px;line-height:1.55;font-weight:600;padding-top:2px}

/* ===== CHALLENGE ===== */
/* Skip link — hidden until focused, then the first tab stop on the page.
   Standard WCAG 2.4.1 bypass for keyboard and switch-control users. */
.skip-link{position:absolute;top:-60px;right:12px;z-index:10000;
  background:var(--peri);color:#fff;padding:10px 16px;border-radius:0 0 12px 12px;
  font-weight:700;font-size:14px;transition:top .18s ease}
.skip-link:focus{top:0}

/* Honour the OS "increase contrast" setting. */
@media (prefers-contrast: more){
  .muted{color:var(--tx)!important;opacity:1!important}
  .card,.qcard{border-width:2px!important}
}

/* =====================================================================
   NATIVE TOUCH BEHAVIOUR
   These four rules are the difference between "a website" and "an app"
   on iOS. Each fixes a specific reported symptom.
   ===================================================================== */

/* touch-action:manipulation disables double-tap-to-zoom ON CONTROLS ONLY.
   Pinch-zoom still works everywhere, so the accessibility fix stays intact.
   This is the cause of "tapping fast makes the screen zoom". */
/* Applied to the ROOT, not just controls. Double-tap zoom fires wherever the
   finger lands — on a card, on text, on empty background — so scoping this to
   buttons left most of the screen still zoomable. That is what was happening.

   `manipulation` allows panning and pinch-zoom but removes double-tap zoom.
   Pinch-to-zoom therefore still works, so the WCAG 1.4.4 fix stays intact —
   this is NOT the same as user-scalable=no, which would block pinch too. */
html, body, #app, .view, .sheet, .card, .qcard, div, p, span, h1, h2, h3,
button, a, label, section, main{
  touch-action: manipulation;
}

button, .btn, .chip, .tab, .qbtn, .sh-x, .opt, .node, .qcard,
.swipe-btn, .surv-btn, .modecard, .fc, .cmp-tab, .pers-opt, [onclick]{
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;   /* no grey flash box */
  -webkit-touch-callout: none;                /* no long-press share menu */
}

/* Chrome must not be text-selectable — accidental blue highlight while
   tapping is the single most "website" feeling thing there is.
   Lesson prose is deliberately excluded so users can still copy it. */
button, .btn, .chip, .tab, .qbtn, .sh-x, .opt, .node, .qcard,
.tabbar, .head, .sh-head, .modecard, .cmp-tab{
  -webkit-user-select: none;
  user-select: none;
}

/* Instant press feedback. Without it a user who feels nothing taps again —
   which is the "buttons don't respond" report. */
button:active, .btn:active, .chip:active, .qbtn:active, .opt:active,
.node:active, .qcard:active, .modecard:active, .fc:active{
  transform: scale(.96);
  transition: transform .06s ease;
}
@media (prefers-reduced-motion: reduce){
  button:active, .btn:active, .chip:active, .qbtn:active, .opt:active,
  .node:active, .qcard:active, .modecard:active, .fc:active{
    transform: none;
    filter: brightness(.94);
  }
}

/* No rubber-band overscroll on the page body. */
html, body{ overscroll-behavior: none; }

/* 44px minimum touch target without changing anything visually:
   the pseudo-element extends only the hit area. */
.chip, .tab, .qbtn, .sh-x, .gtabs button, .cmp-tabs button, .cmp-tab{
  position: relative;
}
.chip::after, .tab::after, .qbtn::after, .sh-x::after,
.gtabs button::after, .cmp-tabs button::after, .cmp-tab::after{
  content: ""; position: absolute; inset: -10px; z-index: 0;
}

.sheet{position:relative}
/* The legal reader is opened FROM the consent dialog, so it has to sit
   above it. Sheets are z-index:40 by default; the dialog is 9999. */
#sh-legal{z-index:10001}

/* Safety net for overlays: nothing full-screen should be able to grow
   past the viewport without a way to scroll to its buttons. Applied
   broadly so an overlay added later inherits the behaviour. */
.askwrap,.errscreen,#levelup,#gate{overscroll-behavior:contain}
.askbox,.box,.sh-body,.cdwrap,.onb{-webkit-overflow-scrolling:touch}
/* Sheets keep their header and footer fixed while the middle scrolls. */
.sheet{min-height:0}
.sh-head,.sh-foot{flex:0 0 auto}
.sh-body{flex:1 1 auto;min-height:0}

/* ===== consent ===== */
.cst-row{display:flex;gap:11px;align-items:flex-start;padding:11px 0;
  border-bottom:1px solid var(--line);cursor:pointer}
.cst-row:last-of-type{border-bottom:0}
.cst-row input{width:22px;height:22px;flex:0 0 22px;margin-top:1px;accent-color:var(--pri)}
.cst-row span{font-size:13.5px;line-height:1.6;color:var(--tx)}

/* ===== splash ===== */
#splash{position:fixed;inset:0;z-index:99999;background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  transition:opacity .45s ease}
#splash.gone{opacity:0;pointer-events:none}
.sp-inner{display:flex;flex-direction:column;align-items:center;gap:18px;
  transform:translateY(-6%)}
.sp-logo{width:104px;height:104px;border-radius:24px;display:block;
  box-shadow:0 12px 34px rgba(0,0,0,.13);
  animation:spPop .62s cubic-bezier(.22,1.2,.36,1) both}
@keyframes spPop{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:scale(1)}}
.sp-name{font-size:27px;font-weight:800;letter-spacing:-.5px;color:var(--tx);
  animation:spFade .5s ease .18s both}
.sp-name em{font-style:normal;color:var(--pri)}
@keyframes spFade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sp-bar{width:112px;height:3px;border-radius:99px;background:var(--line);
  overflow:hidden;animation:spFade .5s ease .3s both}
.sp-bar i{display:block;height:100%;width:40%;border-radius:99px;background:var(--pri);
  animation:spSlide 1.05s ease-in-out infinite}
@keyframes spSlide{0%{transform:translateX(-115%)}100%{transform:translateX(285%)}}
@media (prefers-reduced-motion: reduce){
  .sp-logo,.sp-name,.sp-bar{animation:none}
  .sp-bar i{animation:none;width:100%}
}

/* ===== legal reader ===== */
.lg-lang{display:flex;gap:8px;margin:4px 0 18px}
.lg-lang button{flex:1;padding:11px 8px;border-radius:12px;border:1.5px solid var(--line);
  background:var(--card2);color:var(--tx2);font-weight:700;font-size:13.5px;font-family:inherit}
.lg-lang button.on{background:var(--pri-soft);border-color:var(--pri);color:var(--tx)}
.lg-doc{padding-bottom:40px}
.lg-h1{font-size:24px;margin:0 0 6px;line-height:1.25}
.lg-h2{font-size:15.5px;font-weight:800;margin:26px 0 8px;padding-top:16px;
  border-top:1px solid var(--line);color:var(--tx)}
.lg-doc .lg-h2:first-of-type{border-top:0;padding-top:0}
.lg-p{font-size:13.5px;line-height:1.85;color:var(--tx2);margin:0 0 12px}
.lg-p b{color:var(--tx);font-weight:800}
.lg-ph{background:var(--amber-soft);color:var(--tx);padding:1px 6px;border-radius:6px;
  font-weight:700;font-size:12.5px}
.chalcard{border:1.5px dashed var(--amber);background:var(--amber-soft)}

/* ===== accessibility ===== */

/* Visible keyboard focus. :focus-visible only fires for keyboard users, so
   pointer users see no change. */
*:focus-visible{outline:3px solid var(--peri);outline-offset:2px;border-radius:6px}

/* Screen-reader-only text: present in the accessibility tree, invisible on screen.
   Used to label icon-only controls without altering the design. */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* Respect the OS "reduce motion" setting. The app has 24 keyframe animations;
   for motion-sensitive users they become instant instead of removed, so no
   state is lost. */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important;scroll-behavior:auto!important}
  .il-pulse,.floaty{animation:none!important}
}

/* User-selectable text size. Everything already sizes in px relative to the
   root, so scaling the root scales the whole app proportionally. */
html{font-size:calc(16px * var(--fscale,1))}
body[data-fsize="lg"]{--fscale:1.15}
body[data-fsize="xl"]{--fscale:1.3}

/* Larger tap targets on coarse pointers, without changing visual size:
   the pseudo-element extends the hit area only. */
@media (pointer: coarse){
  .chip,.tab,.qbtn,.sh-x{position:relative}
  .chip::after,.tab::after,.qbtn::after,.sh-x::after{
    content:"";position:absolute;inset:-8px;z-index:0}
}


/* ===== illustration labels (HTML, not SVG — Safari mis-renders Hebrew in SVG text) ===== */
.il-box{position:relative;width:100%;container-type:inline-size}
.il-lbl{position:absolute;white-space:nowrap;line-height:1;pointer-events:none;
  font-family:var(--disp);opacity:0;animation:ilfade .5s ease forwards}
.il-lbl.il-d1{animation-delay:.1s}.il-lbl.il-d2{animation-delay:.25s}
.il-lbl.il-d3{animation-delay:.4s}.il-lbl.il-d4{animation-delay:.55s}
.il-lbl.il-d5{animation-delay:.7s}


/* ===== in-app confirm ===== */
.askwrap{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.45);
  display:flex;align-items:center;justify-content:center;padding:24px;animation:askin .18s ease}
@keyframes askin{from{opacity:0}}
.askbox{background:var(--card);border:1px solid var(--line);border-radius:22px;
  padding:22px 20px;max-width:340px;width:100%;box-shadow:var(--sh-lg);
  /* Cap the height and let the middle scroll. Without this the box
     stretches to the viewport and the action buttons are pushed to the
     bottom with a large empty gap above them. */
  max-height:min(560px, 88vh);display:flex;flex-direction:column;
  animation:askpop .26s var(--spring)}
.askbox .askb{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0}
.askbox .askt,.askbox .askrow{flex:0 0 auto}
@keyframes askpop{from{transform:scale(.9);opacity:0}}
.askt{font-size:19px;font-weight:800;text-align:center}
.askb{font-size:13.5px;color:var(--tx2);line-height:1.6;text-align:center;margin-top:8px}
.askrow{display:flex;gap:10px;margin-top:18px}
.askrow .btn{flex:1;margin:0}


/* ===== מצב הישרדות ===== */
.modecard{display:flex;align-items:center;gap:13px;text-align:start;width:100%;margin-bottom:12px;
  position:relative;transition:all .25s var(--spring);cursor:pointer}
.modecard:active{transform:scale(.98)}
.modecard.hot{border:1.5px solid var(--dn);background:linear-gradient(140deg,var(--dn-soft),var(--card))}
.modecard-ic{font-size:34px;line-height:1;flex-shrink:0}
.modecard-body{flex:1}
.modecard-t{font-weight:800;font-size:16px}
.modecard-d{font-size:12.5px;color:var(--tx2);line-height:1.5;margin-top:3px}
.modecard-arrow{font-size:20px;color:var(--tx3);flex-shrink:0}
.modecard-badge{position:absolute;top:-8px;inset-inline-end:14px;font-size:11px;font-weight:800;
  background:var(--dn);color:#fff;padding:3px 9px;border-radius:99px;letter-spacing:.03em}
.surv-left{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;
  background:var(--card2);border-radius:14px;margin-bottom:14px;font-weight:700;font-size:14px;
  border:1.5px solid var(--line);transition:all .3s}
.surv-left b{font-size:20px;font-family:var(--disp)}
.surv-left.done{border-color:var(--up);background:var(--up-soft);color:var(--up)}
.surv-left.over{border-color:var(--dn);background:var(--dn-soft);color:var(--dn)}
.surv-assets{display:flex;flex-direction:column;gap:11px}
.surv-asset{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 14px}
.surv-asset-head{display:flex;align-items:center;gap:11px;margin-bottom:10px}
.surv-asset-ic{font-size:26px;line-height:1}
.surv-asset-name{font-weight:800;font-size:14px}
.surv-asset-d{font-size:11.5px;color:var(--tx3)}
.surv-asset-pct{margin-inline-start:auto;font-family:var(--disp);font-weight:800;font-size:18px;color:var(--pri)}
.surv-ctrl{display:flex;align-items:center;gap:6px}
.surv-btn{flex-shrink:0;padding:6px 9px;border-radius:9px;background:var(--card2);border:1px solid var(--line);
  font-size:12px;font-weight:800;color:var(--tx2);transition:all .18s var(--spring)}
.surv-btn:active{transform:scale(.9);background:var(--pri);color:#fff}
.surv-bar{flex:1;height:8px;background:var(--card2);border-radius:99px;overflow:hidden}
.surv-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--amber));
  border-radius:99px;transition:width .3s var(--spring)}
.surv-stage{font-size:11.5px;font-weight:800;color:var(--tx3);letter-spacing:.05em;text-align:center;
  margin-bottom:10px;text-transform:uppercase}
.surv-beat-t{font-size:19px;font-weight:800;text-align:center;line-height:1.35;margin-bottom:14px}
.surv-news{line-height:1.65;font-size:14px}
.surv-hint{text-align:center;font-size:12px;color:var(--tx3);margin-top:14px}
.surv-totalchange{text-align:center;padding:18px;border-radius:18px;margin-bottom:14px;
  background:var(--card);border:1.5px solid var(--line)}
.surv-totalchange.up{border-color:var(--up);background:var(--up-soft)}
.surv-totalchange.dn{border-color:var(--dn);background:var(--dn-soft)}
.surv-totalchange .k{font-size:12px;color:var(--tx2);font-weight:700}
.surv-totalchange .v{font-size:30px;font-family:var(--disp);font-weight:800;margin:2px 0}
.surv-delta{font-size:13px;font-weight:800}
.surv-totalchange.up .surv-delta{color:var(--up)}
.surv-totalchange.dn .surv-delta{color:var(--dn)}
.surv-results{display:flex;flex-direction:column;gap:2px}
.surv-res-row{display:flex;align-items:center;gap:10px;padding:11px 6px;border-bottom:1px solid var(--line)}
.surv-res-row:last-child{border-bottom:none}
.surv-res-ic{flex:1;font-size:13px;font-weight:700}
.surv-res-ch{font-family:var(--disp);font-weight:800;font-size:14px;min-width:56px;text-align:end}
.surv-res-ch.up{color:var(--up)}
.surv-res-ch.dn{color:var(--dn)}
.surv-res-val{font-size:12.5px;color:var(--tx2);min-width:74px;text-align:end}
.surv-final{text-align:center;padding:22px;border-radius:20px;margin-bottom:14px;border:2px solid}
.surv-final.profit{border-color:var(--amber);background:linear-gradient(150deg,var(--amber-soft),var(--card));
  box-shadow:0 8px 30px var(--glow)}
.surv-final.survived{border-color:var(--up);background:var(--up-soft)}
.surv-final.lost{border-color:var(--dn);background:var(--dn-soft)}
.surv-final-v{font-size:38px;font-family:var(--disp);font-weight:800}
.surv-final-d{font-size:13.5px;color:var(--tx2);font-weight:700;margin-top:4px}
.surv-chart{margin-bottom:14px;border-radius:14px;overflow:hidden}



/* ===== טבלת השוואה אינטראקטיבית ===== */
.cmp-tabs{display:flex;gap:7px;overflow-x:auto;padding:4px 2px 10px;margin:0 -2px;scrollbar-width:none}
.cmp-tabs::-webkit-scrollbar{display:none}
.cmp-tab{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:11px 13px;border-radius:15px;background:var(--card2);border:1.5px solid var(--line);
  font-size:11.5px;font-weight:800;color:var(--tx2);transition:all .28s var(--spring);min-width:74px}
.cmp-tab-ic{font-size:22px;line-height:1}
.cmp-tab.on{background:linear-gradient(150deg,var(--pri),color-mix(in srgb,var(--pri) 70%,#000));
  color:#fff;border-color:transparent;transform:translateY(-3px);box-shadow:0 8px 22px var(--pri-glow)}
.cmp-card{background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:18px;
  box-shadow:var(--sh-lg)}
.cmp-card-head{display:flex;align-items:center;gap:13px;padding-bottom:14px;margin-bottom:6px;
  border-bottom:1px solid var(--line)}
.cmp-card-ic{font-size:38px;line-height:1;filter:drop-shadow(0 4px 10px rgba(0,0,0,.18))}
.cmp-card-name{font-size:19px;font-weight:800}
.cmp-card-tag{font-size:12px;color:var(--pri);font-weight:700;margin-top:2px}
.cmp-rows{display:flex;flex-direction:column;gap:2px}
.cmp-row{display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:11px 4px;border-bottom:1px solid var(--line)}
.cmp-row:last-child{border-bottom:none}
.cmp-row-k{font-size:12.5px;font-weight:700;color:var(--tx2);flex-shrink:0}
.cmp-row-v{font-size:13px;font-weight:700;text-align:end;line-height:1.4}
.tone-good{color:var(--up)}
.tone-bad{color:var(--dn)}
.tone-warn{color:var(--amber)}
.tone-neutral{color:var(--tx)}

/* ===== מבחן אישיות ===== */
.pers-prog{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;margin:6px 0 8px}
.pers-prog-bar{height:100%;background:linear-gradient(90deg,var(--pri),var(--amber));
  border-radius:99px;transition:width .5s var(--spring)}
.pers-count{font-size:11.5px;font-weight:800;color:var(--tx3);text-align:center;margin-bottom:16px;
  letter-spacing:.04em}
.pers-q{font-size:19px;font-weight:800;line-height:1.4;text-align:center;margin-bottom:18px}
.pers-opts{display:flex;flex-direction:column;gap:10px}
.pers-opt{text-align:start;padding:16px 17px;border-radius:16px;background:var(--card2);
  border:1.5px solid var(--line);font-size:14px;font-weight:700;color:var(--tx);line-height:1.45;
  transition:all .22s var(--spring)}
.pers-opt:active{transform:scale(.97);border-color:var(--pri);background:var(--pri-soft)}
.pers-reveal{text-align:center;padding:20px 6px}
.pers-badge{font-size:76px;line-height:1;margin-bottom:6px;
  filter:drop-shadow(0 10px 28px var(--glow))}
.pers-reveal-lbl{font-size:11.5px;font-weight:800;color:var(--amber);letter-spacing:.14em;
  text-transform:uppercase}
.pers-reveal-name{font-size:27px;font-weight:800;margin:4px 0 6px}
.pers-reveal-tag{display:inline-block;font-size:12.5px;font-weight:800;color:var(--pri);
  background:var(--pri-soft);padding:5px 13px;border-radius:99px;margin-bottom:16px}
.pers-reveal-desc{text-align:start;font-size:14px;line-height:1.65;color:var(--tx2);
  padding:16px;margin-top:6px}
.pers-reveal-tip{margin-top:14px;font-size:13px;font-weight:700;color:var(--amber);
  background:var(--amber-soft);padding:12px 15px;border-radius:14px;line-height:1.55;text-align:start}


#chalbtn.done{background:var(--up);color:#06231A}

/* ===== AI MENTOR ===== */
.mentor{margin-top:16px;border-radius:18px;border:1.5px solid var(--peri);overflow:hidden;
  background:linear-gradient(150deg,var(--peri-soft),var(--card));
  opacity:0;transform:translateY(14px);transition:opacity .45s,transform .45s}
.mentor.on{opacity:1;transform:none}
.mentor.solved{border-color:var(--up)}
.m-head{display:flex;align-items:center;gap:10px;padding:12px 14px;background:rgba(0,0,0,.12)}
.m-av{width:36px;height:36px;border-radius:11px;background:var(--peri);display:grid;place-items:center;font-size:19px}
.m-name{font-weight:800;font-size:14px}
.m-sub{font-size:11px;color:var(--tx2)}
.m-body{padding:12px 14px}
.m-msg{background:var(--card2);border-radius:13px;padding:11px 13px;font-size:13px;line-height:1.6;margin-bottom:9px}
.m-an{background:var(--amber-soft);border:1px solid var(--amber)}
.m-opt{margin-bottom:7px}
.crown{position:relative;overflow:hidden;border:1px solid var(--amber);
  background:radial-gradient(130% 130% at 100% 0%,var(--amber-soft),transparent 58%),linear-gradient(120deg,var(--card),var(--card2))}
.crown::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--amber) 22%,transparent),transparent);
  transform:translateX(-100%);animation:sweep 3.2s ease-in-out infinite}

/* ============ GENERIC ============ */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;
  margin-bottom:14px;box-shadow:var(--sh-sm);position:relative;overflow:hidden;
  transition:transform .35s var(--spring),box-shadow .35s var(--ease),border-color .25s}
.card::before{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:linear-gradient(160deg,rgba(255,255,255,.5),transparent 42%);opacity:.6}
[data-theme="dark"] .card::before{background:linear-gradient(160deg,rgba(255,255,255,.04),transparent 42%)}
button.card:active{transform:scale(.985);box-shadow:var(--sh-xs)}
.sec-t{font-size:12.5px;font-weight:800;color:var(--tx2);letter-spacing:.5px;margin:20px 2px 10px;text-transform:uppercase}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.btn{background:var(--pri);color:#fff;font-weight:700;font-size:16px;border-radius:18px;
  height:56px;padding:0 20px;width:100%;position:relative;overflow:hidden;letter-spacing:-.01em;
  box-shadow:0 6px 18px var(--pri-glow),0 1px 2px rgba(17,24,39,.08);
  transition:transform .3s var(--spring),box-shadow .3s var(--ease),opacity .2s;
  display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:scale(.965);box-shadow:0 2px 8px var(--pri-glow)}
.btn:disabled{opacity:.38;box-shadow:none;transform:none}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
.btn.ghost{background:var(--card2);color:var(--tx);box-shadow:0 4px 0 rgba(0,0,0,.18)}
.btn.up{background:var(--up);color:#04160E;box-shadow:0 6px 0 rgba(0,0,0,.2)}
.btn.dn{background:var(--dn);color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.2)}
.btn:disabled{opacity:.4;pointer-events:none;box-shadow:none}
.chip{font-size:12px;font-weight:700;padding:6px 12px;border-radius:999px;display:inline-flex;
  align-items:center;gap:5px;letter-spacing:-.01em;transition:transform .25s var(--spring)}
.chip:active{transform:scale(.94)}
.chip.up{background:var(--up-soft);color:var(--up)}.chip.dn{background:var(--dn-soft);color:var(--dn)}
.chip.amber{background:var(--amber-soft);color:var(--amber)}.chip.peri{background:var(--peri-soft);color:var(--peri)}
.muted{color:var(--tx2);font-size:13px;line-height:1.55}

/* ============ LEARN PATH (חתימת עיצוב) ============ */
.goalbar{display:flex;align-items:center;gap:12px}
.goalbar .ring{position:relative;width:46px;height:46px;flex:none}
.goalbar .ring .n{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:15px}
.chap{margin:8px 0 4px}
.chap-h{display:flex;align-items:center;gap:12px;background:linear-gradient(120deg,var(--card),var(--card2));
  border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:22px 0 6px;box-shadow:var(--shadow)}
.chap-h .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:var(--bg2);flex:none}
.chap-h h3{font-size:17px;font-weight:800}.chap-h .muted{font-size:12px}
.path{position:relative;padding:8px 0}
.node{position:relative;display:flex;flex-direction:column;align-items:center;margin:2px auto;width:76px;z-index:2}
.node .disc{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;font-size:27px;
  background:var(--card);border:3px solid var(--line);box-shadow:0 6px 0 rgba(0,0,0,.25);transition:transform .12s}
.node:active .disc{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.node.done .disc{background:var(--up-soft);border-color:var(--up);color:var(--up)}
.node.cur .disc{border-color:var(--amber);box-shadow:0 0 0 5px var(--amber-soft),0 6px 0 rgba(0,0,0,.25);animation:bob 2s ease-in-out infinite}
.node.locked{opacity:.42;pointer-events:none}
@keyframes bob{50%{transform:translateY(-5px)}}
.node .lb{font-size:11px;font-weight:800;margin-top:7px;text-align:center;line-height:1.2;max-width:96px}
.node.cur .lb{color:var(--amber)}
.node .start{position:absolute;top:-30px;background:var(--amber);color:#2A1800;font-weight:800;font-size:11px;
  padding:5px 12px;border-radius:99px;white-space:nowrap;box-shadow:0 4px 12px var(--glow);animation:bob 2s ease-in-out infinite}
.node .start::after{content:"";position:absolute;bottom:-5px;right:50%;transform:translateX(50%) rotate(45deg);width:9px;height:9px;background:var(--amber)}
.track{position:absolute;left:50%;top:0;bottom:0;width:3px;transform:translateX(-50%);
  background:repeating-linear-gradient(var(--line) 0 8px,transparent 8px 16px);z-index:1}
.off-l{transform:translateX(-46px)}.off-r{transform:translateX(46px)}

/* mission strip */
.mstrip{display:flex;gap:10px;overflow-x:auto;padding:2px 0 4px;-webkit-overflow-scrolling:touch}
.mstrip::-webkit-scrollbar{display:none}
.mtile{flex:none;width:140px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px}
.mtile.done{border-color:var(--up);background:var(--up-soft)}
.mtile .mi{font-size:20px}.mtile .mt{font-size:12.5px;font-weight:800;margin:5px 0 6px;line-height:1.25}
.mtile .mp{height:5px;border-radius:99px;background:var(--bg2);overflow:hidden}
.mtile .mp i{display:block;height:100%;background:var(--amber)}

/* ============ SHEETS ============ */
.sheet{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;background:var(--bg);
  transform:translateY(100%);opacity:0;visibility:hidden;
  transition:transform .48s var(--ease),opacity .3s,visibility .48s}
.sheet.on{transform:none;opacity:1;visibility:visible}
.sh-head{padding:calc(env(safe-area-inset-top) + 12px) 18px 8px;display:flex;align-items:center;gap:12px}
.sh-x{width:36px;height:36px;border-radius:50%;background:var(--card);border:1px solid var(--line);
  display:grid;place-items:center;font-size:15px;color:var(--tx2);flex:none}
.sh-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 18px 34px}
.sh-foot{padding:12px 18px calc(env(safe-area-inset-bottom) + 14px);border-top:1px solid var(--line);background:var(--bg2)}
.prog{height:8px;border-radius:99px;background:var(--card2);overflow:hidden;flex:1}
.prog i{display:block;height:100%;background:var(--amber);border-radius:99px;transition:width .35s ease}
.combo{font-size:13px;font-weight:800;color:var(--amber);min-width:44px;text-align:center;opacity:0;transition:opacity .2s}
.combo.on{opacity:1}

/* exercise cards */
.ex{animation:vin .3s ease}
.ex .q{font-size:19px;font-weight:800;line-height:1.4;margin-bottom:16px}
.teach{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px;min-height:220px;
  display:flex;flex-direction:column;justify-content:center;text-align:center}
.teach .big{font-size:46px;margin-bottom:14px;filter:drop-shadow(0 4px 14px var(--glow))}
.teach h2{font-size:22px;font-weight:800;margin-bottom:12px}.teach p{font-size:16px;line-height:1.75}
/* Answer buttons.
   `transition` deliberately lists only colour and shadow properties.
   It previously animated `transform` as well, which combined with the
   :active scale meant tapping an answer visibly stretched the button —
   the spring easing overshoots, and on a flex row with no shrink guard
   that overshoot reads as the option growing taller.
   flex-shrink:0 on the content keeps the row a fixed height while the
   correct/incorrect state adds its marker. */
.opt{display:flex;align-items:center;width:100%;text-align:start;background:var(--card);
  border:1.5px solid var(--line);border-radius:18px;min-height:56px;padding:14px 18px;
  margin-bottom:10px;font-size:15px;font-weight:600;color:var(--tx);position:relative;overflow:hidden;
  box-shadow:var(--sh-xs);line-height:1.4;
  box-sizing:border-box;flex:0 0 auto;
  transition:border-color .25s,background .25s,box-shadow .25s,color .25s}
/* The global :active rule scales every button. On answer options that
   scale fights the state change, so it is replaced with a brightness
   shift — feedback without any geometry change. */
.opt:active{transform:none;filter:brightness(.97)}
.opt.ok,.opt.bad{transform:none}
.opt:active{transform:scale(.975)}
.opt:disabled{opacity:.9}
.opt:active{transform:scale(.98)}
.opt.ok{border-color:var(--up);background:var(--up-soft)}.opt.bad{border-color:var(--dn);background:var(--dn-soft)}
.why{border-radius:15px;padding:15px;font-size:14px;line-height:1.6;margin-top:6px;animation:vin .25s ease;font-weight:600}
.why.ok{background:var(--up-soft);color:var(--up)}.why.bad{background:var(--dn-soft);color:var(--dn)}
.exhint{font-size:13px;color:var(--tx3);text-align:center;margin-bottom:12px;font-weight:700}
.candlewrap{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:8px 4px 4px;margin-bottom:14px;position:relative}
.candlewrap canvas{border-radius:12px}
/* slider */
.slider{width:100%;height:38px;-webkit-appearance:none;background:transparent;margin:8px 0}
.slider::-webkit-slider-runnable-track{height:10px;border-radius:99px;
  background:linear-gradient(90deg,var(--up),var(--amber),var(--dn))}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:#fff;
  margin-top:-10px;box-shadow:0 3px 10px rgba(0,0,0,.4),0 0 0 4px var(--amber)}
.guessbox{text-align:center;font-family:var(--disp);font-size:38px;font-weight:800;margin:4px 0}
.reveal{text-align:center;padding:16px;border-radius:15px;background:var(--card2);margin-top:12px;animation:vin .3s ease}
.reveal .rv{font-family:var(--disp);font-size:34px;font-weight:800;color:var(--up)}
/* build */
.balloc{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);
  border-radius:15px;padding:11px 13px;margin-bottom:9px}
.balloc .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:19px;background:var(--card2);flex:none}
.balloc .st{display:flex;align-items:center;gap:8px}
.balloc .sb{width:34px;height:34px;border-radius:10px;background:var(--card2);font-size:19px;font-weight:800}
.balloc .wv{min-width:42px;text-align:center;font-weight:800;font-family:var(--disp)}
.remain{text-align:center;font-weight:800;margin:6px 0 12px}

/* ============ PRACTICE (simulator) ============ */
.asset{display:flex;align-items:center;gap:12px;padding:13px 14px;background:var(--card);
  border:1px solid var(--line);border-radius:var(--r);margin-bottom:9px;transition:transform .1s;width:100%}
.asset:active{transform:scale(.98)}
.a-ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:20px;background:var(--card2);flex:none}
.a-nm{font-weight:800;font-size:14.5px}.a-sym{font-size:11.5px;color:var(--tx3);font-weight:700}
.a-spark{width:60px;height:30px;flex:none}
.a-px{text-align:left;min-width:76px}.a-p{font-weight:800;font-size:14.5px}.a-c{font-size:12px;font-weight:800;margin-top:1px}
.holdbar{height:8px;border-radius:99px;background:var(--card2);overflow:hidden;display:flex;margin-top:10px}.holdbar i{height:100%}
.seg{display:flex;background:var(--card2);border-radius:14px;padding:4px;margin-bottom:14px}
.seg button{flex:1;padding:10px;border-radius:11px;font-weight:800;font-size:14px;color:var(--tx3)}
.seg button.on.buy{background:var(--up);color:#04160E}.seg button.on.sell{background:var(--dn);color:#fff}
.seg button.on.line,.seg button.on.candle{background:var(--amber);color:#2A1800}
.qty{display:flex;align-items:center;justify-content:center;gap:18px;margin:14px 0}
.qbtn{width:48px;height:48px;border-radius:50%;background:var(--card2);font-size:24px;font-weight:800}
.qval{font-size:32px;font-weight:800;min-width:70px;text-align:center;font-family:var(--disp)}

/* coach / profile */
.co{border-inline-start:4px solid var(--peri);padding-inline-start:12px}
.co.warn{border-color:var(--amber)}.co.risk{border-color:var(--dn)}.co.good{border-color:var(--up)}
.bias{margin-bottom:13px}.bias .row{margin-bottom:5px}
.score{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.score .card{margin:0;padding:15px;text-align:center}
.score .v{font-family:var(--disp);font-size:30px;font-weight:800;margin:4px 0 2px}.score .k{font-size:12px;color:var(--tx2);font-weight:700}
.ach{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.ach div{aspect-ratio:1;border-radius:16px;background:var(--card);border:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:25px;padding:4px}
.ach div span{font-size:11px;font-weight:800;color:var(--tx2);text-align:center;line-height:1.15}
.ach div.off{opacity:.26;filter:grayscale(1)}

/* fx */
#toasts{position:absolute;top:calc(env(safe-area-inset-top) + 60px);left:0;right:0;z-index:60;
  display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 18px;box-shadow:var(--shadow);
  display:flex;align-items:center;gap:10px;font-weight:800;font-size:14px;max-width:88%;
  animation:tin .3s ease,tout .3s ease 2.5s forwards}
@keyframes tin{from{opacity:0;transform:translateY(-14px) scale(.94)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateY(-10px)}}
#confetti{position:absolute;inset:0;z-index:80;pointer-events:none;display:none}
#levelup{position:absolute;inset:0;z-index:75;display:none;place-items:center;background:rgba(15,10,30,.72);backdrop-filter:blur(6px);padding:24px;overflow-y:auto}
#levelup .box{text-align:center;animation:pop .5s cubic-bezier(.2,1.3,.4,1);max-height:86vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
#levelup .lu-ic{font-size:80px;filter:drop-shadow(0 0 30px var(--glow))}
#levelup .lu-t{font-family:var(--disp);font-size:32px;font-weight:800;margin:8px 0}
@keyframes pop{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:none}}
.disclaimer{font-size:11px;color:var(--tx3);text-align:center;line-height:1.6;padding:16px 8px 4px}
</style>

  {t:"predict",q:"דני חסך ₪1,000 לחודש מגיל 25 עד 35 (10 שנים) ואז הפסיק לגמרי. רוני התחיל בגיל 35 וחסך עד 65 (30 שנה!). כמה % מכסף הסיום של דני יש לרוני?",
   min:40,max:160,step:5,unit:"%",answer:90,tol:20,
   reveal:"רוני, שחסך 30 שנה, בקושי משיג את דני שחסך רק 10 — כי לדני היה יותר זמן לתת לכסף לעבוד.",
   why:"המרכיב החזק בנוסחה הוא זמן, לא הסכום. להתחיל מוקדם שווה יותר מלהפקיד הרבה.",tr:{en:{"q": "Danny saved ₪1,000/month from age 25 to 35 (10 years), then stopped completely. Roni started at 35 and saved until 65 (30 years!). What % of Danny's final amount does Roni have?", "unit": "%", "reveal": "Roni, who saved for 30 years, barely catches Danny who saved only 10 — because Danny had more time to let the money work.", "why": "The strongest factor in the formula is time, not the amount. Starting early beats depositing a lot."}}},
  {t:"quiz",q:"מה המרכיב החזק ביותר בריבית דריבית?",o:["הסכום שאתה מפקיד","הזמן","המזל","הברוקר"],a:1,
   why:"זמן. הוא זה שנותן לרווחים להרוויח בעצמם, שוב ושוב.",
   mentor:{why:"בחרת במשהו שנשמע הגיוני — אבל המתמטיקה אומרת אחרת. סכום גדול לתקופה קצרה מפסיד לסכום קטן לתקופה ארוכה.",
    analogy:"כדור שלג: לא משנה כמה גדול התחלת — משנה כמה זמן הוא מתגלגל במורד.",
    q:"מי יסיים עם יותר: מי שהשקיע ₪100 בחודש במשך 40 שנה, או ₪400 בחודש במשך 10 שנים? (סה\"כ הפקדות דומה)",
    o:["מי שהשקיע 40 שנה","מי שהשקיע 10 שנים","בדיוק אותו דבר","אי אפשר לדעת"],a:0,
    hint:"אותו סכום כולל — אבל למי היה יותר זמן לתת לרווחים להרוויח?",
    ok:"נכון! אותה הפקדה כוללת, אבל הזמן עשה את ההבדל העצום."},tr:{en:{"q": "What's the strongest factor in compound interest?", "o": ["The amount you deposit", "Time", "Luck", "The broker"], "why": "Time. It's what lets your gains earn gains, again and again.", "mentor": {"why": "You picked something that sounds logical — but the math says otherwise. A large amount over a short period loses to a small amount over a long one.", "analogy": "A snowball: it doesn't matter how big you started — it matters how long it rolls downhill.", "q": "Who ends up with more: someone who invested ₪100/month for 40 years, or ₪400/month for 10 years? (similar total deposits)", "o": ["The 40-year investor", "The 10-year investor", "Exactly the same", "Impossible to know"], "hint": "Same total amount — but who had more time to let gains earn gains?", "ok": "Right! Same total deposits, but time made the enormous difference."}}}},
  {t:"challenge",task:"פתח מחשבון ריבית דריבית (או השתמש בכלי שלנו בלשונית 🧰) והזן: הסכום שאתה יכול להפקיד בחודש, 8% תשואה, ו-30 שנה. תסתכל על המספר.",
   hint:"עכשיו שנה ל-20 שנה בלבד וראה כמה אתה מפסיד. ההפרש הזה הוא המחיר של דחייה.",tr:{en:{"task": "Open a compound-interest calculator (or use our tool in the 🧰 tab) and enter: the amount you can deposit monthly, 8% return, and 30 years. Look at the number.", "hint": "Now change it to just 20 years and see how much you lose. That gap is the price of delay."}}},
  {t:"summary",h:"מה למדת",points:["ריבית דריבית = הרווחים מתחילים להרוויח בעצמם",
    "הצמיחה מעריכית — זוחלת בהתחלה, מתפוצצת בסוף",
    "זמן חזק יותר מסכום. להתחיל מוקדם מנצח להפקיד הרבה",
    "כל שנה שאתה מחכה — עולה לך יותר ממה שנדמה"],tr:{en:{"h": "What you learned", "points": ["Compounding = gains start earning gains themselves", "Growth is exponential — crawls at first, explodes at the end", "Time beats amount. Starting early beats depositing a lot", "Every year you wait — costs you more than it seems"]}}}
 ]},

 {id:"l14",ic:"🧺",title:"מדדים ו-ETF",tr:{en:{title:"Indexes and ETFs"}},tier:"intermediate",tr:{en:{title:"Index funds & ETFs"}},steps:[
  {t:"hook",ic:"🎯",q:"אתה בטוח שתצליח לבחור את המניה המנצחת מתוך 500?",
   sub:"רוב מנהלי ההשקעות המקצועיים לא מצליחים. יש דרך אחרת.",cta:"מה הדרך? →",tr:{en:{"q": "Are you sure you can pick the winning stock out of 500?", "sub": "Most professional fund managers can't. There's another way.", "cta": "What way? →"}}},
  {t:"card",art:"diversify",ic:"🧺",h:"סל במקום מניה אחת",p:"ETF קונה עשרות-מאות חברות בפעולה אחת. במקום להמר על חברה בודדת — אתה מחזיק את השוק כולו.",
   tr:{en:{h:"A basket, not one stock",p:"An ETF buys dozens or hundreds of companies in one action. Instead of betting on a single company, you hold the whole market."}}},
  {t:"build",q:"בנה תיק ראשון: פזר 100% בין הנכסים. אחר כך נריץ 10 שנים ונראה מה קרה.",
   assets:["INDX","BOND","TECH","GOLD","CRPT"],
   why:"פיזור על מדד ואג\"ח מרכך מפולות. תיק שכולו במניה אחת תנודתית = הימור, לא השקעה.",tr:{en:{"q": "Build a first portfolio: spread 100% across the assets. Then we'll run 10 years and see what happened.", "why": "Spreading across an index and bonds cushions crashes. A portfolio all in one volatile stock = a bet, not an investment."}}},
  {t:"card",art:"feebite",ic:"💸",h:"דמי ניהול הורגים בשקט",p:"הפרש של 1% בדמי ניהול על 30 שנה יכול לאכול מאות אלפי שקלים. תמיד בדוק כמה הקרן גובה.",tr:{en:{"h": "Fees kill quietly", "p": "A 1% difference in fees over 30 years can eat hundreds of thousands. Always check how much the fund charges."}}},
  {t:"quiz",q:"היתרון המרכזי של קרן מדד:",o:["רווח מובטח","פיזור רחב בפעולה אחת","היא תמיד עולה","אין בה סיכון"],a:1,
   why:"פיזור. שום השקעה לא מבטיחה רווח, אבל סל רחב מקטין תלות בחברה בודדת.",
   mentor:{why:"בחרת באפשרות שמבטיחה משהו. אף השקעה לא מבטיחה — וכל מי שאומר אחרת מוכר לך אשליה.",
    analogy:"קרן מדד לא מבטלת סיכון — היא מפזרת אותו. אם חברה אחת מ-500 קורסת, כמעט לא הרגשת. אם היא הייתה כל התיק — נמחקת.",
    q:"חברה אחת מתוך 500 במדד פשטה רגל. מה קרה לתיק שלך?",
    o:["איבדתי הכל","כמעט לא הרגשתי","הרווחתי","המדד נסגר"],a:1,
    hint:"כמה משקל יש לחברה אחת מתוך 500?",
    ok:"בדיוק — זה כוחו של פיזור. אף חברה בודדת לא יכולה למחוק אותך."},tr:{en:{"q": "The main advantage of an index fund:", "o": ["Guaranteed profit", "Broad diversification in one move", "It always goes up", "It has no risk"], "why": "Diversification. No investment guarantees profit, but a broad basket reduces dependence on a single company.", "mentor": {"why": "You picked an option that promises something. No investment guarantees — and anyone who says otherwise is selling you an illusion.", "analogy": "An index fund doesn't eliminate risk — it spreads it. If one company out of 500 collapses, you barely felt it. If it were your whole portfolio — you'd be wiped out.", "q": "One company out of 500 in the index went bankrupt. What happened to your portfolio?", "o": ["I lost everything", "I barely felt it", "I profited", "The index closed"], "hint": "How much weight does one company out of 500 carry?", "ok": "Exactly — that's the power of diversification. No single company can wipe you out."}}}},
  {t:"challenge",task:"חפש בגוגל 'S&P 500 ETF' והסתכל מה דמי הניהול (Expense Ratio) של שתי קרנות שונות. השווה ביניהן.",
   hint:"קרנות מדד טובות גובות לרוב פחות מ-0.2% בשנה. אם ראית 1%+ — שאל את עצמך למה.",tr:{en:{"task": "Search Google for 'S&P 500 ETF' and look at the expense ratio of two different funds. Compare them.", "hint": "Good index funds usually charge under 0.2% a year. If you saw 1%+ — ask yourself why."}}},
  {t:"summary",h:"מה למדת",points:["ETF = מאות חברות בפעולה אחת",
    "פיזור מקטין את התלות בחברה בודדת — אבל לא מבטל סיכון",
    "דמי ניהול נוגסים בשקט לאורך שנים — תמיד בדוק אותם",
    "עדיף להחזיק את השוק מאשר לנחש מי ינצח בתוכו"],tr:{en:{"h": "What you learned", "points": ["An ETF = hundreds of companies in one move", "Diversification reduces dependence on any single company — but doesn't eliminate risk", "Fees quietly eat away over the years — always check them", "Better to hold the market than to guess who wins inside it"]}}}
 ]},

 {id:"l15",ic:"🎢",title:"תנודתיות — החבר שנראה כמו אויב",tr:{en:{title:"Volatility — the friend that looks like an enemy"}},tier:"advanced",tr:{en:{title:"Volatility — the friend that looks like an enemy"}},steps:[
  {t:"hook",ic:"🎢",q:"למה השוק יורד 30% ואתה עדיין אמור לחייך?",
   sub:"התשובה מפרידה בין משקיעים למהמרים.",cta:"תסביר לי →",tr:{en:{"q": "Why does the market drop 30% and you're still supposed to smile?", "sub": "The answer separates investors from gamblers.", "cta": "Explain it to me →"}}},
  {t:"card",art:"panic",ic:"🎢",h:"תנודתיות ≠ הפסד",p:"ירידה במחיר היא הפסד רק אם מכרת. עד אז זו תנודה. השוק ירד ועלה מאות פעמים — ובכל פעם מי שנשאר, התאושש.",tr:{en:{"h": "Volatility ≠ loss", "p": "A price drop is a loss only if you sold. Until then it's a swing. The market has fallen and risen hundreds of times — and each time, those who stayed recovered."}}},
  {t:"sim",asset:"📊 מדד רחב",start:10000,
   why:"ראית את זה בעצמך: כל ירידה הרגישה כמו סוף העולם, וכל פעם השוק חזר. ההפסד היחיד שהיה קבוע — הוא של מי שמכר.",
   events:[
    {ic:"📉",t:"ירידה של 10%",good:false,news:"השוק יורד 10%. הכותרות מדברות על 'תיקון'. הבטן מתהפכת.",
     opts:[{l:"מוכר — לא אוהב את זה",r:-.10,fb:"קיבעת את ההפסד. הירידה הפכה מזמנית לקבועה."},
      {l:"מחזיק — זו תנודה, לא הפסד",r:0,good:true,fb:"נכון. עדיין לא הפסדת כלום — רק אם תמכור."}]},
    {ic:"🩸",t:"מפולת — עוד 20%",good:false,news:"עכשיו זה רציני. השוק ב-30% מתחת לשיא. כולם מוכרים. הפחד בשיא.",
     opts:[{l:"נשבר ומוכר הכל",r:-.20,fb:"מכרת בתחתית — הטעות היקרה ביותר בהשקעות."},
      {l:"מחזיק, ואפילו קונה עוד",r:0,good:true,fb:"אומץ. הפחד המרבי הוא לרוב נקודת ההזדמנות."}]},
    {ic:"🚀",t:"ההתאוששות",good:true,news:"השוק מתאושש חזק — ועובר את השיא הקודם.",
     opts:[{l:"מוכר מיד מרוב הקלה",r:.10,fb:"יצאת מוקדם. שוב תזמנת — ושוב שילמת."},
      {l:"מחזיק לטווח ארוך",r:.45,good:true,fb:"מושלם. הסבלנות שילמה — כמו תמיד בהיסטוריה."}]}],tr:{en:{"asset": "📊 Broad index", "why": "You saw it yourself: every drop felt like the end of the world, and every time the market came back. The only permanent loss — was for whoever sold.", "events": [{"t": "A 10% drop", "news": "The market drops 10%. Headlines talk of a 'correction.' Your stomach turns.", "opts": [{"l": "Sell — I don't like this", "fb": "You locked in the loss. The drop went from temporary to permanent."}, {"l": "Hold — it's a swing, not a loss", "fb": "Right. You haven't lost anything yet — only if you sell."}]}, {"t": "Crash — another 20%", "news": "Now it's serious. The market is 30% below its peak. Everyone's selling. Fear at its max.", "opts": [{"l": "Break down and sell everything", "fb": "You sold at the bottom — the most expensive mistake in investing."}, {"l": "Hold, and even buy more", "fb": "Courage. Maximum fear is usually the point of opportunity."}]}, {"t": "The recovery", "news": "The market recovers strongly — and passes its previous peak.", "opts": [{"l": "Sell immediately out of relief", "fb": "You left early. You timed again — and paid again."}, {"l": "Hold for the long term", "fb": "Perfect. Patience paid off — as it always has in history."}]}]}}},
  {t:"quiz",q:"מתי ירידה במחיר הופכת להפסד אמיתי?",o:["מיד כשהיא קורית","כשאתה מוכר","כשהחדשות מדווחות","אף פעם"],a:1,
   why:"עד שמכרת — זו תנודה על הנייר. המכירה היא שמקבעת אותה.",
   mentor:{why:"בלבלת בין ירידה זמנית להפסד קבוע. זו בדיוק הטעות שגורמת לאנשים למכור בתחתית.",
    analogy:"אם שווי הדירה שלך ירד 10% — הפסדת כסף? רק אם מכרת. אחרת אתה עדיין גר בדירה, והשווי ישתנה שוב.",
    q:"קנית ב-100. המחיר ירד ל-70. לא מכרת. שנתיים אחר כך הוא ב-130. כמה הפסדת?",
    o:["30","0 — הרווחתי 30","70","תלוי בחדשות"],a:1,
    hint:"מה קרה בפועל לכסף שלך בסוף התקופה?",
    ok:"בדיוק. הירידה הייתה על הנייר בלבד — כי לא מכרת."},tr:{en:{"q": "When does a price drop become a real loss?", "o": ["The moment it happens", "When you sell", "When the news reports it", "Never"], "why": "Until you sell — it's a paper swing. Selling is what locks it in.", "mentor": {"why": "You confused a temporary drop with a permanent loss. That's exactly the mistake that makes people sell at the bottom.", "analogy": "If your home's value dropped 10% — did you lose money? Only if you sold. Otherwise you still live there, and the value will change again.", "q": "You bought at 100. The price fell to 70. You didn't sell. Two years later it's at 130. How much did you lose?", "o": ["30", "0 — I gained 30", "70", "Depends on the news"], "hint": "What actually happened to your money by the end of the period?", "ok": "Exactly. The drop was only on paper — because you didn't sell."}}}},
  {t:"summary",h:"מה למדת",points:["תנודתיות היא המחיר שאתה משלם על תשואה — לא עונש",
    "ירידה הופכת להפסד קבוע רק כשאתה מוכר",
    "הפחד המרבי מגיע בתחתית — בדיוק במקום הכי גרוע למכור",
    "מי שנשאר בשוק לאורך זמן, התאושש. תמיד, בכל ההיסטוריה"],tr:{en:{"h": "What you learned", "points": ["Volatility is the price you pay for return — not a punishment", "A drop becomes a permanent loss only when you sell", "Maximum fear comes at the bottom — exactly the worst place to sell", "Whoever stayed in the market long term recovered. Always, in all of history"]}}}
 ]}
]},
{id:"c2",ic:"⚖️",title:"סיכון ופיזור",desc:"איך לא להימחק — הכלל מספר 1",tr:{en:{"title": "Risk and Diversification", "desc": "How not to get wiped out — rule number one"}},lessons:[
 {id:"l21",ic:"🥚",title:"אל תשים הכל בסל אחד",tier:"beginner",tr:{en:{"title": "Don't put it all in one basket"}},steps:[
  {t:"hook",ic:"🥚",q:"מה קורה אם כל הכסף שלך במניה אחת — והיא קורסת?",
   sub:"זה לא תרחיש קיצון. זה קרה לאלפי אנשים.",cta:"תראה לי →",tr:{en:{"q": "What happens if all your money is in one stock — and it collapses?", "sub": "This isn't a far-fetched scenario. It has happened to thousands of people.", "cta": "Show me →"}}},
  {t:"card",art:"diversify",ic:"🥚",h:"סל אחד = סיכון קיומי",p:"אם כל הכסף במניה אחת והיא קורסת — נמחקת. אם הוא ב-500 חברות ואחת קורסת — כמעט לא הרגשת. זה כל הרעיון.",tr:{en:{"h": "One basket = existential risk", "p": "If all your money is in one stock and it collapses, you're wiped out. If it's spread across 500 companies and one collapses, you barely notice. That's the whole idea."}}},
  {t:"flip",q:"4 סוגי פיזור. הקש לגלות:",
   cards:[{ic:"🏢",t:"בין חברות",b:"לא מניה אחת — עשרות או מאות. חברה בודדת לא יכולה למחוק אותך."},
    {ic:"🏭",t:"בין סקטורים",b:"לא רק טק. אם סקטור שלם נופל, השאר מחזיקים אותך."},
    {ic:"🌍",t:"בין מדינות",b:"לא רק שוק אחד. משברים מקומיים לא מוחקים תיק גלובלי."},
    {ic:"💎",t:"בין סוגי נכסים",b:"מניות + אג\"ח + מזומן. הם לא נופלים יחד — וזה מה שמרכך."}],tr:{en:{"q": "4 kinds of diversification. Tap to reveal:", "cards": [{"t": "Across companies", "b": "Not one stock — dozens or hundreds. No single company can wipe you out."}, {"t": "Across sectors", "b": "Not just tech. If an entire sector falls, the rest hold you up."}, {"t": "Across countries", "b": "Not one market. A local crisis can't erase a global portfolio."}, {"t": "Across asset types", "b": "Stocks + bonds + cash. They don't fall together — and that's what cushions you."}]}}},
  {t:"sim",asset:"⚠️ תיק מרוכז מול מפוזר",start:10000,
   why:"אותם אירועים בדיוק — תוצאה הפוכה. הפיזור לא הפך אותך לגאון; הוא פשוט מנע ממך להימחק. וזה כל התפקיד שלו.",
   events:[
    {ic:"🚀",t:"סקטור הטק מזנק",good:true,news:"הטק עולה 30%. התיק המרוכז (100% טק) מזנק. המפוזר עולה פחות. אתה מרגיש טיפש.",
     opts:[{l:"מתחרט — עובר להכל-טק",r:.30,fb:"התפתית. עכשיו אתה חשוף לגמרי לסקטור אחד. תחזיק חזק."},
      {l:"נשאר מפוזר — לא רודף",r:.10,good:true,fb:"עלית פחות. אבל שמרת על הביטוח. עוד רגע תבין למה."}]},
    {ic:"💥",t:"הטק קורס 50%",good:false,news:"רגולציה חדשה מוחקת חצי משווי הסקטור. תיק כולו-טק מתרסק. מפוזר סופג חלקית.",
     opts:[{l:"מוכר הכל בפאניקה",r:-.35,fb:"מכרת בתחתית אחרי שהיית מרוכז מדי. שילמת פעמיים."},
      {l:"מפוזר — סופג ומחזיק",r:-.12,good:true,fb:"נפלת 12% במקום 50%. הפיזור עשה בדיוק את מה שהוא נועד לעשות."}]},
    {ic:"📈",t:"התאוששות",good:true,news:"השוק מתאושש. מי שנשאר מפוזר ולא נמחק — משתתף בעלייה.",
     opts:[{l:"מחזיק את התיק המפוזר",r:.22,good:true,fb:"שרדת את המפולת ונהנית מההתאוששות. זו הנוסחה."},
      {l:"קופץ בחזרה להכל-טק",r:.05,fb:"שוב רודף אחרי הגל האחרון. זה מחזור אינסופי של איחור."}]}],tr:{en:{"asset": "⚠️ Concentrated vs diversified portfolio", "why": "Exactly the same events — opposite outcomes. Diversification didn't make you a genius; it simply stopped you from being wiped out. And that is its entire job.", "events": [{"t": "Tech sector surges", "news": "Tech rises 30%. The concentrated portfolio (100% tech) jumps. The diversified one rises less. You feel foolish.", "opts": [{"l": "Regret it — switch to all-tech", "fb": "You gave in. Now you're fully exposed to a single sector. Hold on tight."}, {"l": "Stay diversified — don't chase", "fb": "You gained less. But you kept the insurance. In a moment you'll see why."}]}, {"t": "Tech collapses 50%", "news": "New regulation erases half the sector's value. The all-tech portfolio craters. The diversified one absorbs part of the blow.", "opts": [{"l": "Panic and sell everything", "fb": "You sold at the bottom after being over-concentrated. You paid twice."}, {"l": "Diversified — absorb it and hold", "fb": "You fell 12% instead of 50%. Diversification did exactly what it was built to do."}]}, {"t": "Recovery", "news": "The market recovers. Whoever stayed diversified and wasn't wiped out takes part in the rise.", "opts": [{"l": "Hold the diversified portfolio", "fb": "You survived the crash and enjoyed the recovery. That's the formula."}, {"l": "Jump back into all-tech", "fb": "Chasing the last wave again. It's an endless cycle of arriving too late."}]}]}}},
  {t:"quiz",q:"מה פיזור באמת עושה?",o:["מבטיח רווח","מקטין את הסיכון להימחק","מבטל סיכון לגמרי","מכפיל תשואה"],a:1,
   why:"פיזור לא מבטיח רווח ולא מבטל סיכון — הוא מונע מאירוע בודד למחוק אותך.",
   mentor:{why:"בחרת באפשרות שמבטיחה או מבטלת. פיזור לא עושה אף אחד מהשניים — הוא מנהל סיכון, לא מוחק אותו.",
    analogy:"חגורת בטיחות לא מבטיחה שלא תיפגע. היא מבטיחה שתאונה אחת לא תהרוג אותך. זה בדיוק פיזור.",
    q:"תיק מפוזר על 500 חברות. השוק כולו יורד 30%. מה קורה לתיק?",
    o:["לא יורד בכלל — הוא מפוזר","יורד גם הוא — פיזור לא מגן מירידת שוק כללית","עולה","נמחק"],a:1,
    hint:"פיזור מגן מכישלון של חברה בודדת. האם הוא מגן גם כשכל השוק יורד יחד?",
    ok:"מדויק. פיזור מגן מסיכון ספציפי, לא מסיכון שוק כללי. חשוב להבין את הגבול."},tr:{en:{"q": "What does diversification actually do?", "o": ["Guarantees a profit", "Reduces the risk of being wiped out", "Eliminates risk entirely", "Doubles your return"], "why": "Diversification neither guarantees profit nor eliminates risk — it stops a single event from wiping you out.", "mentor": {"why": "You chose an option that either guarantees or eliminates. Diversification does neither — it manages risk rather than erasing it.", "analogy": "A seatbelt doesn't promise you'll never be hurt. It promises one accident won't kill you. That's exactly what diversification is.", "q": "A portfolio spread across 500 companies. The entire market falls 30%. What happens to the portfolio?", "o": ["It doesn't fall at all — it's diversified", "It falls too — diversification doesn't protect against a broad market decline", "It rises", "It's wiped out"], "hint": "Diversification protects against a single company failing. Does it also protect when the whole market falls together?", "ok": "Precisely. Diversification protects against specific risk, not market risk. Knowing that boundary matters."}}}},
  {t:"summary",h:"מה למדת",points:["סל אחד = סיכון להימחק מאירוע בודד",
    "פזר בין חברות, סקטורים, מדינות וסוגי נכסים",
    "פיזור לא מבטיח רווח ולא מבטל סיכון — הוא מונע מחיקה",
    "תיק מפוזר עולה פחות בגלים — וזה בדיוק המחיר של הביטוח"],tr:{en:{"h": "What you learned", "points": ["One basket = the risk of being wiped out by a single event", "Spread across companies, sectors, countries and asset types", "Diversification neither guarantees profit nor eliminates risk — it prevents ruin", "A diversified portfolio rises less in a rally — and that is precisely the cost of the insurance"]}}}
 ]},
 {id:"l22",ic:"⚖️",title:"סיכון ותשואה",tier:"intermediate",tr:{en:{"title": "Risk and return"}},steps:[
  {t:"hook",ic:"🎁",q:"מישהו מבטיח לך 20% בשנה, בלי סיכון. מה אתה עושה?",
   sub:"התשובה הנכונה יכולה להציל לך את כל הכסף.",cta:"תגיד לי →",tr:{en:{"q": "Someone promises you 20% a year, with no risk. What do you do?", "sub": "The right answer could save every shekel you have.", "cta": "Tell me →"}}},
  {t:"card",art:"riskreturn",ic:"⚖️",h:"החוק שאי אפשר לעקוף",p:"תשואה גבוהה יותר דורשת סיכון גבוה יותר. תמיד. מי שמבטיח לך תשואה גבוהה בלי סיכון — או שהוא לא מבין, או שהוא מרמה.",tr:{en:{"h": "The law you cannot bypass", "p": "A higher return demands higher risk. Always. Anyone promising you a high return with no risk either doesn't understand, or is lying to you."}}},
  {t:"predict",q:"אג\"ח ממשלתי מניב ~4% בשנה. כמה בערך הניב שוק המניות הרחב בממוצע היסטורי ארוך?",
   min:2,max:20,step:1,unit:"% בשנה",answer:8,tol:2,
   reveal:"~8% בשנה בממוצע ארוך טווח — כפול מאג\"ח, אבל עם תנודתיות הרבה יותר גדולה.",
   why:"התשואה העודפת אינה מתנה — היא הפיצוי על כך שתסבול ירידות של 30-50% בדרך.",tr:{en:{"q": "Government bonds yield roughly 4% a year. Roughly what has the broad stock market returned on a long-run historical average?", "unit": "% per year", "reveal": "About 8% a year over the long run — double bonds, but with far greater volatility.", "why": "That excess return isn't a gift — it's the compensation for enduring 30-50% declines along the way."}}},
  {t:"quiz",q:"מישהו מבטיח 'תשואה גבוהה ללא סיכון'. מה זה?",o:["הזדמנות נדירה","הונאה","עסקה טובה","מזל"],a:1,
   why:"אין דבר כזה. תשואה גבוהה בלי סיכון היא ההגדרה של הונאה.",
   mentor:{why:"התפתית להאמין שיש 'ארוחת חינם'. זו בדיוק הפתיחה של כל הונאה פיננסית בהיסטוריה.",
    analogy:"אם באמת הייתה דרך להרוויח 20% בלי סיכון — הבנקים הגדולים היו עושים את זה עם כל הכסף שלהם. למה שיציעו לך?",
    q:"קרוב משפחה מציע לך 'השקעה בטוחה' עם 3% בחודש. מה הדגל האדום?",
    o:["3% זה מעט מדי","תשואה גבוהה + 'בטוח' = סתירה","זה מקרוב משפחה","אין דגל אדום"],a:1,
    hint:"3% בחודש = מעל 40% בשנה. מה זה אומר על הסיכון האמיתי?",
    ok:"בדיוק. 'גבוה' ו'בטוח' לא יכולים לחיות יחד. זו הסתירה שחושפת כל הונאה."},tr:{en:{"q": "Someone promises 'high returns with no risk'. What is it?", "o": ["A rare opportunity", "A scam", "A good deal", "Luck"], "why": "No such thing exists. A high return with no risk is the definition of fraud.", "mentor": {"why": "You were tempted to believe in a free lunch. That is precisely the opening line of every financial scam in history.", "analogy": "If there really were a way to earn 20% with no risk, the major banks would be doing it with all of their own money. Why would they offer it to you?", "q": "A relative offers you a 'safe investment' paying 3% a month. What's the red flag?", "o": ["3% is too little", "High return + 'safe' = a contradiction", "It's from a relative", "There's no red flag"], "hint": "3% a month is over 40% a year. What does that tell you about the real risk?", "ok": "Exactly. 'High' and 'safe' cannot coexist. That contradiction exposes every scam."}}}},
  {t:"summary",h:"מה למדת",points:["תשואה גבוהה יותר = סיכון גבוה יותר. חוק, לא המלצה",
    "מניות הניבו היסטורית יותר מאג\"ח — ובתמורה סבלו ירידות חדות",
    "'תשואה גבוהה בלי סיכון' = הונאה. תמיד. בלי יוצא מן הכלל"],tr:{en:{"h": "What you learned", "points": ["Higher return = higher risk. A law, not a suggestion", "Stocks have historically returned more than bonds — and in exchange suffered sharp declines", "'High return with no risk' = fraud. Always. Without exception"]}}}
 ]},
 {id:"l23",ic:"🛡️",title:"כמה סיכון מתאים לך?",tier:"advanced",tr:{en:{"title": "How much risk suits you?"}},steps:[
  {t:"hook",ic:"😴",q:"מה התיק הנכון עבורך? זה שמאפשר לך לישון בלילה.",
   sub:"התשובה תלויה בשני דברים בלבד — ורובם לא יודעים אותם.",cta:"מה הם? →",tr:{en:{"q": "What's the right portfolio for you? The one that lets you sleep at night.", "sub": "The answer depends on just two things — and most people don't know them.", "cta": "What are they? →"}}},
  {t:"card",art:"coresat",ic:"🛡️",h:"שני משתנים בלבד",p:"1) אופק הזמן — מתי תצטרך את הכסף. 2) הבטן שלך — כמה ירידה תוכל לספוג בלי למכור. תיק שגורם לך למכור בפאניקה הוא תיק שגוי, גם אם הוא 'אופטימלי' על הנייר.",tr:{en:{"h": "Only two variables", "p": "1) Your time horizon — when you'll need the money. 2) Your stomach — how large a decline you can absorb without selling. A portfolio that makes you panic-sell is the wrong portfolio, even if it looks 'optimal' on paper."}}},
  {t:"scenario",q:"אתה בן 30, לא תצטרך את הכסף 30 שנה.",situation:"כמה מניות בתיק?",
   options:[{label:"רוב התיק במניות — יש לי זמן לספוג ירידות",verdict:"good",fb:"נכון. אופק ארוך מאפשר לספוג תנודתיות ולנצל את הצמיחה. הזמן הוא הביטוח שלך."},
    {label:"הכל באג\"ח, בטוח יותר",verdict:"bad",fb:"'בטוח' מדי עולה לך ביוקר. על 30 שנה, האינפלציה תשחק אותך — וזה סיכון אמיתי גם כן."}],
