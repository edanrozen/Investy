  {t:"card",art:"exitplan",ic:"🧠",h:"3 סיבות טובות למכור",p:"1) הגעת ליעד שקבעת מראש. 2) התזה נשברה — משהו בעסק עצמו התקלקל (לא רק המחיר). 3) איזון מחדש — הפוזיציה גדלה מדי והפכה מסוכנת. שלוש הסיבות האלה הן ניתוח. כל השאר זה רגש.",tr:{en:{"h": "3 good reasons to sell", "p": "1) You reached the target you set in advance. 2) The thesis broke — something in the business itself went wrong (not just the price). 3) Rebalancing — the position grew too large and became risky. Those three reasons are analysis. Everything else is emotion."}}},
  {t:"swipe",q:"סיבה טובה למכור — או רגש? החלק כל כרטיס.",leftLabel:"❌ רגש",rightLabel:"✅ סיבה",
   cards:[
    {text:"הגעתי ליעד שקבעתי מראש",good:true,why:"תוכנית שנקבעה בראש קר. זו הסיבה הטובה ביותר."},
    {text:"המחיר ירד קצת ואני בלחץ",good:false,why:"מכירת פאניקה. ירידה לבדה אינה מידע חדש על העסק."},
    {text:"החברה איבדה את הלקוח הגדול והרווח קורס",good:true,why:"התזה נשברה — העסק עצמו התקלקל. סיבה עניינית למכור."},
    {text:"היא כבר עלתה מספיק, נמאס לי לחכות",good:false,why:"שעמום זה לא אסטרטגיה. סבלנות היא חלק מהמשחק."},
    {text:"הפוזיציה הפכה ל-50% מהתיק — מסוכן מדי",good:true,why:"איזון מחדש. גזירת מנצחת שתפחה זו ניהול סיכונים נכון."},
    {text:"חבר אמר שהוא מכר",good:false,why:"החלטה של מישהו אחר, עם תיק אחר ומטרות אחרות. לא רלוונטי אליך."}],tr:{en:{"q": "A good reason to sell — or emotion? Swipe each card.", "leftLabel": "❌ Emotion", "rightLabel": "✅ Reason", "cards": [{"text": "I reached the target I set in advance", "why": "A plan set with a cool head. That's the best reason there is."}, {"text": "The price dipped a little and I'm stressed", "why": "Panic selling. A decline alone isn't new information about the business."}, {"text": "The company lost its largest customer and profits are collapsing", "why": "The thesis broke — the business itself went wrong. A substantive reason to sell."}, {"text": "It has risen enough, I'm tired of waiting", "why": "Boredom isn't a strategy. Patience is part of the game."}, {"text": "The position became 50% of my portfolio — too risky", "why": "Rebalancing. Trimming a winner that swelled is sound risk management."}, {"text": "A friend said he sold", "why": "Someone else's decision, with a different portfolio and different goals. Not relevant to you."}]}}},
  {t:"tapChart",q:"גע בנר שבו התזה נשברה — הקריסה החדה שמסמנת שמשהו בעסק עצמו השתנה.",
   candles:candles([[100,102,103,99],[102,104,105,101],[104,103,106,102],[103,84,104,82],[84,80,86,78],[80,78,82,76]]),
   target:3,why:"נפילה חדה ופתאומית שממנה אין התאוששות = לרוב אירוע אמיתי בעסק. זו מכירה עניינית — לא פאניקה.",tr:{en:{"q": "Tap the candle where the thesis broke — the sharp collapse signalling something in the business itself changed.", "why": "A sharp, sudden fall with no recovery usually reflects a real event in the business. That's a substantive sale — not panic."}}},
  {t:"challenge",task:"בחר החזקה אחת שלך וכתוב לה עכשיו 'תוכנית יציאה' בשתי שורות: (1) באיזה מצב עסקי אמכור. (2) באיזה רווח אממש חלקית. שמור את זה.",
   hint:"כתוב את זה עכשיו, כשאתה רגוע. ביום שהמניה תזנק או תתרסק — לא תוכל לחשוב בבהירות.",tr:{en:{"task": "Pick one of your holdings and write it an 'exit plan' right now, in two lines: (1) What business condition would make me sell. (2) At what gain I'd realise partially. Save it.", "hint": "Write it now, while you're calm. On the day the stock leaps or crashes, you won't be able to think clearly."}}}]}
]},
{id:"c28",ic:"🏦",title:"בחירת ברוקר ומיקוח",desc:"העמלות ניתנות למיקוח — רובם לא יודעים",tr:{en:{"title": "Choosing a Broker and Negotiating", "desc": "Fees are negotiable — most people don't know it"}},lessons:[
 {id:"l281",ic:"💸",title:"איפה הכסף באמת נעלם",tier:"beginner",tr:{en:{"title": "Where the money actually disappears"}},steps:[
  {t:"hook",ic:"💸",q:"אתה משלם לברוקר יותר ממה שאתה חושב. הרבה יותר.",sub:"ורובן ניתנות למיקוח. כן, באמת.",cta:"בוא נגלה →",tr:{en:{"q": "You're paying your broker more than you think. Far more.", "sub": "And most of it is negotiable. Yes, genuinely.", "cta": "Let's find out →"}}},
  {t:"card",art:"feebite",ic:"💸",h:"4 הנגיסות",p:"בכל פלטפורמה משלמים: עמלת קנייה/מכירה (לעסקה), דמי ניהול/משמרת (אחוז שנתי מהתיק), עמלת המרת מט\"ח (בקנייה בחו\"ל — לרוב הנסתרת ביותר), והמרווח (spread). כל אחת נשמעת זעירה. יחד, לאורך שנים, הן חותכות נתח עצום.",tr:{en:{"h": "The four bites", "p": "On every platform you pay: a buy/sell commission (per trade), management or custody fees (an annual percentage of the portfolio), a currency conversion fee (on foreign purchases — usually the most hidden), and the spread. Each sounds tiny. Together, over years, they take an enormous slice."}}},
  {t:"predict",q:"תיק של ₪200,000. כמה עולה דמי ניהול של 1% בשנה — לעומת 0.2%?",min:0,max:5000,step:200,unit:"₪ בשנה",answer:1600,tol:500,
   reveal:"₪1,600 בשנה הפרש — וזה לפני שהסכום גדל.",why:"ההפרש הוא כסף שיוצא כל שנה מסכום שגדל. על 20 שנה זה עשרות אלפי שקלים שנעלמו בשקט.",tr:{en:{"q": "A ₪200,000 portfolio. What does a 1% annual management fee cost — compared with 0.2%?", "unit": "₪ per year", "reveal": "A ₪1,600 difference a year — and that's before the balance grows.", "why": "The difference is money leaving every year from a growing sum. Over 20 years that's tens of thousands quietly gone."}}},
  {t:"quiz",q:"איזו עמלה היא הכי 'נסתרת' ומפתיעה משקיעים?",o:["עמלת קנייה","עמלת המרת מט\"ח","דמי ניהול","אין נסתרות"],a:1,why:"רבים בודקים רק עמלת קנייה — ואז מגלים שעל כל קנייה בחו\"ל גובים גם המרת מט\"ח שיכולה להיות יקרה בהרבה.",tr:{en:{"q": "Which fee is the most 'hidden' and surprises investors most?", "o": ["The buying commission", "The currency conversion fee", "Management fees", "There are no hidden ones"], "why": "Many people check only the buying commission — then discover every foreign purchase also carries a currency conversion charge that can be far more expensive."}}},
  {t:"challenge",task:"התקשר או שלח הודעה לברוקר/בית ההשקעות שלך ובקש הנחה בעמלות. תגיד שאתה שוקל לעבור.",
   hint:"רוב האנשים פשוט לא מבקשים. שיחה של 5 דקות יכולה לחסוך לך אלפי שקלים לאורך שנים. הגרוע ביותר שיקרה: יגידו לא.",tr:{en:{"task": "Call or message your broker or investment house and ask for a discount on fees. Say you're considering moving.", "hint": "Most people simply never ask. A five-minute call can save you thousands over the years. The worst that happens: they say no."}}},
  {t:"summary",h:"מה למדת",points:["4 נגיסות: עמלת קנייה, דמי ניהול, המרת מט\"ח, מרווח","עמלת מינימום הורגת תיקים קטנים","תמיד תרגם עמלה לאחוז מהתיק שלך","עמלות ניתנות למיקוח — רוב האנשים פשוט לא מבקשים"],tr:{en:{"h": "What you learned", "points": ["Four bites: buying commission, management fees, currency conversion, spread", "A minimum fee kills small portfolios", "Always translate a fee into a percentage of your portfolio", "Fees are negotiable — most people simply never ask"]}}}]},
 {id:"l282",ic:"🔍",title:"איך משווים פלטפורמות",tier:"intermediate",tr:{en:{"title": "How to compare platforms"}},steps:[
  {t:"card",art:"negotiate",ic:"🔍",h:"מה באמת לבדוק",p:"רגולציה ופיקוח (הכי חשוב — הכסף שלך מוגן?), עמלת מינימום לחודש (הרוצח השקט של תיקים קטנים), עמלת המרת מט\"ח, דמי ניהול, ומה קורה כשרוצים למשוך. אל תבחר לפי אפליקציה יפה או מתנת הצטרפות.",tr:{en:{"h": "What actually to check", "p": "Regulation and oversight (most important — is your money protected?), the monthly minimum fee (the silent killer of small portfolios), currency conversion charges, management fees, and what happens when you want to withdraw. Don't choose based on a pretty app or a sign-up gift."}}},
  {t:"sort",q:"סדר לפי חשיבות בבחירת ברוקר — מהקריטי ביותר (1) לפחות חשוב (4).",
   items:[{label:"🛡️ רגולציה ופיקוח",rank:1},{label:"💸 מבנה העמלות",rank:2},{label:"📱 נוחות הממשק",rank:3},{label:"🎁 מתנת הצטרפות",rank:4}],
   why:"רגולציה קודמת לכל — היא קובעת אם הכסף שלך מוגן. אחריה עמלות (שעולות לך שנים). ממשק זה נחמד; מתנת הצטרפות היא פיתיון שיווקי.",tr:{en:{"q": "Order by importance when choosing a broker — from most critical (1) to least (4).", "items": [{"label": "🛡️ Regulation and oversight"}, {"label": "💸 The fee structure"}, {"label": "📱 Interface convenience"}, {"label": "🎁 A sign-up gift"}], "why": "Regulation comes first — it determines whether your money is protected. Then fees (which cost you for years). The interface is nice; a sign-up gift is marketing bait."}}},
  {t:"scenario",q:"תיק קטן של ₪10,000. הברוקר גובה עמלת מינימום של ₪30 לחודש.",situation:"מה זה אומר בפועל?",
   options:[
    {label:"₪360 בשנה = 3.6% מהתיק שנשחקים לפני שהרווחתי שקל",verdict:"good",fb:"בדיוק. עמלת מינימום הורגת תיקים קטנים. 3.6% בשנה זה כמעט חצי מהתשואה הממוצעת של השוק."},
    {label:"זה זניח, רק ₪30",verdict:"bad",fb:"₪30 בחודש נשמע קטן — אבל מול תיק של ₪10,000 זו שחיקה של 3.6% בשנה. אחוזים, לא שקלים."}],
   why:"תמיד תרגם עמלות לאחוז מהתיק שלך. אותה עמלה יכולה להיות זניחה בתיק גדול והרסנית בקטן.",tr:{en:{"q": "A small ₪10,000 portfolio. The broker charges a ₪30 monthly minimum fee.", "situation": "What does that mean in practice?", "why": "Always translate fees into a percentage of your portfolio. The same fee can be negligible in a large portfolio and devastating in a small one.", "options": [{"label": "₪360 a year = 3.6% of the portfolio eroded before I've earned a shekel", "fb": "Exactly. A minimum fee kills small portfolios. 3.6% a year is nearly half the market's average return."}, {"label": "It's negligible, only ₪30", "fb": "₪30 a month sounds small — but against a ₪10,000 portfolio it's 3.6% of erosion a year. Think in percentages, not shekels."}]}}}]},
 {id:"l283",ic:"🤝",title:"להתמקח — כן, זה אפשרי",tier:"advanced",tr:{en:{"title": "Negotiating — yes, it's possible"}},steps:[
  {t:"card",art:"negotiate",ic:"🤝",h:"הסוד ששומרים",p:"רוב האנשים מקבלים את מחירון העמלות כאילו הוא חוק טבע. הוא לא. בבנקים ובבתי השקעות, עמלות מסחר ודמי ניהול הם כמעט תמיד ניתנים למיקוח — במיוחד אם יש לך סכום משמעותי, אתה פעיל, או שיש לך הצעה מתחרה ביד.",tr:{en:{"h": "The secret they keep", "p": "Most people accept the fee schedule as though it were a law of nature. It isn't. At banks and investment houses, trading commissions and management fees are almost always negotiable — especially if you have a meaningful sum, you're active, or you're holding a competing offer."}}},
  {t:"card",art:"negotiate",ic:"📞",h:"איך מנהלים את השיחה",p:"1) בדוק מה מציעים המתחרים — בכתב. 2) התקשר וציין במפורש: 'קיבלתי הצעה טובה יותר, אשמח שתשוו אותה'. 3) בקש דברים ספציפיים: הורדת עמלת מינימום, אחוז נמוך יותר, פטור מדמי משמרת. 4) היה מוכן לעבור באמת — זה מה שנותן לך כוח. 5) בקש הכל בכתב.",tr:{en:{"h": "How to run the conversation", "p": "1) Find out what competitors offer — in writing. 2) Call and say explicitly: 'I've received a better offer, I'd like you to match it.' 3) Ask for specifics: a lower minimum fee, a lower percentage, a custody fee waiver. 4) Be genuinely prepared to leave — that's what gives you power. 5) Get everything in writing."}}},
  {t:"swipe",q:"מהלך מיקוח חזק — או חלש? החלק כל כרטיס.",leftLabel:"❌ חלש",rightLabel:"✅ חזק",
   cards:[
    {text:"'קיבלתי הצעה של 0.1% במקום אחר, תשוו לי'",good:true,why:"הצעה מתחרה קונקרטית היא הקלף החזק ביותר. היא הופכת את הבקשה למוחשית."},
    {text:"'אפשר קצת הנחה בבקשה?'",good:false,why:"מעורפל ובלי מנוף. אין סיבה שיוותרו — לא נתת להם שום סיבה."},
    {text:"מוכן באמת לעבור לברוקר אחר אם לא ישוו",good:true,why:"נכונות אמיתית לעזוב היא מקור הכוח. בלעדיה, המיקוח הוא בלוף."},
    {text:"'אני איתכם 10 שנים, מגיע לי'",good:false,why:"ותק לבדו הוא טיעון רגשי חלש. חבר אותו להצעה מתחרה כדי שיעבוד."},
    {text:"מבקש בכתב אישור לתנאים שסוכמו",good:true,why:"הבטחה בטלפון נעלמת. תנאים בכתב הם תנאים אמיתיים."}],tr:{en:{"q": "A strong negotiating move — or a weak one? Swipe each card.", "leftLabel": "❌ Weak", "rightLabel": "✅ Strong", "cards": [{"text": "'I've been offered 0.1% elsewhere, please match it'", "why": "A concrete competing offer is the strongest card there is. It makes the request tangible."}, {"text": "'Could I have a small discount please?'", "why": "Vague and with no leverage. There's no reason for them to concede — you haven't given them one."}, {"text": "Genuinely prepared to move to another broker if they don't match", "why": "A real willingness to leave is the source of your power. Without it, the negotiation is a bluff."}, {"text": "'I've been with you 10 years, I deserve it'", "why": "Tenure alone is a weak emotional argument. Pair it with a competing offer to make it work."}, {"text": "Asking for written confirmation of the agreed terms", "why": "A promise on the phone disappears. Terms in writing are real terms."}]}}},
  {t:"scenario",q:"התקשרת וביקשת הנחה בעמלות. הנציג אמר 'זה המחירון, אין מה לעשות'.",situation:"מה עכשיו?",
   options:[
    {label:"מבקש לדבר עם מנהל שימור לקוחות, ומציין הצעה מתחרה",verdict:"good",fb:"מצוין. לנציג בקו הראשון לרוב אין סמכות. מחלקת שימור לקוחות קיימת בדיוק בשביל זה — ויש לה תקציב."},
    {label:"מקבל את התשובה ומוותר",verdict:"bad",fb:"'זה המחירון' הוא כמעט תמיד תשובת ברירת מחדל, לא אמת. רוב מי שמתעקש — מקבל."},
    {label:"צועק ומאיים בלי כוונה אמיתית לעזוב",verdict:"bad",fb:"בלוף שקוף וללא הצעה מתחרה. אגרסיביות אינה מנוף — נכונות אמיתית לעבור היא."}],
   why:"סירוב ראשון אינו סוף הדרך. מנהל שימור + הצעה מתחרה + נכונות אמיתית לעזוב = השילוב שמוריד עמלות.",tr:{en:{"q": "You called and asked for a fee discount. The representative said 'that's the price list, there's nothing to be done'.", "situation": "What now?", "why": "A first refusal isn't the end of the road. A retention manager + a competing offer + genuine willingness to leave is the combination that lowers fees.", "options": [{"label": "Ask to speak to a customer retention manager, and mention a competing offer", "fb": "Excellent. Front-line representatives usually have no authority. Retention departments exist precisely for this — and they have a budget."}, {"label": "Accept the answer and give up", "fb": "'That's the price list' is almost always a default response, not the truth. Most people who persist get a discount."}, {"label": "Shout and threaten with no genuine intention of leaving", "fb": "A transparent bluff with no competing offer. Aggression isn't leverage — a genuine willingness to move is."}]}}},
  {t:"quiz",q:"מה נותן לך את הכוח האמיתי במיקוח על עמלות?",o:["לבקש יפה","הצעה מתחרה ונכונות אמיתית לעבור","ותק בלבד","להתעצבן"],a:1,why:"מנוף אמיתי = חלופה קונקרטית שאתה באמת מוכן לממש. בלי זה, אין סיבה שיזוזו.",tr:{en:{"q": "What gives you real power when negotiating fees?", "o": ["Asking nicely", "A competing offer and genuine willingness to move", "Tenure alone", "Getting angry"], "why": "Real leverage means a concrete alternative you're genuinely prepared to take. Without it, there's no reason for them to move."}}}]}
]},
{id:"c29",ic:"⚔️",title:"בחירת טקטיקת המסחר",desc:"5 סגנונות — מסקאלפינג ועד טווח ארוך. איזה מהם אתה?",tr:{en:{"title": "Choosing Your Trading Style", "desc": "5 styles, from scalping to the long term. Which one are you?"}},lessons:[

 {id:"l291",ic:"🎯",title:"5 המהירויות של השוק",tier:"beginner",tr:{en:{"title": "The market's 5 speeds"}},steps:[
  {t:"hook",ic:"⚔️",q:"אותו שוק, אותה מניה — וחמישה אנשים ירוויחו ממנה בחמש דרכים שונות לגמרי. איך?",sub:"ההבדל אינו במניה. הוא בקצב שבו הם משחקים.",cta:"בוא נגלה →",tr:{en:{"q": "The same market, the same stock — and five people will profit from it in five completely different ways. How?", "sub": "The difference isn't the stock. It's the tempo they play at.", "cta": "Let's find out →"}}},
  {t:"card",ic:"⏱️",h:"הכל עניין של זמן",p:"סגנון מסחר הוא בעצם החלטה אחת: כמה זמן אתה מחזיק פוזיציה. שניות? יום? שבועות? שנים? כל תשובה היא עולם אחר — עם סיכון, מאמץ ואופי שונים לגמרי.",tr:{en:{"h": "It all comes down to time", "p": "A trading style is really one decision: how long you hold a position. Seconds? A day? Weeks? Years? Each answer is a different world — with entirely different risk, effort and temperament."}}},
  {t:"flip",q:"5 המהירויות. הקש כל אחת לגלות את קצב ההחזקה:",cards:[
    {ic:"⚡",t:"Scalping",b:"שניות עד דקות. עשרות-מאות עסקאות ביום. רווח זעיר מכל אחת — במהירות בזק."},
    {ic:"☀️",t:"Day Trading",b:"דקות עד שעות. נכנס ויוצא באותו יום. לא מחזיק פוזיציה ללילה — לעולם."},
    {ic:"🌊",t:"Swing Trading",b:"ימים עד שבועות. תופס 'גל' תנועה בינוני. בודק את השוק פעם-פעמיים ביום."},
    {ic:"🗻",t:"Position Trading",b:"שבועות עד חודשים. רוכב על מגמה ארוכה. סבלנות על פני אקשן."},
    {ic:"🌳",t:"טווח ארוך",b:"שנים עד עשורים. קונה ומחזיק. נותן לריבית דריבית ולזמן לעשות את העבודה."}],tr:{en:{"q": "The 5 speeds. Tap each to reveal its holding period:", "cards": [{"t": "Scalping", "b": "Seconds to minutes. Dozens or hundreds of trades a day. A tiny profit from each — at lightning speed."}, {"t": "Day trading", "b": "Minutes to hours. In and out on the same day. Never holds a position overnight."}, {"t": "Swing trading", "b": "Days to weeks. Catches a medium-sized wave of movement. Checks the market once or twice a day."}, {"t": "Position trading", "b": "Weeks to months. Rides a long trend. Patience over action."}, {"t": "Long-term investing", "b": "Years to decades. Buy and hold. Lets compounding and time do the work."}]}}},
  {t:"card",art:"riskreturn",ic:"📊",h:"ככל שמהיר יותר — קשה יותר",p:"זו לא דעה, זו סטטיסטיקה: ככל שהמסחר מהיר יותר, כך הוא דורש יותר זמן, יותר משמעת, ועמלות אוכלות יותר. רוב הסוחרים המהירים מפסידים לאורך זמן. רוב משקיעי הטווח הארוך מרוויחים. זה לא במקרה.",tr:{en:{"h": "The faster it is, the harder it gets", "p": "This isn't an opinion, it's a statistic: the faster the trading, the more time and discipline it demands, and the more fees eat into it. Most fast traders lose money over time. Most long-term investors make money. That isn't a coincidence."}}},
  {t:"quiz",q:"מה ההבדל המהותי בין 5 סגנונות המסחר?",o:["כמה כסף צריך","כמה זמן מחזיקים פוזיציה","איזה ברוקר","סוג המניה"],a:1,why:"הכל מסתכם למשך ההחזקה — הוא קובע את הסיכון, המאמץ והאופי של כל סגנון.",
   mentor:{why:"חיפשת הבדל 'טכני', אבל ההבדל האמיתי פשוט הרבה יותר: זמן. משך ההחזקה הוא שקובע הכל.",
    analogy:"אותו כביש, חמישה נהגים: אחד דוהר, אחד נוסע רגוע, אחד יוצא לטיול של שבוע. אותו כביש — חוויה, סיכון ומאמץ שונים לגמרי.",
    q:"סוחר מחזיק מניה 3 שבועות ותופס תנועה של 8%. איזה סגנון זה?",
    o:["Scalping","Day Trading","Swing Trading","טווח ארוך"],a:2,
    hint:"שבועות — לא שניות ולא שנים. איפה זה נופל על הסקאלה?",
    ok:"בדיוק — שבועות ותנועה בינונית זה בול Swing Trading."},tr:{en:{"q": "What's the fundamental difference between the 5 trading styles?", "o": ["How much money you need", "How long you hold a position", "Which broker you use", "The type of stock"], "why": "It all comes down to holding period — which determines the risk, the effort and the character of each style.", "mentor": {"why": "You looked for a 'technical' difference, but the real one is far simpler: time. Holding period determines everything.", "analogy": "The same road, five drivers: one races, one cruises, one takes a week-long trip. Same road — completely different experience, risk and effort.", "q": "A trader holds a stock for three weeks and captures an 8% move. Which style is that?", "o": ["Scalping", "Day trading", "Swing trading", "Long-term investing"], "hint": "Weeks — not seconds and not years. Where does that fall on the scale?", "ok": "Exactly — weeks and a medium-sized move is squarely swing trading."}}}},
  {t:"summary",h:"מה למדת",points:[
    "סגנון מסחר = החלטה אחת: כמה זמן מחזיקים פוזיציה",
    "5 המהירויות: Scalping ⚡ → Day ☀️ → Swing 🌊 → Position 🗻 → טווח ארוך 🌳",
    "ככל שמהיר יותר — יותר זמן, יותר משמעת, יותר עמלות, וסיכוי נמוך יותר להצליח",
    "אין סגנון 'נכון' אחד — יש סגנון שמתאים לך. את זה נגלה בהמשך"],tr:{en:{"h": "What you learned", "points": ["A trading style is one decision: how long you hold a position", "The 5 speeds: scalping ⚡ → day ☀️ → swing 🌊 → position 🗻 → long term 🌳", "The faster it is, the more time, discipline and fees — and the lower the chance of success", "There's no single 'right' style — there's the one that suits you. We'll find that next"]}}}
 ]},

 {id:"l292",ic:"⚡",title:"מהיר: Scalping ו-Day Trading",tier:"beginner",tr:{en:{"title": "Fast: scalping and day trading"}},steps:[
  {t:"hook",ic:"⚡",q:"מה אם היית צריך לקבל 200 החלטות ביום, כל אחת בשניות, בלי לטעות ברגש?",sub:"זה היומיום של סוחר מהיר. וזו הסיבה שרובם נשחקים.",cta:"תראה לי →",tr:{en:{"q": "What if you had to make 200 decisions a day, each in seconds, without a single emotional error?", "sub": "That's a fast trader's daily life. And it's why most of them burn out.", "cta": "Show me →"}}},
  {t:"card",ic:"⚡",h:"Scalping — ציד השניות",p:"סקאלפר עושה עשרות עד מאות עסקאות ביום, ותופס רווח זעיר מכל אחת — לפעמים 0.1%. הרעיון: הרבה נצחונות קטנטנים מצטברים. המציאות: עמלות, מהירות ולחץ עצום שדורשים ריכוז מוחלט.",tr:{en:{"h": "Scalping — hunting seconds", "p": "A scalper makes dozens to hundreds of trades a day, capturing a tiny profit from each — sometimes 0.1%. The idea: many tiny wins add up. The reality: fees, speed and immense pressure that demand absolute concentration."}}},
  {t:"compare",q:"Scalping — התמונה המלאה",rows:[
    {name:"Scalping",ic:"⚡",tag:"המהיר ביותר",cells:{
      hold:{v:"שניות עד דקות",tone:"neutral"},
      risk:{v:"גבוה מאוד",tone:"bad"},
      time:{v:"כל היום מול המסך",tone:"bad"},
      fee:{v:"עמלות אוכלות רווח",tone:"bad"},
      who:{v:"מקצוענים, אנשי משמעת ברזל",tone:"warn"},
      pro:{v:"רווחים מהירים, לא תלוי בכיוון השוק",tone:"good"},
      con:{v:"שחיקה, לחץ, עמלות גבוהות",tone:"bad"}}}],
   cols:[
    {k:"hold",label:"משך החזקה",ic:"⏱️"},
    {k:"risk",label:"רמת סיכון",ic:"⚠️"},
    {k:"time",label:"זמן נדרש",ic:"🕐"},
    {k:"fee",label:"השפעת עמלות",ic:"💸"},
    {k:"who",label:"למי מתאים",ic:"👤"},
    {k:"pro",label:"יתרון",ic:"✅"},
    {k:"con",label:"חיסרון",ic:"❌"}],tr:{en:{"q": "Scalping — the full picture", "cols": [{"label": "Holding period"}, {"label": "Risk level"}, {"label": "Time required"}, {"label": "Impact of fees"}, {"label": "Who it suits"}, {"label": "Advantage"}, {"label": "Drawback"}], "rows": [{"name": "Scalping", "tag": "The fastest of all", "cells": {"hold": {"v": "Seconds to minutes"}, "risk": {"v": "Very high"}, "time": {"v": "All day at the screen"}, "fee": {"v": "Fees eat the profit"}, "who": {"v": "Professionals with iron discipline"}, "pro": {"v": "Fast profits, independent of market direction"}, "con": {"v": "Burnout, pressure, high fees"}}}]}}},
  {t:"card",ic:"☀️",h:"Day Trading — נכנס ויוצא באותו יום",p:"דיי-טריידר סוגר את כל הפוזיציות לפני סוף היום — לעולם לא מחזיק ללילה. כך הוא ישן בשקט בלי לדאוג מחדשות פתאומיות. אבל זה עדיין דורש שעות מול המסך וניתוח מהיר של תנועות תוך-יומיות.",tr:{en:{"h": "Day trading — in and out the same day", "p": "A day trader closes every position before the day ends — never holding overnight. That way they sleep soundly without worrying about sudden news. But it still demands hours at the screen and rapid analysis of intraday moves."}}},
  {t:"sim",asset:"⚡ יום של דיי-טריידר",start:10000,
   why:"ראית את הפער: לתפוס תנועה קטנה קל; לחזור אחרי הפסד בלי לנקום — קשה מאוד. הרוב נכשלים לא בגלל הטכניקה, אלא בגלל הרגש שאחרי ההפסד.",
   events:[
    {ic:"📈",t:"תנועה ראשונה",good:true,news:"המניה זזה 1.5% למעלה בבוקר. תפסת רווח קטן ויצאת מהר.",
     opts:[{l:"מרוצה מהרווח הקטן, ממשיך במשמעת",r:.015,good:true,fb:"נכון. בדיי-טריידינג רווחים קטנים ועקביים מנצחים ניסיונות ל'מכה גדולה'."},
      {l:"מתחרט שלא הכנסתי הכל — מהמר בגדול",r:-.04,fb:"רדפת אחרי יותר. זו בדיוק תחילת הדרך להפסד."}]},
    {ic:"📉",t:"הפסד",good:false,news:"העסקה הבאה הפסידה 2%. אתה כועס. הבטן דורשת 'לנקום' ולהחזיר מיד.",
     opts:[{l:"מכניס עסקה גדולה כפולה כדי להחזיר",r:-.08,fb:"'מסחר נקמה' — הרוצח מספר 1 של דיי-טריידרים. הרגש קיבל את ההחלטה."},
      {l:"עוצר, נושם, חוזר לתוכנית",r:.01,good:true,fb:"משמעת. היכולת לספוג הפסד בלי לנקום היא מה שמפריד בין שורד לנשחק."}]},
    {ic:"🌙",t:"סוף היום",good:true,news:"היום נגמר. יש לך פוזיציה פתוחה קטנה ברווח.",
     opts:[{l:"סוגר הכל — לא מחזיק ללילה",r:.005,good:true,fb:"זה הכלל הברזל של דיי-טריידינג. אתה ישן בשקט, מוגן מחדשות לילה."},
      {l:"משאיר פתוח — 'אולי יעלה עוד'",r:-.03,fb:"שברת את הכלל. חדשות בלילה יכולות לפתוח את השוק נגדך בפער."}]}],tr:{en:{"asset": "⚡ A day in a day trader's life", "why": "You saw the gap: catching a small move is easy; recovering from a loss without seeking revenge is very hard. Most people fail not on technique, but on the emotion that follows a loss.", "events": [{"t": "The first move", "news": "The stock moves 1.5% up in the morning. You captured a small profit and exited quickly.", "opts": [{"l": "Satisfied with the small gain, stick to the discipline", "fb": "Correct. In day trading, small consistent gains beat attempts at one big score."}, {"l": "Regret not going bigger — take a large gamble", "fb": "You chased more. That's precisely where the road to a loss begins."}]}, {"t": "A loss", "news": "The next trade lost 2%. You're angry. Your gut demands 'revenge' and an immediate recovery.", "opts": [{"l": "Enter a double-sized trade to win it back", "fb": "'Revenge trading' — the number one killer of day traders. Emotion made the decision."}, {"l": "Stop, breathe, return to the plan", "fb": "Discipline. The ability to absorb a loss without seeking revenge is what separates a survivor from a casualty."}]}, {"t": "End of day", "news": "The day is over. You have a small open position in profit.", "opts": [{"l": "Close everything — never hold overnight", "fb": "That's the iron rule of day trading. You sleep soundly, protected from overnight news."}, {"l": "Leave it open — 'maybe it'll rise more'", "fb": "You broke the rule. Overnight news can gap the market open against you."}]}]}}},
  {t:"quiz",q:"מהו 'מסחר נקמה' (Revenge Trading)?",o:["אסטרטגיה מתקדמת","להכניס עסקה גדולה כדי להחזיר הפסד מיד","סוג של סקאלפינג","מסחר נגד השוק"],a:1,why:"מסחר נקמה = לתת לרגש אחרי הפסד להכתיב עסקה נמהרת. זו אחת הטעויות היקרות ביותר.",
   mentor:{why:"אולי זה נשמע כמו טקטיקה, אבל זו טעות רגשית. אחרי הפסד, הצורך 'להחזיר מיד' מוביל להחלטות גרועות.",
    analogy:"מהמר שהפסיד יד ומכפיל את ההימור מתוך כעס — לא מחשב סיכוי, הוא מנסה להרגיש טוב. זה בדיוק מסחר נקמה.",
    q:"הפסדת 2% בעסקה. מה המהלך של סוחר ממושמע?",
    o:["להכפיל את ההימור הבא","לעצור, לנשום, לחזור לתוכנית","למכור הכל ולברוח","לצעוק על המסך"],a:1,
    hint:"מה מפריד בין סוחר שורד לסוחר שנשחק — טכניקה או שליטה ברגש?",
    ok:"בדיוק. השליטה ברגש אחרי הפסד היא המיומנות האמיתית."},tr:{en:{"q": "What is 'revenge trading'?", "o": ["An advanced strategy", "Entering a large trade to win back a loss immediately", "A type of scalping", "Trading against the market"], "why": "Revenge trading means letting the emotion after a loss dictate a hasty trade. It's one of the most expensive mistakes there is.", "mentor": {"why": "It may sound like a tactic, but it's an emotional error. After a loss, the urge to 'win it back now' leads to poor decisions.", "analogy": "A gambler who loses a hand and doubles the stake out of anger isn't calculating odds — he's trying to feel better. That's exactly revenge trading.", "q": "You lost 2% on a trade. What does a disciplined trader do?", "o": ["Double the next bet", "Stop, breathe, return to the plan", "Sell everything and run", "Shout at the screen"], "hint": "What separates a surviving trader from a burnt-out one — technique or emotional control?", "ok": "Exactly. Emotional control after a loss is the real skill."}}}},
  {t:"challenge",task:"אם אי פעם ניסית מסחר יומי (או שאתה שוקל) — כתוב לעצמך כלל אחד: 'אחרי X הפסדים ברצף, אני עוצר להיום'. קבע מספר קונקרטי עכשיו.",hint:"הכלל הזה, שנכתב מראש כשאתה רגוע, הוא ההגנה הטובה ביותר מפני מסחר נקמה. הבטן של אמצע היום לא תחשוב בהיגיון.",tr:{en:{"task": "If you've ever tried day trading (or are considering it), write yourself one rule: 'after X consecutive losses, I stop for the day'. Set a concrete number now.", "hint": "That rule, written in advance while you're calm, is the best protection against revenge trading. Your mid-session gut won't think clearly."}}},
  {t:"summary",h:"מה למדת",points:[
    "Scalping = עשרות-מאות עסקאות ביום, רווח זעיר מכל אחת, לחץ אדיר",
    "Day Trading = נכנס ויוצא באותו יום, אף פעם לא מחזיק ללילה",
    "שניהם דורשים שעות מול המסך ומשמעת ברזל — ורובם מפסידים",
    "'מסחר נקמה' אחרי הפסד הוא הרוצח מספר 1. כלל כתוב מראש מגן עליך"],tr:{en:{"h": "What you learned", "points": ["Scalping = dozens to hundreds of trades a day, tiny gains, enormous pressure", "Day trading = in and out the same day, never holding overnight", "Both demand hours at the screen and iron discipline — and most lose money", "'Revenge trading' after a loss is the number one killer. A rule written in advance protects you"]}}}
 ]},

 {id:"l293",ic:"🌊",title:"בינוני: Swing ו-Position",tier:"intermediate",tr:{en:{"title": "Medium: swing and position"}},steps:[
  {t:"hook",ic:"🌊",q:"מה אם היית יכול לסחור בלי לשבת מול המסך כל היום — ועדיין לתפוס תנועות משמעותיות?",sub:"זה בדיוק המרחב שבין המהיר לאיטי. ורבים מוצאים בו את הבית שלהם.",cta:"בוא נראה →",tr:{en:{"q": "What if you could trade without sitting at a screen all day — and still capture meaningful moves?", "sub": "That's exactly the space between fast and slow. And many people find their home there.", "cta": "Let's see →"}}},
  {t:"card",ic:"🌊",h:"Swing Trading — לרכוב על הגל",p:"סווינג-טריידר תופס 'גל' של תנועה שנמשך ימים עד שבועות. הוא בודק את השוק פעם-פעמיים ביום, לא כל שנייה. מתאים למי שיש לו עבודה ביום אבל רוצה להיות פעיל בשוק.",tr:{en:{"h": "Swing trading — riding the wave", "p": "A swing trader captures a wave of movement lasting days to weeks. They check the market once or twice a day, not every second. It suits anyone with a day job who still wants to be active in the market."}}},
  {t:"compare",q:"Swing מול Position — ההשוואה",rows:[
    {name:"Swing Trading",ic:"🌊",tag:"בינוני-מהיר",cells:{
      hold:{v:"ימים עד שבועות",tone:"neutral"},
      risk:{v:"בינוני-גבוה",tone:"warn"},
      time:{v:"בדיקה פעם-פעמיים ביום",tone:"warn"},
      fee:{v:"מתונה",tone:"warn"},
      who:{v:"עובדים במשרה מלאה שרוצים להיות פעילים",tone:"good"},
      pro:{v:"לא צמוד למסך, תופס תנועות אמיתיות",tone:"good"},
      con:{v:"חשוף לחדשות לילה וסופ\"ש",tone:"bad"}}},
    {name:"Position Trading",ic:"🗻",tag:"בינוני-איטי",cells:{
      hold:{v:"שבועות עד חודשים",tone:"neutral"},
      risk:{v:"בינוני",tone:"warn"},
      time:{v:"בדיקה שבועית",tone:"good"},
      fee:{v:"נמוכה",tone:"good"},
      who:{v:"מי שמאמין במגמות ויש לו סבלנות",tone:"good"},
      pro:{v:"רוכב על מגמות גדולות, מעט מאמץ",tone:"good"},
      con:{v:"דורש סבלנות לשבת דרך תנודות",tone:"warn"}}}],
   cols:[
    {k:"hold",label:"משך החזקה",ic:"⏱️"},
    {k:"risk",label:"רמת סיכון",ic:"⚠️"},
    {k:"time",label:"זמן נדרש",ic:"🕐"},
    {k:"fee",label:"השפעת עמלות",ic:"💸"},
    {k:"who",label:"למי מתאים",ic:"👤"},
    {k:"pro",label:"יתרון",ic:"✅"},
    {k:"con",label:"חיסרון",ic:"❌"}],tr:{en:{"q": "Swing versus position — the comparison", "cols": [{"label": "Holding period"}, {"label": "Risk level"}, {"label": "Time required"}, {"label": "Impact of fees"}, {"label": "Who it suits"}, {"label": "Advantage"}, {"label": "Drawback"}], "rows": [{"name": "Swing trading", "tag": "Medium-fast", "cells": {"hold": {"v": "Days to weeks"}, "risk": {"v": "Medium-high"}, "time": {"v": "A check once or twice a day"}, "fee": {"v": "Moderate"}, "who": {"v": "Full-time workers who want to stay active"}, "pro": {"v": "Not tied to a screen, captures real moves"}, "con": {"v": "Exposed to overnight and weekend news"}}}, {"name": "Position trading", "tag": "Medium-slow", "cells": {"hold": {"v": "Weeks to months"}, "risk": {"v": "Medium"}, "time": {"v": "A weekly check"}, "fee": {"v": "Low"}, "who": {"v": "Anyone who believes in trends and has patience"}, "pro": {"v": "Rides large trends, little effort"}, "con": {"v": "Requires patience to sit through swings"}}}]}}},
  {t:"scenario",q:"יש לך עבודה במשרה מלאה, אבל אתה רוצה להיות פעיל בשוק ולתפוס תנועות.",situation:"איזה סגנון הכי הגיוני?",
   options:[
    {label:"Swing Trading — בדיקה בבוקר ובערב, תופס גלים של ימים",verdict:"good",fb:"בול. סווינג נבנה בדיוק בשביל מי שלא יכול לשבת מול המסך כל היום אבל רוצה להיות פעיל."},
    {label:"Scalping — עשרות עסקאות ביום",verdict:"bad",fb:"בלתי אפשרי עם עבודה במשרה מלאה. סקאלפינג דורש ריכוז מוחלט לאורך כל היום."}],
   why:"התאמה בין סגנון לאורח החיים היא קריטית. סווינג מתאים למי שיש לו עיסוק אחר ביום.",tr:{en:{"q": "You have a full-time job, but you want to be active in the market and capture moves.", "situation": "Which style makes most sense?", "why": "Matching a style to your lifestyle is critical. Swing trading suits anyone with another occupation during the day.", "options": [{"label": "Swing trading — a check morning and evening, capturing waves lasting days", "fb": "Spot on. Swing trading was built precisely for people who can't sit at a screen all day but still want to be active."}, {"label": "Scalping — dozens of trades a day", "fb": "Impossible alongside a full-time job. Scalping demands absolute concentration throughout the day."}]}}},
  {t:"card",ic:"🗻",h:"Position Trading — רוכב על המגמה",p:"פוזישן-טריידר מחזיק שבועות עד חודשים, ורוכב על מגמה ארוכה. הוא בודק את השוק פעם בשבוע. זה הכי קרוב להשקעה — אבל עדיין עם כוונה לתפוס תנועה מסוימת ולצאת, לא להחזיק לנצח.",tr:{en:{"h": "Position trading — riding the trend", "p": "A position trader holds for weeks to months, riding a long trend. They check the market once a week. It's the closest thing to investing — but still with the intention of capturing a particular move and exiting, rather than holding forever."}}},
  {t:"quiz",q:"למי Swing Trading הכי מתאים?",o:["מי שיושב מול המסך כל היום","מי שעובד ביום אבל רוצה להיות פעיל בשוק","מי שרוצה להחזיק 20 שנה","מי שמפחד מסיכון"],a:1,why:"סווינג מתאים למי שיש לו עיסוק ביום — הוא דורש בדיקה פעם-פעמיים ביום בלבד, לא ריכוז מתמשך.",
   mentor:{why:"כדאי להתאים סגנון לאורח חיים, לא לחלום. סווינג נועד בדיוק למי שלא פנוי כל היום.",
    analogy:"אתה לא בוחר רכב רק לפי מהירות — אלא לפי מה שמתאים לחיים שלך. אותו דבר בסגנון מסחר.",
    q:"מישהו בודק את השוק בבוקר לפני העבודה ובערב אחריה, ומחזיק פוזיציות כשבוע. איזה סגנון?",
    o:["Scalping","Day Trading","Swing Trading","טווח ארוך"],a:2,
    hint:"בדיקה פעמיים ביום, החזקה של שבוע — איפה זה נופל?",
    ok:"נכון — זה הדפוס הקלאסי של סווינג-טריידר."},tr:{en:{"q": "Who does swing trading suit best?", "o": ["Someone sitting at a screen all day", "Someone who works during the day but wants to stay active in the market", "Someone who wants to hold for 20 years", "Someone afraid of risk"], "why": "Swing trading suits anyone with a day job — it requires a check once or twice a day, not continuous concentration.", "mentor": {"why": "Match the style to your life, not to a fantasy. Swing trading was designed exactly for people who aren't free all day.", "analogy": "You don't choose a car purely on top speed — you choose what fits your life. The same applies to a trading style.", "q": "Someone checks the market in the morning before work and in the evening after, holding positions for about a week. Which style?", "o": ["Scalping", "Day trading", "Swing trading", "Long-term investing"], "hint": "A check twice a day, holding for a week — where does that fall?", "ok": "Right — that's the classic pattern of a swing trader."}}}},
  {t:"summary",h:"מה למדת",points:[
    "Swing Trading = תופס גלים של ימים-שבועות, בדיקה פעם-פעמיים ביום",
    "Position Trading = רוכב על מגמה של שבועות-חודשים, בדיקה שבועית",
    "שניהם מתאימים למי שיש לו עיסוק אחר ביום ולא יכול לשבת מול המסך",
    "המפתח: להתאים את הסגנון לאורח החיים שלך — לא לחלום"],tr:{en:{"h": "What you learned", "points": ["Swing trading = capturing waves lasting days to weeks, checking once or twice a day", "Position trading = riding a trend of weeks to months, checking weekly", "Both suit anyone with another occupation who can't sit at a screen", "The key: match the style to your life — not to a fantasy"]}}}
 ]},

 {id:"l294",ic:"🌳",title:"איטי ומנצח: טווח ארוך",tier:"intermediate",tr:{en:{"title": "Slow and winning: the long term"}},steps:[
  {t:"hook",ic:"🌳",q:"מה אם הסגנון ה'משעמם' ביותר הוא גם זה שמנצח את רוב המקצוענים?",sub:"המספרים לא משקרים — וזה מפתיע כמעט את כולם.",cta:"תוכיח לי →",tr:{en:{"q": "What if the most boring style of all is also the one that beats most professionals?", "sub": "The numbers don't lie — and it surprises almost everyone.", "cta": "Prove it →"}}},
  {t:"card",art:"compound",ic:"🌳",h:"טווח ארוך — הזמן עושה את העבודה",p:"משקיע טווח ארוך קונה ומחזיק שנים עד עשורים. הוא לא מנסה לתזמן את השוק — הוא נותן לריבית דריבית ולצמיחת הכלכלה לעבוד. פחות מאמץ, פחות עמלות, פחות מסים — ופחות טעויות רגשיות.",tr:{en:{"h": "Long term — time does the work", "p": "A long-term investor buys and holds for years or decades. They don't try to time the market — they let compounding and economic growth work. Less effort, fewer fees, less tax — and fewer emotional mistakes."}}},
  {t:"compare",q:"טווח ארוך — למה הוא מנצח",rows:[
    {name:"טווח ארוך",ic:"🌳",tag:"האיטי — והמנצח",cells:{
      hold:{v:"שנים עד עשורים",tone:"neutral"},
      risk:{v:"נמוך (לאורך זמן)",tone:"good"},
      time:{v:"כמעט אפס — פעם ברבעון",tone:"good"},
      fee:{v:"מינימלית",tone:"good"},
      who:{v:"כמעט כולם — במיוחד מתחילים",tone:"good"},
      pro:{v:"ריבית דריבית, מעט מאמץ, מנצח רוב הפעילים",tone:"good"},
      con:{v:"דורש סבלנות, 'משעמם', לא אקשן",tone:"warn"}}}],
   cols:[
    {k:"hold",label:"משך החזקה",ic:"⏱️"},
    {k:"risk",label:"רמת סיכון",ic:"⚠️"},
    {k:"time",label:"זמן נדרש",ic:"🕐"},
    {k:"fee",label:"השפעת עמלות",ic:"💸"},
    {k:"who",label:"למי מתאים",ic:"👤"},
    {k:"pro",label:"יתרון",ic:"✅"},
    {k:"con",label:"חיסרון",ic:"❌"}],tr:{en:{"q": "The long term — why it wins", "cols": [{"label": "Holding period"}, {"label": "Risk level"}, {"label": "Time required"}, {"label": "Impact of fees"}, {"label": "Who it suits"}, {"label": "Advantage"}, {"label": "Drawback"}], "rows": [{"name": "Long-term investing", "tag": "The slow one — and the winner", "cells": {"hold": {"v": "Years to decades"}, "risk": {"v": "Low (over time)"}, "time": {"v": "Almost none — once a quarter"}, "fee": {"v": "Minimal"}, "who": {"v": "Almost everyone — especially beginners"}, "pro": {"v": "Compounding, little effort, beats most active traders"}, "con": {"v": "Requires patience, 'boring', no action"}}}]}}},
  {t:"predict",q:"לאורך 20+ שנה, איזה אחוז ממנהלי הקרנות המקצועיים מפסידים למדד הפשוט (S&P 500)?",min:10,max:95,step:5,unit:"%",answer:85,tol:12,
   reveal:"בערך 85-90% מהמקצוענים מפסידים למדד לאורך זמן. הסגנון ה'משעמם' מנצח כמעט את כולם.",
   why:"זה לא כי המנהלים טיפשים — זה כי עמלות, מסים וטעויות תזמון שוחקים אפילו את הטובים. המדד פשוט לא עושה את הטעויות האלה.",tr:{en:{"q": "Over 20+ years, what percentage of professional fund managers underperform the simple index (the S&P 500)?", "unit": "%", "reveal": "Roughly 85-90% of professionals underperform the index over time. The 'boring' style beats almost everyone.", "why": "It isn't because managers are foolish — it's because fees, taxes and timing errors erode even the good ones. The index simply doesn't make those mistakes."}}},
  {t:"quiz",q:"למה טווח ארוך מנצח את רוב הסוחרים הפעילים?",o:["כי הוא מסוכן יותר","פחות עמלות, פחות מסים, פחות טעויות רגשיות","כי המניות תמיד עולות","כי צריך פחות כסף"],a:1,why:"פחות פעולות = פחות עמלות, פחות מסים, ופחות הזדמנויות לטעות רגשית. הזמן והריבית דריבית עושים את השאר.",
   mentor:{why:"הניצחון של טווח ארוך אינו בקסם — הוא בהיעדר טעויות. כל פעולה עולה כסף ומזמינה טעות.",
    analogy:"שני נהגים לאותו יעד: אחד עוקף, בולם ומחליף נתיבים כל הזמן; השני נוסע ישר ורגוע. השני מגיע בטוח יותר — ולרוב גם מהר יותר.",
    q:"מה עולה לך על כל עסקה שאתה עושה, גם אם הרווחת?",
    o:["כלום","עמלות ולעיתים מס","רק זמן","תלוי במזל"],a:1,
    hint:"כל פעולה בשוק גובה מחיר. מה קורה כשעושים מאות פעולות מול אפס?",
    ok:"בדיוק. פחות פעולות = פחות חיכוך = יותר נשאר אצלך."},tr:{en:{"q": "Why does long-term investing beat most active traders?", "o": ["Because it's riskier", "Fewer fees, less tax, fewer emotional mistakes", "Because stocks always rise", "Because it needs less money"], "why": "Fewer actions mean fewer fees, less tax, and fewer chances to make an emotional error. Time and compounding do the rest.", "mentor": {"why": "The long term's victory isn't magic — it's the absence of mistakes. Every action costs money and invites error.", "analogy": "Two drivers heading to the same destination: one overtakes, brakes and changes lanes constantly; the other drives straight and calmly. The second arrives more safely — and usually sooner.", "q": "What does every trade you make cost you, even when you profit?", "o": ["Nothing", "Fees and sometimes tax", "Only time", "It depends on luck"], "hint": "Every action in the market extracts a price. What happens when you make hundreds of them versus none?", "ok": "Exactly. Fewer actions mean less friction, which means more stays with you."}}}},
  {t:"challenge",task:"חשב: אם היית משקיע סכום קבוע כל חודש במדד רחב ומחזיק 20 שנה, כמה פעולות מסחר היית עושה בשנה? השווה למספר של דיי-טריידר (מאות ביום).",hint:"ההבדל העצום הזה במספר הפעולות הוא בדיוק ההבדל בעמלות, במסים, ובכמות הטעויות האפשריות. פשטות מנצחת.",tr:{en:{"task": "Work it out: if you invested a fixed amount monthly in a broad index and held for 20 years, how many trades would you make a year? Compare that with a day trader's (hundreds a day).", "hint": "That enormous gap in the number of actions is exactly the gap in fees, taxes and possible mistakes. Simplicity wins."}}},
  {t:"summary",h:"מה למדת",points:[
    "טווח ארוך = קונה ומחזיק שנים, נותן לזמן ולריבית דריבית לעבוד",
    "85-90% מהמנהלים המקצועיים מפסידים למדד הפשוט לאורך זמן",
    "הסוד אינו גאונות — אלא היעדר טעויות, עמלות ומסים",
    "לרוב האנשים, במיוחד מתחילים, זה הסגנון החכם ביותר. 'משעמם' = מנצח"],tr:{en:{"h": "What you learned", "points": ["Long term = buy and hold for years, letting time and compounding work", "85-90% of professional managers underperform the simple index over time", "The secret isn't brilliance — it's the absence of mistakes, fees and taxes", "For most people, especially beginners, it's the smartest style. 'Boring' = winning"]}}}
 ]},

/* =====================================================================
   StorageAdapter — abstraction over persistence.
   Everything that touches storage goes through here, so swapping
   localStorage for Supabase later means writing ONE new adapter and
   flipping Storage.use(...). No call sites change.

   The synchronous surface (getSync/setSync) is what today's code uses.
   The async surface (get/set/list) is what a network adapter needs.
   Both exist now so call sites can migrate gradually.
   ===================================================================== */
const StorageAdapter = {
  name: "abstract",
  /* sync surface — used by the current offline app */
  getSync(k, d)     { throw new Error("not implemented") },
  setSync(k, v)     { throw new Error("not implemented") },
  removeSync(k)     { throw new Error("not implemented") },
  keysSync(prefix)  { throw new Error("not implemented") },
  /* async surface — what a server-backed adapter will implement.
     Default: wrap the sync surface so callers can already `await`. */
  async get(k, d)   { return this.getSync(k, d) },
  async set(k, v)   { return this.setSync(k, v) },
  async remove(k)   { return this.removeSync(k) },
  async keys(p)     { return this.keysSync(p) },
  /* capability flags — call sites branch on these, never on adapter name */
  caps: { durable:false, crossDevice:false, serverAuthoritative:false, async:false }
};

const LocalStorageAdapter = Object.assign(Object.create(StorageAdapter), {
  name: "local",
  caps: { durable:true, crossDevice:false, serverAuthoritative:false, async:false },
  getSync(k, d){
    try{ const r = localStorage.getItem(k); return r ? JSON.parse(r) : d }
    catch(e){ return d }
  },
  setSync(k, v){
    try{ localStorage.setItem(k, JSON.stringify(v)); return true }
    catch(e){ return false }
  },
  removeSync(k){
    try{ localStorage.removeItem(k); return true }catch(e){ return false }
  },
  keysSync(prefix){
    const out=[];
    try{
      for(let i=0;i<localStorage.length;i++){
        const k=localStorage.key(i);
        if(!prefix || (k && k.indexOf(prefix)===0)) out.push(k);
      }
    }catch(e){}
    return out;
  },
  /* raw access for migration/export — bypasses JSON parsing */
  rawSync(k){ try{ return localStorage.getItem(k) }catch(e){ return null } }
});

/* Not wired up. Documents the exact contract the Supabase adapter must meet,
   so the migration is filling in method bodies rather than redesigning.
   Every method mirrors LocalStorageAdapter's signature. */
const FutureSupabaseAdapter = Object.assign(Object.create(StorageAdapter), {
  name: "supabase",
  caps: { durable:true, crossDevice:true, serverAuthoritative:true, async:true },
  client: null,                       // set to the supabase-js client on init
  /* Sync surface CANNOT be honoured over a network. When this adapter is
     active, call sites must use the async surface. Storage.caps.async tells
     them which to use — that flag is the whole migration switch. */
  getSync(k, d){ Err && Err.warn && Err.warn(
    "Sync storage read under async adapter",
    "This call site still uses getSync and must move to await Storage.get().",
    "See MIGRATION.md"); return d },
  setSync(){ return false },
  removeSync(){ return false },
  keysSync(){ return [] },
  /* async surface — the real implementation, later:
       async get(k,d){ const {data,error} = await this.client
           .from('kv').select('value').eq('key',k).maybeSingle();
         return error||!data ? d : data.value }
       async set(k,v){ const {error} = await this.client
           .from('kv').upsert({key:k, value:v, user_id:this.uid});
         return !error }
     RLS enforces user_id = auth.uid(), so a client cannot read another
     user's rows even with a forged request. */
  async get(k, d){ throw new Error("FutureSupabaseAdapter.get not implemented") },
  async set(k, v){ throw new Error("FutureSupabaseAdapter.set not implemented") },
  async remove(k){ throw new Error("FutureSupabaseAdapter.remove not implemented") },
  async keys(p){   throw new Error("FutureSupabaseAdapter.keys not implemented") }
});

/* Active adapter. Swapping backends is one line: Storage.use(FutureSupabaseAdapter) */
const Storage = {
  _a: LocalStorageAdapter,
  use(adapter){ this._a = adapter; return this },
  get adapter(){ return this._a },
  get caps(){ return this._a.caps },
  getSync(k,d){ return this._a.getSync(k,d) },
  setSync(k,v){ return this._a.setSync(k,v) },
  removeSync(k){ return this._a.removeSync(k) },
  keysSync(p){ return this._a.keysSync(p) },
  get(k,d){ return this._a.get(k,d) },
  set(k,v){ return this._a.set(k,v) },
  remove(k){ return this._a.remove(k) },
  keys(p){ return this._a.keys(p) }
};

/* =====================================================================
   Cloud — local-first sync to Supabase.

   Design note: Store is synchronous and hundreds of call sites depend on
   that. Rather than rewrite them all as async, localStorage stays the
   source of truth and Supabase syncs around it:

     read   -> local (instant, works offline)
     write  -> local now, debounced push to the server
     login  -> pull remote, newest-wins, write to local

   Result: zero behaviour change offline, real cross-device sync online.
   If anything here fails the app carries on exactly as it did before.
   ===================================================================== */
const Cloud = {
  sb: null,
  user: null,
  ready: false,
  _timer: null,

  configured(){
    const c = window.IQ_SUPABASE;
    return !!(c && c.url && c.anonKey && location.protocol !== "file:");
  },

  async init(){
    if(!this.configured()) return false;
    try{
      for(let i=0; i<40 && !window.supabase; i++) await new Promise(r=>setTimeout(r,50));
      if(!window.supabase) return false;
      const c = window.IQ_SUPABASE;
      this.sb = window.supabase.createClient(c.url, c.anonKey);
      const { data } = await this.sb.auth.getSession();
      if(data && data.session) await this.onSignedIn(data.session.user);
      this.sb.auth.onAuthStateChange((_e, session)=>{
        if(session && session.user) this.onSignedIn(session.user);
        else this.user = null;
      });
      this.ready = true;
      return true;
    }catch(e){ return false }
  },

  async onSignedIn(u){
    this.user = {
      id: u.id,
      email: u.email || "",
      name: (u.user_metadata && (u.user_metadata.display_name || u.user_metadata.full_name))
            || (u.email||"").split("@")[0],
      avatar: (u.user_metadata && u.user_metadata.avatar) || "😎"
    };
    await this.pull();
  },

  /* Adopt remote state only if it is newer. Ties favour local so an
     in-progress session is never clobbered by a stale server copy. */
  async pull(){
    if(!this.sb || !this.user) return;
    try{
      const { data, error } = await this.sb
        .from("user_progress").select("state, updated_at, xp")
        .eq("user_id", this.user.id).maybeSingle();
      if(error || !data || !data.state || !Object.keys(data.state).length) return;
      const remoteAt = new Date(data.updated_at || 0).getTime();
      const localAt  = Storage.getSync("iq_synced_at", 0) || 0;
      if(remoteAt > localAt){
        Storage.setSync(Store.key(), data.state);
        Storage.setSync("iq_synced_at", remoteAt);
        if(typeof S !== "undefined") S = Store.load();
        try{ UI.headRefresh() }catch(e){}
      }
    }catch(e){}
  },

  /* Store.save() fires on every market tick, so pushes are coalesced to at
     most one network write every 5 seconds. */
  schedulePush(){
    if(!this.sb || !this.user) return;
    clearTimeout(this._timer);
    this._timer = setTimeout(()=>this.push(), 5000);
  },

  async push(){
    if(!this.sb || !this.user) return;
    try{
      const state = Storage.getSync(Store.key(), null);
      if(!state) return;
      const now = Date.now();
      const { error } = await this.sb.from("user_progress").upsert({
        user_id: this.user.id,
        state: state,
        xp: state.xp || 0,
        streak_days: state.streak || 0,
        schema_version: 1,
        updated_at: new Date(now).toISOString()
      }, { onConflict: "user_id" });
      if(!error) Storage.setSync("iq_synced_at", now);
    }catch(e){}
  },

  /* ---- leaderboard ---- */
  async leaderboard(limit){
    if(!this.sb) return null;
    try{
      const { data, error } = await this.sb
        .from("user_progress")
        .select("user_id, xp, level, streak_days, profiles(display_name, avatar)")
        .order("xp", { ascending:false })
        .limit(limit || 30);
      if(error) return null;
      return (data||[]).map((r,i)=>({
        rank: i+1,
        id: r.user_id,
        xp: r.xp,
        level: r.level,
        streak: r.streak_days,
        name: (r.profiles && r.profiles.display_name) || "—",
        avatar: (r.profiles && r.profiles.avatar) || "😎",
        me: this.user && r.user_id === this.user.id
      }));
    }catch(e){ return null }
  },

  /* ---- auth actions ---- */
  async signInWithGoogle(){
    if(!this.sb) return;
    await this.sb.auth.signInWithOAuth({
      provider: "google",
      options: { redirectTo: location.href.split("#")[0].split("?")[0] }
    });
  },
  async signUpWithEmail(email, password, name){
    if(!this.sb) throw new Error("cloud not ready");
    const { error } = await this.sb.auth.signUp({
      email, password, options:{ data:{ display_name:name } }
    });
    if(error) throw new Error(error.message);
  },
  async signInWithEmail(email, password){
    if(!this.sb) throw new Error("cloud not ready");
    const { error } = await this.sb.auth.signInWithPassword({ email, password });
    if(error) throw new Error(error.message);
  },
  async signOut(){
    if(!this.sb) return;
    await this.push();
    await this.sb.auth.signOut();
    this.user = null;
  }
};

const I18N={
 LKEY:"investiq_lang",
 /* Reads the stored language. set() writes through Storage, which
    JSON-encodes ("en" with quotes); users from before that change have the
    bare value (en). Accept both, so switching works for everyone. */
 get(){
  try{
   const raw=localStorage.getItem(this.LKEY);
   if(raw==null)return "he";
   if(LANGS[raw])return raw;                 // legacy: bare value
   try{ const p=JSON.parse(raw); if(LANGS[p])return p }catch(e){}
   return "he";
  }catch(e){ return "he" }
 },
 set(l){if(!LANGS[l])return;
  try{
   Storage.setSync(this.LKEY,l);
  }catch(e){}
  location.reload()},
 dir(){return LANGS[this.get()].dir},
 apply(){const l=this.get(),d=LANGS[l].dir;
  document.documentElement.lang=l;document.documentElement.dir=d;
  document.body.dataset.dir=d},
 /* t(key, vars) — עם fallback לעברית אם המפתח חסר */
 t(k,vars){const l=this.get();
  let s=(STR[l]&&STR[l][k])!=null?STR[l][k]:(STR.he[k]!=null?STR.he[k]:k);
  if(vars)for(const v in vars)s=s.split("{"+v+"}").join(vars[v]);
  return s},
 /* tr(obj) — לתוכן קורס: obj.tr={en:{...}} עם נפילה לעברית */
 /* דגל שפת תוכן. התוכן עדיין לא מתורגם במלואו (רק חלק מפרק 1),
    ולכן מציגים תוכן בעברית עקבית תמיד — גם כשהממשק באנגלית.
    כשכל 28 הפרקים יתורגמו, הופכים ל-true וזהו. */
 /* כל 29 הפרקים מתורגמים במלואם לאנגלית — התוכן פעיל. */
 CONTENT_READY:true,
 /* מחזיר גרסה מתורגמת מלאה של צעד שיעור — כולל מערכים (כרטיסים, תשובות, אירועים).
    כך הרנדררים ממשיכים לקרוא st.cards / st.o / st.points כרגיל ומקבלים אנגלית
    בלי שנצטרך לגעת בכל רנדרר. אין תרגום → מחזיר את הצעד המקורי (עברית עקבית). */
 step(st){
  const l=this.get();
  if(l==="he"||!this.CONTENT_READY||!st||!st.tr||!st.tr[l])return st;
  const en=st.tr[l];
  const out=Object.assign({},st);
  ["q","sub","cta","h","p","why","asset","reveal","unit","task","hint","situation","company","leftLabel","rightLabel"].forEach(k=>{
   if(en[k]!=null)out[k]=en[k]});
  if(en.cards&&st.cards)out.cards=st.cards.map((c,i)=>Object.assign({},c,en.cards[i]||{}));
  if(en.o)out.o=en.o.slice();
  if(en.points)out.points=en.points.slice();
  if(en.options&&st.options)out.options=st.options.map((o,i)=>Object.assign({},o,en.options[i]||{}));
  if(en.items&&st.items)out.items=st.items.map((o,i)=>Object.assign({},o,en.items[i]||{}));
  // שורות ממוזגות לפי אינדקס — כדי לשמור אייקונים, צבעים וערכים מספריים
  if(en.rows&&st.rows)out.rows=st.rows.map((r,i)=>{
   const er=en.rows[i]||{},nr=Object.assign({},r,er);
   if(r.cells&&er.cells){nr.cells={};
    for(const k in r.cells)nr.cells[k]=Object.assign({},r.cells[k],er.cells[k]||{})}
   return nr});
  else if(en.rows)out.rows=en.rows.slice();
  // טבלת השוואה — עמודות ושורות עם תאים מקוננים
  if(en.cols&&st.cols)out.cols=st.cols.map((c,i)=>Object.assign({},c,en.cols[i]||{}));
  // מבחן אישיות — שאלות (עם אופציות וניקוד) ותוצאות
  if(en.questions&&st.questions)out.questions=st.questions.map((q,i)=>{
   const eq=en.questions[i]||{};const nq=Object.assign({},q,{q:eq.q!=null?eq.q:q.q});
   if(eq.options&&q.options)nq.options=q.options.map((o,j)=>Object.assign({},o,{l:(eq.options[j]&&eq.options[j].l)!=null?eq.options[j].l:o.l}));
   return nq});
  if(en.results&&st.results){out.results={};
   for(const k in st.results)out.results[k]=Object.assign({},st.results[k],en.results[k]||{})}
  if(en.events&&st.events)out.events=st.events.map((e,i)=>{
   const ee=en.events[i]||{};const ne=Object.assign({},e,{t:ee.t!=null?ee.t:e.t,news:ee.news!=null?ee.news:e.news});
   if(ee.opts&&e.opts)ne.opts=e.opts.map((o,j)=>Object.assign({},o,ee.opts[j]||{}));
   return ne});
  if(en.mentor&&st.mentor){out.mentor=Object.assign({},st.mentor);
   ["why","analogy","q","hint","ok"].forEach(k=>{if(en.mentor[k]!=null)out.mentor[k]=en.mentor[k]});
   if(en.mentor.o)out.mentor.o=en.mentor.o.slice()}
  return out},
 /* מחזיר תוכן קורס. עד שהתרגום מלא — עברית עקבית, בלי חצי-חצי. */
 tr(obj,field){const l=this.get();
  const useTrans=this.CONTENT_READY&&l!=="he"&&obj&&obj.tr&&obj.tr[l]&&obj.tr[l][field]!=null;
  const raw=useTrans?obj.tr[l][field]:(obj?obj[field]:"");
  return bd(raw)},
 /* האם פריט תוכן מתורגם לשפה הנוכחית? */
 has(obj){const l=this.get();return l==="he"||!!(obj&&obj.tr&&obj.tr[l])}};

/* ---------- Market (GBM + משטר מאקרו + דיבידנדים) ---------- */
const Market={hist:{},price:{},tick:0,TPD:8,DT:1/252/8,
 reg(){return REGIMES[S.market.regime]||REGIMES.expansion},
 init(){if(!S.market.regime){S.market.regime="expansion";S.market.regimeEnds=S.market.day+18}
  const rnd=mulberry32(20260706);
  ASSETS.forEach(a=>{let p=a.p0;const h=[p];
    for(let d=1;d<180;d++){p*=Math.exp((a.mu-a.sigma*a.sigma/2)/252+a.sigma*Math.sqrt(1/252)*gauss(rnd));h.push(p)}
    this.hist[a.sym]=h;this.price[a.sym]=h[h.length-1]});
  const r2=mulberry32(991+S.market.seedTicks);for(let i=0;i<S.market.seedTicks;i++)this.step(r2,false);
  setInterval(()=>{this.step(Math.random.bind(Math),true);S.market.seedTicks++;Store.save()},2500)},
 step(rnd,live){this.tick++;const g=this.reg();
  ASSETS.forEach(a=>{const z=gauss(rnd),mu=a.mu+g.muShift+(a.rateBeta||0)*g.rateEffect,sig=a.sigma*g.volMul;
    this.price[a.sym]*=Math.exp((mu-sig*sig/2)*this.DT+sig*Math.sqrt(this.DT)*z)});
  if(this.tick%this.TPD===0){
   ASSETS.forEach(a=>{const h=this.hist[a.sym];h.push(this.price[a.sym]);if(h.length>400)h.shift()});
   if(live){S.market.day++; // >>> תיקון: מונה-ימים/שווי/דיבידנד מתעדכנים רק בזמן אמת, לא בריצת-השלמה
    S.nwHist.push(+Game.netWorth().toFixed(2));if(S.nwHist.length>400)S.nwHist.shift();
    this.dividends();this.regimeCheck();this.eventCheck();this.milestoneCheck();Game.checkAchs()}}
  if(live)UI.liveRefresh()},
 eventCheck(){if(S.market.day-(S.eventDay||0)<9)return;if(Math.random()>.55)return;
  const e=EVENTS[Math.floor(Math.random()*EVENTS.length)];S.eventDay=S.market.day;
  S.lastEvent={ic:e.ic,name:e.name,news:e.news,day:S.market.day};
  ASSETS.forEach(a=>{let sh=e.shockAll||0;if(e.shock&&e.shock[a.sym]!=null)sh=e.shock[a.sym];
    if(sh)this.price[a.sym]*=(1+sh)});
  // צליל לפי כיוון האירוע — מחושב מה-shock בפועל (אין שדה impact ב-EVENTS)
  const sk=e.shockAll!=null?e.shockAll:
    Object.values(e.shock||{}).reduce((a,b)=>a+b,0)/Math.max(1,Object.keys(e.shock||{}).length);
  (sk<=-.05?Sound.crash():sk<0?Sound.down():Sound.up());
  UI.toast(e.ic,"אירוע שוק: "+e.name);Haptics.hit([15,40,15]);Game.checkAchs()},
 milestoneCheck(){const nw=Game.netWorth();
  MILESTONES.forEach(m=>{if(nw>=m.v&&!S.milestones.includes(m.v)){S.milestones.push(m.v);Store.save();
    FX.celebrate(m.ic,m.t,"אבן דרך בקריירה הושגה! 🎯");Haptics.level()}})},
 dividends(){if(S.market.day%20!==0)return;let paid=0; // תשלום רבעוני (כל 20 ימי מסחר)
  for(const k in S.holdings){const a=ASSETS.find(x=>x.sym===k),dv=a&&a.f?a.f.div:0;
    if(dv>0&&S.holdings[k].qty>0)paid+=S.holdings[k].qty*this.price[k]*(dv/100)/4}
  if(paid>0){S.cash+=paid;S.divTotal=(S.divTotal||0)+paid;UI.toast("💰","דיבידנד רבעוני: "+fmt(paid))}},
 regimeCheck(){if(S.market.day<S.market.regimeEnds)return;
  const flow=REGIME_FLOW[S.market.regime]||["expansion"],next=flow[Math.floor(Math.random()*flow.length)];
  S.market.regime=next;S.market.regimeEnds=S.market.day+15+Math.floor(Math.random()*12);
  S.regimesSeen=(S.regimesSeen||0)+1;const g=this.reg();UI.toast(g.ic,"שינוי מאקרו: "+g.name)},
 chg(sym,d=1){const h=this.hist[sym];return(this.price[sym]/h[Math.max(0,h.length-1-d)]-1)*100}};

/* ---------- Sound (WebAudio) ---------- */
/* ---------- Sound: מנוע אודיו סינתטי ----------
   הכל נוצר ב-Web Audio API — אפס קבצים, אפס רשת (חובה מ-file://).
   מעטפת ADSR אמיתית + פילטר → צליל רך, לא "ביפ" צורם. */
const Sound={ctx:null,master:null,muted:false,
 init(){if(this.ctx)return;
  try{this.ctx=new (window.AudioContext||window.webkitAudioContext)();
   this.master=this.ctx.createGain();
   this.master.gain.value=(typeof S!=="undefined"&&S.vol!=null)?S.vol:.5;
   this.master.connect(this.ctx.destination)}catch(e){}},
 setVol(v){if(this.master)this.master.gain.value=Math.max(0,Math.min(1,v))},
 /* ספארי מקפיא את ה-AudioContext עד אינטראקציה — מחייב resume */
 resume(){if(this.ctx&&this.ctx.state==="suspended")this.ctx.resume().catch(()=>{})},
 on(){return S&&S.sound&&this.ctx},

 /* צליל בודד עם מעטפת ADSR + פילטר low-pass */
 note(freq,{dur=.18,type="sine",vol=.18,when=0,atk=.008,dec=.06,sus=.5,rel=.09,glide=0,cut=0}={}){
  if(!this.on())return;this.resume();
  const t=this.ctx.currentTime+when;
  const o=this.ctx.createOscillator(),g=this.ctx.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,t);
  if(glide)o.frequency.exponentialRampToValueAtTime(Math.max(20,freq*glide),t+dur);
  let node=o;
  if(cut){const f=this.ctx.createBiquadFilter();f.type="lowpass";
   f.frequency.setValueAtTime(cut,t);o.connect(f);node=f}
  node.connect(g);g.connect(this.master);
  // ADSR
  const peak=vol, sl=vol*sus;
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(peak,t+atk);
  g.gain.linearRampToValueAtTime(sl,t+atk+dec);
  g.gain.setValueAtTime(sl,t+Math.max(atk+dec,dur-rel));
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.start(t);o.stop(t+dur+.02)},

 /* אקורד — כמה תווים יחד */
 chord(freqs,opts={}){freqs.forEach((f,i)=>this.note(f,{...opts,when:(opts.when||0)+i*(opts.strum||0)}))},
 /* ארפג'ו — תווים ברצף */
 arp(freqs,step=.075,opts={}){freqs.forEach((f,i)=>this.note(f,{...opts,when:i*step}))},
 /* רעש — לשימוש בוויסים ומפולות */
 noise({dur=.3,vol=.08,cut=900}={}){if(!this.on())return;this.resume();
  const t=this.ctx.currentTime,n=Math.floor(this.ctx.sampleRate*dur);
  const buf=this.ctx.createBuffer(1,n,this.ctx.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  const src=this.ctx.createBufferSource();src.buffer=buf;
  const f=this.ctx.createBiquadFilter();f.type="lowpass";f.frequency.value=cut;
  const g=this.ctx.createGain();g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  src.connect(f);f.connect(g);g.connect(this.master);src.start(t);src.stop(t+dur)},

 /* ===== ספריית הצלילים ===== */
 tap(){this.note(520,{dur:.045,type:"triangle",vol:.07,atk:.002,cut:2600})},
 select(){this.note(660,{dur:.06,type:"triangle",vol:.08,atk:.002,cut:3000})},
 /* נכון — אקורד מז'ורי עולה (C-E-G) */
 correct(){this.arp([523.25,659.25,783.99],.055,{dur:.2,type:"sine",vol:.15,cut:4000})},
 right(){this.correct()},           // ← באג שתוקן: הקוד קרא ל-Sound.right() שלא היה קיים
 /* שגוי — שני תווים יורדים, רך ולא מעניש */
 wrong(){this.note(233.08,{dur:.16,type:"triangle",vol:.13,cut:900});
  this.note(174.61,{dur:.24,type:"triangle",vol:.12,when:.1,cut:700})},
 /* מטבע / XP */
 coin(){this.note(1046.5,{dur:.07,type:"triangle",vol:.10,cut:5000});
  this.note(1396.9,{dur:.1,type:"triangle",vol:.08,when:.05,cut:6000})},
 /* עליית רמה — ארפג'ו מז'ורי מלא */
 levelup(){this.arp([523.25,659.25,783.99,1046.5,1318.5],.085,{dur:.34,type:"sine",vol:.16,cut:5000});
  this.chord([523.25,659.25,783.99,1046.5],{dur:.9,type:"sine",vol:.07,when:.42,sus:.6,cut:3500})},
 /* הישג — פאנפרה */
 achieve(){this.arp([659.25,783.99,1046.5],.07,{dur:.3,type:"sine",vol:.15,cut:5000});
  this.chord([783.99,1046.5,1318.5],{dur:.7,type:"sine",vol:.08,when:.22,cut:4000})},
 /* קנייה / מכירה */
 buy(){this.note(440,{dur:.1,type:"sine",vol:.12,glide:1.5,cut:3000})},
 sell(){this.note(660,{dur:.12,type:"sine",vol:.12,glide:.66,cut:2500})},
 /* שוק עולה / יורד */
 up(){this.note(587.33,{dur:.13,type:"sine",vol:.10,glide:1.26,cut:3500})},
 down(){this.note(493.88,{dur:.16,type:"sine",vol:.10,glide:.75,cut:1800})},
 /* מפולת — רעש + צליל יורד */
 crash(){this.noise({dur:.55,vol:.09,cut:700});
  this.note(220,{dur:.7,type:"sawtooth",vol:.10,glide:.35,cut:600})},
 /* טיק-טק של שעון לחץ */
 tick(){this.note(1200,{dur:.03,type:"square",vol:.05,cut:4000})},
 /* פתיחה/סגירה של מסך */
 open(){this.note(392,{dur:.13,type:"sine",vol:.08,glide:1.34,cut:2600})},
 close(){this.note(523.25,{dur:.12,type:"sine",vol:.07,glide:.75,cut:2200})},
 /* היפוך כרטיס */
 flip(){this.note(880,{dur:.06,type:"triangle",vol:.08,glide:1.2,cut:4000})},
 /* המנטור מדבר */
 mentor(){this.arp([440,554.37],.09,{dur:.26,type:"sine",vol:.10,cut:2400})},
 /* הודעה קטנה */
 toast(){this.note(783.99,{dur:.08,type:"sine",vol:.09,cut:3500})}};

/* ---------- FX (confetti + levelup) ---------- */
const FX={
 confetti(){const cv=document.getElementById("confetti"),c=cv.getContext("2d"),dpr=devicePixelRatio||1;
  const w=cv.clientWidth,h=cv.clientHeight;cv.width=w*dpr;cv.height=h*dpr;c.scale(dpr,dpr);cv.style.display="block";
  const cols=["#FFB23E","#37E0A6","#8C93FF","#FF6B8A","#fff"],P=[];
  for(let i=0;i<90;i++)P.push({x:w/2+(Math.random()-.5)*80,y:h*.34,vx:(Math.random()-.5)*9,vy:Math.random()*-11-4,
    r:Math.random()*6+3,col:cols[i%5],rot:Math.random()*6,vr:(Math.random()-.5)*.4,life:1});
  let t=0;const anim=()=>{c.clearRect(0,0,w,h);t++;let alive=false;
   P.forEach(p=>{p.vy+=.32;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.life-=.011;if(p.life>0&&p.y<h+20){alive=true;
     c.save();c.globalAlpha=Math.max(0,p.life);c.translate(p.x,p.y);c.rotate(p.rot);c.fillStyle=p.col;
     c.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6);c.restore()}});
   if(alive&&t<160)requestAnimationFrame(anim);else cv.style.display="none"};anim()},
 levelUp(lvl,sub){this.celebrate("🎉","רמה "+lvl+"!",sub||"פתחת תוכן חדש")},
 celebrate(ic,title,sub){document.getElementById("luIc").textContent=ic;
  document.getElementById("luT").textContent=title;
  document.getElementById("luSub").textContent=sub||"";
  document.getElementById("levelup").style.display="grid";Sound.levelup();this.confetti();
  setTimeout(()=>{document.getElementById("levelup").style.display="none"},2600)}};

/* ---------- Game ---------- */
const Game={
 /* עקומת רמות. LVL_K קובע את התלילות.
    היה 80 → סיום מלא של הקורס נתן רמה 8 בלבד ("סיימתי הכל ואני רמה 8?").
    עכשיו 20 → סיום מלא ≈ רמה 16, ועדיין יש לאן לגדול עם האתגר היומי. */
 LVL_K:20,
 level(xp){return Math.floor(Math.sqrt(xp/this.LVL_K))+1},
 lvlProg(xp){const l=this.level(xp),a=this.LVL_K*(l-1)*(l-1),b=this.LVL_K*l*l;return(xp-a)/(b-a)},
 addXP(n){const before=this.level(S.xp);S.xp+=n;S.today.xp=(S.today.xp||0)+n;const after=this.level(S.xp);Store.save();UI.headRefresh();
  if(after>before)FX.levelUp(after,"רמה "+after+" — ממשיכים לצבור ידע");this.checkAchs();return after>before},
 touchDay(){const k=Store.dayKey();
  if(S.today.date!==k)S.today={date:k,xp:0,lessons:0,trades:0,coach:0,chartOk:0,claimed:{}};
  if(S.lastDay!==k){const y=new Date();y.setDate(y.getDate()-1);
   const yk=y.getFullYear()+"-"+(y.getMonth()+1)+"-"+y.getDate();
   S.streak=(S.lastDay===yk)?S.streak+1:1;S.lastDay=k;Store.save()}},
 netWorth(){let n=S.cash;for(const k in S.holdings)n+=S.holdings[k].qty*Market.price[k];return n},
 weights(){const nw=this.netWorth(),w={};for(const k in S.holdings){const v=S.holdings[k].qty*Market.price[k];if(v>0)w[k]=v/nw}return w},
 riskScore(){const w=this.weights();let vol=0,hhi=0,tot=0;
  for(const k in w){const a=ASSETS.find(x=>x.sym===k);vol+=w[k]*a.sigma;hhi+=w[k]*w[k];tot+=w[k]}
  if(tot<.01)return 5;return Math.min(100,Math.round(vol/.85*60+hhi*40))},

/* ---------- BiDi: תיקון "מילים הפוך" ----------
   בעברית (RTL) רצף לטיני/מספרי מתהפך. לדוגמה:
     "1000 − 550 − 250 = 200"   מוצג כ־   "200 = 250 − 550 − 1000"
     "P/E = 60 ÷ 6 = 10"        מוצג הפוך לגמרי
   הפתרון: לעטוף כל רצף כזה ב-<bdi> (unicode-bidi:isolate) — הוא נשאר LTR
   בתוך משפט RTL והסדר נשמר. שקוף למשתמש; הטקסט עצמו לא משתנה.
   בטוח: אומת שאף מחרוזת תוכן (3,233) אינה מכילה HTML. */
const HEB=/[\u0590-\u05FF]/;
const LTR_RUN=/[A-Za-z0-9][A-Za-z0-9,.%'’:/&\-–]*(?:\s*(?:[=÷×+\-−*/&]\s*)?[A-Za-z0-9][A-Za-z0-9,.%'’:/&\-–]*)*/g;
/* esc — HTML-escape user-supplied text before it reaches innerHTML.
   Usernames are the only free-text field a user controls, and they are
   rendered in the profile, the admin list and inside onclick attributes.
   bd() does NOT escape (it only isolates LTR runs), so this is separate. */
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>
  ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[c]);

const bd=s=>{
  if(s==null)return"";
  const str=String(s);
  if(!HEB.test(str))return str;              // מחרוזת לטינית טהורה — אין מה לבודד
  return str.replace(LTR_RUN,m=>`<bdi>${m}</bdi>`)};

const Err={

     <button class="et-x" onclick="this.parentElement.remove()">✕</button>`;
   document.body.appendChild(el);
   requestAnimationFrame(()=>el.classList.add("on"));
   setTimeout(()=>{el.classList.remove("on");setTimeout(()=>el.remove(),400)},7000);
  }catch(e){}
 },

/* =====================================================================
   NotificationProvider — abstraction over "tell the operator something
   happened". Swapping Web3Forms for a real backend is one line:
   Notify.use(FutureServerProvider).

   SECURITY NOTE: providers here are CLIENT-SIDE. Anything they send is
   attacker-controllable — a user can forge a "signup" event. Treat these
   notifications as convenience telemetry, never as an audit trail.
   ===================================================================== */
const NotificationProvider = {
  name: "abstract",
  enabled(){ return false },
  async send(evt){ throw new Error("not implemented") },
  caps: { serverVerified:false, delivers:"none" }
};

const Web3FormsProvider = Object.assign(Object.create(NotificationProvider), {
  name: "web3forms",
  caps: { serverVerified:false, delivers:"email" },
  key: "ba64d91d-19ad-4093-b55b-620ed7e7dca7",   // public by design; send-only
  enabled(){ return !!this.key && location.protocol !== "file:" },
  async send(evt){
    return fetch("https://api.web3forms.com/submit", {
      method:"POST",
      headers:{ "Content-Type":"application/json", Accept:"application/json" },
      body: JSON.stringify({
        access_key: this.key,
        subject: evt.title + " — InvestIQ",
        from_name: "InvestIQ",
        message: evt.title + "\n\n" +
                 "משתמש: " + (evt.avatar||"") + " " + evt.name + "\n" +
                 "זמן: " + evt.time + "\n" +
                 'סה"כ משתמשים: ' + evt.total
      })
    });
  }
});

/* Not wired up. Contract the server provider must satisfy. Once a backend
   exists, notifications should be emitted SERVER-SIDE from the auth hook
   (Supabase: an Edge Function on auth.users insert) — not from the client.
   This provider then only exists for client-originated events that are
   explicitly not security-relevant. */
const FutureServerProvider = Object.assign(Object.create(NotificationProvider), {
  name: "server",
  caps: { serverVerified:true, delivers:"email+push" },
  endpoint: null,                    // e.g. https://<project>.supabase.co/functions/v1/notify
  getToken: null,                    // () => supabase session access_token
  enabled(){ return !!this.endpoint },
  async send(evt){
    /* Later:
         return fetch(this.endpoint, {
           method:"POST",
           headers:{ "Content-Type":"application/json",
                     Authorization:"Bearer "+(await this.getToken()) },
           body: JSON.stringify(evt)
         });
       The function verifies the JWT, so `name` cannot be spoofed. */
    throw new Error("FutureServerProvider.send not implemented");
  }
});

/* NOTIFY keeps its exact public surface — signup/login/visit/flush —
   so no call site changes. It now delegates transport to a provider. */
const Notify = {
  _p: Web3FormsProvider,
  use(p){ this._p = p; return this },
  get provider(){ return this._p }
};

const NOTIFY = {
  get key(){ return Notify.provider.key },          // back-compat for tests
  set key(v){ Notify.provider.key = v },
  on(){ return Notify.provider.enabled() },

  /* signup — always reported */
  signup(u){ if(!this.on())return; this.send("🎉 משתמש חדש נרשם", u) },
  /* login with password — rare, always reported */
  login(u){ if(!this.on())return; this.send("🔑 התחברות", u) },
  /* returning user — throttled to once per day per user, or the operator
     gets an email on every app open (auto-login makes that constant). */
  visit(u){
    if(!this.on() || !u) return;
    const k = "iq_seen_" + u.id, today = new Date().toDateString();
    try{
      if(Storage.getSync(k, null) === today) return;
      Storage.setSync(k, today);
    }catch(e){ return }
    this.send("👤 משתמש חזר", u);
  },

  send(title, u){
    const evt = { title, name:u.name, avatar:u.avatar||"",
                  total:Auth.list().length,
                  time:new Date().toLocaleString("he-IL") };
    this.post(evt).catch(()=>this.queue(evt));
  },
  post(evt){
    try{ return Notify.provider.send(evt) }
    catch(e){ return Promise.reject(e) }
  },

  /* offline → queue and retry on next boot */
  queue(evt){
    try{
      const q = Storage.getSync("iq_nq", []) || [];
      q.push(evt);
      Storage.setSync("iq_nq", q.slice(-20));
    }catch(e){}
  },
  flush(){
    if(!this.on()) return;
    let q = [];
    try{ q = Storage.getSync("iq_nq", []) || [] }catch(e){ return }
    if(!q.length) return;
    try{ Storage.removeSync("iq_nq") }catch(e){}
    q.forEach(evt => this.post(evt).catch(()=>{}));
  }
};

const Charts={
 /* גרף קו ברמת TradingView: גרדיאנט רך, קו חלק, נקודה אחרונה פועמת, crosshair + tooltip */
 line(cv,data,color,fill=true,h=90,opts={}){const dpr=devicePixelRatio||1,w=cv.clientWidth||300;
  cv.width=w*dpr;cv.height=h*dpr;cv.style.height=h+"px";const c=cv.getContext("2d");c.scale(dpr,dpr);
  if(data.length<2)return;
  const mn=Math.min(...data),mx=Math.max(...data),rg=(mx-mn)||1,p=8;
  const X=i=>i/(data.length-1)*w,Y=v=>h-p-(v-mn)/rg*(h-p*2);
  c.clearRect(0,0,w,h);
  // קו רשת עדין
  if(opts.grid!==false){c.strokeStyle=cssv("--line");c.lineWidth=.5;c.globalAlpha=.6;
   for(let i=1;i<3;i++){const y=p+(h-p*2)*i/3;c.beginPath();c.moveTo(0,y);c.lineTo(w,y);c.stroke()}
   c.globalAlpha=1}
  // מסלול חלק (Catmull-Rom → bezier)
  const pts=data.map((v,i)=>({x:X(i),y:Y(v)}));
  const path=()=>{c.beginPath();c.moveTo(pts[0].x,pts[0].y);
   for(let i=0;i<pts.length-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
    c.bezierCurveTo(p1.x+(p2.x-p0.x)/6,p1.y+(p2.y-p0.y)/6,p2.x-(p3.x-p1.x)/6,p2.y-(p3.y-p1.y)/6,p2.x,p2.y)}};
  if(fill){const g=c.createLinearGradient(0,0,0,h);
   g.addColorStop(0,hexa(color,.28));g.addColorStop(.55,hexa(color,.08));g.addColorStop(1,hexa(color,0));
   path();c.lineTo(w,h);c.lineTo(0,h);c.closePath();c.fillStyle=g;c.fill()}
  path();c.strokeStyle=color;c.lineWidth=2.4;c.lineJoin="round";c.lineCap="round";
  c.shadowColor=hexa(color,.35);c.shadowBlur=8;c.shadowOffsetY=2;c.stroke();
  c.shadowColor="transparent";c.shadowBlur=0;c.shadowOffsetY=0;
  // נקודה אחרונה
  const last=pts[pts.length-1];
  c.beginPath();c.arc(last.x,last.y,6,0,7);c.fillStyle=hexa(color,.18);c.fill();
  c.beginPath();c.arc(last.x,last.y,3,0,7);c.fillStyle=color;c.fill();
  c.beginPath();c.arc(last.x,last.y,3,0,7);c.strokeStyle="#fff";c.lineWidth=1.5;c.stroke();
  // crosshair רק בגרפים גדולים מספיק לגעת בהם.
  // (באג שתוקן: נצמד גם לספארקליין של 5px ברשימת הנכסים → overlay מיותר לכל שורה)
  if(opts.interactive!==false&&h>=90)this.attachCrosshair(cv,{data,X,Y,w,h,color,mn,mx});},

 /* Crosshair + tooltip — נגיעה/גרירה על הגרף */
 attachCrosshair(cv,ctx){
  if(cv._cross)return;cv._cross=true;
  const wrap=cv.parentElement;if(!wrap)return;
  if(getComputedStyle(wrap).position==="static")wrap.style.position="relative";
  let tip=wrap.querySelector(".chtip");
  if(!tip){tip=document.createElement("div");tip.className="chtip";wrap.appendChild(tip)}
  let ov=wrap.querySelector(".chov");
  if(!ov){ov=document.createElement("canvas");ov.className="chov";wrap.appendChild(ov)}
  const dpr=devicePixelRatio||1;
  ov.width=ctx.w*dpr;ov.height=ctx.h*dpr;ov.style.width="100%";ov.style.height=ctx.h+"px";
  const oc=ov.getContext("2d");oc.setTransform(dpr,0,0,dpr,0,0);
  const draw=e=>{
   const r=cv.getBoundingClientRect();
   const px=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
   const i=Math.max(0,Math.min(ctx.data.length-1,Math.round(px/ctx.w*(ctx.data.length-1))));
   const x=ctx.X(i),y=ctx.Y(ctx.data[i]);
   oc.clearRect(0,0,ctx.w,ctx.h);
   oc.setLineDash([3,4]);oc.strokeStyle=cssv("--tx3");oc.lineWidth=1;oc.globalAlpha=.7;
   oc.beginPath();oc.moveTo(x,0);oc.lineTo(x,ctx.h);oc.stroke();
   oc.beginPath();oc.moveTo(0,y);oc.lineTo(ctx.w,y);oc.stroke();
   oc.setLineDash([]);oc.globalAlpha=1;
   oc.beginPath();oc.arc(x,y,5,0,7);oc.fillStyle=ctx.color;oc.fill();
   oc.strokeStyle="#fff";oc.lineWidth=2;oc.stroke();
   tip.textContent=fmt(Math.round(ctx.data[i]));
   tip.style.insetInlineStart=Math.max(4,Math.min(ctx.w-70,x-35))+"px";
   tip.style.top=Math.max(2,y-34)+"px";
   tip.classList.add("on")};
  const hide=()=>{oc.clearRect(0,0,ctx.w,ctx.h);tip.classList.remove("on")};
  cv.addEventListener("touchstart",draw,{passive:true});
  cv.addEventListener("touchmove",draw,{passive:true});
  cv.addEventListener("touchend",hide);
  cv.addEventListener("mousemove",draw);
  cv.addEventListener("mouseleave",hide)},
 // מקבל [{o,c,h,l}] או היסטוריית מחירים→נרות; מחזיר rects להיטים
 candles(cv,cnds,h=150,opts={}){const dpr=devicePixelRatio||1,w=cv.clientWidth||300;
  cv.width=w*dpr;cv.height=h*dpr;cv.style.height=h+"px";const c=cv.getContext("2d");c.scale(dpr,dpr);
  const up=getComputedStyle(document.body).getPropertyValue("--up").trim(),
        dn=getComputedStyle(document.body).getPropertyValue("--dn").trim(),
        am=getComputedStyle(document.body).getPropertyValue("--amber").trim();
  let mn=Infinity,mx=-Infinity;cnds.forEach(k=>{mn=Math.min(mn,k.l);mx=Math.max(mx,k.h)});
  const rg=(mx-mn)||1,pad=14,Y=v=>h-pad-(v-mn)/rg*(h-pad*2);
  const n=cnds.length,slot=w/n,bw=Math.min(slot*.62,26),rects=[];
  cnds.forEach((k,i)=>{const cx=slot*i+slot/2,green=k.c>=k.o;let col=green?up:dn;
    if(opts.correct===i)col=up;if(opts.wrong===i)col=dn;if(opts.highlight===i)col=am;
    c.strokeStyle=col;c.lineWidth=2;c.beginPath();c.moveTo(cx,Y(k.h));c.lineTo(cx,Y(k.l));c.stroke();
    const yT=Y(Math.max(k.o,k.c)),yB=Y(Math.min(k.o,k.c));c.fillStyle=col;
    c.fillRect(cx-bw/2,yT,bw,Math.max(2,yB-yT));
    if(opts.highlight===i||opts.correct===i){c.strokeStyle=am;c.lineWidth=2.5;
      c.strokeRect(slot*i+3,4,slot-6,h-8)}
    rects.push({i,x0:slot*i,x1:slot*(i+1)})});
  return rects}};
